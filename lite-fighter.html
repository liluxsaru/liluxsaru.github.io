// perfect unison, which reads as fake; amplitude is small enough it never looks like jitter.
const PLATFORM_SWAY_PX = 1.4;
const PLATFORM_SWAY_PERIOD_MS = 3200;
function drawPlatform(ctx, p, accent, now) {
	const phase = ((p.x1 + p.x2) / 2) * 0.017; // deterministic per-platform offset, not random
	const swayY = now != null ? Math.sin(now / PLATFORM_SWAY_PERIOD_MS + phase) * PLATFORM_SWAY_PX : 0;
	const x = p.x1, w = p.x2 - p.x1, yTop = p.y + swayY;
	const bodyH = 20; // doubled from 10 - purely visual; collision only ever checks the platform's top surface (p.y itself), a one-way line, so this doesn't change landing behavior at all
	const capW = Math.min(14, w / 5);

	ctx.fillStyle = "rgba(0,0,0,0.28)";
	ctx.fillRect(x + 3, yTop + bodyH, w - 6, 3);

	ctx.fillStyle = "#262a38";
	ctx.fillRect(x, yTop, w, bodyH);
	ctx.fillStyle = "#1b1e28";
	ctx.fillRect(x, yTop + bodyH - 3, w, 3);

	ctx.fillStyle = accent;
	ctx.fillRect(x, yTop, w, 2);
	ctx.fillStyle = "#ffffff55";
	ctx.fillRect(x, yTop, w, 1);

	ctx.fillStyle = "#3a3f52";
	ctx.fillRect(x, yTop, capW, bodyH);
	ctx.fillRect(x + w - capW, yTop, capW, bodyH);
	ctx.fillStyle = accent;
	ctx.globalAlpha = 0.8;
	ctx.fillRect(x + 3, yTop + 2, 3, bodyH - 4);
	ctx.fillRect(x + w - capW + 3, yTop + 2, 3, bodyH - 4);
	ctx.globalAlpha = 1;

	ctx.fillStyle = "#12141c";
	for (let nx = x + capW + 10; nx < x + w - capW - 6; nx += 22) {
		ctx.fillRect(nx, yTop + bodyH - 5, 6, 2);
	}
}

// Solid ground bar for a stage with no background art (the default starfield arena - see STAGES).
// Purely visual: the actual floor collision is the engine's existing invisible y=0 ground plane
// (already solid and non-droppable, unlike anything in the `platforms` array - see the "stage's
// own ground layer is never droppable" comment in character.js), this just finally gives that
// plane real pixels instead of leaving the space below the characters' feet as plain black. Spans
// STAGE.left/right edge-to-edge (every stage is 1080 world units wide, see STAGE's own comment),
// so it always matches the actual walkable width no matter how that's calibrated per stage.
function drawFloor(ctx) {
	const x = STAGE.left, w = STAGE.right - STAGE.left, y = 0, h = 300; // tall enough to fill the space below groundY down to the canvas bottom at any zoom
	ctx.fillStyle = "#20232e";
	ctx.fillRect(x, y, w, h);
	ctx.fillStyle = "#12141c";
	ctx.fillRect(x, y, w, 6);
	ctx.fillStyle = "#5dd0ff";
	ctx.fillRect(x, y, w, 3);
	ctx.fillStyle = "#ffffff55";
	ctx.fillRect(x, y, w, 1);
	ctx.fillStyle = "#171a24";
	for (let nx = x + 18; nx < x + w - 12; nx += 46) {
		ctx.fillRect(nx, y + 16, 22, 4);
	}
}

async function startMatch(p1Name, p2Name, stageId) {
	for (const k of Object.keys(keys)) keys[k] = false;
	const stage = (stageId != null && STAGES.find((st) => st.id === stageId)) || randomStage();
	currentStageId = stage.id;
	currentStageIsGif = stage.bgExt === "gif";
	if (currentStageIsGif) {
		// Only reassign .src if it's actually changing - re-setting the same src restarts the video
		// from frame 1, which would visibly stutter/reset it every time a match (re)starts on the
		// same stage. This element otherwise just sits permanently off-screen - see its CSS comment.
		// Plays the converted .mp4 next to the shipped .gif (same basename - see STAGES' bgExt
		// comment), not the .gif itself: a <video> reliably keeps decoding new frames for
		// drawImage() the way an <img> playing a GIF did not in practice.
		const videoSrc = `assets/stages/${stage.id}/bg.mp4`;
		if (stageGifLayer.src.indexOf(videoSrc) === -1) stageGifLayer.src = videoSrc;
		// .src alone doesn't reliably (re)start playback, especially on a match restart after the
		// element was left paused/ended - .play() returns a promise that rejects if the browser's
		// autoplay policy blocks it; muted (set on the element itself) is what makes autoplay
		// actually allowed here without a direct user gesture on this element specifically.
		stageGifLayer.play().catch(() => {});
	}
	if (stage.music) playMusic(stage.music);
	// Per-stage bounce-boundary calibration from the stage mapper (worldLeft/worldRight on a
	// STAGES entry) - STAGE is a single shared object that every physics/AI/camera call already
	// reads fresh each time rather than caching, so mutating it here before the match loop starts
	// propagates everywhere correctly. Every stage is always 1080 world units wide (±540) - only
	// height/ground position varies per map (see groundYFrac below) - so this fallback is really
	// just for a stage authored before that convention; a real exported stage always sets both to
	// the same ±540 the stage mapper now defaults to.
	STAGE.left = stage.worldLeft ?? -540;
	STAGE.right = stage.worldRight ?? 540;
	// Top blast zone - the only remaining way to lose a stock (see isOffStage()). Per-stage,
	// author-placed in the stage mapper (a stage with no blastAboveY set falls back to the old
	// fixed -900, positioned well above the stage image so a normal jump/recovery never brushes it).
	STAGE.blastAbove = stage.blastAboveY ?? -900;
	// Per-stage floor-position override for a hand-picked background image whose own visual floor
	// isn't at the fixed 400/720 convention every pre-composited stage bg.png follows (see this
	// file's STAGE_BG_GROUND_FRAC comment) - author-calibrated in the stage mapper by dragging the
	// ground handle until it visually lines up with the uploaded art's real floor. null (the
	// default) falls back to the fixed 400/720 convention in frame() below.
	STAGE.bgFloorFrac = stage.bgFloorFrac ?? null;
	const p1Label = CHARACTER_NAMES[p1Name].toUpperCase();
	const p2Label = CHARACTER_NAMES[p2Name].toUpperCase();

	// Draw scale is no longer set here at all - Character.load() below measures each character's
	// own idle sprite and computes its natural, clamped scale itself (see the
	// CHARACTER_MIN/MAX_HEIGHT_PX comment block near SIZE_SCALE's old location, and
	// computeNaturalCharacterScale()) - a short character stays shorter than a tall one, neither
	// can ever end up under 60 or over 200 world px tall, and nothing here needs to know or care
	// which is which per-character anymore.
	// All character/summon art loads from the real assets/ folder on disk (no embedded/inline
	// build option anymore - see the ASSETS-removal note near the top of this file).
	const p1Def = { x: -230, y: 0, facing: 1, stocks: roundsCount };
	const p2Def = { x: 230, y: 0, facing: -1, stocks: roundsCount };
	// p1's and p2's whole asset load (atlas/air/sounds/moveset - see Character.load) used to run
	// strictly one after the other, and the shared UI-FX overlay atlas loaded only after BOTH of
	// those had already fully finished - three real network+decode waits stacked in sequence,
	// which is exactly what made hitting FIGHT feel slow to actually load into a match. None of
	// the three depends on either of the others, so kick all three off together and let the
	// browser fetch/decode them concurrently; total wait becomes roughly the slowest one instead
	// of the sum of all three. (Two different characters never share a basePath, so there's no
	// risk of the same file being double-fetched/racing itself here.)
	const [p1, p2, uiFx] = await Promise.all([
		Character.load(p1Name, { ...p1Def, basePath: `assets/characters/${p1Name}` }),
		Character.load(p2Name, { ...p2Def, basePath: `assets/characters/${p2Name}` }),
		// Shared ROUND/FIGHT!/K.O. overlay (real fight.sff art - see ui-fx.js above). Loaded once
		// and cached across matches/rematches; a fresh RoundFightKO controller per match just
		// tracks this match's own round counter and current phase.
		loadUiFxAtlas(),
	]);
	const { atlas: uiFxAtlas, actions: uiFxActions } = uiFx;
	const roundFightKO = new RoundFightKO(uiFxAtlas, uiFxActions);
	let roundNumber = 1;
	roundFightKO.startRound(roundNumber);

	// This match's platform arrangement: either the stage's own fixed layout, or - for a stage
	// authored with randomizePlatforms (see STAGES) - a fresh random 6-platform layout rolled right
	// now (after STAGE.left/right above are already set for this stage, since generateRandomPlatforms()
	// reads them to know how wide a stage it's spreading platforms across).
	const stageLayout = { platforms: stage.randomizePlatforms ? generateRandomPlatforms(6) : stage.platforms };

	const p1AI = new AIController(p1, p2, difficultyOrder[difficultyIndex], stageLayout.platforms);
	const p2AI = new AIController(p2, p1, difficultyOrder[difficultyIndex], stageLayout.platforms);

	const SUMMON_COOLDOWN = 12; // seconds
	let p1SummonCooldown = 0;
	let p2SummonCooldown = 0;
	let p1SummonPrev = false; // previous frame's requested state, for rising-edge detection
	let p2SummonPrev = false;
	const activeSummons = [];
	const activeProjectiles = []; // "projectile" type moves - see Projectile class above
	const activeImpactFX = []; // transient hit/guard/miss sparks - see ImpactFX class above
	const activeKOBursts = []; // transient KO'd-flash bursts, see KOBurst class above and checkKO() below
	let blockGrid = buildBlockGrid(stageLayout.platforms); // this match's breakout-block wall - see buildBlockGrid()'s own comment
	const activeBlockBursts = []; // transient block-break shard bursts, see BlockShatterBurst class above and checkBlockCollisions() below

	/** Spawns a real hit/guard/miss spark (moveset.json's move.hitSpark/guardSpark/missSpark -
	 * action numbers into the SPARKING character's own atlas, per real MUGEN sparkno data) at a
	 * world position, if the move actually has one assigned - a no-op otherwise (some real moves,
	 * like the non-damaging Bubble, genuinely have no impact spark). `sparkOwner` is whichever
	 * character's atlas the spark's art should come from - always the attacker, matching MUGEN's
	 * own default (an Explod with no explicit ownpal draws from its spawning character's sff). */
	function spawnSpark(sparkOwner, actionNum, x, y, facing) {
		if (typeof actionNum !== "number" || !sparkOwner || !sparkOwner.atlas) return;
		// Sized to the spawning character's own render scale (their own natural, clamped scale -
		// see the CHARACTER_MIN/MAX_HEIGHT_PX comment block), not a flat constant - so a spark
		// drawn by a bigger or smaller character resizes right along with them instead of staying a
		// fixed size regardless of who cast it.
		activeImpactFX.push(new ImpactFX(sparkOwner.atlas, sparkOwner.actions, actionNum, x, y, sparkOwner.scale, facing));
	}

	/** Turns a just-armed pendingProjectileSpawn (set by Character.attack()) into a real traveling
	 * Projectile and clears the flag - called once per character per frame from the match loop
	 * below, mirroring how summons are spawned from trySummon() rather than from inside Character
	 * itself (keeps Character.js free of any match-loop-scoped state). */
	function spawnPendingProjectile(character) {
		const spawn = character.pendingProjectileSpawn;
		if (!spawn) return;
		character.pendingProjectileSpawn = null;
		activeProjectiles.push(new Projectile(spawn.move, spawn.fromX, spawn.fromY, spawn.facing, character));
	}

	function trySummon(cooldownRemaining, requesting, wasPressed, summoner, target, spawnFacing) {
		const rising = requesting && !wasPressed;
		if (!rising || cooldownRemaining > 0) return cooldownRemaining;

		// Character-specific companion pool only (see moveset.json's `summons`), rendered from
		// the summoner's OWN atlas/actions. A character
		// with no `summons` block in its moveset.json has no summon move - there is no generic
		// shared fallback pool anymore.
		if (!summoner.summonDef || !Array.isArray(summoner.summonDef.pool) || !summoner.summonDef.pool.length) {
			return cooldownRemaining;
		}

		const sd = summoner.summonDef;
		const pick = sd.pool[Math.floor(Math.random() * sd.pool.length)];
		const nearX = summoner.x + spawnFacing * 100;
		const spawnX = Math.max(STAGE.left + 40, Math.min(STAGE.right - 40, nearX));
		const def = { ...pick, mode: "melee", appearSound: sd.sounds && sd.sounds.appear };
		activeSummons.push(new Summon(def, spawnX, spawnFacing, target, {
			atlas: summoner.atlas, actions: summoner.actions, scale: summoner.scale,
			enterAction: sd.appearAction, owner: summoner,
		}));
		return sd.cooldown || SUMMON_COOLDOWN;
	}

	let last = performance.now();
	let matchOver = false;
	let winnerLabel = null;
	// Counts up from 0 once matchOver flips true, so the winner banner fades in over
	// WINNER_BANNER_FADE seconds instead of snapping on at full opacity the instant the fatal KO
	// lands - gives whatever's still finishing up on screen right then (a summon's last hit, a
	// KO burst) a beat to actually read before the dim overlay + "WINS" text cover the stage.
	let winnerBannerTimer = 0;
	const WINNER_BANNER_FADE = 0.4;
	let active = true; // set false when leaving this match (Escape) so its rAF loop actually stops
	let camX = 0; // smoothed camera-follow offset in world units - see the "camera" block in frame() below
	let camZoom = 0.75; // smoothed zoom level, matches the new ZOOM_MAX below - see the same block
	// Screen-space row where world y=0 (the ground) renders - normally the stage's own baseline
	// groundYFrac, but pushed further DOWN the (fixed 720-tall) canvas, up to a max near the very
	// bottom, whenever a player needs more headroom above than the baseline already shows. This is
	// what "extends the camera vertically above the stage" without ever touching zoom or revealing
	// anything below/beside the stage - see the "camera" block in frame() below. Starts at -1 (an
	// impossible screen row) so the very first frame snaps straight to the real baseline instead of
	// smoothing in from a wrong default.
	let groundYScreen = -1;
	let paused = false; // in-match pause/movelist overlay - see drawPauseOverlay(), toggled by 'P'/Escape or gamepad Start
	let p1StartPrev = false; // previous frame's raw gamepad Start state, for rising-edge detection (Start isn't
	let p2StartPrev = false; // part of the normal per-character input shape - see the Start-button check in frame())
	// Raw gamepad B/Y state, only ever read while actually paused (see frame()'s own check) - B
	// quits to the menu, Y toggles fullscreen, matching drawPauseOverlay()'s own button sub-labels.
	// Safe to repurpose these two combat buttons here since Character.update() never runs at all
	// while paused.
	let p1BPrev = false, p2BPrev = false, p1YPrev = false, p2YPrev = false;

	function resetMatch() {
		p1.stocks = 3;
		p1.respawn();
		p2.stocks = 3;
		p2.respawn();
		matchOver = false;
		winnerLabel = null;
		winnerBannerTimer = 0;
		activeSummons.length = 0;
		activeProjectiles.length = 0;
		activeImpactFX.length = 0;
		activeKOBursts.length = 0;
		blockGrid = buildBlockGrid(stageLayout.platforms);
		activeBlockBursts.length = 0;
		p1SummonCooldown = 0;
		p2SummonCooldown = 0;
	}
	resetMatchFn = resetMatch;

	/** Handles a tap/click on one of drawPauseOverlay()'s own Resume/Fullscreen/Quit buttons - the
	 * mouse/touch half of the same 3 actions the gamepad B/Y and keyboard Q/F handle elsewhere (see
	 * frame()'s Start-button block below and the global keydown handler in main.js). Registered for
	 * the whole match (not just while paused) same as the other per-match listeners, but a no-op
	 * whenever `paused` is false so it never interferes with any real gameplay input. */
	function onPausePointerUp(e) {
		if (!paused) return;
		const p = toGameCoords(e);
		const r = pauseHitRects;
		if (pointInRect(p.x, p.y, r.resumeButton)) paused = false;
		else if (pointInRect(p.x, p.y, r.fullscreenButton)) toggleFullscreen();
		else if (pointInRect(p.x, p.y, r.quitButton)) backToSelectFn();
	}
	canvas.addEventListener("pointerup", onPausePointerUp);

	backToSelectFn = () => {
		active = false;
		resetMatchFn = null;
		backToSelectFn = null;
		pauseToggleFn = null;
		isPausedFn = null;
		canvas.removeEventListener("pointerup", onPausePointerUp);
		playMusic("select");
		runSelectScreen(goToStageSelect);
	};
	pauseToggleFn = () => {
		if (matchOver) return; // no pausing over the winner banner
		paused = !paused;
	};
	isPausedFn = () => paused;

	// Both attackers' hitbox/hurtbox overlap is checked against the *same* pre-hit snapshot of
	// both characters, then applied afterward - so if both swings land in the same frame it's a
	// genuine trade (both get hit) instead of whoever is resolved first always winning.
	function computeHit(attacker, defender) {
		if (!attacker.isAttacking || attacker.hitLanded || attacker.inHitstun) return null;
		const currentFrame = attacker.currentFrame();
		if (!currentFrame) return null;
		// Prefer a Clsn1-bearing frame this tick's animation advance stepped past without ever
		// landing on as the final frame (see Character.update()'s _pendingHitFrame and its own
		// comment) over the plain current frame - a short/single hit-active frame sandwiched
		// between fast startup frames (e.g. a fast crouch-attack move) can otherwise get
		// skipped over entirely within one update() call under ordinary dt jitter and never once
		// be "current" at the moment this function samples it, silently swallowing what looked
		// on screen like a clean connecting hit.
		const hitFrame = attacker._pendingHitFrame || currentFrame;
		if (hitFrame.clsn1 && hitFrame.clsn1.length > 0) {
			if (anyOverlap(attacker.hitboxes(), defender.hurtboxes())) return attacker.currentMove || {};
			return null;
		}
		// Track A: this action's frames have no authored Clsn1 - fall back to the sprite's own
		// pixel silhouette instead of "no hitbox at all". Always keyed off the true current
		// frame (not hitFrame) - this is about the actually-displayed sprite's own silhouette.
		const spans = getSpriteAlphaSpans(attacker.atlas, currentFrame.group, currentFrame.image);
		if (spans && spansOverlapBoxes(attacker, spans, defender.hurtboxes())) {
			return attacker.currentMove || {};
		}
		return null;
	}
	function applyHit(attacker, defender, move) {
		attacker.hitLanded = true;
		// Taunt atk-buff (see TAUNT_BUFF_* / Character.update()'s taunt branch) applies here, at the
		// single shared point every melee/sweep hit's damage passes through, rather than needing to
		// touch takeHit()/blockHit() themselves (which also serve projectile/summon damage that has
		// its own separate attacker reference - see the two applyHit-style call sites below).
		const atkMult = attacker.buffType === "atk" ? attacker.buffMult : 1;
		const hitInfo = { damage: (move.damage ?? 8) * atkMult, fromX: attacker.x, kbBase: move.kbBase, kbGrowth: move.kbGrowth, angle: move.angle };
		// Spark spawns roughly at the point of contact - defender's position, nudged toward the
		// attacker by a bit so it doesn't sit dead-center on the defender's own sprite.
		const sparkX = defender.x - (defender.x - attacker.x) * 0.2;
		const sparkY = defender.y - 60;
		if (defender.isBlocking) {
			defender.blockHit(hitInfo);
			if (move.sounds && move.sounds.guard) playCharacterSound(defender, move.sounds.guard);
			spawnSpark(attacker, move.guardSpark, sparkX, sparkY, attacker.facing);
		} else if (move.stun) {
			// Non-damaging stun trap (real MUGEN "dizzy" convention, e.g. the Bubble trap) - no damage,
			// no knockback, just locks the defender into the dizzy pose for move.stunDuration seconds.
			defender.applyStun(move.stunDuration ?? 1.5);
			if (move.sounds && move.sounds.hit) playCharacterSound(attacker, move.sounds.hit);
			spawnSpark(attacker, move.hitSpark, sparkX, sparkY, attacker.facing);
		} else {
			defender.takeHit(hitInfo);
			if (move.sounds && move.sounds.hit) playCharacterSound(attacker, move.sounds.hit);
			spawnSpark(attacker, move.hitSpark, sparkX, sparkY, attacker.facing);
		}
	}

	// Simple pushbox: keeps the two characters from fully overlapping while walking around each
	// other. Never active during an attack or hitstun so it can't rob a real hit of its range.
	const PUSH_MIN_DIST = 68;
	function separate(a, b) {
		if (a.isAttacking || b.isAttacking || a.inHitstun || b.inHitstun) return;
		const dx = b.x - a.x;
		const dist = Math.abs(dx);
		if (dist > 0 && dist < PUSH_MIN_DIST) {
			const push = (PUSH_MIN_DIST - dist) / 2;
			const dir = dx >= 0 ? 1 : -1;
			a.x -= push * dir;
			b.x += push * dir;
		}
	}

	/** True while a character is in hitstun AND moving fast enough (see PINBALL_MIN_SPEED) that a
	 * body-check into the other character should really hurt, not just pass through - ordinary
	 * hitstun (a light poke's tiny knockback, or the tail end of a bigger one that's already
	 * mostly decayed) stays completely harmless to bump into, same as before this feature existed. */
	function isBouncing(c) {
		if (c.hitstunTimer <= 0 || c.pinballCooldown > 0) return false;
		return c.vx * c.vx + c.vy * c.vy > PINBALL_MIN_SPEED * PINBALL_MIN_SPEED;
	}

	/** True while a character is in hitstun and moving fast enough to crack a block open - see
	 * BLOCK_BREAK_MIN_SPEED's own comment on why this is a separate, much lower bar than
	 * isBouncing() above. Deliberately NOT gated on pinballCooldown - that cooldown exists purely to
	 * stop the SAME two characters re-triggering a player-vs-player pinball hit every single frame
	 * they overlap, and has nothing to do with breaking a block; a character on that cooldown right
	 * after bouncing off the opponent should still crack open whatever block it flies into next. */
	function isBreakingSpeed(c) {
		if (c.hitstunTimer <= 0) return false;
		return c.vx * c.vx + c.vy * c.vy > BLOCK_BREAK_MIN_SPEED * BLOCK_BREAK_MIN_SPEED;
	}

	/** Hard safety-net floor: Character.update() already keeps a character from sinking below the
	 * stage ground or the platform it's standing on, but checkBlockCollisions() below can shove a
	 * character's own .y directly (pushing it out of a glass block) AFTER update() already ran
	 * for this frame, with nothing re-clamping it before the frame is drawn - that's what let a
	 * character visibly render sunk into/below the ground or a platform for a frame any time a
	 * block push-out happened to land it past the surface. Called right after every such
	 * position-mutating pass, every frame, for both characters. */
	function enforceGroundClamp(character) {
		if (character.isDead) return;
		if (character.groundedOn === "platform" && character.currentPlatform) {
			if (character.y > character.currentPlatform.y) {
				const wasAirborne = !character.grounded;
				character.y = character.currentPlatform.y;
				if (character.vy > 0) character.vy = 0;
				character.grounded = true;
				character._snapFeetToSurface(character.currentPlatform.y);
				// Mirrors Character.update()'s own landing transition (see its "wasAirborne"
				// branch) - without this, a character clamped straight from airborne here would
				// already read as grounded by the time update() runs next frame, so THAT branch's
				// own wasAirborne check would never fire, permanently stranding them on whatever
				// pose (e.g. jumpFall) was playing at the moment of the clamp.
				if (wasAirborne && !character.isLocked && !character.isAttacking) character.play(character.pose("idle"));
			}
		} else if (character.y > 0) {
			const wasAirborne = !character.grounded;
			character.y = 0;
			if (character.vy > 0) character.vy = 0;
			character.grounded = true;
			character.groundedOn = "stage";
			character.currentPlatform = null;
			character._snapFeetToSurface(0);
			if (wasAirborne && !character.isLocked && !character.isAttacking) character.play(character.pose("idle"));
		}
	}

	/** A character sent flying hard enough (isBouncing()) to plow into the OTHER character mid-
	 * flight is a real physical impact - deals real percent damage to both participants, the
	 * "pinball" feel the percent system is going for at high percent (a hit doesn't just launch
	 * one player, it can chain into launching both). Guarding cancels the damage for whichever
	 * side is doing it: the guarding character only takes shield drain (same idea as a normal
	 * blocked hit), and the MOVING character gets deflected back away from them instead of
	 * plowing straight through, mirroring a shield actually stopping something rather than just
	 * quietly no-op'ing it. Neither guarding is the default "real" pinball case: both take
	 * percent damage, the target launches away from the mover, and the mover itself sheds speed
	 * on impact (an inelastic hit, not a clean elastic bounce - two bodies colliding isn't as
	 * bouncy as the wall/side-boundary bounce elsewhere in this file). */
	function handlePinballCollision(a, b) {
		if (a.isDead || b.isDead) return;
		const aBouncing = isBouncing(a);
		const bBouncing = isBouncing(b);
		if (!aBouncing && !bBouncing) return;
		if (!anyOverlap(a.hurtboxes(), b.hurtboxes())) return;

		// If both happen to qualify at once (a rare mid-air double-bounce), the faster one is
		// treated as the mover and the other as the target, so the pair resolves as one
		// collision, not two conflicting ones the same frame.
		const aSpeed2 = a.vx * a.vx + a.vy * a.vy;
		const bSpeed2 = b.vx * b.vx + b.vy * b.vy;
		const moverIsA = aBouncing && (!bBouncing || aSpeed2 >= bSpeed2);
		const mover = moverIsA ? a : b;
		const target = moverIsA ? b : a;

		const speed = Math.sqrt(mover.vx * mover.vx + mover.vy * mover.vy);
		const impactDamage = Math.min(PINBALL_MAX_DAMAGE, speed * PINBALL_DAMAGE_SCALE);

		if (target.isBlocking) {
			target.blockHit({ damage: impactDamage, fromX: mover.x });
			mover.vx = -mover.vx * PINBALL_BOUNCE_RESTITUTION;
			mover.vy = -Math.abs(mover.vy) * PINBALL_BOUNCE_RESTITUTION * 0.5; // a gentler upward kick, not a full vertical reversal
		} else if (mover.isBlocking) {
			// Now genuinely reachable (not just a defensive fallback) since a character can hold
			// guard mid-hitstun once their own flight has already bounced once - see
			// Character.update()'s midFlightGuardable and takeHit()'s pinballBounced comment. A
			// guarding mover still bounces back off the target rather than plowing through/dealing
			// damage, same idea as the target.isBlocking branch above just from the other side.
			mover.vx = -mover.vx * PINBALL_BOUNCE_RESTITUTION;
		} else {
			target.takeHit({ damage: impactDamage, fromX: mover.x, kbBase: 260 + speed * 0.15, kbGrowth: 6, angle: 30 });
			const moverDamage = impactDamage * 0.4; // the mover takes a smaller share - they delivered the impact, not absorbed it
			mover.percent = Math.min(MAX_PERCENT, mover.percent + moverDamage);
			mover.damagePopups.push({ amount: Math.round(moverDamage), life: 0, seed: Math.random() * 20 - 10 });
			mover.vx *= 0.55;
			mover.vy *= 0.55;
			// This collision IS target's first bounce too (takeHit() above just reset
			// pinballBounced to false as part of a fresh launch - see its own comment - so restore
			// it immediately: a hit that arrives BY physically colliding, rather than a normal
			// hitbox, already counts as having bounced once).
			target.pinballBounced = true;
		}

		// The mover always just physically bounced off something this call, regardless of which
		// branch above ran - eligible to guard for the rest of this flight from here on.
		mover.pinballBounced = true;

		mover.pinballCooldown = PINBALL_COOLDOWN;
		target.pinballCooldown = PINBALL_COOLDOWN;
	}

	/** Resolves against at most one live block per call, against ANY character (not just one
	 * currently isBouncing() - a normal jump, a recovery move, momentum left over after hitstun
	 * already ended mid-flight, anything) that overlaps a live block - the wall itself is solid to
	 * everyone, always, or a character could simply climb/float past it above the grid's own
	 * height entirely and reach STAGE.blastAbove without ever actually going through a block, which
	 * defeats the whole point of it being a barrier in front of the kill boundary. Only whether a
	 * given hit actually BREAKS the block it hits is still gated on isBreakingSpeed() (fast + in
	 * hitstun, a lower bar than isBouncing()'s own player-vs-player threshold) below - "one hit from
	 * a bouncing pinball player breaks blocks" - a slower/calmer
	 * contact still gets stopped cold (bounced back, same as any other hit), it just doesn't crack
	 * the block open.
	 * `prevX`/`prevY` are the character's position from BEFORE this frame's own Character.update()
	 * already moved it (captured by the caller, since this runs after that update - see the
	 * frame() call site) - used to build a SWEPT test box spanning the character's entire path this
	 * frame, not just where it ended up. Without that, a fast enough character can cross an entire
	 * block's width/height inside a single frame's position update and never actually overlap it at
	 * the one instant this function runs - "phasing through" a solid block wall regardless of its
	 * speed. The swept box always covers the whole distance traveled, so any block that path
	 * crossed still overlaps it and gets caught, at any speed.
	 * Two different resolutions depending on HOW the overlap was caught, not just one:
	 *  - A DIRECT overlap (the character's own current, non-swept hurtbox rect genuinely intersects
	 *    the block right now) gets a real MTV push-out: shoved clear along whichever axis has the
	 *    SHALLOWER penetration, by exactly that overlap amount. This is what a character embedded in
	 *    a block needs, however it happened - including a block regenerating underneath/around a
	 *    character who was simply resting there (nothing "moved into" anything that frame, so the
	 *    swept box alone would never have caught it, and prevX/prevY could easily be inside that
	 *    same block too since they hadn't gone anywhere - snapping back to it would just re-trap them
	 *    every single frame forever, which was exactly the "stuck and can't move" bug this replaces).
	 *  - A SWEPT-only overlap (no direct overlap right now - the character's current position is
	 *    already cleanly on the far side, only the path swept through the block) is pure tunneling:
	 *    prevX/prevY is safe to snap back to here, since that's genuinely where they were standing
	 *    before crossing into the block this exact frame.
	 * Whichever way it resolves, the character bounces: velocity reversed along the corrected axis
	 * (both axes, for the snap-back tunneling case - a real "opposite direction" bounce; just the
	 * one shallower axis for the push-out case, so a graze off a corner doesn't fling them back
	 * along an axis they were barely touching). That's what makes the grid a genuine, always-solid
	 * barrier in front of the kill boundary: only a column that's already had its blocks cleared (by
	 * earlier hits, from a bouncing character) lets a later launch fly all the way up into
	 * STAGE.blastAbove.
	 * When more than one live block overlaps at once (adjacent blocks, a big/fast hurtbox), a direct
	 * overlap always wins over a swept-only one, and among same-kind candidates the largest overlap
	 * AREA is picked - the one most genuinely in the way - rather than just whichever happens first
	 * in blockGrid's array order. */
	function checkBlockCollisions(character, prevX, prevY) {
		const hBoxes = character.hurtboxes();
		if (!hBoxes.length) return;

		// One unified bounding rect over every hurtbox (most standing poses are several boxes -
		// head/body/limbs), not just hBoxes[0], so a multi-box hurtbox still resolves as one solid
		// body instead of only ever checking whichever box happens to be listed first.
		let cx1 = Infinity, cy1 = Infinity, cx2 = -Infinity, cy2 = -Infinity;
		for (const b of hBoxes) {
			if (b[0] < cx1) cx1 = b[0];
			if (b[1] < cy1) cy1 = b[1];
			if (b[2] > cx2) cx2 = b[2];
			if (b[3] > cy2) cy2 = b[3];
		}
		if (cx1 > cx2 || cy1 > cy2) return; // no real boxes after all (shouldn't happen given the length check above, but stay defensive)

		// Expand the test box backward along this frame's own movement (character.x/y minus
		// prevX/prevY) so it spans the character's ENTIRE path this frame, not just its final
		// resting spot - see this function's own comment on why that's what actually stops
		// high-speed tunneling. Only used as a SWEPT-only fallback below, when there's no direct
		// overlap right now.
		const dx = character.x - prevX;
		const dy = character.y - prevY;
		const sx1 = Math.min(cx1, cx1 - dx);
		const sx2 = Math.max(cx2, cx2 - dx);
		const sy1 = Math.min(cy1, cy1 - dy);
		const sy2 = Math.max(cy2, cy2 - dy);

		let best = null, bestIsDirect = false, bestArea = 0, bestOverlapX = 0, bestOverlapY = 0;
		for (const block of blockGrid) {
			if (!block.alive) continue;
			const by = getBlockY(block);
			const bx1 = block.x, bx2 = block.x + block.w, by1 = by, by2 = by + block.h;

			const directOverlapX = Math.min(cx2, bx2) - Math.max(cx1, bx1);
			const directOverlapY = Math.min(cy2, by2) - Math.max(cy1, by1);
			if (directOverlapX > 0 && directOverlapY > 0) {
				const area = directOverlapX * directOverlapY;
				if (!bestIsDirect || area > bestArea) {
					best = block; bestIsDirect = true; bestArea = area;
					bestOverlapX = directOverlapX; bestOverlapY = directOverlapY;
				}
				continue;
			}
			if (bestIsDirect) continue; // a direct overlap on some other block always outranks a merely-swept one

			const sweptOverlapX = Math.min(sx2, bx2) - Math.max(sx1, bx1);
			const sweptOverlapY = Math.min(sy2, by2) - Math.max(sy1, by1);
			if (sweptOverlapX <= 0 || sweptOverlapY <= 0) continue;
			const area = sweptOverlapX * sweptOverlapY;
			if (!best || area > bestArea) {
				best = block; bestArea = area;
			}
		}
		if (!best) return;

		// A genuinely fast/hitstun hit cracks the block open - see isBreakingSpeed()'s own comment
		// on why this uses a lower, dedicated bar rather than the much higher isBouncing() (tuned
		// for a soon-after-the-hit player-vs-player collision, not a launch that's already bled off
		// speed climbing all the way up to the wall) - anything slower still bounces off it, just
		// without breaking it.
		if (isBreakingSpeed(character)) {
			best.alive = false;
			best.respawnTimer = BLOCK_REGEN_SECONDS;
			const by = getBlockY(best);
			activeBlockBursts.push(new BlockShatterBurst(best.x + best.w / 2, by + best.h / 2, best.w, best.h, BLOCK_PALETTE[best.colorIndex]));
		}

		if (bestIsDirect) {
			// Real push-out: shove clear along whichever axis is shallower, away from the block's
			// own center - guaranteed to actually clear it regardless of how the character ended up
			// embedded there (see this function's own comment on why prevX/prevY isn't safe to
			// assume here).
			const by = getBlockY(best);
			if (bestOverlapX < bestOverlapY) {
				const dir = (cx1 + cx2) / 2 < best.x + best.w / 2 ? -1 : 1;
				character.x += dir * bestOverlapX;
				character.vx = -character.vx * BLOCK_BOUNCE_RESTITUTION;
			} else {
				const dir = (cy1 + cy2) / 2 < by + best.h / 2 ? -1 : 1;
				character.y += dir * bestOverlapY;
				character.vy = -character.vy * BLOCK_BOUNCE_RESTITUTION;
			}
		} else {
			// Pure tunneling - snap back to the last known-clear position, then bounce straight back
			// the way it came.
			character.x = prevX;
			character.y = prevY;
			character.vx = -character.vx * BLOCK_BOUNCE_RESTITUTION;
			character.vy = -character.vy * BLOCK_BOUNCE_RESTITUTION;
		}
		// Bouncing off a block is a real bounce event for this flight too - see
		// handlePinballCollision()'s matching comment and takeHit()'s own on why a brand-new launch
		// starts this false. Only actually matters while hitstunTimer > 0 (a calm character bouncing
		// off a block harmlessly here isn't otherwise affected, since it's not locked to begin with).
		character.pinballBounced = true;
	}

	function checkKO(character, name, opponentName, opponentChar) {
		if (isOffStage(character) && !character.isDead) {
			character.stocks = Math.max(0, character.stocks - 1);
			// A burst at the point they left the screen, then a brief pause with the character
			// hidden entirely (see Character.die()/DEATH_PAUSE) before they respawn - respawn()
			// itself fires automatically once that pause ends (see Character.update()'s isDead
			// branch), no separate call needed here. Clamped to blastAbove so the burst reads at the
			// screen's top edge rather than off in the (much further) world-space blast zone.
			activeKOBursts.push(new KOBurst(character.x, Math.max(character.y, STAGE.blastAbove)));
			character.die();
			if (character.stocks === 0 && !matchOver) {
				matchOver = true;
				winnerLabel = opponentName;
				roundFightKO.showKO();
				// Real win pose (see POSE_SLOT_KEYS/ACTION.WIN) - the main loop stops calling this
				// character's normal update() once matchOver is true (see startMatch()'s frame()),
				// so its animation is kept alive separately via advanceWinPose() below instead.
				opponentChar.play(opponentChar.pose("win"), true);
			} else if (character.stocks > 0) {
				// Not the deciding stock - shows K.O. immediately, then automatically starts the
				// next 3-2-1/"FIGHT!" intro once its hold time elapses (see RoundFightKO.update()).
				roundNumber += 1;
				roundFightKO.queueNextRound(roundNumber);
			}
		}
	}

	function frame(now) {
		if (!active) return;
		const dt = Math.min((now - last) / 1000, 1 / 30);
		last = now;

		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(frame);
			return;
		}

		// Gamepad Start button toggles pause - checked here (raw, off both pads) rather than fed
		// through p1Input/readGamepadInput's normal shape, since it's a match-level menu action, not
		// a per-character combat input Character.update() should ever see. Runs unconditionally
		// (even while already paused/matchOver) so Start also works to resume.
		const startPad1 = connectedPad(0);
		const startPad2 = connectedPad(1);
		const p1StartHeld = startPad1 ? padPressed(startPad1, 9) : false;
		const p2StartHeld = startPad2 ? padPressed(startPad2, 9) : false;
		if (((p1StartHeld && !p1StartPrev) || (p2StartHeld && !p2StartPrev)) && !matchOver) {
			paused = !paused;
		}
		p1StartPrev = p1StartHeld;
		p2StartPrev = p2StartHeld;

		// B (quit to menu) / Y (toggle fullscreen) - the gamepad half of drawPauseOverlay()'s own
		// Resume/Fullscreen/Quit buttons, only meaningful while actually paused (see this block's
		// own edge-detection reset in the else branch, so a button already held from gameplay right
		// as pause opens doesn't instantly fire the moment it becomes "new"). Safe to repurpose B/Y
		// here since Character.update() never runs at all while paused - these two aren't real
		// combat inputs at that moment, just menu buttons.
		if (paused) {
			const p1BHeld = startPad1 ? padPressed(startPad1, 1) : false;
			const p2BHeld = startPad2 ? padPressed(startPad2, 1) : false;
			if ((p1BHeld && !p1BPrev) || (p2BHeld && !p2BPrev)) backToSelectFn();
			p1BPrev = p1BHeld;
			p2BPrev = p2BHeld;

			const p1YHeld = startPad1 ? padPressed(startPad1, 3) : false;
			const p2YHeld = startPad2 ? padPressed(startPad2, 3) : false;
			if ((p1YHeld && !p1YPrev) || (p2YHeld && !p2YPrev)) toggleFullscreen();
			p1YPrev = p1YHeld;
			p2YPrev = p2YHeld;
		} else {
			p1BPrev = false;
			p2BPrev = false;
			p1YPrev = false;
			p2YPrev = false;
		}

		if (!matchOver && !paused && !roundFightKO.blocking) {
			// Keep both AI brains on whatever difficulty is currently selected.
			const difficulty = difficultyOrder[difficultyIndex];
			if (p1AI.difficulty !== difficulty) p1AI.setDifficulty(difficulty);
			if (p2AI.difficulty !== difficulty) p2AI.setDifficulty(difficulty);

			const p1Move = p1IsAI ? p1AI.update(dt, p1SummonCooldown) : getP1Input(p2.x);
			const p2Move = p2IsAI ? p2AI.update(dt, p2SummonCooldown) : getP2Input(p1.x);

			// Snapshotted BEFORE Character.update() below moves them - checkBlockCollisions() needs
			// each character's position from the start of this frame to build a swept collision box
			// spanning its whole path, not just where it lands, so a block wall can never be
			// tunneled through regardless of speed (see that function's own comment).
			const p1PreX = p1.x, p1PreY = p1.y;
			const p2PreX = p2.x, p2PreY = p2.y;

			p1.update(dt, p1Move, stageLayout.platforms);
			p2.update(dt, p2Move, stageLayout.platforms);
			spawnPendingProjectile(p1);
			spawnPendingProjectile(p2);

			if (p1SummonCooldown > 0) p1SummonCooldown = Math.max(0, p1SummonCooldown - dt);
			if (p2SummonCooldown > 0) p2SummonCooldown = Math.max(0, p2SummonCooldown - dt);
			p1SummonCooldown = trySummon(p1SummonCooldown, p1Move.summon, p1SummonPrev, p1, p2, p1.facing);
			p2SummonCooldown = trySummon(p2SummonCooldown, p2Move.summon, p2SummonPrev, p2, p1, p2.facing);
			p1SummonPrev = Boolean(p1Move.summon);
			p2SummonPrev = Boolean(p2Move.summon);

			separate(p1, p2);
			handlePinballCollision(p1, p2);
			checkBlockCollisions(p1, p1PreX, p1PreY);
			checkBlockCollisions(p2, p2PreX, p2PreY);
			enforceGroundClamp(p1);
			enforceGroundClamp(p2);

			const p1HitMove = computeHit(p1, p2);
			const p2HitMove = computeHit(p2, p1);
			if (p1HitMove) applyHit(p1, p2, p1HitMove);
			if (p2HitMove) applyHit(p2, p1, p2HitMove);

			checkKO(p1, p1Label, p2Label, p2);
			checkKO(p2, p2Label, p1Label, p1);
		}

		// Transient effects (a summon mid-attack, a projectile still traveling, hit/miss sparks,
		// a KO burst) keep running on their own timers here regardless of matchOver - gated only
		// on !paused, not !matchOver. A summon/projectile that's already out in the world when a
		// character dies (or the match itself ends on that KO) finishes its own animation, lands
		// or misses its hit, and grows/shrinks/fades out same as always, instead of freezing
		// mid-action the instant matchOver flips true (which used to read as it glitching and
		// vanishing, since nothing here ever got another update() call to carry on or clean
		// itself up). Only NEW spawns (trySummon/spawnPendingProjectile above) stop once the
		// match is over - existing ones always get to finish.
		if (!paused) {
			for (const s of activeSummons) {
				s.update(dt);
				if (s.isAttacking && !s.hitLanded && anyOverlap(s.hitboxes(), s.target.hurtboxes())) {
					s.hitLanded = true;
					const def = s.def;
					const owner = s.owner || (s.target === p1 ? p2 : p1);
					const atkMult = owner.buffType === "atk" ? owner.buffMult : 1;
					const hitInfo = { damage: def.damage * atkMult, fromX: s.x, kbBase: def.kbBase, kbGrowth: def.kbGrowth, angle: def.angle };
					if (s.target.isBlocking) { s.target.blockHit(hitInfo); spawnSpark(owner, def.guardSpark, s.x, s.y - 60, s.facing); }
					else { s.target.takeHit(hitInfo); spawnSpark(owner, def.hitSpark, s.x, s.y - 60, s.facing); }
				}
			}
			for (let i = activeSummons.length - 1; i >= 0; i--) {
				if (activeSummons[i].isDone) activeSummons.splice(i, 1);
			}

			for (const proj of activeProjectiles) {
				proj.update(dt);
				const target = proj.owner === p1 ? p2 : p1;
				if (!proj.hitLanded && anyOverlap(proj.hitboxes(), target.hurtboxes())) {
					proj.hitLanded = true;
					const move = proj.move;
					const atkMult = proj.owner && proj.owner.buffType === "atk" ? proj.owner.buffMult : 1;
					const hitInfo = { damage: (move.damage ?? 8) * atkMult, fromX: proj.x, kbBase: move.kbBase, kbGrowth: move.kbGrowth, angle: move.angle };
					if (target.isBlocking) target.blockHit(hitInfo);
					else target.takeHit(hitInfo);
					const p = move.projectile || {};
					spawnSpark(proj.owner, p.hitSparkAction, proj.x, proj.y - 30 * ((proj.owner && proj.owner.scale) || 1), proj.facing);
				}
			}
			for (let i = activeProjectiles.length - 1; i >= 0; i--) {
				const proj = activeProjectiles[i];
				if (proj.done) {
					// Expired without ever landing (flew off, or ran out of life) - a quieter "fizzle"
					// spark instead of the hit spark, if the move has a distinct one for that.
					if (!proj.hitLanded) {
						const p = proj.move.projectile || {};
						spawnSpark(proj.owner, p.missSparkAction, proj.x, proj.y - 30 * ((proj.owner && proj.owner.scale) || 1), proj.facing);
					}
					activeProjectiles.splice(i, 1);
				}
			}
			for (let i = activeImpactFX.length - 1; i >= 0; i--) {
				activeImpactFX[i].update(dt);
				if (activeImpactFX[i].done) activeImpactFX.splice(i, 1);
			}
			for (let i = activeKOBursts.length - 1; i >= 0; i--) {
				activeKOBursts[i].update(dt);
				if (activeKOBursts[i].done) activeKOBursts.splice(i, 1);
			}
			for (const block of blockGrid) {
				if (block.alive) continue;
				block.respawnTimer -= dt;
				if (block.respawnTimer <= 0) block.alive = true;
			}
			for (let i = activeBlockBursts.length - 1; i >= 0; i--) {
				activeBlockBursts[i].update(dt);
				if (activeBlockBursts[i].done) activeBlockBursts.splice(i, 1);
			}
			roundFightKO.update(dt);
		}

		// --- draw --- (recomputed every frame so a live window resize is handled for free)
		// Camera follows the midpoint between both characters (panning) and zooms out however much
		// is needed to keep BOTH of them actually on screen - horizontally AND vertically - rather
		// than the old "roughly how far apart are they" distance heuristic: zoomFitX/zoomFitY below
		// are the exact zoom levels at which each axis's required span just fits the canvas, and the
		// SMALLER of the two (whichever axis is more constrained) becomes the target, clamped to
		// this game's own ZOOM_MIN/ZOOM_MAX range. Below ZOOM_MIN (a full stage-width-or-taller
		// spread) the two are simply too far apart to keep both framed at all - that's the one case
		// a player can still fly off screen, same as a real fighting game's blast zone; anywhere
		// short of that, this guarantees both stay visible, including a player launched high up
		// toward the block wall/blast zone, which is the whole reason to actually reveal that space.
		const CHAR_FIT_PAD = 180; // world-unit padding kept around each character's own X position so they're not clipped right at the very edge of the frame horizontally
		// Full standing sprite height, in world units, above a character's own y (their feet/ground
		// anchor - see Character.y) - NOT just "extra margin", the actual space their body occupies.
		// Derived from CHARACTER_MAX_HEIGHT_PX (the top of the natural-height clamp band every
		// character's own real scale is measured against - see that constant's own comment block)
		// plus a little extra padding for taller attack/knockback-stretch poses, which run bigger
		// than the idle frame that clamp is measured from. Deriving this from the clamp's own
		// ceiling (rather than a separately-tuned flat number) means it can never quietly drift out
		// of sync with the actual max a character can ever render at - nobody's own head can clip
		// off the top of frame even at rest, no matter how tall their natural (clamped) height is.
		const CHARACTER_STAND_HEIGHT = CHARACTER_MAX_HEIGHT_PX + 40;
		const CAMERA_TOP_MARGIN = 70; // extra breathing room above the tallest player's own head, on top of CHARACTER_STAND_HEIGHT, so it doesn't sit flush against the top edge
		const ZOOM_MIN = CAMERA_ZOOM_MIN; // at/beyond a full stage-width (or stage-height) spread - the floor; a player can still fly off screen past this point - see CAMERA_ZOOM_MIN's own comment (buildBlockGrid() reads the same constant)
		const ZOOM_MAX = 1; // at/under a close-range distance - no pull-back at all now that characters render at the natural-height clamp's tall ~180-200px standing height (was 0.75, tuned back when characters rendered at BASE_SCALE's old ~350px) - shrinking them further on top of that would read as uncomfortably tiny up close
		const distX = Math.abs(p1.x - p2.x);
		const highestPlayerY = Math.min(p1.y, p2.y); // most negative = highest above ground
		const zoomFitX = GAME_W / (distX + CHAR_FIT_PAD * 2);
		// No more Math.min(0, ...)/clamping-to-only-count-airborne-height here - a STANDING player
		// (highestPlayerY = 0) still needs CHARACTER_STAND_HEIGHT + CAMERA_TOP_MARGIN of headroom
		// above them at all times; jumping/launched (highestPlayerY < 0) just adds to that same
		// requirement on top, it was never a separate case.
		const zoomFitY = GAME_H / Math.max(1, -highestPlayerY + CHARACTER_STAND_HEIGHT + CAMERA_TOP_MARGIN);
		const targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoomFitX, zoomFitY));
		// Zooming further OUT (to keep someone newly visible) snaps in fast - a player launched hard
		// toward the block wall needs the camera to catch up within a frame or two, not ease into it
		// over half a second by which point they'd already be clipped off the top of the screen.
		// Zooming back IN, once things calm back down, eases in slower so the camera doesn't feel
		// jittery/twitchy at normal range.
		const zoomLerpRate = targetZoom < camZoom ? 12 : 4;
		camZoom += (targetZoom - camZoom) * Math.min(1, zoomLerpRate * dt);

		const halfView = GAME_W / 2 / camZoom; // in world units - widens as the camera zooms out
		const maxCamX = Math.max(0, STAGE.right - halfView);
		const targetCamX = Math.max(-maxCamX, Math.min(maxCamX, (p1.x + p2.x) / 2));
		camX += (targetCamX - camX) * Math.min(1, 6 * dt);
		// Hard safety clamp AFTER the lerp above, re-applied every frame against the CURRENT (already
		// up-to-date) maxCamX - not just relied on via targetCamX's own clamp. camX eases toward its
		// target at a fixed 6/dt rate, but camZoom (and therefore maxCamX, which shrinks as the camera
		// zooms out) can snap out much faster (up to 12/dt - see zoomLerpRate above) during a sudden
		// vertical launch. Without this, a frame or two right after a fast zoom-out could catch camX
		// still mid-lerp toward a now-stale, wider maxCamX from before the zoom - i.e. camX sitting
		// further off-center than the NEW, tighter-zoomed frame can actually afford - which is exactly
		// what let the stage's own bg art edge (and the flat black past it) show at the screen's side
		// during/right after a big bounce, even though bgCoverWidth is otherwise sized to always cover
		// the full canvas at any zoom >= ZOOM_MIN. This just guarantees camX can never itself be
		// outside the currently-valid range, lerp lag or not.
		camX = Math.max(-maxCamX, Math.min(maxCamX, camX));
		const screenCenterX = GAME_W / 2 - camX * camZoom; // world x=0 renders here

		// Background art geometry is computed BEFORE the ground row itself now - the ground row
		// (world y=0's screen row) is DERIVED from wanting the art's own bottom edge pinned to the
		// canvas's own bottom edge (GAME_H), rather than the other way around. An earlier version
		// picked the ground row from `groundYFrac` first and let the art's bottom edge land wherever
		// that put it - fine for a stage whose groundYFrac stayed under ~1, but for one calibrated
		// like this gif stage (deliberately dragged below the mapper's own canvas edge - see the
		// STAGES comment), that put the ground row - and every character standing on it - below the
		// bottom of the visible canvas entirely. Pinning the art's bottom edge to GAME_H instead
		// means the ground row lands wherever that pin puts it, which can never itself exceed GAME_H
		// (STAGE_BG_GROUND_FRAC is always <= 1 - see the math below), so characters always stay
		// on-screen and reasonably framed instead of standing on an invisible line past the bottom edge.
		const STAGE_BG_GROUND_FRAC = STAGE.bgFloorFrac ?? (400 / 720);
		const bgCoverWidth = GAME_W / ZOOM_MIN;
		const bgImg = currentStageId ? stageBgImages[currentStageId] : null;
		// Only requires the plain <img> (bgImg) to be ready, NOT the GIF-stage video specifically
		// (stageGifLayer) - that used to gate bgReady too, which meant if the video was ever slow
		// to load, blocked by the browser's autoplay policy, or simply failed, the ENTIRE
		// background silently never drew at all (not even a static fallback frame) for the rest
		// of the match, despite bgImg itself - loaded via a completely separate <img> element -
		// having succeeded just fine. See the draw block below for the actual video-vs-static
		// fallback logic this now allows.
		const bgReady = bgImg && bgImg.complete && bgImg.naturalWidth > 0;
		let bgDw = 0, bgDh = 0;
		if (bgReady) {
			const scaleForWidth = bgCoverWidth / bgImg.naturalWidth;
			// Independent of any ground-line calibration - guarantees the art is never shorter than
			// the canvas itself, so there's always real image left to pin to GAME_H even before the
			// width-driven cover-fit scale (in practice almost always the bigger of the two) is applied.
			const scaleForHeightMin = GAME_H / bgImg.naturalHeight;
			const scale = Math.max(scaleForWidth, scaleForHeightMin);
			bgDw = bgImg.naturalWidth * scale;
			bgDh = bgImg.naturalHeight * scale;
			// The breakout block grid's bottom row seeps just slightly past this stage's real art's
			// top edge (BLOCK_GRID_SEEP) rather than floating with a gap above it, in the same black
			// "extends the camera vertically above the stage" space the starfield fills (see
			// drawStars()'s own comment on that rule) - recomputed fresh every frame from the actual
			// loaded image (cheap - one multiply) rather than a guessed fixed world height, so it's
			// always correct the moment the background image finishes loading, and stays correct
			// even if a future stage's art has very different real dimensions.
			blockGridBottomY = -STAGE_BG_GROUND_FRAC * bgDh + BLOCK_GRID_SEEP;
		}

		// Always keep the lowest (closest-to-ground) player's row visible, and extend UPWARD past the
		// pinned-bottom baseline by however much headroom the highest player's own FULL standing
		// sprite height needs (see CHARACTER_STAND_HEIGHT's own derivation comment above) - not just
		// "extra" once someone leaves the ground. Pushing groundY further DOWN the fixed 720-tall
		// canvas (revealing genuine black space - filled with the starfield - at the top) is what
		// "extends the camera vertically above the stage" - working together with zoomFitY above
		// (which already widened the view to help keep this same high-up player framed), not instead
		// of it.
		const neededTopWorldY = highestPlayerY - CHARACTER_STAND_HEIGHT - CAMERA_TOP_MARGIN;
		const neededHeadroomPx = Math.max(0, -neededTopWorldY) * camZoom;
		// The art's own bottom edge lands, in screen space, at groundY + camZoom*bgDh*(1-frac) - see
		// the bg draw block below for that same formula the other way round. Solving it for groundY
		// with the LHS pinned to GAME_H is this line. Recomputed fresh every frame from the current
		// (already-smoothed) camZoom, so the pin holds continuously through every zoom change too,
		// not just at rest.
		const pinnedGroundY = bgReady ? (GAME_H - camZoom * bgDh * (1 - STAGE_BG_GROUND_FRAC)) : GAME_H * 0.7;
		const targetGroundY = Math.max(pinnedGroundY, neededHeadroomPx);
		// Same fast-reveal/slow-retract asymmetry as camZoom above: MORE headroom (targetGroundY
		// increasing) snaps in quickly so a sudden launch doesn't outrun it and clip off the top of
		// the screen; retracting back to the resting baseline once things calm down eases in slower.
		const groundLerpRate = targetGroundY > groundYScreen ? 12 : 5;
		groundYScreen = groundYScreen < 0 ? targetGroundY : groundYScreen + (targetGroundY - groundYScreen) * Math.min(1, groundLerpRate * dt);
		const groundY = groundYScreen;

		// No clearRect needed here - the fillRect immediately below already overwrites every pixel
		// in the canvas, an opaque full-canvas clear right before it was pure wasted work every frame.
		ctx.fillStyle = "#05060c"; // deep-space fallback for any revealed space above the stage (was a flat panel gray - now only ever seen there, so it reads as sky rather than "art still loading")
		ctx.fillRect(0, 0, GAME_W, GAME_H);
		drawStars(now); // fixed screen-space backdrop (see the Starfield section) - stays put under camera pan/zoom, only ever actually visible above the stage's own art, per the black-space rule above

		ctx.save();
		ctx.translate(screenCenterX, groundY); // world space -> screen space
		ctx.scale(camZoom, camZoom);

		// Stage background: drawn INSIDE the same camera transform as the platforms/characters
		// (below), so it zooms and pans together with everything else instead of sitting frozen in
		// screen space while the world "moves" independently around it - that mismatch is what used
		// to make the platforms look like they were sliding in and out on their own as the camera
		// zoomed. The world's own bounce bounds (STAGE.left/right, combat.js) are still NOT tied to
		// the image's displayed size - they stay the fixed ±540 world units (1080 wide) the physics/
		// platform layouts were already tuned against, which happens to line up with the full 1280px canvas
		// width at the camera's default zoom/pan, i.e. the edges of the (cover-fit) image are where
		// a character bounces off, in the common case of camera zoom=1/pan=0.
		//
		// Local-space (pre-transform - see ctx.translate/scale just above) Y of the canvas's true
		// bottom edge, screen row GAME_H, mapped back through the same camera transform the art below
		// is about to be drawn under - see drawStageLayerCovered()'s own comment for why this matters.
		const stageCoverBottomY = (GAME_H - groundY) / camZoom;
		if (bgReady) {
			const drawX = -bgDw / 2; // centered on world x=0
			const drawY = -STAGE_BG_GROUND_FRAC * bgDh; // pins the art's real floor row to world y=0 (=groundY on screen)
			// For a GIF stage (bgExt: "gif"), draw gifFrameCache instead of `bgImg` - a canvas kept
			// periodically re-sampled from the real, playing #stageGifLayer <video> (see its own
			// declaration comment for why this indirection exists - a straight ctx.drawImage() of the
			// live element every render frame was the actual stutter, not the DOM-overlay code an
			// earlier pass here already removed for the black-box FX bug). `bgImg` itself is never
			// drawn for these - it only exists for its naturalWidth/naturalHeight above, identical to
			// stageGifLayer's since it's the same file. This still keeps the canvas fully opaque
			// everywhere (no transparent hole for additive-blended hit-spark/explosion art - see
			// ImpactFX.draw()'s own comment - to wrongly show through as solid black).
			let bgDrawSrc = bgImg;
			if (currentStageIsGif && stageGifLayer.videoWidth > 0) {
				// The video (and therefore the animated frame cache) is actually ready - use it.
				// If it ISN'T ready (still loading, blocked by autoplay policy, or simply
				// errored), bgDrawSrc just stays bgImg from above: a static, but correctly
				// positioned/scaled, first frame of the same art - miles better than nothing.
				if (gifFrameCache.width !== stageGifLayer.videoWidth || gifFrameCache.height !== stageGifLayer.videoHeight) {
					gifFrameCache.width = stageGifLayer.videoWidth;
					gifFrameCache.height = stageGifLayer.videoHeight;
				}
				if (now - gifFrameCacheLastUpdate > GIF_FRAME_CACHE_INTERVAL_MS) {
					gifFrameCacheCtx.drawImage(stageGifLayer, 0, 0);
					gifFrameCacheLastUpdate = now;
				}
				bgDrawSrc = gifFrameCache;
			}
			drawStageLayerCovered(ctx, bgDrawSrc, drawX, drawY, bgDw, bgDh, stageCoverBottomY);
			strokeComicPanelOutline(ctx, drawX, drawY, bgDw, bgDh, camZoom);
		}

		// Optional foreground layer (set dressing only - pillars/plants/etc.) - drawn right after the
		// background and BEFORE the platforms/characters below, so it can never obscure actual
		// gameplay, using the same scale/position formula (and the same world transform) so it stays
		// aligned with the background and zooms/pans right along with it too.
		const fgImg = currentStageId ? stageFgImages[currentStageId] : null;
		if (fgImg && fgImg.complete && fgImg.naturalWidth > 0) {
			// Same scaleForWidth/scaleForHeightMin approach as the main bg layer above (see its own
			// comment) - independent of any ground-line calibration, just guarantees full coverage.
			const scaleForWidth = bgCoverWidth / fgImg.naturalWidth;
			const scaleForHeightMin = GAME_H / fgImg.naturalHeight;
			const scale = Math.max(scaleForWidth, scaleForHeightMin);
			const dw = fgImg.naturalWidth * scale;
			const dh = fgImg.naturalHeight * scale;
			const drawX = -dw / 2;
			const drawY = -STAGE_BG_GROUND_FRAC * dh;
			drawStageLayerCovered(ctx, fgImg, drawX, drawY, dw, dh, stageCoverBottomY);
		}

		// Solid ground bar - only for a stage with no background art (bgReady false): a real stage's
		// own floor art (aligned to this same `groundY` above) is the floor there, and drawing a
		// generic gray bar on top of it would just clash with the real art. See drawFloor()'s own
		// comment for why this is purely cosmetic - the actual (non-droppable) floor collision
		// already exists whether this draws or not.
		if (!bgReady) drawFloor(ctx);

		// Floating platforms, drawn after the background/foreground and before the characters -
		// platforms render over everything behind them (background, optional foreground layer) and
		// anyone standing on one draws in front of it in turn. Platforms themselves never move
		// (their x1/x2/y are fixed stage data - only the very subtle wind-sway drawn below shifts,
		// and that's a draw-time-only offset that never touches the real platform coordinates used
		// for collision, so it can't cause the "platform drifts/jitters" class of bug).
		stageLayout.platforms.forEach((p, i) => drawPlatform(ctx, p, PLATFORM_ACCENTS[i % PLATFORM_ACCENTS.length], now));

		// Breakout block wall - drawn right after the platforms (so it layers above the background/
		// foreground stage art exactly like they do) and before the characters (so a fighter flying
		// up through the grid still draws in front of whatever's left of it, same convention as
		// platforms above). See buildBlockGrid()'s own comment for why the grid itself is fixed-size
		// rather than per-stage.
		drawBlockGrid(ctx, blockGrid, now, camX, camZoom);

		p1.draw(ctx);
		p2.draw(ctx);
		for (const s of activeSummons) s.draw(ctx);
		for (const proj of activeProjectiles) proj.draw(ctx);
		for (const fx of activeImpactFX) fx.draw(ctx);
		for (const burst of activeKOBursts) burst.draw(ctx);
		for (const burst of activeBlockBursts) burst.draw(ctx);
		if (showBoxes) {
			drawBoxes(p1.hurtboxes(), "#3399ff");
			drawBoxes(p1.hitboxes(), "#ff3333");
			drawBoxes(p2.hurtboxes(), "#3399ff");
			drawBoxes(p2.hitboxes(), "#ff3333");
			for (const proj of activeProjectiles) drawBoxes(proj.hitboxes(), "#ffcf5d");
		}

		// Front foreground layer (see stage-mapper.html's "front foreground" upload) - a SECOND,
		// optional layer drawn dead last, on top of platforms and both fighters (unlike the classic
		// `fg` layer above, which is deliberately kept behind gameplay). Most stages won't set this;
		// it exists for foreground bars/mesh/pillars the action should visually pass behind.
		const fgFrontImg = currentStageId ? stageFgFrontImages[currentStageId] : null;
		if (fgFrontImg && fgFrontImg.complete && fgFrontImg.naturalWidth > 0) {
			// Same scaleForWidth/scaleForHeightMin approach as the main bg layer above (see its own
			// comment) - independent of any ground-line calibration, just guarantees full coverage.
			const scaleForWidth = bgCoverWidth / fgFrontImg.naturalWidth;
			const scaleForHeightMin = GAME_H / fgFrontImg.naturalHeight;
			const scale = Math.max(scaleForWidth, scaleForHeightMin);
			const dw = fgFrontImg.naturalWidth * scale;
			const dh = fgFrontImg.naturalHeight * scale;
			const drawX = -dw / 2;
			const drawY = -STAGE_BG_GROUND_FRAC * dh;
			drawStageLayerCovered(ctx, fgFrontImg, drawX, drawY, dw, dh, stageCoverBottomY);
		}

		ctx.restore();

		// Comic-page burning border - screen space, unaffected by camera pan/zoom, drawn before the
		// HUD panels so they always stay legible on top of it. See drawBurningBorder()'s own comment.
		drawBurningBorder(ctx, now);

		drawHud(p1, p2, p1Label, p2Label, p1SummonCooldown, p2SummonCooldown);
		roundFightKO.draw(ctx);
		if (matchOver) {
			winnerBannerTimer = Math.min(WINNER_BANNER_FADE, winnerBannerTimer + dt);
			drawWinnerBanner(winnerLabel, winnerBannerTimer / WINNER_BANNER_FADE);
			// Only the winner is actually mid-win-pose here (the loser is isDead/mid-KO-pause and
			// isn't drawn at all in that state - see Character.draw()'s own early return) - calling
			// this on both is harmless either way since a dead character's frame just never gets read.
			if (!p1.isDead) p1.advanceWinPose(dt);
			if (!p2.isDead) p2.advanceWinPose(dt);
		}
		if (paused) drawPauseOverlay(p1, p2, p1Label, p2Label);
		applyRetroFX(now, 0.6);

		requestAnimationFrame(frame);
	}

	requestAnimationFrame(frame);
}

runTitleScreen(() => {
	playMusic("select");
	runSelectScreen(goToStageSelect);
});

</script>
</body>
</html>
