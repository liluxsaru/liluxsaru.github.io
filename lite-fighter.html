			// Standalone/offline mode: assets were embedded in the page, no fetch() involved.
			self.atlas = await Atlas.loadInline(def.inline.csv, def.inline.png);
			self.actions = parseAir(def.inline.air);
		} else {
			const base = def.basePath;
			self.soundBasePath = base;
			// These four fetches (atlas image+csv, the .air animation-timing file, the sound
			// bank, and the optional moveset.json) are all independent of one another - nothing
			// here reads the result of another one of these loads - so kick them all off at
			// once with Promise.all instead of awaiting them one at a time. This used to be a
			// strictly sequential chain (atlas, THEN .air, THEN sounds, THEN moveset), which
			// meant a single character's load time was the SUM of every one of these round
			// trips instead of just the slowest of them; with two characters also loaded fully
			// sequentially (see startMatch()), that compounded into a genuinely slow fight-start
			// wait. moveset.json keeps its own try/catch inline (missing file for the legacy
			// roster is expected, not an error) so a 404 there can't reject the whole Promise.all
			// and take the atlas/air/sounds loads down with it.
			const [atlas, airText, soundBank, movesetData] = await Promise.all([
				Atlas.load(`${base}/sprite_atlas_${name}.csv`, `${base}/sprite_atlas_${name}.png`),
				fetch(`${base}/${name}.air`).then((r) => r.text()),
				CharacterSoundBank.load(base), // no-ops gracefully if sound_bank.json is missing
				// Optional full move-list, authored in character-mapper.html and exported next to
				// the three required files above. Missing file (the common case for the original
				// roster, which has none) is not an error - just falls back to the legacy
				// MOVESETS table below.
				fetch(`${base}/moveset.json`)
					.then((res) => (res.ok ? res.json() : null))
					.catch(() => null),
			]);
			self.atlas = atlas;
			self.actions = parseAir(airText);
			self.soundBank = soundBank;
			if (movesetData && movesetData.moves) fullMoveset = movesetData.moves;
			if (movesetData && movesetData.commandMoves && Array.isArray(movesetData.commandMoves.moves)) commandMoves = movesetData.commandMoves.moves;
			if (movesetData && movesetData.summons) summonDef = movesetData.summons;
			if (movesetData && movesetData.poseSounds) poseSounds = movesetData.poseSounds;
		}
		self.summonDef = summonDef; // null for characters with no character-specific companion pool - those characters simply have no summon move (see trySummon())
		self.poseSounds = poseSounds || {};
		self.commandMoveDefs = commandMoves || []; // fed to self.commandBuffer.match() every frame in update()
		self.commandBuffer = new CommandBuffer();
		self.tauntTimer = 0;
		self.buffType = null; // "atk" | "def" | null - see the taunt handling in update() below
		self.buffMult = 1; // >1 for an active atk buff (multiplies outgoing damage), <1 for an active def buff (multiplies incoming damage)
		self.buffTimer = 0; // seconds remaining on the current buff, 0/negative = no active buff
		// Track A: warm the pixel-perfect fallback hitbox cache now, not on a fighter's first
		// swing, so there's no mid-match hitch the first time a Clsn1-less action plays.
		warmAlphaSpanCache(self.atlas, self.actions);

		// moveset: full slot key (jab/ftilt/.../specialD) -> { action, type, damage, kbBase,
		// kbGrowth, angle, ...type-specific tuning (projectile{}/sweep{}) }. Built from a real
		// moveset.json when present, otherwise synthesized from the legacy 6-slot MOVESETS table -
		// see buildSlotMoveset()'s comment above. Either way, everything downstream (attack
		// resolution, hit detection, projectile/sweep execution) only ever looks at this table.
		self.moveset = buildSlotMoveset(name, fullMoveset);
		// Motion-input "combo" specials (see CommandBuffer/command_buffer.js) register into the same
		// moveset table under their own `key` (e.g. "hyper1") instead of a FULL_ATTACK_SLOTS slot name -
		// attack() below doesn't care which kind of key it was looked up by, and these are never
		// reachable through resolveAttackSlot()'s normal tier logic, only through a matched command.
		for (const cm of self.commandMoveDefs) {
			if (cm && cm.key && typeof cm.action === "number") self.moveset[cm.key] = cm;
		}
		// pose-key (idle/crouch/walkFwd/...) -> action number, so play() calls throughout this class
		// use this character's own pose assignments instead of assuming the template's numbers.
		self.poseMap = buildPoseMap(self.actions, fullMoveset);
		// reverse lookup: action number -> move slot, so we know when an attack animation is currently playing
		// (covers every slot, not just the four standing ones, so crouch/air attacks count as "attacking" too)
		self.actionToSlot = {};
		for (const slot of Object.keys(self.moveset)) {
			const move = self.moveset[slot];
			if (move) self.actionToSlot[move.action] = slot;
		}
		self.currentMove = null; // tuning data for whichever attack is presently active
		self.attackRecoveryTimer = 0; // brief extra recovery after an attack whiffs or lands, before another can start
		self.activeSweep = null; // set while a "sweep" type move (see character-mapper.html) is actively traveling
		self.pendingProjectileSpawn = null; // set for one frame when a "projectile" type move starts - the match loop spawns the real Projectile from it

		self.x = def.x || 0;
		self.y = def.y || 0; // y = 0 is the ground line for this character
		self.vx = 0;
		self.vy = 0;
		self.facing = def.facing || 1; // 1 = right, -1 = left
		// Paper-Mario turn-flip (cosmetic only, see TURN_FLIP_DURATION): visualFacing is what
		// draw() actually mirrors on, and only snaps to match self.facing at the flip's midpoint;
		// turnFlipTimer counts down from TURN_FLIP_DURATION to 0 across one full turn.
		self.visualFacing = self.facing;
		self.turnFlipTimer = 0;
		self.turnFlipFrom = self.facing;
		self.grounded = true;
		self.groundedOn = "stage"; // "stage" | "platform" | null (airborne) - which surface, if any, is holding self.grounded up
		self.currentPlatform = null; // the specific platform object from combat.js's PLATFORMS while groundedOn === "platform"
		// This character's own natural, clamped draw scale - see the CHARACTER_MIN/MAX_HEIGHT_PX
		// comment block for the full rule. Measured fresh from THIS character's own idle sprite
		// every load, so it's correct for any character (including any added later) with zero
		// per-character setup - def.scale is only ever consulted as an explicit manual override
		// (not used by startMatch() itself anymore; left available for tooling/tests that want to
		// force a specific scale rather than auto-measuring one).
		self.scale = def.scale || computeNaturalCharacterScale(measureIdleSpriteHeight(self.atlas, self.actions, self.poseMap));

		self.percent = 0; // Smash-style damage percent
		self.hitstunTimer = 0;
		self.stunTimer = 0; // non-damaging "dizzy" stun lock (e.g. Bubble trap) - separate from hitstunTimer, see applyStun()
		self.hitLanded = false; // true once the *current* attack has connected, to prevent multi-hits per swing
		self._pendingHitFrame = null; // this tick's own catch for a Clsn1-bearing animation frame that got stepped PAST (not landed on as the final frame) during update()'s frame-advance loop below - see that loop's own comment for why a short/single hit-active frame needs this at all
		self.groundBounceArmed = false; // set by takeHit() when the last hit was a steep/strong enough downward spike - see GROUND_BOUNCE_* comment
		self.groundBounceKb = 0;
		self.pinballCooldown = 0; // see handlePinballCollision() in main.js - one collision event per overlap, not one per frame
		self.pinballBounced = false; // true once THIS hitstun flight has bounced off something at least once - see takeHit()'s own comment and update()'s wantsGuard
		self.stocks = def.stocks ?? 3;
		self.spawnX = self.x;
		self.spawnY = self.y;

		self.shieldHP = MAX_SHIELD;
		self.isBlocking = false;
		self.blockStunTimer = 0;
		self.shieldBreakTimer = 0;
		self.invulnTimer = 0;
		self.isDead = false; // true for the brief KO pause between flying off-screen and respawning - see die()/respawn()
		self.deathTimer = 0;
		self.damagePopups = []; // floating combat-text queue - see DAMAGE_POPUP_* comment and takeHit()

		// --- Sprint (double-tap dash) state - see _updateSprintState() and SPRINT_SPEED_MULT ---
		self.moveHeldPrev = 0; // -1/0/1, which direction (if any) was held last frame
		self.jumpHeldPrev = false; // rising-edge tracking for input.jump - see update()'s jumpPressed, fixes bunny-hop/platform-loop spam from a held or AI-sustained jump input
		self.dashPendingDir = 0; // direction we just released, waiting on a fast re-press to count as a double-tap
		self.dashWindowTimer = 0; // seconds left for that re-press to land
		self.sprinting = false; // true while actively dashing
		self.sprintDir = 0; // -1/1, which direction the current sprint is committed to
		self.animSpeedMult = 1; // multiplies dt for this character's own frame-timer advance - see update()
		self.poseBlendTimer = 0; // counts down from POSE_BLEND_DURATION whenever play() switches actions - see draw()
		self.prevPoseSnap = null; // {group,image} of the frame we cross-faded away from, while poseBlendTimer > 0

		self.play(self.poseMap.idle, true);
		return self;
	}

	/** Looks up this character's own action number for a pose key (idle/crouch/walkFwd/...),
	 * falling back to the standard template's ACTION.STAND if somehow unset. */
	pose(key) {
		return this.poseMap[key] ?? ACTION.STAND;
	}

	play(actionNum, force) {
		if (this.actionNum === actionNum && !force) return;
		let action = this.actions[actionNum];
		if (!action) {
			actionNum = this.pose("idle");
			action = this.actions[actionNum];
			if (!action) return;
		}
		// Snapshot the frame we're switching away from so draw() can briefly cross-fade into the
		// new pose instead of hard-cutting to it - only when there's a genuine outgoing frame to
		// fade from (skips the very first play() call at construction, and any switch that's
		// already mid-blend just keeps extending from whatever's currently on screen).
		const outgoing = this.action ? this.currentFrame() : null;
		if (outgoing && this.actionNum !== actionNum) {
			this.prevPoseSnap = { group: outgoing.group, image: outgoing.image };
			this.poseBlendTimer = POSE_BLEND_DURATION;
		}
		this.actionNum = actionNum;
		this.action = action;
		this.frameIndex = 1;
		this.frameTimer = 0;
		const slot = this.actionToSlot[actionNum];
		if (slot) {
			this.hitLanded = false;
			this.currentMove = this.moveset[slot];
		}
	}

	/** Start an attack by full move-list slot name (jab/ftilt/.../specialD - see FULL_ATTACK_SLOTS).
	 * Handles all three move types: melee (just plays the animation - existing per-frame Clsn1 hit
	 * detection in the match loop does the rest), projectile (plays the animation once and arms
	 * pendingProjectileSpawn for the match loop to turn into a real traveling Projectile), and sweep
	 * (arms activeSweep, which update()'s physics step below drives for the move's duration). */
	attack(slot) {
		const move = this.moveset[slot];
		if (!move) return false;
		this.play(move.action);
		// Two real moves can legitimately share the same windup action number (e.g. specialU "Bubble"
		// and specialD "Bubble Bomb" both start from action 1200 in the real MUGEN source - see
		// moveset.json's _note on each). play() infers currentMove purely from the action number via
		// actionToSlot, which can't disambiguate that collision - it just keeps whichever slot was
		// last written into the map. attack() already knows definitively which slot was actually
		// invoked, so pin currentMove/hitLanded here, overriding whatever play() guessed.
		this.currentMove = move;
		this.hitLanded = false;
		if (move.sounds && move.sounds.swing) playCharacterSound(this, move.sounds.swing);
		this.pendingProjectileSpawn = null;
		this.activeSweep = null;
		if (move.type === "projectile" && move.projectile) {
			this.pendingProjectileSpawn = { move, fromX: this.x, fromY: this.y, facing: this.facing };
		} else if (move.type === "sweep" && move.sweep) {
			const sw = move.sweep;
			const speed = Math.max(1, Number(sw.speed) || 400);
			const distance = Math.max(0, Number(sw.distance) || 0);
			this.activeSweep = {
				direction: sw.direction || "side",
				speed,
				dirSign: sw.direction === "side" ? (sw.reverse ? -this.facing : this.facing) : 1,
				timer: distance / speed, // seconds - how long the travel lasts, so total distance ~= speed * timer
			};
		}
		return true;
	}

	/** Resolves which attack tier ("light"|"medium"|"heavy"|"special") was requested, plus the
	 * current movement context (grounded/airborne, held direction, facing), into one concrete
	 * full-move-list slot key - the single place input turns into "which of the 18 possible moves
	 * is this". Always falls back to a slot that legacy (non-moveset.json) characters actually
	 * have, so the original 12-character roster keeps its exact old behavior (one move per tier,
	 * direction-blind) while a character with a real moveset.json gets the full direction-aware set. */
	resolveAttackSlot(tier, input) {
		const dirHeld = input.up ? "up" : input.down ? "down" : (input.left || input.right) ? "side" : null;
		const towardFacing = (input.left && this.facing === -1) || (input.right && this.facing === 1);

		if (!this.grounded) {
			// Special button held in the air: prefer a real dedicated aerial variant
			// (specialNAir/specialSAir/specialUAir/specialDAir - e.g. a genuine "j.6B" MUGEN state)
			// when this character actually has one, otherwise fall back to reusing the grounded
			// special's own animation/tuning (still better than the move being unusable in the air
			// at all - true for e.g. an Up Special that's meant to double as a recovery move). Only
			// falls through to an aerial *normal* if this character has no special at all in that
			// direction, so pressing "special" in the air is never a no-op when any special exists.
			if (tier === "special") {
				const dirSlot = dirHeld === "up" ? "U" : dirHeld === "down" ? "D" : dirHeld === "side" ? "S" : "N";
				const airKey = `special${dirSlot}Air`;
				const groundKey = `special${dirSlot}`;
				if (this.moveset[airKey]) return airKey;
				if (this.moveset[groundKey]) return groundKey;
				return this._fallbackAerialNormal();
			}
			if (dirHeld === "down" && this.moveset.dair) return "dair";
			if (dirHeld === "up" && this.moveset.uair) return "uair";
			if (dirHeld === "side" && towardFacing && this.moveset.fair) return "fair";
			if (dirHeld === "side" && !towardFacing && this.moveset.bair) return "bair";
			if (this.moveset.nair) return "nair";
			return this._fallbackAerialNormal();
		}

		if (tier === "special") {
			if (dirHeld === "up" && this.moveset.specialU) return "specialU";
			if (dirHeld === "down" && this.moveset.specialD) return "specialD";
			if (dirHeld === "side" && this.moveset.specialS) return "specialS";
			return "specialN";
		}

		if (tier === "heavy") {
			if (dirHeld === "up" && this.moveset.usmash) return "usmash";
			if (dirHeld === "down" && this.moveset.dsmash) return "dsmash";
			if (this.moveset.fsmash) return "fsmash";
			return this.moveset.usmash ? "usmash" : "dsmash";
		}

		// light / medium tier - grounded normals, including a genuine dash attack while actively
		// sprinting toward facing (see Character.sprinting / SPRINT_SPEED_MULT). Checks this.sprinting
		// rather than raw vx, since the attack branch in update() zeroes vx to plant the character's
		// feet *before* calling this, which would otherwise make this slot permanently unreachable.
		if (dirHeld === "side" && towardFacing && this.sprinting && this.moveset.dashAttack) return "dashAttack";
		if (dirHeld === "up" && this.moveset.utilt) return "utilt";
		if (dirHeld === "down" && this.moveset.dtilt) return "dtilt";
		if (dirHeld === "side" && this.moveset.ftilt) return "ftilt";
		return "jab";
	}

	/** Last-resort aerial move when nothing more specific applies (see resolveAttackSlot()) - picks
	 * whichever aerial normal this character actually has, in a fixed priority order. Returns null
	 * only for a character with literally no aerial moves defined at all (attack() already no-ops
	 * gracefully on a null/missing slot). */
	_fallbackAerialNormal() {
		return this.moveset.fair ? "fair" : this.moveset.uair ? "uair" : this.moveset.dair ? "dair" : this.moveset.bair ? "bair" : null;
	}

	currentFrame() {
		if (!this.action) return null;
		return this.action.frames[this.frameIndex - 1];
	}

	get isAttacking() {
		return Boolean(this.actionToSlot[this.actionNum]);
	}

	get inHitstun() {
		return this.hitstunTimer > 0;
	}

	/** True while an attack's animation is finishing up and another attack can't yet start. */
	get inRecovery() {
		return this.isAttacking || this.attackRecoveryTimer > 0;
	}

	/** True while stunned by hitstun, block-stun, a broken shield, or a non-damaging dizzy stun - no input is read in this state. */
	get isLocked() {
		return this.hitstunTimer > 0 || this.blockStunTimer > 0 || this.shieldBreakTimer > 0 || this.stunTimer > 0;
	}

	/** Apply an incoming hit: damage, knockback, hitstun, and the reaction animation. */
	takeHit({ damage = 8, fromX = this.x, kbBase = 320, kbGrowth = 7.5, angle = 40 } = {}) {
		// Taunt def-buff (see TAUNT_BUFF_* / update()'s taunt branch) - applied here centrally so it
		// covers every incoming-damage source uniformly (melee/sweep via applyHit(), but also
		// projectiles and summon hits, which call takeHit() directly with their own damage number).
		if (this.buffType === "def") damage *= this.buffMult;
		this.percent = Math.min(MAX_PERCENT, this.percent + damage);
		// A little per-hit horizontal jitter (seed) so a rapid multi-hit combo's numbers fan out
		// instead of stacking in one unreadable column - see DAMAGE_POPUP_* / draw()'s render of this.
		this.damagePopups.push({ amount: damage, life: 0, seed: Math.random() * 20 - 10 });

		const dir = this.x >= fromX ? 1 : -1;
		const kb = kbBase + this.percent * kbGrowth;
		const rad = (angle * Math.PI) / 180;

		this.vx = dir * kb * Math.cos(rad);
		this.vy = -kb * Math.sin(rad);
		this.grounded = false;
		this.isBlocking = false;
		this.activeSweep = null; // a hit interrupts a sweep in progress, same as it interrupts any other attack
		this.pendingProjectileSpawn = null;
		this.tauntTimer = 0; // a hit always interrupts a taunt in progress

		// Arms (or re-arms, on a juggle) a ground bounce if THIS hit's own downward component is a
		// genuine spike/meteor/stomp - see the GROUND_BOUNCE_* comment above. Only actually triggers
		// if this exact hit is still in hitstun at the moment of landing (see the landing branch).
		this.groundBounceArmed = this.vy > GROUND_BOUNCE_MIN_VY;
		this.groundBounceKb = kb;

		this.hitstunTimer = Math.min(MAX_HITSTUN, Math.max(MIN_HITSTUN, kb / 900));
		this.stunTimer = 0; // a real hit always cancels a non-damaging dizzy stun in progress
		// A brand-new launch is never guard-eligible mid-flight yet (see wantsGuard's own comment in
		// update()) - only set back to true once this exact flight has actually bounced off
		// something (the opponent or a block - see handlePinballCollision()/checkBlockCollisions()),
		// which for a pinball-collision-caused hit happens to be the very same call as this one.
		this.pinballBounced = false;
		this.play(this.pose("hitStand"), true);
		if (this.poseSounds.hurt) playCharacterSound(this, this.poseSounds.hurt);
	}

	/** Apply a non-damaging "dizzy" stun (real MUGEN convention - e.g. the Bubble trap): no damage,
	 * no knockback, just locks input and holds the dizzy pose for the given duration. Repeated stuns
	 * refresh to the longer remaining duration rather than stacking. A real subsequent hit (takeHit)
	 * always interrupts and cancels stun - see takeHit() above. */
	applyStun(duration) {
		this.isBlocking = false;
		this.activeSweep = null;
		this.pendingProjectileSpawn = null;
		this.tauntTimer = 0;
		if (this.grounded) this.vx = 0; // rooted in place on the ground; airborne stun keeps falling naturally under gravity
		this.stunTimer = Math.max(this.stunTimer, duration);
		this.play(this.pose("dizzy"), true);
	}

	/** Absorb an incoming hit on shield: chip damage + shield drain + pushback, no knockback/hitstun animation.
	 * Above GUARD_BREAK_PERCENT (real fighting-game "your guard can't hold forever at high damage"
	 * territory), shield drain ramps up hard - a full-momentum hit at 999% chews through a full
	 * shield in a hit or two instead of the normal handful, so guard stops being a safe answer to
	 * a pinball-fast bounce the longer a match/round drags on, same spirit as the percent cap
	 * itself making the highest percents feel dangerous rather than just numerically large. */
	blockHit({ damage = 8, fromX = this.x } = {}) {
		this.percent = Math.min(MAX_PERCENT, this.percent + damage * CHIP_DAMAGE_MULT);
		const overPercent = Math.max(0, this.percent - GUARD_BREAK_PERCENT);
		const breakMult = 1 + (overPercent / (MAX_PERCENT - GUARD_BREAK_PERCENT)) * (GUARD_BREAK_MAX_MULT - 1);
		this.shieldHP = Math.max(0, this.shieldHP - damage * SHIELD_DAMAGE_MULT * breakMult);

		const dir = this.x >= fromX ? 1 : -1;
		this.vx = dir * BLOCK_PUSHBACK;
		this.blockStunTimer = BLOCK_STUN;

		if (this.shieldHP <= 0) {
			this._triggerGuardBreak();
			this.play(this.pose("crouch"), true); // dazed - held in the guard-broken crouch pose until it wears off
		}
	}

	/** Fires once, right as shieldHP crosses to 0 (see blockHit() above and the two guard
	 * branches in update() below) - drops guard, starts the break-stun, and pushes a "GUARD
	 * BREAK!" popup using the exact same floating-text system as a damage number (see
	 * _drawDamagePopups()), just with its own distinct label/styling instead of a percent, so it
	 * reads as a real event rather than getting lost among ordinary hit numbers. */
	_triggerGuardBreak() {
		this.isBlocking = false;
		this.shieldBreakTimer = SHIELD_BREAK_STUN;
		this.damagePopups.push({ amount: 0, label: "GUARD BREAK!", life: 0, seed: 0 });
	}

	/** Starts the brief KO pause after flying off-stage - see DEATH_PAUSE. The character is hidden
	 * and frozen (see draw()/update()'s early-return while isDead) until the timer runs out, at
	 * which point update() calls respawn() itself - callers (checkKO()) don't need to. The actual
	 * KO-burst visual effect is spawned by the caller, not here - Character has no access to the
	 * match loop's activeImpactFX array (a local inside startMatch()), so checkKO() spawns it
	 * itself using this character's position right before calling this. */
	die() {
		this.isDead = true;
		this.deathTimer = DEATH_PAUSE;
		this.vx = 0;
		this.vy = 0;
		this.damagePopups.length = 0;
	}

	/** Reset to spawn position with 0 percent - call after a stock is lost. */
	respawn() {
		this.isDead = false;
		this.deathTimer = 0;
		this.x = this.spawnX;
		this.y = this.spawnY;
		this.vx = 0;
		this.vy = 0;
		this.percent = 0;
		this.hitstunTimer = 0;
		this.pinballBounced = false;
		this.stunTimer = 0;
		this.attackRecoveryTimer = 0;
		this.currentMove = null;
		this.activeSweep = null;
		this.pendingProjectileSpawn = null;
		this.groundBounceArmed = false;
		this.groundBounceKb = 0;
		this.pinballCooldown = 0;
		this.grounded = true;
		this.groundedOn = "stage";
		this.currentPlatform = null;
		this.shieldHP = MAX_SHIELD;
		this.isBlocking = false;
		this.blockStunTimer = 0;
		this.shieldBreakTimer = 0;
		this.invulnTimer = RESPAWN_INVULN;
		this.play(this.pose("idle"), true);
	}

	/** Double-tap-to-sprint detection (Smash-style dash): tap a direction, release, then tap the
	 * same direction again within SPRINT_TAP_WINDOW seconds to start sprinting - holding the
	 * direction continues the sprint; releasing it, reversing direction, or leaving the ground
	 * ends it. Runs off this character's own persistent state (not the fresh-every-frame input
	 * object), so it works identically whether `input` came from keyboard or gamepad this frame.
	 * `input.sprint` lets a controller (currently just AIController) request a sprint directly
	 * without needing to simulate a realistic double-tap. */
	_updateSprintState(input, dt) {
		const dirHeld = input.left ? -1 : (input.right ? 1 : 0);
		if (this.dashWindowTimer > 0) this.dashWindowTimer = Math.max(0, this.dashWindowTimer - dt);
		if (dirHeld !== this.moveHeldPrev) {
			if (dirHeld === 0) {
				// Released a direction - arm the window for a fast re-press of that same direction.
				this.dashPendingDir = this.moveHeldPrev;
				this.dashWindowTimer = SPRINT_TAP_WINDOW;
			} else {
				if (this.dashPendingDir === dirHeld && this.dashWindowTimer > 0) {
					this.sprinting = true;
					this.sprintDir = dirHeld;
				} else if (dirHeld !== this.sprintDir) {
					this.sprinting = false; // fresh press in a new direction without redoing the double-tap
				}
				this.dashPendingDir = 0;
				this.dashWindowTimer = 0;
			}
		}
		if (dirHeld === 0 || !this.grounded) this.sprinting = false; // letting go, or airborne, always cancels
		if (input.sprint && dirHeld !== 0 && this.grounded) {
			this.sprinting = true;
			this.sprintDir = dirHeld;
		}
		this.moveHeldPrev = dirHeld;
	}

	update(dt, input = {}, platforms = []) {
		// Rising-edge jump: input.jump is a raw "is the button currently held" flag (from a real
		// held key, gamepad button, or - for AIController - a plan/reaction that keeps jump:true
		// asserted for many frames in a row between think-ticks). The two grounded jump branches
		// below used to key directly off input.jump, so holding the key (or the AI's plan simply
		// still wanting to jump next think-tick) re-triggered a brand new jump every single frame
		// the character happened to be grounded and it was still true - normally invisible against
		// a tall arc, but on a short hop or a small platform (quick to land back on) it read as a
		// rapid jump-spam/bounce loop. jumpPressed only fires on the frame the flag actually goes
		// false->true, exactly like a real single button tap, and this.jumpHeldPrev is updated
		// unconditionally every frame (even while locked/attacking) so a held button correctly
		// still needs a real release before it can fire again.
		const jumpPressed = Boolean(input.jump) && !this.jumpHeldPrev;
		this.jumpHeldPrev = Boolean(input.jump);
		this.clock = (this.clock || 0) + dt; // local running clock, used only as CommandBuffer's time base
		// Physics-scaled dt (see PHYSICS_SPEED_MULT) - used ONLY for the handful of real spatial-
		// integration lines below (gravity/air-accel accumulation, ground-knockback friction
		// decay, and the actual this.x/this.y position updates near the end of this method) so
		// movement, dashing, jumping, knockback flight, etc. all physically cover ground twice as
		// fast in real time - everything else (hitstun/blockstun/recovery timers, animation, AI
		// think timers) keeps using plain `dt` and is completely unaffected.
		const pdt = dt * PHYSICS_SPEED_MULT;
		if (this.isDead) {
			// Gone from the stage entirely for a brief beat after a KO (see die()) - no physics,
			// input, or animation while this runs; respawn() (which clears isDead) fires itself the
			// instant the pause ends, so callers only ever need to call die(), never respawn() directly.
			this.deathTimer = Math.max(0, this.deathTimer - dt);
			if (this.deathTimer === 0) this.respawn();
			return;
		}
		this._updateSprintState(input, dt);
		this.animSpeedMult = 1; // reset every frame; only the grounded walk/sprint branch below may raise it
		if (this.invulnTimer > 0) this.invulnTimer = Math.max(0, this.invulnTimer - dt);
		if (this.attackRecoveryTimer > 0) this.attackRecoveryTimer = Math.max(0, this.attackRecoveryTimer - dt);
		if (this.hitstunTimer > 0) this.hitstunTimer = Math.max(0, this.hitstunTimer - dt);
		if (this.blockStunTimer > 0) this.blockStunTimer = Math.max(0, this.blockStunTimer - dt);
		if (this.pinballCooldown > 0) this.pinballCooldown = Math.max(0, this.pinballCooldown - dt);
		if (this.stunTimer > 0) {
			this.stunTimer = Math.max(0, this.stunTimer - dt);
			if (this.stunTimer === 0 && this.actionNum === this.pose("dizzy")) {
				this.play(this.grounded ? this.pose("idle") : this.pose("jumpFall"), true);
			}
		}
		if (this.tauntTimer > 0) this.tauntTimer = Math.max(0, this.tauntTimer - dt);
		if (this.buffTimer > 0) {
			this.buffTimer = Math.max(0, this.buffTimer - dt);
			if (this.buffTimer === 0) { this.buffType = null; this.buffMult = 1; }
		}
		if (this.damagePopups.length) {
			for (let i = this.damagePopups.length - 1; i >= 0; i--) {
				const p = this.damagePopups[i];
				p.life += dt;
				if (p.life >= DAMAGE_POPUP_DURATION) this.damagePopups.splice(i, 1);
			}
		}
		// Fed every frame regardless of lock state (a motion started just before a hit landed
		// shouldn't have to be re-input once control returns) - only actually *acts* on a match
		// below, gated the same way a normal attack request is.
		this.commandBuffer.update(this.clock, input, this.facing);
		// Runs unconditionally (even mid-attack/hitstun/locked) so a turn started right before
		// something else interrupts it still finishes its visual cycle instead of freezing
		// mid-squash - see draw() for how this drives the flip.
		if (this.turnFlipTimer > 0) this.turnFlipTimer = Math.max(0, this.turnFlipTimer - dt);
		if (this.poseBlendTimer > 0) this.poseBlendTimer = Math.max(0, this.poseBlendTimer - dt);
		if (this.shieldBreakTimer > 0) {
			this.shieldBreakTimer = Math.max(0, this.shieldBreakTimer - dt);
			if (this.shieldBreakTimer === 0) this.shieldHP = SHIELD_BREAK_RECOVER_HP;
		}

		// Walked off the edge of the platform currently underfoot - start falling. The stage's own
		// ground layer has no such edges here (it's checked separately, further below), so this
		// branch only ever fires for groundedOn === "platform".
		if (this.grounded && this.groundedOn === "platform" && this.currentPlatform) {
			const p = this.currentPlatform;
			const edgeMargin = 10; // small horizontal buffer so leaving the platform isn't pixel-perfect
			if (this.x + edgeMargin < p.x1 || this.x - edgeMargin > p.x2) {
				this.grounded = false;
				this.groundedOn = null;
				this.currentPlatform = null;
			}
		}

		const locked = this.isLocked;

		// Mid-flight "tech": a character already bounced at least once during THIS exact hitstun
		// flight (off the opponent or a block - see handlePinballCollision()/checkBlockCollisions(),
		// and takeHit()'s own comment on why a brand-new launch starts this false) can raise their
		// guard for the rest of that flight, even though they're still technically locked/in
		// hitstun - a fresh hit still can't be blocked on the very frame it lands (matches every
		// other fighting game), but once the pinball physics have already taken over, holding guard
		// now protects against whatever comes next (another collision, another block) instead of
		// eating it clean every time.
		const midFlightGuardable = this.hitstunTimer > 0 && this.pinballBounced && this.shieldHP > 0;

		// Requesting guard: held, not already mid-attack/stunned (or mid-flight-guardable - see
		// above), and something left to block with. No longer requires being grounded - blocking
		// works in midair too (see the airborne branch below), matching a normal fighting-game air
		// guard. This is its own dedicated button (RT on gamepad, separate from the down/crouch
		// direction below) so the guard shimmer in draw() (gated on isBlocking) - and the "no
		// attacking while guarding" rule further down - only ever apply while this is actually true,
		// never while merely crouching.
		let wantsGuard = Boolean(input.block) && (!locked || midFlightGuardable) && !this.isAttacking && this.shieldHP > 0;

		// Requesting crouch: just holding down, grounded, and not guarding. No shield involved at
		// all - no drain, no break, no flicker - but still lets a crouch-attack through (see the
		// grounded branch below) and still lets down+jump drop through a platform, same spot as the
		// old block+jump did, just decoupled from the guard button.
		let wantsCrouch = Boolean(input.down) && !locked && this.grounded && !wantsGuard;

		if (!wantsGuard) {
			this.shieldHP = Math.min(MAX_SHIELD, this.shieldHP + SHIELD_REGEN_PER_SEC * dt);
		}

		if (locked && midFlightGuardable) {
			// Still fully in hitstun physics-wise - the position/velocity integration further down
			// in this same update() runs exactly as it always did for a locked character (gravity,
			// wall/platform bounces, block-wall bounces, etc. are all unaffected by this). This only
			// raises/lowers the shield itself, so a further pinball collision (handlePinballCollision())
			// or an incoming attack (applyHit()) treats them as guarding instead of getting hit clean.
			this.isBlocking = wantsGuard;
			if (wantsGuard) {
				this.shieldHP = Math.max(0, this.shieldHP - SHIELD_DRAIN_PER_SEC * dt);
				this.play(this.pose("guard"));
				if (this.shieldHP <= 0) this._triggerGuardBreak();
			}
		} else if (locked) {
			this.isBlocking = false;
		} else {
			// --- Face whichever opponent we're told about, like a real fighting game ---
			if (typeof input.opponentX === "number" && this.grounded && !this.isAttacking && !wantsGuard) {
				const desiredFacing = input.opponentX >= this.x ? 1 : -1;
				if (desiredFacing !== this.facing) {
					this.turnFlipFrom = this.facing; // draw() keeps mirroring on this until the flip's midpoint
					this.turnFlipTimer = TURN_FLIP_DURATION;
					this.facing = desiredFacing; // combat/AI logic (hitboxes, hurtboxes) flips instantly, as before
				}
			}

			// Which attack tier (if any) is being requested this frame? Checked in priority order so
			// pressing two buttons at once resolves to the stronger move. Also doubles as "some
			// attack button is held", which is all crouch/air attacks care about. The concrete full
			// move-list slot (jab/ftilt/.../specialD) this tier actually resolves to depends on
			// grounded state and held direction - see resolveAttackSlot().
			let requestedTier = null;
			if (!this.inRecovery) {
				for (const slot of MOVE_SLOTS) {
					if (input[slot]) {
						requestedTier = slot;
						break;
					}
				}
			}
			const anyAttackPressed = requestedTier !== null;

			// Motion-input "combo" specials (Hyper moves etc, see CommandBuffer) take priority over a
			// plain single-button attack the instant their motion+button both land - same lockout
			// (!inRecovery) a normal attack already needs, so this can't interrupt an attack in progress.
			let commandMatched = false;
			if (!this.inRecovery && !locked && !wantsGuard) {
				const matchedKey = this.commandBuffer.match(this.commandMoveDefs, this.clock);
				if (matchedKey && this.moveset[matchedKey]) {
					this.isBlocking = false;
					this.vx = 0;
					this.attack(matchedKey);
					commandMatched = true;
				}
			}

			if (commandMatched) {
				// handled above - fall through to physics/animation-advance below, skip the normal
				// movement/attack decision tree entirely for this frame.
			} else if (this.grounded) {
				if (this.groundedOn === "platform" && wantsCrouch && jumpPressed) {
					// Hold down/crouch + tap jump to drop through the platform underfoot
					// (Smash-style) - this is now entirely a crouch action, nothing to do with the
					// guard button, and is only reachable when groundedOn is "platform" in the first
					// place, so the stage's own ground layer is never droppable this way.
					this.isBlocking = false;
					this.vx = 0;
					this.grounded = false;
					this.groundedOn = null;
					this.currentPlatform = null;
					this.vy = Math.max(this.vy, 30); // gentle nudge downward; gravity takes it from here
					this.play(this.pose("jumpFall"));
				} else if (wantsGuard) {
					// Real guard: shield goes up, drains, and is the only thing that flickers (see
					// the guardAlphaMul draw()-side check, gated on isBlocking) - no attack of any
					// kind (including crouch attacks) gets through while this is active, matching a
					// real fighting-game "can't swing out of block" rule.
					this.isBlocking = true;
					this.shieldHP = Math.max(0, this.shieldHP - SHIELD_DRAIN_PER_SEC * dt);
					this.vx = 0;
					this.play(this.pose("crouch"));
					if (this.shieldHP <= 0) this._triggerGuardBreak();
				} else if (wantsCrouch && anyAttackPressed && this.moveset.crouchAttack) {
					// Just crouching (down, no guard held) + an attack button = crouch attack. No
					// shield/guard involved at all, so no flicker and no need to "cancel" anything.
					this.isBlocking = false;
					this.vx = 0;
					this.attack("crouchAttack");
				} else if (wantsCrouch) {
					// Plain crouch: held pose, no shield drain, no flicker - just a lower stance that
					// stays ready to crouch-attack the instant an attack button is added.
					this.isBlocking = false;
					this.vx = 0;
					this.play(this.pose("crouch"));
				} else if (requestedTier) {
					// Grounded attacks plant your feet - no more sliding through a swing at walk speed
					// (a "sweep" type move below immediately overrides this with its own travel).
					this.isBlocking = false;
					this.vx = 0;
					this.attack(this.resolveAttackSlot(requestedTier, input));
				} else if (jumpPressed && !this.isAttacking) {
					this.isBlocking = false;
					this.vy = JUMP_VELOCITY;
					this.grounded = false;
					if (this.poseSounds.jump) playCharacterSound(this, this.poseSounds.jump);
				} else if ((input.left || input.right) && !this.isAttacking) {
					this.isBlocking = false;
					const moveDir = input.left ? -1 : 1;
					const isSprinting = this.sprinting && this.sprintDir === moveDir;
					this.vx = moveDir * MOVE_SPEED * (isSprinting ? SPRINT_SPEED_MULT : 1);
					// locoMult (see LOCOMOTION_ANIM_SPEED_MULT's own comment) applies on top of the
					// sprint speed-up below, in BOTH branches - a character's dash pose still needs it
					// even though it doesn't get the walk branch's own isSprinting-based doubling,
					// since it's already only ever played while sprinting.
					const locoMult = LOCOMOTION_ANIM_SPEED_MULT[this.name] || 1;
					// A character with a real, authored dash/sprint pose+action (moveset.json's "dash"
					// slot - see POSE_SLOT_KEYS) plays that at its own normal speed instead of an
					// artificially sped-up walk cycle; only a character with no such pose falls back to
					// doubling the walk animation's own playback speed to visually match the faster move.
					const hasDashPose = isSprinting && moveDir === this.facing && this.poseMap.dash != null;
					if (hasDashPose) {
						this.animSpeedMult = locoMult;
						this.play(this.poseMap.dash);
					} else {
						this.animSpeedMult = (isSprinting ? SPRINT_SPEED_MULT : 1) * locoMult;
						this.play(moveDir === this.facing ? this.pose("walkFwd") : this.pose("walkBack"));
					}
				} else if (input.taunt && this.tauntTimer <= 0 && this.poseMap.taunt !== undefined && this.poseMap.taunt !== this.pose("idle")) {
					// Brief, uncancellable-by-movement (but always cancellable by getting hit, see
					// takeHit()) cosmetic pose - only reachable standing still with nothing else held.
					this.isBlocking = false;
					this.vx = 0;
					this.tauntTimer = 0.9;
					this.play(this.pose("taunt"), true);
					if (this.poseSounds.taunt) playCharacterSound(this, this.poseSounds.taunt);
					// Taunt gamble: a real taunt (not just standing still - see the guard above) rolls a
					// random temporary buff, atk or def with equal odds, that replaces (never stacks with)
					// whatever buff was already running. A risk/reward provoke mechanic in the spirit of
					// games like Guilty Gear's Instant Kill stance or Them's Fighting Herds' taunts -
					// landing one costs a few standing-still frames an opponent could otherwise punish.
					this.buffType = Math.random() < 0.5 ? "atk" : "def";
					this.buffMult = this.buffType === "atk" ? TAUNT_BUFF_ATK_MULT : TAUNT_BUFF_DEF_MULT;
					this.buffTimer = TAUNT_BUFF_MIN_DURATION + Math.random() * (TAUNT_BUFF_MAX_DURATION - TAUNT_BUFF_MIN_DURATION);
				} else if (!this.isAttacking && this.tauntTimer <= 0) {
					this.isBlocking = false;
					this.vx = 0;
					this.play(this.pose("idle"));
				} else if (!this.isAttacking) {
					this.vx = 0; // still taunting - hold position, let the timer above run out
				}
			} else {
				if (wantsGuard) {
					this.isBlocking = true;
					this.shieldHP = Math.max(0, this.shieldHP - SHIELD_DRAIN_PER_SEC * dt);
					this.play(this.pose("guard"));
					if (this.shieldHP <= 0) this._triggerGuardBreak();
					// Deliberately no air-control steering while actively guarding - gravity still
					// integrates normally below, so an air-blocking character keeps falling, just
					// without being able to steer left/right until they let go of block.
				} else {
					this.isBlocking = false;
					const hasAerial = this.moveset.nair || this.moveset.fair || this.moveset.bair || this.moveset.uair || this.moveset.dair;
					if (anyAttackPressed && !this.inRecovery && hasAerial) {
						this.attack(this.resolveAttackSlot(requestedTier, input));
					} else if (!this.isAttacking) {
						// Air control: steer left/right while airborne on a voluntary jump. Knockback
						// launches never reach here since those keep the character in the locked branch.
						if (input.left) {
							this.vx = Math.max(this.vx - AIR_ACCEL * pdt, -AIR_MAX_SPEED);
						} else if (input.right) {
							this.vx = Math.min(this.vx + AIR_ACCEL * pdt, AIR_MAX_SPEED);
						} else {
							const decay = AIR_DRAG * dt;
							if (Math.abs(this.vx) <= decay) this.vx = 0;
							else this.vx -= Math.sign(this.vx) * decay;
						}
						this.play(this.vy < 0 ? this.pose("jumpUp") : this.pose("jumpFall"));
					}
				}
			}
		}

		// --- Physics ---
		// Heavier fall: once past the apex (vy >= 0, i.e. actually falling, not still rising) of a
		// normal jump/walk-off-a-ledge - NOT a hitstun/knockback launch (a pinball flight, a hit's
		// own arc keeps its original tuned feel unchanged) and NOT mid-sweep (that move drives vy
		// directly) - gravity is scaled up by FALL_GRAVITY_MULT for a noticeably weightier drop than
		// the rise that got them there.
		const fallingNormally = this.vy >= 0 && this.hitstunTimer <= 0 && !this.activeSweep;
		const gravityNow = fallingNormally ? GRAVITY * FALL_GRAVITY_MULT : GRAVITY;
		this.vy = Math.min(this.vy + gravityNow * pdt, TERMINAL_VELOCITY);

		// A "sweep" type move (see character-mapper.html) forcibly drives the character's own
		// velocity for the move's travel duration, overriding whatever normal walk/gravity physics
		// just computed above/below - this is what makes it "the character travels while the
		// hitbox rides along" rather than a stationary swing. Side sweeps dash along the ground at
		// a fixed velocity; up/down sweeps rise or drop at a fixed vertical speed (an up-sweep with
		// enough speed/distance can carry the attacker onto a platform a normal jump wouldn't
		// reach; a down-sweep can drop fast enough to read as a stomp/crash landing on an
		// opponent - see the "reachPlatform"/"crashDown" hints authored in the mapper). Cleared the
		// instant its timer runs out, handing control straight back to normal physics/animation.
		// Once a side sweep (e.g. a dash-attack type "sweep" move) actually lands its hit, stop
		// driving it forward for the rest of its travel distance/duration - without this, a
		// sweep landing at normal melee range (the AI/most players throw it right around
		// ATTACK_RANGE, ~78px) kept plowing the attacker straight through the now-launched
		// opponent for its full authored distance (routinely 300+px), a visible overshoot that
		// could also carry the attacker clean off a small platform or stage edge on a hit that
		// happened to connect near one. Up/down sweeps are untouched - those double as real
		// recovery movement (see specialU's own "Recovery" attackType/note) and are meant to
		// keep carrying the character the full distance regardless of whether they tag someone
		// on the way.
		if (this.activeSweep && this.activeSweep.direction === "side" && this.hitLanded) {
			this.activeSweep = null;
		}
		if (this.activeSweep) {
			const sw = this.activeSweep;
			if (sw.direction === "side") {
				this.vx = sw.dirSign * sw.speed;
				if (this.grounded) this.vy = 0; // planted side sweep - an airborne one keeps falling normally underneath the dash
			} else if (sw.direction === "up") {
				this.vy = -sw.speed;
				this.vx *= 0.4; // still mostly plants horizontally, doesn't fully lock it
				this.grounded = false;
			} else if (sw.direction === "down") {
				this.vy = sw.speed;
				this.vx *= 0.4;
				this.grounded = false;
			}
			sw.timer -= dt;
			if (sw.timer <= 0) this.activeSweep = null;
		}

		// A grounded slide from knockback/block-pushback decays over time instead of continuing
		// forever - normal walking/attacks always set vx explicitly every frame so this never
		// fights against voluntary movement, it only ever decays an unattended leftover velocity.
		if (this.grounded && locked && this.vx !== 0) {
			const decay = GROUND_KNOCKBACK_FRICTION * pdt;
			if (Math.abs(this.vx) <= decay) this.vx = 0;
			else this.vx -= Math.sign(this.vx) * decay;
		}
		this.x += this.vx * pdt;

		// Bounce off the left/right screen edges instead of flying off them - only going off the
		// top of the screen is an actual KO now (see combat.js's isOffStage). Only reflects an
		// outward-moving character (so gently walking up to the edge just stops you there, same
		// as before, rather than pinging you back at your walk speed); a character sent flying by
		// a hard hit at high percent naturally bounces further/harder since the incoming velocity
		// that gets reflected is already bigger at higher percent (existing knockback scaling),
		// with no extra logic needed here for that part.
		if (this.x < STAGE.left) {
			this.x = STAGE.left;
			if (this.vx < 0) this.vx = -this.vx * BOUNCE_RESTITUTION;
		} else if (this.x > STAGE.right) {
			this.x = STAGE.right;
			if (this.vx > 0) this.vx = -this.vx * BOUNCE_RESTITUTION;
		}

		// Holding down/crouch while falling auto-passes-through any platform you'd otherwise land
		// on (Smash-style) - doesn't apply to the stage's own ground layer, which is handled
		// separately below and stays solid no matter what.
		const fallThroughHeld = Boolean(input.down) && !this.grounded;

		const prevY = this.y;
		this.y += this.vy * pdt;
		if (this.grounded && this.groundedOn === "platform" && this.currentPlatform) {
			// Continuously hold the character at the platform's surface while standing on it -
			// mirrors the stage-ground clamp just below. Without this, gravity keeps accumulating
			// every single frame regardless of grounded state, and nothing else re-clamps a
			// platform-standing character back down (the landing check right below only ever
			// fires on the transition frame, gated on `!this.grounded`) - so they'd slowly sink
			// through the platform, picking up fall speed, while `grounded` incorrectly stayed
			// true the whole time.
			this.y = this.currentPlatform.y;
			this.vy = 0;
			this._snapFeetToSurface(this.currentPlatform.y);
		} else if (this.y >= 0) {
			// prevY < 0 (was airborne last frame) is what marks this as a genuine landing transition,
			// as opposed to every subsequent frame spent already standing at y=0 - without that check
			// this branch (harmlessly) re-fires every single frame while grounded, which would also
			// make the ground-bounce check below misfire on a character just standing still.
			if (prevY < 0 && this.groundBounceArmed && this.hitstunTimer > 0) {
				this.y = 0;
				this.vy = -(this.groundBounceKb * GROUND_BOUNCE_RESTITUTION + this.percent * GROUND_BOUNCE_PERCENT_SCALE);
				this.groundBounceArmed = false; // one bounce per arming hit
				this.grounded = false; // still airborne, now launched back upward
				this.groundedOn = null;
				this.currentPlatform = null;
			} else {
				const wasAirborne = !this.grounded;
				this.y = 0;
				this.vy = 0;
				this.grounded = true;
				this.groundedOn = "stage";
				this.currentPlatform = null;
				// Snap straight to idle the instant we touch down, rather than leaving whatever
				// airborne pose (jumpUp/jumpFall) was last playing on screen for one extra frame
				// until the next input-decision pass below catches up - that's what read as a
				// "freeze"/still-falling-while-grounded look. Only when nothing more important
				// (an attack, hitstun, block-stun, etc.) should keep owning the pose right now.
				if (wasAirborne && !locked && !this.isAttacking) this.play(this.pose("idle"));
				this._snapFeetToSurface(0);
			}
		} else if (!this.grounded && this.vy > 0 && !fallThroughHeld && !this.groundBounceArmed) {
			// One-way platform landing: only catches a character that's actively falling onto the
			// platform's top surface this frame (prevY was above it, this.y crossed at/below it) -
			// jumping up through a platform from underneath just passes through untouched, and so
			// does a deliberate drop-through (prevY starts exactly at p.y that frame, which fails
			// the "prevY < p.y" check below, so it can never immediately re-catch itself). A hit
			// that armed a ground bounce (see GROUND_BOUNCE_* above - a genuine steep spike/meteor/
			// stomp) is excluded here entirely, same as fallThroughHeld: that hit is meant to blast
			// the target all the way down to the real stage ground for the actual bounce to fire
			// (see the y>=0 branch above) - a platform catching them first would silently eat the
			// bounce every time there happened to be one in the way underneath.
			for (const p of platforms) {
				const halfWidth = 10; // small horizontal margin so landing doesn't need pixel-perfect alignment
				if (this.x + halfWidth < p.x1 || this.x - halfWidth > p.x2) continue;
				if (prevY < p.y && this.y >= p.y) {
					this.y = p.y;
					this.vy = 0;
					this.grounded = true;
					this.groundedOn = "platform";
					this.currentPlatform = p;
					if (!locked && !this.isAttacking) this.play(this.pose("idle"));
					break;
				}
			}
		}

		// --- Animation advance ---
		let frame = this.currentFrame();
		// Reset every tick - only a frame skipped over DURING THIS tick's own catch-up loop
		// below should count; a stale hit from a previous tick must never linger and get
		// re-checked again later (computeHit()'s own hitLanded gate already stops a real
		// multi-hit, but this avoids depending on that alone).
		this._pendingHitFrame = null;
		if (frame) {
			this.frameTimer += dt * this.animSpeedMult;
			let dur = ticksToSeconds(frame.time);
			if (frame.time >= 0 && dur > 0) {
				while (this.frameTimer >= dur) {
					// Bank this frame's own hit data before advancing away from it. Without
					// this, a short (or even single-tick) animation frame that carries the
					// move's only active Clsn1 hitbox - e.g. a fast crouch-attack move
					// whose entire hit window is one 3-tick frame sandwiched between five
					// 1-tick startup frames - could get stepped straight past within this same
					// while loop (completely normal whenever frameTimer has enough banked time
					// to jump two-plus frames in one go, which any small amount of dt jitter
					// causes routinely) without ever once being the frame `currentFrame()`
					// returns at the moment computeHit() (in the match loop, right after this
					// update() call returns) actually samples it - silently swallowing what
					// looked, on screen, like a clean connecting hit.
					if (frame.clsn1 && frame.clsn1.length) this._pendingHitFrame = frame;
					this.frameTimer -= dur;
					this.frameIndex += 1;
					if (this.frameIndex > this.action.frames.length) {
						if (this.actionNum === this.pose("crouch")) {
							// This animation is only a couple of short breathing-idle frames in the
							// source data - fine passing through, but held for a whole block it just
							// flickers. Settle into the last (most-crouched) frame and stay there.
							this.frameIndex = this.action.frames.length;
							this.frameTimer = 0;
							break;
						}
						this.frameIndex = this.action.loopstart || 1;
						if (this.isAttacking) {
							this.attackRecoveryTimer = ATTACK_RECOVERY;
							this.currentMove = null;
							this.activeSweep = null;
							this.play(this.grounded ? this.pose("idle") : this.pose("jumpFall"), true);
							break;
						}
						if (this.actionNum === this.pose("hitStand") && this.hitstunTimer === 0) {
							this.play(this.grounded ? this.pose("idle") : this.pose("jumpFall"), true);
							break;
						}
					}
					frame = this.currentFrame();
					dur = frame ? ticksToSeconds(frame.time) : 0;
					if (!frame || frame.time < 0) break;
				}
			}
		}
	}

	/** Minimal standalone frame-advance, used ONLY for animating the winner's win pose during the
	 * post-match winner-banner fade, once the main loop has already stopped calling this
	 * character's full update() (see startMatch()'s matchOver branch) - so the pose doesn't just
	 * freeze on whatever single frame happened to be showing the instant the match ended. Doesn't
	 * need any of update()'s combat-state handling (hitstun exits, attack recovery, physics, etc.)
	 * since a character in this state is guaranteed to just be looping its own win pose. */
	advanceWinPose(dt) {
		const frame = this.currentFrame();
		if (!frame) return;
		this.frameTimer += dt;
		let dur = ticksToSeconds(frame.time);
		if (frame.time >= 0 && dur > 0) {
			while (this.frameTimer >= dur) {
				this.frameTimer -= dur;
				this.frameIndex += 1;
				if (this.frameIndex > this.action.frames.length) this.frameIndex = this.action.loopstart || 1;
				const f2 = this.currentFrame();
				dur = f2 ? ticksToSeconds(f2.time) : 0;
				if (!f2 || f2.time < 0) break;
			}
		}
	}

	/** MMO-style floating combat text for this.damagePopups (see takeHit()) - a bold, outlined,
	 * color-scaled-by-damage number that pops in, rises, and fades over DAMAGE_POPUP_DURATION,
	 * anchored just above wherever this frame's own hurtbox (Clsn2) top edge actually is (so it
	 * tracks correctly whether the character's standing, crouching, or airborne) rather than a
	 * fixed offset that would float at the wrong height in some poses. A popup with a `label`
	 * (see _triggerGuardBreak()) renders that text instead of a percent, in its own bigger,
	 * alarm-red "shattered" style (a doubled offset-stroke, like a cracked-glass double-take)
	 * rather than the percent number's plain outline - a real, distinct event, not just a bigger
	 * damage number. */
	_drawDamagePopups(ctx) {
		if (!this.damagePopups.length) return;
		const frame = this.currentFrame();
		let topY = this.y - 300; // fallback if this frame has no hurtbox data at all
		if (frame && frame.clsn2 && frame.clsn2.length) {
			let minY = Infinity;
			for (const b of frame.clsn2) minY = Math.min(minY, b[1]);
			if (minY !== Infinity) topY = this.y + minY * this.scale;
		}
		ctx.save();
		ctx.textAlign = "center";
		for (const p of this.damagePopups) {
			const t = p.life / DAMAGE_POPUP_DURATION;
			const rise = DAMAGE_POPUP_RISE * t;
			const popScale = t < DAMAGE_POPUP_POPIN ? t / DAMAGE_POPUP_POPIN : 1;
			const alpha = t < 0.6 ? 1 : 1 - (t - 0.6) / 0.4; // hold fully opaque, then fade over the last 40%
			const px = this.x + p.seed;
			const py = topY - 24 - rise;
			ctx.globalAlpha = Math.max(0, alpha);
			if (p.label) {
				// A quick overshoot-and-settle scale (bigger than the plain popup's own pop-in)
				// so it reads as a bigger deal than an ordinary hit number.
				const punch = t < DAMAGE_POPUP_POPIN ? popScale * 1.3 : 1;
				const size = 40 * punch;
				ctx.font = `bold ${size.toFixed(1)}px 'All Around The World', monospace`;
				ctx.lineWidth = 5;
				ctx.strokeStyle = "rgba(60,4,4,0.9)";
				ctx.strokeText(p.label, px + 2, py + 2); // offset "shatter" stroke, drawn first so the main stroke+fill sit on top
				ctx.strokeStyle = "rgba(10,8,4,0.85)";
				ctx.strokeText(p.label, px, py);
				ctx.fillStyle = "#ff3b3b";
				ctx.fillText(p.label, px, py);
			} else {
				const size = (46 + Math.min(46, p.amount * 2)) * popScale; // bigger hits pop in bigger - a little "crit" feel
				const color = p.amount >= 15 ? "#ff5d5d" : p.amount >= 8 ? "#ffb238" : "#ffe27a";
				ctx.font = `bold ${size.toFixed(1)}px 'All Around The World', monospace`;
				ctx.lineWidth = 6;
				ctx.strokeStyle = "rgba(10,8,4,0.85)";
				ctx.strokeText(`${Math.round(p.amount)}%`, px, py);
				ctx.fillStyle = color;
				ctx.fillText(`${Math.round(p.amount)}%`, px, py);
			}
		}
		ctx.globalAlpha = 1;
		ctx.restore();
	}

	draw(ctx) {
		if (this.isDead) return; // gone entirely during the KO pause - see die()
		this._drawDamagePopups(ctx); // drawn regardless of the invuln dim below - a genuinely separate visual element
		const frame = this.currentFrame();
		if (!frame) return;
		// Smash-style respawn invulnerability: a constant translucency for as long as invulnTimer is
		// still counting down (see RESPAWN_INVULN/respawn()) - the same "can't be hit right now"
		// signal every Smash game uses, without the on/off blink this used to be (that read as
		// flickering/stuttering rather than a clean invulnerability cue).
		const invulnAlphaMul = this.invulnTimer > 0 ? INVULN_DIM_ALPHA : 1;
		// Paper-Mario turn-flip: while turnFlipTimer is counting down, squashX sweeps a smooth
		// 1 -> 0 -> 1 width envelope (full width at the start and end, a zero-width sliver at the
		// midpoint) and visualFacing only swaps from the old to the new facing right at that
		// zero-width instant - so the sprite visibly shrinks, mirrors, then grows back, instead of
		// snapping to the mirrored art at full width. this.facing itself (what hit/hurtboxes use)
		// already flipped the instant the turn started; only the draw is delayed/animated.
		let squashX = 1;
		let visualFacing = this.facing;
		if (this.turnFlipTimer > 0) {
			const progress = 1 - this.turnFlipTimer / TURN_FLIP_DURATION; // 0 at start -> 1 at end
			squashX = Math.abs(Math.cos(progress * Math.PI));
			visualFacing = progress < 0.5 ? this.turnFlipFrom : this.facing;
		}
		const flip = visualFacing === -1;
		// Guarding shimmer: a constant soft dim (not a full vanish - see GUARD_DIM_ALPHA's own
		// comment) for as long as isBlocking holds and the shield hasn't broken - _triggerGuardBreak()
		// flips isBlocking false the instant it does, so this stops immediately on a break, no
		// separate timer needed here. Multiplies into whichever alpha the pose-blend branch below
		// is already using rather than replacing it, so the two effects combine correctly if a
		// guard happens to start/end right on a pose-blend frame. No longer blinks on/off - that
		// hard alternation read as stutter/flashing rather than a shield effect, especially under
		// any frame-time variance.
		const guardAlphaMul = this.isBlocking ? GUARD_DIM_ALPHA : 1;
		const combinedAlphaMul = guardAlphaMul * invulnAlphaMul;
		if (this.poseBlendTimer > 0 && this.prevPoseSnap) {
			const t = this.poseBlendTimer / POSE_BLEND_DURATION; // 1 right at the switch -> 0 once the blend ends
			ctx.globalAlpha = t * combinedAlphaMul;
			this.atlas.draw(ctx, this.prevPoseSnap.group, this.prevPoseSnap.image, this.x, this.y, flip, false, this.scale, squashX);
			ctx.globalAlpha = (1 - t) * combinedAlphaMul;
			this.atlas.draw(ctx, frame.group, frame.image, this.x, this.y, flip, false, this.scale, squashX);
			ctx.globalAlpha = 1;
		} else {
			ctx.globalAlpha = combinedAlphaMul;
			this.atlas.draw(ctx, frame.group, frame.image, this.x, this.y, flip, false, this.scale, squashX);
			ctx.globalAlpha = 1;
		}
	}

	/** World-space hurtboxes (Clsn2) for the current frame - empty during the KO pause or respawn invulnerability. */
	hurtboxes() {
		if (this.isDead || this.invulnTimer > 0) return [];
		return this._boxesFor("clsn2");
	}

	/** World-space hitboxes (Clsn1) for the current frame - empty while dead or in hitstun (no
	 * trading off broken frames). Prefers this._pendingHitFrame (see update()'s animation-advance
	 * loop) over currentFrame() when set - that's a real Clsn1-bearing frame this exact tick's
	 * animation advance stepped PAST without ever landing on as the final frame (typical of a
	 * short/single hit-active frame under ordinary dt jitter), so using only currentFrame() here
	 * would silently miss it even though it was, for a real instant, the active frame this tick. */
	hitboxes() {
		if (this.isDead || this.inHitstun) return [];
		return this._boxesFor("clsn1", this._pendingHitFrame || this.currentFrame());
	}

	/** Nudges this.y so THIS frame's own hurtbox (Clsn2) bottom edge sits exactly on `surfaceY`
	 * (0 for the stage ground, a platform's own .y while standing on one) - rather than trusting
	 * every action's authored sprite anchor to already line up with the ground line on its own.
	 * Different poses (a hit reaction, a knockdown, a crouch) don't all have their art anchored
	 * identically, which is what let a grounded character's sprite visibly float above or sink
	 * below the ground/platform line depending which animation happened to be playing. Called
	 * every grounded frame (see update()) so it tracks pose changes as they happen, not just once
	 * on landing. Bounded to a small correction so one malformed/oversized Clsn2 box can't yank
	 * the character somewhere else entirely - real per-character hurtbox bottoms all sit within a
	 * few dozen px of the anchor already, this only closes that last gap. */
	_snapFeetToSurface(surfaceY) {
		const frame = this.currentFrame();
		if (!frame) return;
		// Uses the frame's own rendered pixel silhouette (same alpha-span data the Track A fallback
		// hitbox system computes/caches - see getSpriteAlphaSpans()) rather than its authored Clsn2
		// hurtbox: a lot of frames simply have no per-frame Clsn2 at all (MUGEN's Clsn2Default
		// convention leaves many frames' own clsn2 array empty, relying on a once-per-action
		// default that never reaches this per-frame data), and even where Clsn2 IS present it's a
        // gameplay hitbox, not a pixel-perfect outline - it doesn't always reach the true visual
		// bottom of the art. Keying this off the actual rendered pixels instead is what the
		// hurtbox-based version was still missing, which is why feet could still end up floating
		// or sinking on some animations even after switching to it.
		const spans = getSpriteAlphaSpans(this.atlas, frame.group, frame.image);
		if (!spans || !spans.length) return;
		const maxY = spans[spans.length - 1].y; // spans are built top row to bottom row, so the last entry is the lowest visible pixel row
		const bottomWorld = this.y + maxY * this.scale;
		const correction = surfaceY - bottomWorld;
		if (Math.abs(correction) <= GROUND_SNAP_MAX_CORRECTION) this.y += correction;
	}

	_boxesFor(key, frameOverride = null) {
		const frame = frameOverride || this.currentFrame();
		if (!frame) return [];
		const boxes = [];
		for (const b of frame[key]) {
			let [x1, y1, x2, y2] = b;
			if (this.facing === -1) [x1, x2] = [-x1, -x2];
			x1 *= this.scale; x2 *= this.scale; y1 *= this.scale; y2 *= this.scale;
			let bx1 = this.x + Math.min(x1, x2);
			let bx2 = this.x + Math.max(x1, x2);
			// Same reach trim as the Track A fallback above, applied here to authored Clsn1
			// hitboxes - key === "clsn1" only, hurtboxes (clsn2) are left exactly as authored so
			// this never shrinks what counts as landing a hit against you, only what's required to
			// land one yourself.
			if (key === "clsn1" && bx2 - bx1 > HITBOX_REACH_TRIM * 2) {
				bx1 += HITBOX_REACH_TRIM;
				bx2 -= HITBOX_REACH_TRIM;
			}
			boxes.push([bx1, this.y + y1, bx2, this.y + y2]);
		}
		return boxes;
	}
}

// ai.js
// A lightweight opponent brain for singleplayer. It doesn't see anything the
// human player couldn't see (positions, percents, whether someone's mid-
// attack) - it just reacts to that state on a timer, the way a person would,
// rather than doing full lookahead/search. Three difficulty presets tune how
// often it "thinks", how good its decisions are, and how much it whiffs.
//
// The controller produces the exact same input shape main.js's keyboard
// readers do ({ left, right, jump, light, medium, heavy, special, opponentX })
// so Character.update() can't tell the difference between a human and the AI.



const DIFFICULTY = {
	easy: {
		thinkInterval: 0.45, // seconds between decisions
		reactionDelay: 0.28, // seconds before it reacts to a state change (e.g. opponent attacking) - now actually used, see AIController._perceive()
		mistakeChance: 0.3, // chance per decision it does something suboptimal (wrong move / hesitates)
		aggression: 0.4, // how eagerly it closes distance / commits to attacks
		dodgeChance: 0.35, // chance it reacts at all when the opponent swings nearby
		blockChance: 0.55, // of those reactions, chance it blocks instead of jumping away
		punishChance: 0.35, // chance it capitalizes on a whiff it just watched end nearby
		jumpChance: 0.22, // baseline chance, even at point-blank range, to mix in a jump/aerial instead of a grounded attack
		moveWeights: { light: 0.34, medium: 0.24, heavy: 0.16, special: 0.14, crouch: 0.12 },
		// Chance per eligible decision tick to attempt a real motion-input command move (see
		// AIController._tryQueueCommandMove()) - low and a little unreliable at this tier: also
		// gets a real chance to fumble the input partway through (see commandMoveFumbleChance),
		// reading as "knows the move exists but doesn't always land the input clean" rather than
		// simply never throwing hypers at all.
		commandMoveChance: 0.05,
		commandMoveFumbleChance: 0.35,
	},
	normal: {
		thinkInterval: 0.2,
		reactionDelay: 0.1,
		mistakeChance: 0.1,
		aggression: 0.6,
		// Both bumped up noticeably from before - now that guarding mid-pinball-flight and while

		// engine-side support and _resolveReaction()'s own relaxed self.grounded requirement),
		// "normal"/medium difficulty is meant to actually punish getting careless with big hits and
		// pinball collisions, not just occasionally shrug one off - this tier should read as

		dodgeChance: 0.68,
		blockChance: 0.88,
		punishChance: 0.72,
		jumpChance: 0.32,
		// Light dropped well below heavy/special (was an even 4-way split) - a bot leaning that
		// heavily on jabs reads as timid given how much moveset there is to actually show off; heavy
		// and special are now the two single likeliest picks, not tied with a plain poke.
		moveWeights: { light: 0.14, medium: 0.2, heavy: 0.28, special: 0.28, crouch: 0.1 },
		commandMoveChance: 0.16,
		commandMoveFumbleChance: 0.1,
	},
	hard: {
		thinkInterval: 0.08,
		reactionDelay: 0.025,
		mistakeChance: 0.015,
		aggression: 0.9,
		dodgeChance: 0.9,
		blockChance: 0.96,
		punishChance: 0.94,
		jumpChance: 0.48,
		moveWeights: { light: 0.08, medium: 0.16, heavy: 0.3, special: 0.36, crouch: 0.1 },
		// Hard practically never botches the input, and reaches for a real hyper much more readily -
		// this is the tier where "the CPU just comboed into a super" should actually happen.
		commandMoveChance: 0.32,
		commandMoveFumbleChance: 0.02,

const ATTACK_RANGE = 78; // px - roughly where these characters' normals reach, AFTER the HITBOX_REACH_TRIM/alpha-threshold tightening below (was 95, calibrated before that change existed) - every attack-decision distance check in AIController derives from this one constant, so leaving it at the old, looser value here was exactly why the AI kept deciding it was "in range" and swinging into what was actually now several pixels of empty air per the tightened hitboxes.
// How far (world px, pre-scale-adjusted per box below) every hitbox gets trimmed inward from
// each side before it's tested against a hurtbox - attacker side only, never applied to
// hurtboxes, so this only ever makes landing a hit require being genuinely closer, never makes
// getting hit easier. Fixes moves connecting from visibly too far away in close-range melee.
const HITBOX_REACH_TRIM = 6;
const EDGE_MARGIN = 70; // px of buffer the AI tries to keep from the blast-zone edges
const THREAT_RANGE = ATTACK_RANGE * 1.3; // px - close enough that an opponent's swing is a real threat worth reacting to
const OPP_MEMORY = 5; // how many of the opponent's recent moves it remembers, for simple pattern reads

function weightedPick(weights) {
	const total = Object.values(weights).reduce((a, b) => a + b, 0);
	let r = Math.random() * total;
	for (const [key, w] of Object.entries(weights)) {
		if ((r -= w) <= 0) return key;
	}
	return Object.keys(weights)[0];
}

class AIController {
	constructor(character, opponent, difficulty = "normal", platforms = []) {

		this.setDifficulty(difficulty);

		this.wantsSummon = false;

		// --- Perception state (checked every frame, independent of the think timer above) ---
		// This is what lets the bot "see" the opponent's actual moves/inputs - not by cheating and
		// reading their keyboard, but the same way a human would: watching state changes (an attack
		// starting, an attack ending, which move it was) as they happen, then reacting after a
		// short human-like delay rather than instantly.
		this.wasOppAttacking = false;

		this.reactionTimer = 0; // counts down to zero, then `pendingReaction` actually fires

		this._wasPinballBounced = false; // rising-edge tracking for this character's OWN pinballBounced flag - see update()'s mid-flight guard check
		this._wasOnPlatform = false; // rising-edge tracking for self.groundedOn === "platform" - see _perceive()'s landing-on-platform check, which stops a stale "walk under it and jump" plan from just carrying the bot straight back off a small/narrow platform the instant it lands
		this._midFlightGuardActive = false; // this flight's one-time guard-or-not roll, held steady for its whole duration - see update()

		// _buildMotionFrames() below. The AI doesn't get to just teleport a super out - it has to

		// command move is currently being executed.

		this.commandMoveStepTimer = 0; // seconds remaining on the current queue step
		this.commandMoveDef = null; // which commandMoveDefs entry this queue is trying to land
		this.commandMoveCooldown = 1.5 + Math.random() * 2; // seconds until the next attempt may even be considered
