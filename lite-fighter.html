		// defines (detected generically - any key with a `type`, i.e. jab/ftilt/.../specialD -
		// not the pose-only entries like idle/walkFwd/guard), each starting at 0 uses this
		// fight. Read by _reachableAttackCandidates()/_weightedLeastUsed() below to heavily bias
		// attack decisions toward whatever's least-thrown so far, so a full match actually shows
		// off the character's whole moveset instead of leaning on 2-3 favorites - and since this
		// is driven entirely off the moveset data rather than a hardcoded slot list, it works
		// identically for any future character with no extra wiring needed.
		this.moveUsage = {};
		for (const key of Object.keys(character.moveset)) {
			if (character.moveset[key] && character.moveset[key].type) this.moveUsage[key] = 0;
		}
		for (const cm of character.commandMoveDefs || []) {
			this.moveUsage[cm.key] = 0;
		}
	}

	setDifficulty(difficulty) {
		this.difficulty = difficulty;
		this.tuning = DIFFICULTY[difficulty] || DIFFICULTY.normal;
	}

	/** Same coverage-aware picking as _pickSmartAttack(), but for a confirmed juggle (opponent
	 * airborne and still in hitstun from a hit that already landed) - strongly prefers an
	 * up-directed aerial (uair) when one's available. The only way to actually take a stock in
	 * this game is crossing the top blast zone (see isOffStage()), so continuing to launch an
	 * already-juggled opponent upward is the real kill-confirm read a strong human player makes,
	 * not just "throw whatever connects". Falls back to the normal picker if there's no uair (or
	 * the weighted roll doesn't land on it - still some variety, not a robotic 100%-uair lock). */
	_pickJuggleAttack(towardOpponent) {
		const all = this._reachableAttackCandidates(towardOpponent);
		const upOptions = all.filter((c) => c.dir === "up");
		if (upOptions.length && Math.random() < 0.7) {
			const chosen = this._weightedLeastUsed(upOptions);
			if (chosen) {
				this.moveUsage[chosen.slot] = (this.moveUsage[chosen.slot] || 0) + 1;
				return chosen;
			}
		}
		return this._pickSmartAttack(towardOpponent);
	}

	/** Every final move-list slot (see resolveAttackSlot()) actually reachable RIGHT NOW given
	 * current grounded/airborne/sprinting state, filtered to ones this character's moveset
	 * really defines - mirrors resolveAttackSlot()'s own branching exactly (it has to: this is
	 * choosing what to request so that engine logic resolves to a specific real slot, not
	 * guessing at it), so this list only ever contains genuinely deliverable moves and stays
	 * correct with zero extra work for any future character - it's driven entirely off
	 * self.moveset's own keys, the same generic detection used by the constructor above. */
	_reachableAttackCandidates(towardOpponent) {
		const self = this.character;
		const has = (k) => Boolean(self.moveset[k]);
		const list = [];
		if (!self.grounded) {
			if (has("nair")) list.push({ slot: "nair", tier: "light", dir: null, moveDir: 0 });
			if (has("uair")) list.push({ slot: "uair", tier: "light", dir: "up", moveDir: 0 });
			if (has("dair")) list.push({ slot: "dair", tier: "light", dir: "down", moveDir: 0 });
			if (has("fair")) list.push({ slot: "fair", tier: "light", dir: "side", moveDir: self.facing });
			if (has("bair")) list.push({ slot: "bair", tier: "light", dir: "side", moveDir: -self.facing });
			// Aerial specials - resolveAttackSlot() will use a dedicated air variant
			// (specialNAir/etc.) when this character has one, or fall back to reusing the grounded
			// special's own animation otherwise - so a candidate is offered here whenever the
			// character has *either*, letting the AI use specials in the air for any character with
			// specials at all, not just ones with a dedicated air-specific state.
			if (has("specialNAir") || has("specialN")) list.push({ slot: has("specialNAir") ? "specialNAir" : "specialN", tier: "special", dir: null, moveDir: 0 });
			if (has("specialSAir") || has("specialS")) list.push({ slot: has("specialSAir") ? "specialSAir" : "specialS", tier: "special", dir: "side", moveDir: towardOpponent });
			if (has("specialUAir") || has("specialU")) list.push({ slot: has("specialUAir") ? "specialUAir" : "specialU", tier: "special", dir: "up", moveDir: 0 });
			if (has("specialDAir") || has("specialD")) list.push({ slot: has("specialDAir") ? "specialDAir" : "specialD", tier: "special", dir: "down", moveDir: 0 });
			return list;
		}
		if (has("jab")) list.push({ slot: "jab", tier: "light", dir: null, moveDir: 0 });
		if (has("ftilt")) list.push({ slot: "ftilt", tier: "light", dir: "side", moveDir: towardOpponent });
		if (has("utilt")) list.push({ slot: "utilt", tier: "light", dir: "up", moveDir: 0 });
		if (has("dtilt")) list.push({ slot: "dtilt", tier: "light", dir: "down", moveDir: 0 });
		if (self.sprinting && has("dashAttack")) list.push({ slot: "dashAttack", tier: "light", dir: "side", moveDir: self.facing });
		if (has("crouchAttack")) list.push({ slot: "crouchAttack", tier: "crouch", dir: null, moveDir: 0 });
		if (has("fsmash")) list.push({ slot: "fsmash", tier: "heavy", dir: null, moveDir: 0 });
		if (has("usmash")) list.push({ slot: "usmash", tier: "heavy", dir: "up", moveDir: 0 });
		if (has("dsmash")) list.push({ slot: "dsmash", tier: "heavy", dir: "down", moveDir: 0 });
		if (has("specialN")) list.push({ slot: "specialN", tier: "special", dir: null, moveDir: 0 });
		if (has("specialS")) list.push({ slot: "specialS", tier: "special", dir: "side", moveDir: towardOpponent });
		if (has("specialU")) list.push({ slot: "specialU", tier: "special", dir: "up", moveDir: 0 });
		if (has("specialD")) list.push({ slot: "specialD", tier: "special", dir: "down", moveDir: 0 });
		return list;
	}

	/** Picks one candidate, weighted heavily toward whichever has been thrown the fewest times
	 * so far this fight (inverse-frequency, not a strict round-robin - a never-used move is by
	 * far the likeliest pick, but it's not a rigid "always the single least-used one" pattern,
	 * which would read as mechanical). Falls back to a flat random pick if usage tracking has
	 * nothing for a candidate (shouldn't normally happen - see the constructor). */
	_weightedLeastUsed(candidates) {
		if (!candidates.length) return null;
		const weights = candidates.map((c) => 1 / Math.pow((this.moveUsage[c.slot] || 0) + 1, 1.6));
		const total = weights.reduce((a, b) => a + b, 0);
		let r = Math.random() * total;
		for (let i = 0; i < candidates.length; i++) {
			r -= weights[i];
			if (r <= 0) return candidates[i];
		}
		return candidates[candidates.length - 1];
	}

	/** Turns a chosen candidate (see above) into the actual plan/reaction fields Character.update()
	 * reads. crouchAttack is a special case - it's not reached through resolveAttackSlot's tier
	 * system at all, but through holding down/crouch + any attack button at once (see
	 * Character.update()) - so it needs its own distinct field shape rather than the normal
	 * {attack: tier, dir} one. Deliberately block: false here - crouch attacks no longer have
	 * anything to do with the guard button. */
	_candidateToPlan(candidate, extra = {}) {
		if (candidate.tier === "crouch") {
			return { move: 0, jump: false, attack: "light", block: false, dir: "down", ...extra };
		}
		return { move: candidate.moveDir, jump: false, attack: candidate.tier, block: false, dir: candidate.dir, ...extra };
	}

	/** The one place an attack decision actually gets chosen, used by both the strategic planner
	 * (_decide()) and the reflex punish reaction (_resolveReaction()) so both play with the same
	 * coverage-aware variety instead of the punish path falling back to something dumber. Rolls
	 * a tier first (respecting this difficulty's own moveWeights flavor, so easy/normal/hard
	 * still feel distinct), then picks the least-used REAL slot within that tier - except when
	 * there's a move this character has genuinely never thrown yet this fight, which gets a
	 * strong (but not absolute) chance to jump the queue regardless of tier, so a full match
	 * reliably works its way through the entire moveset rather than just mostly favoring it. */
	_pickSmartAttack(towardOpponent) {
		const t = this.tuning;
		const all = this._reachableAttackCandidates(towardOpponent);
		if (!all.length) return null;
		const neverUsed = all.filter((c) => !this.moveUsage[c.slot]);
		let chosen;
		if (neverUsed.length && Math.random() < 0.55) {
			chosen = this._weightedLeastUsed(neverUsed);
		} else {
			const tier = weightedPick(t.moveWeights === undefined ? { light: 1 } : t.moveWeights);
			const tierCandidates = all.filter((c) => c.tier === tier);
			chosen = this._weightedLeastUsed(tierCandidates.length ? tierCandidates : all);
		}
		if (chosen) this.moveUsage[chosen.slot] = (this.moveUsage[chosen.slot] || 0) + 1;
		return chosen;
	}

	/** Call once per frame; returns an input object for Character.update(). `summonCooldown` is
	 * this character's real, current summon-cooldown remaining (seconds, 0 = ready) - the same
	 * value the HUD badge shows - passed in fresh each frame so _decide() can gate wantsSummon on
	 * actual readiness instead of guessing. */
	update(dt, summonCooldown = 0) {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;
		this._summonCooldown = summonCooldown;

		// Mid-flight self-defense: once THIS character's own hitstun flight has bounced off
		// something at least once (self.pinballBounced - see Character.update()'s
		// midFlightGuardable/takeHit()'s own comment), it's now ALLOWED to hold guard for the rest
		// of that flight - decide once, right as that becomes true (not re-rolled every frame,
		// which would just flicker the shield on and off), using this difficulty's own blockChance
		// bumped up further by two real risk reads: choosing not to guard here means eating whatever
		// collision comes next completely clean, and since the ONLY way to lose a stock in this game
		// is crossing STAGE.blastAbove (see isOffStage()), that risk is a lot more than academic once
		// either (a) this flight is already well up toward that top blast zone, or (b) self's own
		// percent is high enough that the next hit's knockback would launch hard regardless of where
		// this particular bounce started.
		if (self.pinballBounced && !this._wasPinballBounced) {
			const blastDanger = STAGE.blastAbove < 0 ? Math.max(0, Math.min(1, self.y / STAGE.blastAbove)) : 0;
			const percentDanger = Math.min(1, self.percent / 150);
			this._midFlightGuardActive = self.shieldHP > 15 &&
				Math.random() < Math.min(0.97, t.blockChance + 0.15 + blastDanger * 0.25 + percentDanger * 0.15);
		}
		this._wasPinballBounced = self.pinballBounced;
		if (self.hitstunTimer > 0 && self.pinballBounced && this._midFlightGuardActive && self.shieldHP > 0) {
			// Nothing else matters more right now - checked every frame, ahead of even the
			// stage-edge recovery check below, since a pinball flight is exactly the kind of fast,
			// must-react-NOW situation neither the slower think-timer nor a delayed reaction would
			// reliably catch in time.
			return {
				left: false, right: false, up: false, down: false, jump: false,
				light: false, medium: false, heavy: false, special: false,
				block: true, summon: false, sprint: false, opponentX: opp.x,
			};
		}

		if (this.platformCooldown > 0) this.platformCooldown -= dt;

		this._perceive(dt);

		this.thinkTimer -= dt;
		if (this.thinkTimer <= 0) {
			this.thinkTimer = this.tuning.thinkInterval * (0.8 + Math.random() * 0.4);
			this._decide();
		}

		// Emergency reactions are checked every frame, not just on the think
		// timer, so the bot doesn't step off the stage just because it hasn't
		// "thought" in a while - this is the one thing that overrides everything else.
		const recovering = self.x < STAGE.left + EDGE_MARGIN || self.x > STAGE.right - EDGE_MARGIN;

		// A command-move input sequence in progress (see _tryQueueCommandMove()) aborts immediately
		// if something more urgent preempts it - forced into recovery, actually hit (hitstunTimer),
		// or knocked airborne mid-input - rather than stubbornly finishing a now-pointless motion (or
		// worse, resuming it stale several frames later with a leftover button press landing with no
		// real direction history behind it).
		if (this.commandMoveQueue && (recovering || self.hitstunTimer > 0 || !self.grounded)) {
			this.commandMoveQueue = null;
			this.commandMoveDef = null;
		}

		const input = {
			left: false,
			right: false,
			up: false,
			down: false,
			jump: false,
			light: false,
			medium: false,
			heavy: false,
			special: false,
			block: false,
			summon: false,
			sprint: false,
			opponentX: opp.x,
		};

		if (recovering && self.grounded) {
			// Walk back toward center - urgently, so the bot actually uses sprint to get there.
			if (self.x < STAGE.left + EDGE_MARGIN) input.right = true;
			else input.left = true;
			input.sprint = true;
		} else if (this.commandMoveQueue) {
			// Drive the queued motion one step at a time - real left/right/down held input, exactly
			// what CommandBuffer.update() (called from Character.update() right after this returns)
			// reads a human's input from. Takes full priority over the reaction/plan branches below
			// for as long as it's running: same reasoning as the reaction branch itself - a
			// committed action in progress shouldn't get second-guessed frame to frame - and it's
			// already been aborted above if something more urgent (a hit, forced recovery) just
			// happened.
			const step = this.commandMoveQueue[0];
			if (step.left) input.left = true;
			if (step.right) input.right = true;
			if (step.down) input.down = true;
			if (step.button) input[step.button] = true;
			this.commandMoveStepTimer -= dt;
			if (this.commandMoveStepTimer <= 0) {
				this.commandMoveQueue.shift();
				if (this.commandMoveQueue.length) {
					this.commandMoveStepTimer = this.commandMoveQueue[0].holdSeconds;
				} else {
					this.commandMoveQueue = null;
					this.commandMoveDef = null;
				}
			}
		} else if (this.reaction) {
			// A resolved reflex (block/dodge/punish) briefly overrides the slower strategic plan -
			// same as how a real player's reflexes interrupt whatever they were doing a moment ago.
			const r = this.reaction;
			if (r.move < 0) input.left = true;
			else if (r.move > 0) input.right = true;
			if (r.jump) input.jump = true;
			if (r.attack) input[r.attack] = true;
			if (r.block) input.block = true;
			if (r.dir === "up") input.up = true;
			else if (r.dir === "down") input.down = true;
			if (r.sprint) input.sprint = true;

			this.reactionHoldTimer -= dt;
			if (this.reactionHoldTimer <= 0) this.reaction = null;
		} else {
			if (this.plan.move < 0) input.left = true;
			else if (this.plan.move > 0) input.right = true;
			if (this.plan.jump) input.jump = true;
			if (this.plan.attack) input[this.plan.attack] = true;
			if (this.plan.block) input.block = true;
			if (this.plan.dir === "up") input.up = true;
			else if (this.plan.dir === "down") input.down = true;
			if (this.plan.sprint) input.sprint = true;
		}
		if (this.wantsSummon) input.summon = true;

		return input;
	}

	/**
	 * Runs every frame regardless of the think timer. Watches the opponent's actual animation
	 * state - is it attacking right now, did it just stop, which move was it - the same
	 * information visible on screen to a human opponent - and turns state *changes* into
	 * delayed reactions, rather than the bot instantly knowing and instantly responding.
	 */
	_perceive(dt) {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;
		const dist = Math.abs(opp.x - self.x);
		const oppSlot = opp.actionToSlot ? opp.actionToSlot[opp.actionNum] : null;

		// Rising edge: just touched down on a platform. The "walk under it and jump" plan (see
		// _decide()'s platform-awareness block) keeps its move:1/-1 held for the rest of that
		// think-tick, which used to just carry the bot straight on across - and, on a small/
		// narrow platform, straight back off the far edge - the instant it landed, rather than
		// actually stopping to use the platform it just worked to get onto. Zeroing the plan out
		// here hands control back to the very next _decide() tick (which runs on this same
		// character's own normal cadence, not a special extra one), so it settles in place first
		// instead of sliding through.
		const onPlatformNow = self.grounded && self.groundedOn === "platform";
		if (onPlatformNow && !this._wasOnPlatform) {
			this.plan = { move: 0, jump: false, attack: null, block: false };
		}
		this._wasOnPlatform = onPlatformNow;

		if (opp.isAttacking && !this.wasOppAttacking) {
			// Rising edge: the opponent just committed to a move. Recognize what it actually is
			// (a heavy/special hits harder and should be respected more than a jab) and remember it,
			// so repeated use of the same move gets easier to read over time.
			if (oppSlot) {
				this.oppRecentMoves.push(oppSlot);
				if (this.oppRecentMoves.length > OPP_MEMORY) this.oppRecentMoves.shift();
			}
			if (dist < THREAT_RANGE && !this.pendingReaction) {
				const move = opp.currentMove;
				const isHeavy = move && (move.priority >= 2 || move.damage >= 13);
				// Bigger, higher-priority swings get noticed a bit faster and more reliably reacted
				// to - the same way a person reacts quicker/more surely to an obvious haymaker than
				// a flicked-out jab.
				const delay = t.reactionDelay * (isHeavy ? 0.6 : 1) * (0.75 + Math.random() * 0.5);
				this.pendingReaction = { kind: "defend", isHeavy };
				this.reactionTimer = delay;
			}
		} else if (!opp.isAttacking && this.wasOppAttacking) {
			// Falling edge: the opponent's swing just ended. If it whiffed close by and the bot
			// isn't already busy, that's a clean punish window - react to it quickly, since
			// noticing an attack has *already* ended is an easier read than predicting one mid-swing.
			if (dist < THREAT_RANGE && !self.isAttacking && !self.inRecovery && !this.pendingReaction && Math.random() < t.punishChance) {
				this.pendingReaction = { kind: "punish" };
				this.reactionTimer = t.reactionDelay * 0.6 * (0.75 + Math.random() * 0.5);
			}
		}
		this.wasOppAttacking = opp.isAttacking;

		// A charging pinball body (opponent in hitstun, moving fast - see PINBALL_MIN_SPEED/
		// isBouncing() in main.js, replicated inline here since that helper lives in main.js's own
		// closure, not this top-level class) is a real incoming threat even though it's not a normal
		// "attack" with a hitbox - react to it the same way `opp.isAttacking` reacts above, just
		// faster (a person's instinct is to throw a shield up IMMEDIATELY against something clearly
		// about to slam into them, not after the usual attack-recognition delay), and only when it's
		// actually headed toward self rather than away.
		const oppBouncing = opp.hitstunTimer > 0 && opp.pinballCooldown <= 0 &&
			(opp.vx * opp.vx + opp.vy * opp.vy) > PINBALL_MIN_SPEED * PINBALL_MIN_SPEED;
		const towardSelfSign = self.x >= opp.x ? 1 : -1;
		const closingIn = oppBouncing && Math.sign(opp.vx || towardSelfSign) === towardSelfSign;
		if (closingIn && !this.wasOppBouncing && dist < THREAT_RANGE * 1.8 && !this.pendingReaction) {
			this.pendingReaction = { kind: "defend", isHeavy: true, pinball: true };
			this.reactionTimer = t.reactionDelay * 0.5 * (0.75 + Math.random() * 0.5);
		}
		this.wasOppBouncing = closingIn;

		// Combo follow-up: the opponent just entered hitstun (a real landed hit, not just a swing
		// that ended) - closing in and following up immediately is a genuine combo opportunity, and
		// shouldn't wait for the slower whiff-punish window below (that one's keyed off an attack
		// *ending*, a different, later read). A real player capitalizes on a hit connecting right
		// away rather than letting the opponent fully recover first.
		if (opp.inHitstun && !this.wasOppInHitstun && dist < THREAT_RANGE * 2.2 && !this.pendingReaction &&
			!self.isAttacking && !self.inRecovery && Math.random() < t.punishChance) {
			this.pendingReaction = { kind: "punish" };
			this.reactionTimer = t.reactionDelay * 0.5 * (0.75 + Math.random() * 0.5);
		}
		this.wasOppInHitstun = opp.inHitstun;

		if (this.pendingReaction) {
			this.reactionTimer -= dt;
			if (this.reactionTimer <= 0) {
				this._resolveReaction(this.pendingReaction, dist);
				this.pendingReaction = null;
			}
		}

		// Aerial engage: once actually airborne (a jump-in from _decide() below, or just any hop)
		// and genuinely close enough to land an aerial RIGHT NOW, throw it immediately instead of
		// waiting on the next slow think-tick to happen to line up - "jump attacks but wait to hit
		// when the opponent is actually hittable", not throwing blind the moment it leaves the
		// ground regardless of whether they're even in range yet. Checked every frame (like
		// everything else in this method), not gated behind the think timer, since the window to
		// actually land an aerial is short and closes fast. Deliberately after the defend/pinball
		// reactions above (and gated on !this.reaction) so a real incoming threat still takes
		// priority over going for an attack.
		//
		// A confirmed juggle (opponent airborne, still in hitstun from a hit that already landed)
		// gets a noticeably wider commit range and the up-aerial-biased picker (see
		// _pickJuggleAttack()) - a real kill-confirm read on the only actual KO condition in this
		// game (crossing the top blast zone) is worth reaching a little further for than an
		// ordinary neutral poke would be.
		const juggling = !opp.grounded && opp.inHitstun;
		if (!self.grounded && !self.isAttacking && !self.inRecovery && !this.reaction &&
			dist <= ATTACK_RANGE * (juggling ? 1.3 : 0.85)) {
			const towardOpponent = opp.x >= self.x ? 1 : -1;
			const chosen = juggling ? this._pickJuggleAttack(towardOpponent) : this._pickSmartAttack(towardOpponent);
			if (chosen) {
				this.reaction = this._candidateToPlan(chosen);
				this.reactionHoldTimer = 0.15;
			}
		}
	}

	/** Turns a queued reaction into an actual input plan, held for a short beat. */
	_resolveReaction(reaction, dist) {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;
		const towardOpponent = opp.x >= self.x ? 1 : -1;

		if (reaction.kind === "defend") {
			// A pattern that's been repeated is easier to read - if the opponent's last couple of
			// moves were the same slot, lean even harder toward blocking it instead of guessing. A
			// charging pinball body (reaction.pinball - see _perceive()) is an even more obvious,
			// unmissable threat than a normal swing (there's no disguising a body flying straight at
			// you), so it gets the single biggest bump of all.
			const recent = this.oppRecentMoves;
			const repeated = recent.length >= 2 && recent[recent.length - 1] === recent[recent.length - 2];
			// Same top-blast-zone reasoning as the mid-flight guard roll in update() and the on-tick
			// defensive check in _decide() - the higher self's own percent, the more a launch here
			// actually threatens a stock (isOffStage() is the only way to lose one), so this reflex
			// leans further toward guarding too instead of only scaling with the read on the
			// incoming swing itself.
			const percentCaution = Math.min(1, Math.max(0, self.percent - 60) / 120);
			const blockChance = Math.min(0.98, t.blockChance + (reaction.isHeavy ? 0.08 : 0) + (repeated ? 0.15 : 0) + (reaction.pinball ? 0.12 : 0) + percentCaution * 0.12);
			// No longer requires self.grounded - a real air guard is a normal engine option (see
			// Character.update()), and a pinball body doesn't wait for a convenient moment to land
			// before it hits you, so an airborne bot needs to be able to block it too.
			if (self.shieldHP > 15 && Math.random() < blockChance) {
				this.reaction = { move: 0, jump: false, attack: null, block: true };
				this.reactionHoldTimer = 0.35;
			} else {
				this.reaction = { move: -towardOpponent, jump: self.grounded, attack: null, block: false };
				this.reactionHoldTimer = 0.25;
			}
			return;
		}

		// Whiff punish / combo follow-up: opponent's swing just ended and left them in recovery, or
		// they're still in hitstun from a hit that just landed (see _perceive()'s two separate
		// pendingReaction triggers for "punish") - step in and hit back rather than let a clean
		// opening go to waste.
		//
		// Juggle case: if the opponent is airborne AND still in hitstun (a real launched-them
		// follow-up opportunity, not a grounded whiff), a grounded attack from here would just whiff
		// underneath them entirely - jump toward them instead. Character.update()'s own
		// _reachableAttackCandidates() already offers nair/fair/uair/dair/bair/aerial-specials the
		// instant self is airborne and back in range (see its own !self.grounded branch), so simply
		// jumping is enough to set up the actual follow-up hit on the very next think tick.
		if (!opp.grounded && opp.inHitstun && self.grounded) {
			this.reaction = { move: towardOpponent, jump: true, attack: null, block: false };
			this.reactionHoldTimer = 0.22;
			return;
		}

		// Same coverage-aware picker as the strategic planner (_decide()) below, so a punish shows
		// the same variety instead of falling back to something dumber just because it's the faster
		// reflex path.
		if (dist > ATTACK_RANGE * 0.8) {
			this.reaction = { move: towardOpponent, jump: false, attack: null, block: false, sprint: true };
			this.reactionHoldTimer = 0.15;
		} else {
			const chosen = this._pickSmartAttack(towardOpponent);
			this.reaction = chosen ? this._candidateToPlan(chosen) : { move: 0, jump: false, attack: "light", block: false };
			this.reactionHoldTimer = 0.2;
		}
	}

	/**
	 * Slower strategic layer - runs on the think timer, not every frame. Where `_perceive()` is
	 * reflexes, this is planning: it looks at the match state (stocks/percent, who's ahead, is the
	 * opponent stranded off-stage) and biases the usual approach/attack/hold-ground decision
	 * accordingly, instead of always playing the exact same way regardless of the scoreline.
	 */
	/** Builds the queued input steps for a real qcf ("D","DF","F") or qcb ("D","DB","B") motion,
	 * relative to `facing` exactly the way CommandBuffer.update() itself resolves forward/back (see
	 * its own fwdHeld/backHeld) - so this produces genuinely the same raw left/right/down input a
	 * human would hold to draw the same motion, not a shortcut into CommandBuffer's internal state.
	 * The button press rides along on the final (forward/back) step, well inside
	 * COMMAND_BUTTON_GRACE, mirroring how a real player rolls the stick then taps the button just
	 * as it settles forward rather than waiting for a separate beat. */
	_buildMotionFrames(motion, facing, button) {
		const fwd = facing === 1 ? "right" : "left";
		const back = facing === 1 ? "left" : "right";
		const diagKey = motion === "qcf" ? fwd : back;
		const finalKey = motion === "qcf" ? fwd : back;
		return [
			{ down: true, holdSeconds: 0.07 },
			{ down: true, [diagKey]: true, holdSeconds: 0.07 },
			{ [finalKey]: true, holdSeconds: 0.1, button },
		];
	}

	/** Strategic-layer roll (called from _decide()) for whether to start executing a real
	 * motion-input command move (moveset.json's commandMoves - hypers, Patty Frisbee/Spatula Throw-
	 * style specials, etc). Gated on cooldown, a safe opening (grounded, not already mid-move, not
	 * being pressured by the opponent's active hitbox), and roughly the same mid-range window the
	 * strategic planner already uses for a jump-in approach - close enough that the ~0.25s the real
	 * input sequence takes to play out won't just whiff into empty space, far enough that it isn't
	 * indistinguishable from a point-blank poke. Picks the least-used real command move this fight
	 * (same coverage philosophy as _pickSmartAttack()) so a long match shows off more than one
	 * hyper. Returns true if it queued one (caller should return immediately, same as every other
	 * plan-setting branch in _decide()). */
	_tryQueueCommandMove(dist, towardOpponent) {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;
		const defs = self.commandMoveDefs;
		if (!defs || !defs.length) return false;
		if (this.commandMoveCooldown > 0) return false;
		if (!self.grounded || self.isAttacking || self.inRecovery || self.hitstunTimer > 0) return false;
		if (opp.isAttacking) return false; // don't start a slow input while actually under threat
		if (dist > ATTACK_RANGE * 2.5) return false;
		if (Math.random() >= (t.commandMoveChance ?? 0)) return false;

		const chosen = this._weightedLeastUsed(defs.map((d) => ({ ...d, slot: d.key })));
		if (!chosen) return false;
		this.moveUsage[chosen.key] = (this.moveUsage[chosen.key] || 0) + 1;

		const spec = chosen.command;
		if (!spec || (spec.motion !== "qcf" && spec.motion !== "qcb") || !spec.button) return false;
		let steps = this._buildMotionFrames(spec.motion, self.facing, spec.button);

		// Easy (and, rarely, normal) difficulty can fumble the input - same spirit as mistakeChance
		// elsewhere: it "went for" the hyper but didn't actually land the motion clean, so the
		// button tap fires with no qualifying direction history behind it and CommandBuffer.match()
		// correctly just... doesn't recognize it. Reads as a whiffed special, not a frozen bot.
		if (Math.random() < (t.commandMoveFumbleChance ?? 0)) {
			steps = [{ [Math.random() < 0.5 ? "left" : "right"]: true, holdSeconds: 0.08 }, steps[steps.length - 1]];
		}

		this.commandMoveQueue = steps;
		this.commandMoveStepTimer = steps[0].holdSeconds;
		this.commandMoveDef = chosen;
		// Cooldown regardless of hit/miss/fumble - this is pacing for how often the bot ATTEMPTS
		// one, not a resource the move itself consumes (moveset.json has no meter/cost system).
		this.commandMoveCooldown = 3 + Math.random() * 4 - (t.commandMoveChance ?? 0) * 3;
		return true;
	}

	_decide() {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;

		if (this.commandMoveCooldown > 0) this.commandMoveCooldown -= this.tuning.thinkInterval;

		const dx = opp.x - self.x;
		const dist = Math.abs(dx);
		const towardOpponent = dx > 0 ? 1 : -1;

		// Summon call: only even considered when there's actually a real move to make - a character
		// with no summonDef has nothing to roll for, and requesting one mid-cooldown used to be
		// "harmless" only in the sense that main.js silently ignores it, which meant the bot spent
		// its whole think-tick "trying" a move that could never fire, often at exactly the moments
		// (see the range/safety gates below) that would have been worth a real attack instead. Gated
		// on the same real cooldown value the HUD badge itself shows (see update()'s own
		// `_summonCooldown`), plus two real situational reads: not while the opponent has an active
		// hitbox out (the summon's own appear/attack animation isn't a defensive option, so this
		// would just be eating a hit for free), and only at a range the summon (which appears
		// standing right in front of whoever calls it, per summon.js's own doc comment - it doesn't
		// travel like a projectile) could actually connect at all.
		this.wantsSummon = Boolean(
			self.summonDef && this._summonCooldown <= 0 && !opp.isAttacking &&
			dist <= ATTACK_RANGE * 1.8 && Math.random() < 0.3 + t.aggression * 0.3
		);

		// --- Strategy: read the scoreline and adjust risk-taking, same as a person would play
		// differently when comfortably ahead vs. down to their last stock. ---
		const stockDiff = self.stocks - opp.stocks;
		const percentDiff = self.percent - opp.percent; // positive = self is in more danger (higher %, easier to KO)
		let aggression = t.aggression;
		let mistakeChance = t.mistakeChance;
		if (stockDiff < 0 || percentDiff > 25) {
			// Behind on stocks, or sitting at a much higher percent than the opponent (one good hit
			// from losing a stock): play riskier, commit more, stop being so cautious about mistakes.
			aggression = Math.min(1, aggression + 0.2);
			mistakeChance = Math.max(0, mistakeChance - 0.08);
		} else if (stockDiff > 0 && percentDiff < -20) {
			// Comfortably ahead: no reason to dive in for risky trades, play a bit more patiently.
			aggression = Math.max(0.15, aggression - 0.15);
		}

		// Own percent, on its own (independent of the relative-to-opponent read just above) - the
		// higher it climbs, the harder ANY hit launches, and since the top blast zone is the only
		// way to actually lose a stock in this game (see isOffStage()), a high-percent bot has real
		// reason to get more careful in the neutral game specifically, not just play the scoreline.
		// Scales dodge/block chances used both by the on-tick defensive check right below and by
		// _perceive()'s faster reflex path (both read off `t.dodgeChance`/`t.blockChance` directly
		// today - these local, percent-aware versions replace those reads for the rest of this
		// method so a high-percent bot visibly plays tighter instead of trading carelessly).
		const percentCaution = Math.min(1, Math.max(0, self.percent - 60) / 120);
		const dodgeChance = Math.min(0.98, t.dodgeChance + percentCaution * 0.2);
		const blockChance = Math.min(0.98, t.blockChance + percentCaution * 0.12);

		// Edge-guard read: opponent is airborne and out near a blast-zone edge, i.e. actually
		// recovering - worth closing toward that edge to threaten them on the way back in, rather
		// than only ever reacting once they're already safely back on stage.
		const oppRecovering = !opp.grounded && (opp.x < STAGE.left + EDGE_MARGIN * 1.5 || opp.x > STAGE.right - EDGE_MARGIN * 1.5);
		if (oppRecovering && self.grounded && Math.random() < aggression) {
			const edgeX = opp.x < 0 ? STAGE.left + EDGE_MARGIN : STAGE.right - EDGE_MARGIN;
			this.plan = { move: edgeX > self.x + 5 ? 1 : edgeX < self.x - 5 ? -1 : 0, jump: false, attack: null, block: false, sprint: true };
			return;
		}

		// Defensive reaction on the think tick too (in addition to the faster `_perceive()` path
		// above) so a bot that's mid-plan still reconsiders blocking on a normal decision beat.
		if (opp.isAttacking && dist < THREAT_RANGE && Math.random() < dodgeChance) {
			if (self.shieldHP > 15 && Math.random() < blockChance) {
				this.plan = { move: 0, jump: false, attack: null, block: true };
			} else {
				this.plan = { move: -towardOpponent, jump: self.grounded, attack: null, block: false };
			}
			return;
		}

		// Real motion-input command moves (hypers, Patty Frisbee/Spatula Throw-style specials -
		// see moveset.json's commandMoves) - checked here, after the safety-critical edge-guard and
		// defensive branches above have already had first refusal, but before the lower-priority
		// platform/poke/approach decisions below, so a hyper reads as a real strategic option, not
		// an afterthought. See _tryQueueCommandMove()'s own doc comment for the full gating logic;
		// it returns false without touching `plan` at all if this isn't a good moment, so falling
		// through to everything below is always safe.
		if (this._tryQueueCommandMove(dist, towardOpponent)) return;

		// Platform awareness: occasionally reposition onto or off of a platform instead of only
		// ever fighting at ground level, so floating platforms actually get used - gated behind a
		// cooldown (set below whenever it actually acts) so this reads as an occasional tactical
		// choice rather than something it tries to do every other decision tick.
		if (this.platforms.length && !opp.isAttacking && this.platformCooldown <= 0) {
			if (self.groundedOn === "platform") {
				// Hop back down instead of camping on the platform forever - the same drop-through
				// input a human uses (hold down + tap jump). More eager to drop when the
				// opponent isn't also up on a platform (i.e. there's actually somewhere worth
				// dropping down *to* to re-engage), less eager (but still sometimes) otherwise.
				const oppWorthChasing = opp.groundedOn !== "platform";
				const dropChance = oppWorthChasing ? 0.4 : 0.18;
				if (Math.random() < dropChance) {
					this.plan = { move: 0, jump: true, attack: null, block: false, dir: "down" };
					this.platformCooldown = 2.5 + Math.random() * 2.5;
					return;
				}
			} else if (self.grounded && dist > ATTACK_RANGE && Math.random() < aggression * 0.32) {
				const target = this.platforms[Math.floor(Math.random() * this.platforms.length)];
				const targetX = (target.x1 + target.x2) / 2;
				if (Math.abs(self.x - targetX) < 260) {
					// Close enough that a jump could plausibly land on it - walk under it and jump.
					this.plan = { move: targetX > self.x + 5 ? 1 : targetX < self.x - 5 ? -1 : 0, jump: true, attack: null, block: false };
					this.platformCooldown = 2.5 + Math.random() * 2.5;
					return;
				}
			}
		}

		// Proactive guarding: even without reacting to a swing already in progress, sometimes
		// just hold block for a beat at close-to-mid range - reads as actually respecting the
		// neutral game instead of only ever blocking as a pure reaction to an active hitbox.
		if (dist <= ATTACK_RANGE * 1.4 && self.grounded && self.shieldHP > 25 && Math.random() < blockChance * 0.2) {
			this.plan = { move: 0, jump: false, attack: null, block: true };
			return;
		}

		// Ranged zoning: a character with a real projectile special (moveset.json's specialN/S/U/D,
		// detected generically off `type`, not hardcoded to specialN, so any future character's own
		// projectile special(s) get this for
		// free) should actually get to use it as a projectile - planting and firing from outside
		// melee range, where it visibly travels - instead of "special" tier only ever coming up in
		// the point-blank melee check below, where it fired at contact range and was functionally
		// indistinguishable from a regular poke. This is now the STRONG default the moment they're
		// out of melee range with one available (a real zoner doesn't need much convincing to throw
		// a projectile at an opponent who isn't already in their face) rather than a rare roll - see
		// the much higher base chance below - with a few real factors still shaping just how eager:
		// farther away reads as more of an actual zoning opportunity (up to a point - see the dist
		// upper bound); an opponent currently airborne can't immediately close in and punish a whiff,
		// so it's a safer window to throw one; and per the scoreline read above, a bot comfortably
		// ahead is more willing to play the patient, poke-from-range game rather than dive in for a
		// risky trade. If more than one projectile slot is available, the least-thrown one this
		// fight gets first pick, same coverage logic as melee attacks.
		const projectileCandidates = this._reachableAttackCandidates(towardOpponent)
			.filter((c) => self.moveset[c.slot] && self.moveset[c.slot].type === "projectile");
		if (projectileCandidates.length && self.grounded && !self.isAttacking && !self.inRecovery &&
			dist > ATTACK_RANGE * 1.15 && dist <= ATTACK_RANGE * 7) {
			const distFactor = Math.min(1, (dist - ATTACK_RANGE * 1.15) / (ATTACK_RANGE * 4));
			const airborneFactor = opp.grounded ? 0 : 0.15;
			const patientFactor = stockDiff > 0 && percentDiff < -20 ? 0.1 : 0;
			const zoningChance = Math.min(0.92, 0.45 + aggression * 0.2 + distFactor * 0.35 + airborneFactor + patientFactor);
			if (Math.random() < zoningChance) {
				const chosen = this._weightedLeastUsed(projectileCandidates);
				this.moveUsage[chosen.slot] = (this.moveUsage[chosen.slot] || 0) + 1;
				this.plan = this._candidateToPlan(chosen);
				return;
			}
		}

		// A mistake this tick: do something a bit off (stand still, or just approach
		// without attacking) so the bot isn't perfectly optimal.
		const mistake = Math.random() < mistakeChance;

		if (dist <= ATTACK_RANGE * 0.85) {
			if (mistake) {
				// Whiff: back off instead of attacking into a read - sometimes a plain retreat,
				// sometimes a retreating short hop, so even the "doing nothing productive" branch
				// doesn't look identical every time.
				const hopBack = self.grounded && Math.random() < 0.3;
				this.plan = { move: -towardOpponent * (hopBack ? 1 : 0.5), jump: hopBack, attack: null, block: false };
				return;
			}
			// Even at point-blank range, sometimes jump instead of throwing yet another grounded
			// normal - a real player doesn't just stand and trade forever; short-hop aerials (in, to
			// close further; straight up, an anti-air/juggle read; or back out, for spacing) are a
			// normal part of close-range neutral, not just something that only ever happens from
			// mid-range. Character.update() already throws an air attack automatically once airborne
			// and back in range (see the mid-range branch below) - no attack slot needs picking here.
			if (self.grounded && Math.random() < t.jumpChance) {
				const roll = Math.random();
				// Weighted toward jumping in/holding position over jumping straight back out - a bot
				// that only ever retreats into the air reads as scared rather than varied.
				const moveDir = roll < 0.45 ? towardOpponent : roll < 0.7 ? 0 : -towardOpponent;
				this.plan = { move: moveDir, jump: true, attack: null, block: false };
				return;
			}
			// Coverage-aware pick (see _pickSmartAttack()): rolls this difficulty's own tier weights
			// (so easy/normal/hard still feel distinct, crouch included), then biases toward
			// whichever real slot within that tier - grounded jab/ftilt/utilt/dtilt/dashAttack/
			// fsmash/usmash/dsmash/specialN../D, or airborne nair/fair/bair/uair/dair - has been
			// thrown the fewest times so far this fight, so a full match actually works its way
			// through the character's entire moveset instead of settling into 2-3 favorites.
			const chosen = this._pickSmartAttack(towardOpponent);
			this.plan = chosen ? this._candidateToPlan(chosen) : { move: 0, jump: false, attack: "light", block: false };
			return;
		}

		if (dist <= ATTACK_RANGE * 2.2) {
			// Mid-range: close in, with occasional jump-ins (which will throw an air attack
			// automatically once airborne and back in range, no special-casing needed here). A flat
			// base chance on top of the aggression scaling means even a passive/low-aggression bot
			// still mixes in aerials sometimes, rather than jump-ins being an almost-hard-difficulty-only
			// thing.
			const jumpIn = self.grounded && Math.random() < 0.2 + aggression * 0.4;
			// Roughly even odds of dashing vs. plain walking in - a flat near-50/50 base rather
			// than the old heavy sprint bias, so both gears actually show up about equally over
			// a match instead of the bot looking like it's always dashing everywhere.
			this.plan = { move: towardOpponent, jump: jumpIn, attack: null, block: false, sprint: !jumpIn && Math.random() < 0.42 + aggression * 0.16 };
			return;
		}

		// Far away: approach, but a passive/low-aggression bot sometimes just holds ground.
		if (Math.random() < aggression || mistake === false) {
			this.plan = { move: towardOpponent, jump: false, attack: null, block: false, sprint: Math.random() < 0.46 + aggression * 0.16 };
		} else {
			this.plan = { move: 0, jump: false, attack: null, block: false };
		}
	}
}


// ===== summon.js =====
// summon.js
// Character-specific companion/assist summons only - each playable character optionally
// defines its own summon pool in moveset.json's `summons` block, rendered from that
// character's OWN atlas/animations. There is no
// shared generic creature pool (no Wolf/Golem/Wraith fallback) - a character with no
// `summons` block simply has no summon move, full stop. This keeps the system generic and
// reusable: any character authored at a full level of detail just
// needs its own `summons` entry in moveset.json to get this for free.
//
// Behaves like a Smash assist trophy / Pokemon call: appears standing on the
// ground right in front of whoever summoned it, performs its attack in place,
// then leaves. It does not travel across the stage like a projectile.

// Matches NATURAL_HEIGHT_SCALE_UNIT (the typical natural, clamped character scale - see the
// CHARACTER_MIN/MAX_HEIGHT_PX comment block), so a summoned creature reads as roughly
// character-sized rather than a shrunken effect sprite. Used as a fallback only if a
// character's own summon spawn doesn't specify a scale (trySummon() always passes the summoning
// character's own real `scale`, so this rarely actually applies).
const SUMMON_SCALE = NATURAL_HEIGHT_SCALE_UNIT;

const ENTER_DURATION = 0.25; // expanding in from nothing before it can hit anything
const EXIT_DURATION = 0.3; // collapsing back down to nothing after its attack finishes
const MAX_ATTACK_TIME = 2.5; // safety cap in case an animation's timing loops oddly
const DROP_START_Y = -700; // how high a "drop" summon starts, well above the visible stage
const DROP_GRAVITY = 2600; // px/s^2 - noticeably heavier fall than a character's jump, reads as a weighty object
const SQUASH_DURATION = 0.12; // seconds of impact squash on landing

class Summon {
	/**
	 * @param {object} def - one entry from a character's own summons.pool (moveset.json)
	 * @param {number} x world x it appears/lands at
	 * @param {number} facing 1 or -1, which way it faces to attack
	 * @param {Character} target the character this summon can actually hit (never its own summoner)
	 * @param {object} source - {atlas, actions, scale, enterAction, owner} - always the summoning
	 *   character's OWN sprite set (e.g. a character's own companion creatures render
	 *   straight off its own atlas, no separate sheet needed). `owner` (the summoning Character)
	 *   is used only to resolve sound refs via its soundBank.
	 */
	constructor(def, x, facing, target, source) {
		this.def = def;
		this.x = x;
		this.facing = facing;
		this.target = target;
		this.timer = 0;
		this.hitLanded = false;
		this.squashTimer = 0;
		this.atlas = source.atlas;
		this.actions = source.actions;
		this.scale = source.scale || SUMMON_SCALE;
		this.owner = source.owner;
		this.enterAction = source && source.enterAction != null ? this.actions[source.enterAction] : null;

		if (def.mode === "drop") {
			this.y = DROP_START_Y;
			this.vy = 0;
			this.phase = "falling"; // falling -> attack -> exit -> gone
		} else {
			this.y = def.yOffset || 0;
			this.phase = "enter"; // enter -> attack -> exit -> gone
			if (this.owner && def.appearSound) playCharacterSound(this.owner, def.appearSound);
		}

		this.attackAction = this.actions[def.attackAction];
		this.action = this.enterAction || this.attackAction; // enter-phase plays its own appear pose when one was given
		this.frameIndex = 1;
		this.frameTimer = 0;
	}

	get isDone() {
		return this.phase === "gone";
	}

	get isAttacking() {
		return this.phase === "attack";
	}

	currentFrame() {
		return this.action ? this.action.frames[this.frameIndex - 1] : null;
	}

	hitboxes() {
		if (this.phase !== "attack" || this.hitLanded) return [];
		const frame = this.currentFrame();
		if (!frame) return [];
		return this._worldBoxes(frame.clsn1);
	}

	_worldBoxes(list) {
		const boxes = [];
		for (const b of list) {
			let [x1, y1, x2, y2] = b;
			if (this.facing === -1) [x1, x2] = [-x1, -x2];
			x1 *= this.scale; x2 *= this.scale; y1 *= this.scale; y2 *= this.scale;
			boxes.push([this.x + Math.min(x1, x2), this.y + y1, this.x + Math.max(x1, x2), this.y + y2]);
		}
		return boxes;
	}

	update(dt) {
		this.timer += dt;
		if (this.squashTimer > 0) this.squashTimer = Math.max(0, this.squashTimer - dt);

		if (this.phase === "falling") {
			const pdt = dt * PHYSICS_SPEED_MULT; // same time-compression as Character.update() - see PHYSICS_SPEED_MULT's own comment
			this.vy += DROP_GRAVITY * pdt;
			this.y += this.vy * pdt;
			if (this.y >= 0) {
				this.y = 0;
				this.vy = 0;
				this.phase = "attack";
				this.timer = 0;
				this.squashTimer = SQUASH_DURATION; // impact thud on landing
				if (this.owner && this.def.sounds && this.def.sounds.attack) playCharacterSound(this.owner, this.def.sounds.attack);
			}
			return;
		}

		if (this.phase === "enter") {
			if (this.timer >= ENTER_DURATION) {
				this.phase = "attack";
				this.timer = 0;
				if (this.action !== this.attackAction) {
					this.action = this.attackAction; // hand off from the enter/appear pose to the real attack animation
					this.frameIndex = 1;
					this.frameTimer = 0;
				}
				if (this.owner && this.def.sounds && this.def.sounds.attack) playCharacterSound(this.owner, this.def.sounds.attack);
			}
			return;
		}

		if (this.phase === "attack") {
			let frame = this.currentFrame();
			if (frame) {
				this.frameTimer += dt;
				let dur = frame.time / 60;
				while (frame && dur > 0 && this.frameTimer >= dur) {
					this.frameTimer -= dur;
					this.frameIndex += 1;
					if (this.frameIndex > this.action.frames.length) {
						this.phase = "exit";
						this.timer = 0;
						break;
					}
					frame = this.currentFrame();
					dur = frame ? frame.time / 60 : 0;
					if (!frame || frame.time < 0) break; // holds on its last frame - fine, exit will cut it off
				}
			}
			if (this.timer > MAX_ATTACK_TIME) {
				this.phase = "exit";
				this.timer = 0;
			}
			return;
		}

		if (this.phase === "exit") {
			// stays put on the ground and just fades - no flying off, it's leaving the way it arrived
			if (this.timer >= EXIT_DURATION) this.phase = "gone";
		}
	}

	draw(ctx) {
		const frame = this.currentFrame();
		if (!frame || !this.atlas) return;

		let scaleXMul = 1;
		let scaleYMul = 1;
		let alpha = 1;

		if (this.phase === "enter") {
			// Instead of just popping in, scale from nothing up to full size - reads like a quick
			// materialize rather than a jarring instant appearance. (Drop-mode summons skip this -
			// falling into frame is itself a clear, non-jarring entrance.)
			const t = Math.min(1, this.timer / ENTER_DURATION);
			scaleXMul = scaleYMul = t;
			alpha = t;
		} else if (this.phase === "exit") {
			const t = Math.min(1, this.timer / EXIT_DURATION);
			scaleXMul = scaleYMul = 1 - t;
			alpha = 1 - t;
		} else if (this.squashTimer > 0) {
			// Brief heavy-impact squash right on landing (drop-mode) - wide and short, then settles.
			const t = this.squashTimer / SQUASH_DURATION;
			scaleXMul = 1 + t * 0.35;
			scaleYMul = 1 - t * 0.3;
		}

		ctx.save();
		ctx.globalAlpha = alpha;
		ctx.translate(this.x, this.y);
		ctx.scale(Math.max(0.001, scaleXMul), Math.max(0.001, scaleYMul));
		this.atlas.draw(ctx, frame.group, frame.image, 0, 0, this.facing === -1, false, this.scale);
		ctx.restore();
	}
}


// ===== projectile.js =====
// A traveling hitbox for "projectile" type moves (see character-mapper.html's per-move Type
// selector): the owning Character plays its throw animation once and stays planted (handled in
// Character.attack()/update() via pendingProjectileSpawn), while this object independently flies
// across the stage, drawn from its own dedicated sprite/animation-frame-sheet if the move was
// given one (every frame on the sheet sharing the same frameW x frameH cell), or a small drawn
// energy-bolt fallback when it wasn't - so a projectile move works with zero extra art too.
const PROJECTILE_SCALE = NATURAL_HEIGHT_SCALE_UNIT; // matches the typical natural, clamped character scale - see the CHARACTER_MIN/MAX_HEIGHT_PX comment block, so a fallback-only, owner-less projectile still reads as roughly character-sized by default
function loadProjectileImage(dataUrl) {
	return new Promise((resolve) => {
		if (!dataUrl) { resolve(null); return; }
		const img = new Image();
		img.onload = () => resolve(img);
		img.onerror = () => resolve(null);
		img.src = dataUrl;
	});
}
// Cache decoded projectile images by data-URL identity so re-throwing the same move doesn't
// re-decode its sheet every single time - keyed on the string itself (data: URLs are immutable).
const _projectileImageCache = new Map();
function getProjectileImage(dataUrl) {
	if (!dataUrl) return null;
	if (_projectileImageCache.has(dataUrl)) return _projectileImageCache.get(dataUrl);
	const entry = { img: null };
	_projectileImageCache.set(dataUrl, entry);
	loadProjectileImage(dataUrl).then((img) => { entry.img = img; });
	return entry;
}

class Projectile {
	/**
	 * @param {object} move - the full move entry (damage/kbBase/kbGrowth/angle + .projectile{speed,
	 *   offsetX,offsetY,life,bodyAction,hitSparkAction,missSparkAction,image,frameW,frameH,frameCount,fps})
	 * @param {number} fromX/fromY - the owning character's position at the moment it was thrown
	 * @param {number} facing - the owning character's facing at that moment (travel direction)
	 * @param {Character} owner - never hits its own owner
	 */
	constructor(move, fromX, fromY, facing, owner) {
		const p = move.projectile || {};
		this.move = move;
		this.owner = owner;
		this.facing = facing;
		this.speed = Number(p.speed) || 340;
		this.life = Number(p.life) || 1.2;
		// offsetX/offsetY come straight from the real MUGEN source's Helper/Projectile "pos"/"offset"
		// fields (raw sprite-pixel units, same coordinate space the .air's own Clsn boxes are
		// authored in) - so, exactly like Character._boxesFor() scales Clsn boxes by this.scale
		// before adding them to the character's world position, these need the owner's own scale
		// applied too. Without it (the bug this comment is fixing), a character rendered at 2x still
		// only spawns its projectiles half as high as intended, i.e. down near the waist/ground
		// instead of at the gun/mouth - "coming out across the ground" instead of from the character.
		// Every FX element tied to this projectile (spawn offset, body-art draw size, hitbox size)
		// uses the OWNER's own render scale, not the flat PROJECTILE_SCALE constant - so a bomb/gun
		// spawned by a bigger or smaller character (their own natural, clamped scale - see
		// correctly scales/resizes and repositions right along with them, matching moveset.json's
		// offsetX/offsetY (raw sprite-pixel units, same space as the .air's own Clsn boxes - see
		// Character._boxesFor(), which scales those the same way).
		this.scale = (owner && owner.scale) || PROJECTILE_SCALE;
		this.x = fromX + facing * (Number(p.offsetX) || 0) * this.scale;
		this.y = fromY + (Number(p.offsetY) || 0) * this.scale;
		this.frameW = Math.max(1, Number(p.frameW) || 32);
		this.frameH = Math.max(1, Number(p.frameH) || 32);
		this.frameCount = Math.max(1, Math.round(Number(p.frameCount)) || 1);
		this.fps = Math.max(1, Number(p.fps) || 12);
		this.imageEntry = p.image ? getProjectileImage(p.image) : null;
		// Preferred art path: the move's REAL flying-object animation, straight out of the
		// character's own atlas/.air (e.g. a projectile move's own dedicated action number) -
		// real per-frame group/image/timing, same mechanism
		// Character/Summon already draw themselves with, just addressed by action number instead
		// of hardcoded onto `this`. Falls back to the legacy external-spritesheet path above (kept
		// for character-mapper.html-authored moves that upload their own art with no .air action to
		// reference), then to the plain drawn bolt if neither is present.
		this.bodyAction = (owner && owner.actions && typeof p.bodyAction === "number") ? owner.actions[p.bodyAction] : null;
		this.bodyFrameIndex = 1;
		this.bodyFrameTimer = 0;
		this.hitSparkAction = typeof p.hitSparkAction === "number" ? p.hitSparkAction : null;
		this.missSparkAction = typeof p.missSparkAction === "number" ? p.missSparkAction : null;
		this.animTime = 0;
		this.hitLanded = false;
		this.done = false;
		this.spawnTimer = 0; // counts up to FX_SPAWN_GROW_DURATION - see draw()'s growScale
		this.expiring = false; // true once naturally expiring (miss) - not set on a landed hit
		this.expireTimer = 0; // counts up to FX_DESPAWN_SHRINK_DURATION once expiring
	}

	update(dt) {
		this.x += this.facing * this.speed * dt * PHYSICS_SPEED_MULT; // same time-compression as Character.update()'s pdt - a thrown projectile shouldn't suddenly look slow relative to the now-faster characters around it
		this.life -= dt;
		this.animTime += dt;
		if (this.bodyAction && this.bodyAction.frames.length) {
			const frame = this.bodyAction.frames[this.bodyFrameIndex - 1];
			if (frame) {
				this.bodyFrameTimer += dt;
				const dur = frame.time / 60;
				if (dur > 0 && this.bodyFrameTimer >= dur) {
					this.bodyFrameTimer -= dur;
					this.bodyFrameIndex += 1;
					if (this.bodyFrameIndex > this.bodyAction.frames.length) {
						this.bodyFrameIndex = this.bodyAction.loopstart || 1; // loop the flight animation for the move's whole travel time
					}
				}
			}
		}
		if (this.spawnTimer < FX_SPAWN_GROW_DURATION) this.spawnTimer = Math.min(FX_SPAWN_GROW_DURATION, this.spawnTimer + dt);
		if (this.hitLanded) {
			// A hit spark already plays right at the impact point to sell this moment - fading
			// the (now invisible-to-the-player-anyway) projectile out on top of it would just
			// read as lag, so a landed hit still disappears instantly, same as before.
			this.done = true;
			return;
		}
		if (!this.expiring && (this.life <= 0 || this.x < STAGE.left - 200 || this.x > STAGE.right + 200)) {
			this.expiring = true;
		}
		if (this.expiring) {
			this.expireTimer += dt;
			if (this.expireTimer >= FX_DESPAWN_SHRINK_DURATION) this.done = true;
		}
	}

	/** Combined grow-in/shrink-out multiplier for this frame - 1 for most of a projectile's life,
	 * ramping from/to 0 only during the brief spawn-in or miss-expiry windows. Used for both the
	 * draw-time scale and alpha so it reads as growing/shrinking-and-fading, not just resizing. */
	get fxProgress() {
		const grow = this.spawnTimer < FX_SPAWN_GROW_DURATION ? this.spawnTimer / FX_SPAWN_GROW_DURATION : 1;
		const shrink = this.expiring ? Math.max(0, 1 - this.expireTimer / FX_DESPAWN_SHRINK_DURATION) : 1;
		return grow * shrink;
	}

	hitboxes() {
		if (this.hitLanded || this.done || this.expiring) return [];
		// Half-extents purely from the frame/fallback size at this.scale (the owner's own render
		// scale - see the constructor) - simple and predictable rather than trying to infer a
		// tighter box from per-frame alpha.
		const hasArt = this.bodyAction || (this.imageEntry && this.imageEntry.img);
		const hw = (hasArt ? this.frameW : 16) * this.scale * 0.5;
		const hh = (hasArt ? this.frameH : 16) * this.scale * 0.5;
		return [[this.x - hw, this.y - hh * 2, this.x + hw, this.y]];
	}

	draw(ctx) {
		const fx = this.fxProgress;
		if (this.bodyAction && this.owner && this.owner.atlas) {
			const frame = this.bodyAction.frames[this.bodyFrameIndex - 1];
			if (frame) {
				ctx.globalAlpha = fx;
				this.owner.atlas.draw(ctx, frame.group, frame.image, this.x, this.y, this.facing === -1, false, this.scale * fx);
				ctx.globalAlpha = 1;
				return;
			}
		}
		const img = this.imageEntry && this.imageEntry.img;
		ctx.save();
		ctx.globalAlpha = fx;
		ctx.translate(this.x, this.y - (this.frameH * this.scale) / 2);
		if (img) {
			const frameIdx = Math.floor(this.animTime * this.fps) % this.frameCount;
			const cols = Math.max(1, Math.floor(img.naturalWidth / this.frameW));
			const sx = (frameIdx % cols) * this.frameW;
			const sy = Math.floor(frameIdx / cols) * this.frameH;
			const dw = this.frameW * this.scale * fx;
			const dh = this.frameH * this.scale * fx;
			if (this.facing === -1) ctx.scale(-1, 1);
			ctx.imageSmoothingEnabled = false;
			ctx.drawImage(img, sx, sy, this.frameW, this.frameH, -dw / 2, -dh / 2, dw, dh);
		} else {
			// No dedicated art at all (neither a real .air action nor an uploaded sheet) - a small
			// pulsing energy bolt so the move still reads clearly rather than being invisible, sized
			// relative to the owner's own scale like every other FX element here.
			const r = (10 + Math.sin(this.animTime * 30) * 2) * (this.scale / PROJECTILE_SCALE) * fx;
			const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
			grad.addColorStop(0, "#fff7d6");
			grad.addColorStop(0.5, "#ffcf5d");
			grad.addColorStop(1, "#ff8a1e00");
			ctx.fillStyle = grad;
			ctx.beginPath();
			ctx.arc(0, 0, r, 0, Math.PI * 2);
			ctx.fill();
		}
		ctx.restore();
	}
}

/** A small non-sprite "KO'd!" visual burst - a quick expanding ring flash plus a handful of
 * outward-flying star-like sparks - played once at the point a character flew off the top of the
 * screen, during the brief pause before they respawn (see Character.die()/DEATH_PAUSE in
 * combat.js). No dedicated death/KO sprite exists anywhere in the source .air data for this
 * roster (checked - there's a generic knockback-reaction pose (HIT_BACK) and a dizzy-stun loop,
 * nothing else), so this is procedural instead, matching the same "no art asset available"
 * fallback style already used elsewhere in this file (e.g. Projectile's own energy-bolt gradient
 * when a move has no uploaded sheet) rather than silently doing nothing. */
class KOBurst {
	constructor(x, y) {
		this.x = x;
		this.y = y;
		this.life = 0;
		this.duration = 0.5;
		this.done = false;
		const n = 8;
		this.particles = [];
		for (let i = 0; i < n; i++) {
			const angle = (i / n) * Math.PI * 2 + Math.random() * 0.3;
			this.particles.push({ angle, speed: 220 + Math.random() * 140 });
		}
	}

	update(dt) {
		this.life += dt;
		if (this.life >= this.duration) this.done = true;
	}

	draw(ctx) {
		const t = Math.min(1, this.life / this.duration);
		const alpha = 1 - t;
		ctx.save();
		ctx.globalCompositeOperation = "lighter"; // additive - see ImpactFX.draw()'s own comment on why this is safe against an opaque backdrop
		ctx.strokeStyle = `rgba(255, 230, 150, ${alpha})`;
		ctx.lineWidth = 6 * alpha + 1;
		ctx.beginPath();
		ctx.arc(this.x, this.y, 20 + t * 90, 0, Math.PI * 2);
		ctx.stroke();
		ctx.fillStyle = `rgba(255, 245, 200, ${alpha})`;
		for (const p of this.particles) {
			const dist = p.speed * this.life;
			ctx.beginPath();
			ctx.arc(this.x + Math.cos(p.angle) * dist, this.y + Math.sin(p.angle) * dist, 5 * alpha + 1, 0, Math.PI * 2);
			ctx.fill();
		}
		ctx.restore();
	}
}

/** A handful of colored shard particles that fly outward (with a touch of gravity) and fade when
 * a breakout block breaks - same lightweight life/duration/done pattern as KOBurst just above,
 * just chunky little squares (block debris) instead of a shockwave ring, tinted to match the
 * broken block's own color. */
class BlockShatterBurst {
	constructor(x, y, w, h, color) {
		this.x = x;
		this.y = y;
		this.life = 0;
		this.duration = 0.45;
		this.done = false;
		this.color = color;
		const n = 6;
		this.shards = [];
		for (let i = 0; i < n; i++) {
			const angle = (i / n) * Math.PI * 2 + Math.random() * 0.6;
			this.shards.push({
				angle,
				speed: 140 + Math.random() * 160,
				size: Math.max(4, Math.min(w, h) * (0.16 + Math.random() * 0.12)),
				spin: (Math.random() - 0.5) * 10,
			});
		}
	}

	update(dt) {
		this.life += dt;
		if (this.life >= this.duration) this.done = true;
	}

	draw(ctx) {
		const t = Math.min(1, this.life / this.duration);
		const alpha = 1 - t;
		ctx.save();
		ctx.fillStyle = this.color;
		ctx.globalAlpha = alpha;
		for (const s of this.shards) {
			const dist = s.speed * this.life;
			const sx = this.x + Math.cos(s.angle) * dist;
			const sy = this.y + Math.sin(s.angle) * dist + 200 * this.life * this.life; // a little gravity arc
			ctx.save();
			ctx.translate(sx, sy);
			ctx.rotate(s.spin * this.life);
			ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
			ctx.restore();
		}
		ctx.restore();
	}
}


// A short-lived, real MUGEN spark/impact animation (hit-spark, guard-spark, or a projectile's
// miss/expire fizzle) played once at a world position and then discarded - the same idea as
// Projectile's `bodyAction` art, just for the instantaneous VFX layer instead of a traveling
// hitbox. Every one of these is a REAL local action in the character's own .air/atlas (the
// 8200-8207 family of per-move hit sparks, 6767 for guard, 5555/8510 for specific impacts, etc.) -
// there is no drawn-shape fallback here because every move wired up so far has real art for this;
// a move with no hitSpark/guardSpark assigned in moveset.json just doesn't spawn one.
class ImpactFX {
	constructor(atlas, actions, actionNum, x, y, scale, facing) {
		this.atlas = atlas;
		this.action = actions && typeof actionNum === "number" ? actions[actionNum] : null;
		this.x = x;
		this.y = y;
		this.scale = scale || PROJECTILE_SCALE;
		this.facing = facing || 1;
		this.frameIndex = 1;
		this.frameTimer = 0;
		this.life = 0; // safety cap below covers a badly-authored hold-forever (-1) last frame
		this.done = !this.action || !this.action.frames.length;
	}

	update(dt) {
		if (this.done) return;
		this.life += dt;
		if (this.life > 1.2) { this.done = true; return; } // safety cap - never outlives a beat
		const frame = this.action.frames[this.frameIndex - 1];
		if (!frame) { this.done = true; return; }
		this.frameTimer += dt;
		const dur = frame.time / 60;
		if (frame.time < 0) return; // holding on a terminal frame - the life cap above will retire it
		if (dur <= 0) { this.frameIndex += 1; }
		else if (this.frameTimer >= dur) {
			this.frameTimer -= dur;
			this.frameIndex += 1;
		}
		if (this.frameIndex > this.action.frames.length) this.done = true;
	}

	draw(ctx) {
		if (this.done || !this.atlas) return;
		const frame = this.action.frames[this.frameIndex - 1];
		if (!frame) return;
		// MUGEN's built-in hit-spark system (HitDef's sparkno/guard.sparkno - what every spark
		// used here comes from) always composites these sprites with ADDITIVE blending, never plain
		// alpha-over: the source art is authored on an opaque black matte and relies on that
		// convention (black contributes nothing when added) to read as a bright flash instead of a
		// solid black box. Canvas's closest equivalent is "lighter". Scoped to just this one draw
		// call - atlas.draw() wraps its own ctx.save()/ctx.restore(), so this reverts automatically.
		ctx.globalCompositeOperation = "lighter";
		this.atlas.draw(ctx, frame.group, frame.image, this.x, this.y, this.facing === -1, false, this.scale);
		ctx.globalCompositeOperation = "source-over";
	}
}


// ===== ui-fx.js =====
// Shared ROUND / FIGHT! / K.O. overlay, built from real MUGEN fight.sff + fight.def data (the
// default Elecbyte "Big" motif shipped in this project's data/ pack) rather than drawn/guessed:
// group 1200 is the "FIGHT!" reveal, group 1205 is the "ROUND" banner, group 1100 is the "K.O."
// flash. The AIR text below is copied verbatim from fight.def's own [Begin Action 80]/[Begin
// Action 1200]/[Begin Action 200] blocks (same hold-times per frame, including the real
// flicker-in on the FIGHT! reveal) - fed through this file's own parseAir() rather than
// hand-transcribed, so the exact source timing survives untouched.

/** Plays one parsed MUGEN action as a fixed screen-space overlay, scaled/centered from the
 * source 320x240 MUGEN screen space onto this game's fixed GAME_W x GAME_H canvas. Deliberately
 * NOT ImpactFX (see that class's own comment) - these are real opaque banner/logo art with a
 * normal alpha channel (verified: content pixels carry real RGB, not "additive on a black
 * matte"), so this draws with normal alpha compositing, never "lighter". */
class ScreenFX {
	constructor(atlas, actions, actionNum) {
		this.atlas = atlas;
		this.action = actions && typeof actionNum === "number" ? actions[actionNum] : null;
		this.frameIndex = 1;
		this.frameTimer = 0;
		this.done = !this.action || !this.action.frames.length;
	}
	update(dt) {
		if (this.done) return;
		const frame = this.action.frames[this.frameIndex - 1];
		if (!frame) { this.done = true; return; }
		if (frame.time < 0) return; // holding on a terminal frame - caller retires this, not update()
		this.frameTimer += dt;
		const dur = frame.time / 60;
		if (dur <= 0) { this.frameIndex += 1; }
		else if (this.frameTimer >= dur) {
			this.frameTimer -= dur;
			this.frameIndex += 1;
		}
		if (this.frameIndex > this.action.frames.length) this.done = true;
	}
	draw(ctx) {
		if (this.done || !this.atlas) return;
		const frame = this.action.frames[this.frameIndex - 1];
		if (!frame) return;
		// Native MUGEN screen is 320x240 - uniform-scale it up to this canvas's fixed width and
		// center it (this art is already vertically centered in its own 240-tall space, so the
		// small vertical overflow against the wider 16:9 GAME_H never clips real content - see
		// the atlas build script's own note). Recomputed every draw so a live resize is free.
		const scale = GAME_W / 320;
		const anchorX = GAME_W / 2 - 160 * scale;
		const anchorY = GAME_H / 2 - 120 * scale;
		this.atlas.draw(ctx, frame.group, frame.image, anchorX, anchorY, false, false, scale);
	}
}

/** Loads (once) and caches the shared ROUND/FIGHT!/K.O. atlas - see assets/ui/roundfightko.png

			.then((atlas) => {

			})
			.catch((err) => {
				// A one-time failure here (a dropped request, a dev server hiccup, anything
				// transient) used to get cached FOREVER as a rejected promise, same as a
				// success would - every future match start would keep re-awaiting that same
				// already-failed promise and immediately reject again, permanently, with no
				// on-screen sign of why: the game would just silently stop starting matches
				// for the rest of the session. Clearing the cache back to null on failure lets
				// the very next match attempt actually retry the real fetch instead of
				// replaying a stale failure.

/** Procedural 3-2-1 countdown, played center-screen right at round/match start, before the
 * real "FIGHT!" reveal (see RoundFightKO.update() below). No MUGEN sprite exists for this in
 * fight.sff - real MUGEN doesn't have a numeric countdown at all, this is the same kind of
 * common screenpack/arcade addition on top of the stock reveal - so, like KOBurst above, this is
 * drawn directly rather than faked from missing art, styled to match the HUD's own warm
 * amber/gold accent (HUD_PANEL_BORDER) so it reads as part of the same UI language. */
class CountdownFX {
	constructor() {
		this.numbers = ["3", "2", "1"];
		this.index = 0;
		this.t = 0;
		this.holdPer = 0.62; // seconds each number is shown for
		this.done = false;
	}
	update(dt) {
		if (this.done) return;
		this.t += dt;
		if (this.t >= this.holdPer) {
			this.t -= this.holdPer;
			this.index += 1;
			if (this.index >= this.numbers.length) this.done = true;
		}
	}
	draw(ctx) {
		if (this.done) return;
		const label = this.numbers[this.index];
		// Quick scale-in overshoot (1.6x -> 1x) over the number's first 0.18s, then a brief
		// fade in its last 0.12s so the next number doesn't just hard-cut in on top of it.
		const popT = Math.min(1, this.t / 0.18);
		const scale = 1 + (1 - popT) * 0.6;
		const fadeOut = this.t > this.holdPer - 0.12 ? Math.max(0, (this.holdPer - this.t) / 0.12) : 1;
		const size = 160 * scale;
		ctx.save();
		ctx.translate(GAME_W / 2, GAME_H / 2);
		ctx.globalAlpha = fadeOut;
		ctx.font = `bold ${size}px 'All Around The World', monospace`;
		ctx.textAlign = "center";
		ctx.textBaseline = "middle";
		ctx.shadowColor = "#ffb238";
		ctx.shadowBlur = 30;
		ctx.lineWidth = Math.max(4, size * 0.05);
		ctx.strokeStyle = "#4a2c08";
		ctx.strokeText(label, 0, 0);
		ctx.fillStyle = "#ffe9b0";
		ctx.fillText(label, 0, 0);
		ctx.restore();
	}
}

/** Drives the classic 3-2-1 countdown -> "FIGHT!" intro (played at match start, and again after every
 * NON-final stock loss - a stock loss is this Smash-style game's equivalent of a round ending)
 * plus the "K.O." flash on any stock loss. `.blocking` mirrors real MUGEN's fight.def ctrl.time -
 * true for the whole ROUND->FIGHT sequence, so the match loop can gate normal gameplay update on
 * it without this class needing to know anything about Character/AI/input. The K.O. flash itself
 * does NOT block (real MUGEN doesn't freeze either player mid-KO-flash either). */
class RoundFightKO {
	constructor(atlas, actions) {
		this.atlas = atlas;
		this.actions = actions;
		this.current = null;
		this.phase = null; // "round" | "fight" | "ko" | null
		this.blocking = false;
		this.koHoldTimer = 0;
		this.pendingRound = null;
	}
	startRound(n) {
		this.phase = "countdown";
		this.current = new CountdownFX();
		this.blocking = true;
	}
	showKO() {
		this.phase = "ko";
		this.current = new ScreenFX(this.atlas, this.actions, 200);
		this.koHoldTimer = 0;
		this.blocking = false;
	}
	/** Call from checkKO() right after a non-final stock loss: shows K.O. immediately, then once
	 * its hold time (real fight.def slow.time/over-time territory) elapses, starts the next
	 * round's ROUND->FIGHT sequence automatically. */
	queueNextRound(n) {
		this.showKO();
		this.pendingRound = n;
	}
	update(dt) {
		if (this.phase === "ko") {
			this.koHoldTimer += dt;
			if (this.current) this.current.update(dt);
			if (this.pendingRound != null && this.koHoldTimer > 1.4) {
				const n = this.pendingRound;
				this.pendingRound = null;
				this.startRound(n);
			} else if (this.pendingRound == null && this.current && this.current.done) {
				this.phase = null;
				this.current = null;
			}
			return;
		}
		if (!this.current) return;
		this.current.update(dt);
		if (this.current.done) {
			if (this.phase === "countdown") {
				this.phase = "fight";
				this.current = new ScreenFX(this.atlas, this.actions, 80);
			} else if (this.phase === "fight") {
				this.phase = null;
				this.current = null;
				this.blocking = false;
			}
		}
	}
	draw(ctx) {
		if (this.current) this.current.draw(ctx);
	}
}

// doesn't block the title/select screens from showing up immediately. On the standalone build
// (assets embedded as data: URIs already in memory) this is effectively instant; on the modular
// dev build it streams in over a few frames and the fallback icon covers the gap.
for (const key of ROSTER) ensurePortraitLoaded(key);

// Fixed scale unit for select-screen portraits (only matters as the fallback path - see
// drawPortrait below - since the primary path just cover-fits each character's real avatar.png
// into the card, unaffected by this). Calibrated so a character rendered from their own idle
// sprite/atlas at this flat unit comfortably fills the card without overflowing, the same way for
// every character - deliberately uniform ("fit every character's sprite to the same box height"),
// unlike the in-match natural-height clamp (CHARACTER_MIN/MAX_HEIGHT_PX) which is the opposite on
// purpose: a fixed UI card benefits from consistent framing regardless of a character's real
// gameplay size, whereas the match itself is exactly where that real size should show through.
const PORTRAIT_SCALE_UNIT = 1.2;

function drawPortrait(key, cx, topY, w, h, bottomY, scaleMul) {

	// clips to the card's rounded rect, so a cover-fit here never bleeds outside it).

		const boxAspect = w / h;
		const imgAspect = avatar.naturalWidth / avatar.naturalHeight;
		let dw, dh;
		if (imgAspect > boxAspect) {
			dh = h;
			dw = h * imgAspect;
		} else {
			dw = w;
			dh = w / imgAspect;
		}
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(avatar, cx - dw / 2, topY + (h - dh) / 2, dw, dh);

	// from its match atlas, then (if even that hasn't loaded yet) the tiny pixel icon. Uses the flat
	// PORTRAIT_SCALE_UNIT alone (see its own comment) - deliberately NOT the in-match natural-height
	// clamp, since this fallback's whole point is consistent card framing, not real gameplay size.
	const finalScale = scaleMul;
	const loaded = portraitAtlases[key];
	if (loaded) {
		const frame = loaded.actions[0] && loaded.actions[0].frames[0];
		const spr = frame && loaded.atlas.get(frame.group, frame.image);
		if (frame && spr) {

		ctx.drawImage(icon, cx - iw / 2, bottomY - iw, iw, iw);

 * a size x size box at (x, y) - shared by the small icon-only button on the character select
 * screen and the labeled button in the in-match pause overlay, each of which wraps this in their
 * own panel styling. Automatically swaps to the "collapse" (arrows pointing in) version of the
 * glyph while already fullscreen, so the button always shows the action it's ABOUT to take next. */
function drawFullscreenGlyph(x, y, size) {
	ctx.save();
	ctx.strokeStyle = "#ffffff";
	ctx.lineWidth = Math.max(1.5, size * 0.07);
	ctx.lineCap = "round";
	ctx.lineJoin = "round";
	const m = size * 0.22;
	const armLen = size * 0.26;
	const corners = isFullscreenActive()
		? [ // collapse: brackets point INWARD, toward the box's own center
			[[x + m + armLen, y + m], [x + m, y + m], [x + m, y + m + armLen]],
			[[x + size - m - armLen, y + m], [x + size - m, y + m], [x + size - m, y + m + armLen]],
			[[x + m + armLen, y + size - m], [x + m, y + size - m], [x + m, y + size - m - armLen]],
			[[x + size - m - armLen, y + size - m], [x + size - m, y + size - m], [x + size - m, y + size - m - armLen]],
		]
		: [ // expand: brackets point OUTWARD, toward the box's own corners - the standard fullscreen glyph
			[[x + m, y + m + armLen], [x + m, y + m], [x + m + armLen, y + m]],
			[[x + size - m - armLen, y + m], [x + size - m, y + m], [x + size - m, y + m + armLen]],
			[[x + m, y + size - m - armLen], [x + m, y + size - m], [x + m + armLen, y + size - m]],
			[[x + size - m - armLen, y + size - m], [x + size - m, y + size - m], [x + size - m, y + size - m - armLen]],
		];
	for (const pts of corners) {
		ctx.beginPath();
		ctx.moveTo(pts[0][0], pts[0][1]);
		ctx.lineTo(pts[1][0], pts[1][1]);
		ctx.lineTo(pts[2][0], pts[2][1]);
		ctx.stroke();
	}
	ctx.restore();
}

/** Converts a pointer/mouse event's real screen position into fixed-game-space coordinates. */
function toGameCoords(e) {
	const rect = canvas.getBoundingClientRect();
	const scaleX = GAME_W / rect.width;
	const scaleY = GAME_H / rect.height;
	return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

// Keys that the browser would otherwise use to scroll the page (arrows,
// space, tab) are claimed for the game so they never touch the scrollbar -
// belt-and-braces alongside `overflow: hidden` on <body>.
const SCROLL_KEYS = new Set(["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "tab"]);

const keys = {};
let resetMatchFn = null; // wired up once a match starts
let backToSelectFn = null; // wired up once a match starts
let selectKeyHandlerFn = null; // wired up while the select screen is active
let pauseToggleFn = null; // wired up once a match starts - toggles the in-match pause/movelist overlay
let isPausedFn = null; // wired up once a match starts - lets the global keydown handler below check "are we currently paused" without reaching into startMatch()'s own closure
let pauseHitRects = {}; // populated by drawPauseOverlay() - Resume/Fullscreen/Quit button rects, read by the in-match pointer handler set up in startMatch()

// One shared <audio> element for menu/stage music (select.mp3 during both select screens, a
// stage's own track once a match starts) - simpler than juggling multiple elements since only
// one music track is ever meant to be playing at a time. Browsers block audio autoplay before any
// user gesture, so the first playMusic() call may reject; that's expected and swallowed here -
// music starts as soon as the player's first key/tap fires, not before.
const musicEl = new Audio();
musicEl.volume = 0.55;
// Music tracks are real external files (sound/{id}.mp3, kept alongside this HTML - NOT embedded) -
// STAGES/select-screen code below refers to tracks by short id ("mystage", "select", ...) and
// resolves through here rather than hardcoding a path either way.
function resolveMusicSrc(id) {
	return `sound/${id}.mp3`;
}
// Ids that have already failed to load this session (sound/ folder missing entirely, a specific
// track not copied over, blocked by the browser's local file:// security policy, etc.) - once an
// id lands here, playMusic() for it becomes a silent no-op instead of retrying and spamming
