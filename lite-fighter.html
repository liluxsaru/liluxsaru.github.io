// character.js
// Same lightweight (non-MUGEN) character controller as the Love2D version:
// ground physics, a small state machine, animation driven by parsed .air
// data + the sprite atlas — extended with two-character combat: percent-based
// knockback, hitstun, facing-your-opponent, a moveset with contextual
// crouch/air attacks, and a shield/block system.






// Action numbers - these are standard across most MUGEN characters built on
// a common state file (cloudi.air and etna.air use the same numbers).
const ACTION = {
	STAND: 0,
	CROUCH: 10, // the actual held crouching pose (11 is just the crouch->stand transition frame)
	WALK_FWD: 20,
	WALK_BACK: 21,
	JUMP_UP: 41,
	JUMP_FALL: 44,
	GUARD_AIR: 132, // "GUARD (air)" - same template position confirmed present in every character's .air (see mapper's UNIVERSAL_ACTIONS notes)
	HIT_BACK: 5030, // "Stand/Air Hit back" - generic knockback reaction, works grounded or airborne
};

const BOUNCE_RESTITUTION = 0.85; // fraction of outward speed kept after bouncing off a side boundary

// Paper-Mario-style turn: instead of an instant mirror, the sprite squashes down to a sliver,
// flips through that zero-width instant, then unsquashes back to full width across this many
// seconds. Purely a draw()-time visual - see Character.draw()/update() - never touches facing
// logic used for hitboxes/hurtboxes or AI, which still flips instantly like before.
const TURN_FLIP_DURATION = 0.16; // seconds, full shrink-flip-inflate cycle

const GRAVITY = 1800; // px/s^2
const MOVE_SPEED = 220; // px/s
const JUMP_VELOCITY = -877; // doubles max jump height vs the previous -620 (height scales with v^2, so this is -620*sqrt(2), not -620*2)
const TERMINAL_VELOCITY = 1500; // px/s cap on downward fall speed - keeps big knockback launches from snapping down unrealistically fast
const AIR_ACCEL = 900; // px/s^2 horizontal acceleration available from air control (voluntary jumps only, not knockback)
const AIR_MAX_SPEED = 260; // px/s cap on horizontal speed gained purely from air control
const AIR_DRAG = 600; // px/s^2 passive deceleration in the air when not actively steering
const GROUND_KNOCKBACK_FRICTION = 1400; // px/s^2 decay applied to a grounded knockback/pushback slide so it doesn't continue forever

// --- Combat tuning (Smash-style: percent scales knockback, not a health bar) ---
const MIN_HITSTUN = 0.15; // seconds
const MAX_HITSTUN = 0.7; // seconds
const ATTACK_RECOVERY = 0.08; // seconds of extra recovery after an attack's animation ends, before another can start
const RESPAWN_INVULN = 1.0; // seconds of untouchable grace period after respawning

// --- Shield / block tuning ---
const MAX_SHIELD = 100;
const SHIELD_REGEN_PER_SEC = 22; // recovers whenever the shield isn't actively up
const SHIELD_DRAIN_PER_SEC = 6; // passive cost of just holding guard, hit or not
const SHIELD_DAMAGE_MULT = 0.9; // fraction of a blocked move's damage subtracted from shield
const CHIP_DAMAGE_MULT = 0.12; // fraction of a blocked move's damage that still gets through as percent
const BLOCK_PUSHBACK = 200; // px/s pushback speed when a block absorbs a hit
const BLOCK_STUN = 0.12; // seconds locked out after absorbing a hit on shield
const SHIELD_BREAK_STUN = 1.6; // seconds fully stunned (can't act) after the shield breaks
const SHIELD_BREAK_RECOVER_HP = 25; // shield value granted once break-stun ends - has to be rebuilt from there

function ticksToSeconds(ticks) {
	// MUGEN runs its own animation ticks at 60/s by convention for most chars.
	return ticks / 60;
}

class Character {
	static async load(name, def) {
		const self = new Character();
		self.name = name;

		let fullMoveset = null; // character-mapper.html's moveset.json export, if this character ships one
		if (def.inline) {
			// Standalone/offline mode: assets were embedded in the page, no fetch() involved.
			self.atlas = await Atlas.loadInline(def.inline.csv, def.inline.png);
			self.actions = parseAir(def.inline.air);
		} else {
			const base = def.basePath;
			self.atlas = await Atlas.load(`${base}/sprite_atlas_${name}.csv`, `${base}/sprite_atlas_${name}.png`);
			const airText = await fetchTextOrThrow(`${base}/${name}.air`);
			self.actions = parseAir(airText);
			// Optional full move-list, authored in character-mapper.html and exported next to the
			// three required files above. Missing file (the common case for the original roster,
			// which has none) is not an error - just falls back to the legacy MOVESETS table below.
			try {
				const res = await fetch(`${base}/moveset.json`);
				if (res.ok) {
					const data = await res.json();
					if (data && data.moves) fullMoveset = data.moves;
				}
			} catch (err) {
				/* no moveset.json for this character - legacy MOVESETS fallback below covers it */
			}
		}
		// Track A: warm the pixel-perfect fallback hitbox cache now, not on a fighter's first
		// swing, so there's no mid-match hitch the first time a Clsn1-less action plays.
		warmAlphaSpanCache(self.atlas, self.actions);

		// moveset: full slot key (jab/ftilt/.../specialD) -> { action, type, damage, kbBase,
		// kbGrowth, angle, ...type-specific tuning (projectile{}/sweep{}) }. Built from a real
		// moveset.json when present, otherwise synthesized from the legacy 6-slot MOVESETS table -
		// see buildSlotMoveset()'s comment above. Either way, everything downstream (attack
		// resolution, hit detection, projectile/sweep execution) only ever looks at this table.
		self.moveset = buildSlotMoveset(name, fullMoveset);
		// pose-key (idle/crouch/walkFwd/...) -> action number, so play() calls throughout this class
		// use this character's own pose assignments instead of assuming the template's numbers.
		self.poseMap = buildPoseMap(self.actions, fullMoveset);
		// reverse lookup: action number -> move slot, so we know when an attack animation is currently playing
		// (covers every slot, not just the four standing ones, so crouch/air attacks count as "attacking" too)
		self.actionToSlot = {};
		for (const slot of Object.keys(self.moveset)) {
			const move = self.moveset[slot];
			if (move) self.actionToSlot[move.action] = slot;
		}
		self.currentMove = null; // tuning data for whichever attack is presently active
		self.attackRecoveryTimer = 0; // brief extra recovery after an attack whiffs or lands, before another can start
		self.activeSweep = null; // set while a "sweep" type move (see character-mapper.html) is actively traveling
		self.pendingProjectileSpawn = null; // set for one frame when a "projectile" type move starts - the match loop spawns the real Projectile from it

		self.x = def.x || 0;
		self.y = def.y || 0; // y = 0 is the ground line for this character
		self.vx = 0;
		self.vy = 0;
		self.facing = def.facing || 1; // 1 = right, -1 = left
		// Paper-Mario turn-flip (cosmetic only, see TURN_FLIP_DURATION): visualFacing is what
		// draw() actually mirrors on, and only snaps to match self.facing at the flip's midpoint;
		// turnFlipTimer counts down from TURN_FLIP_DURATION to 0 across one full turn.
		self.visualFacing = self.facing;
		self.turnFlipTimer = 0;
		self.turnFlipFrom = self.facing;
		self.grounded = true;
		self.groundedOn = "stage"; // "stage" | "platform" | null (airborne) - which surface, if any, is holding self.grounded up
		self.currentPlatform = null; // the specific platform object from combat.js's PLATFORMS while groundedOn === "platform"
		self.scale = def.scale || 1;

		self.percent = 0; // Smash-style damage percent
		self.hitstunTimer = 0;
		self.hitLanded = false; // true once the *current* attack has connected, to prevent multi-hits per swing
		self.stocks = def.stocks ?? 3;
		self.spawnX = self.x;
		self.spawnY = self.y;

		self.shieldHP = MAX_SHIELD;
		self.isBlocking = false;
		self.blockStunTimer = 0;
		self.shieldBreakTimer = 0;
		self.invulnTimer = 0;

		self.play(self.poseMap.idle, true);
		return self;
	}

	/** Looks up this character's own action number for a pose key (idle/crouch/walkFwd/...),
	 * falling back to the standard template's ACTION.STAND if somehow unset. */
	pose(key) {
		return this.poseMap[key] ?? ACTION.STAND;
	}

	play(actionNum, force) {
		if (this.actionNum === actionNum && !force) return;
		let action = this.actions[actionNum];
		if (!action) {
			actionNum = this.pose("idle");
			action = this.actions[actionNum];
			if (!action) return;
		}
		this.actionNum = actionNum;
		this.action = action;
		this.frameIndex = 1;
		this.frameTimer = 0;
		const slot = this.actionToSlot[actionNum];
		if (slot) {
			this.hitLanded = false;
			this.currentMove = this.moveset[slot];
		}
	}

	/** Start an attack by full move-list slot name (jab/ftilt/.../specialD - see FULL_ATTACK_SLOTS).
	 * Handles all three move types: melee (just plays the animation - existing per-frame Clsn1 hit
	 * detection in the match loop does the rest), projectile (plays the animation once and arms
	 * pendingProjectileSpawn for the match loop to turn into a real traveling Projectile), and sweep
	 * (arms activeSweep, which update()'s physics step below drives for the move's duration). */
	attack(slot) {
		const move = this.moveset[slot];
		if (!move) return false;
		this.play(move.action);
		this.pendingProjectileSpawn = null;
		this.activeSweep = null;
		if (move.type === "projectile" && move.projectile) {
			this.pendingProjectileSpawn = { move, fromX: this.x, fromY: this.y, facing: this.facing };
		} else if (move.type === "sweep" && move.sweep) {
			const sw = move.sweep;
			const speed = Math.max(1, Number(sw.speed) || 400);
			const distance = Math.max(0, Number(sw.distance) || 0);
			this.activeSweep = {
				direction: sw.direction || "side",
				speed,
				dirSign: sw.direction === "side" ? (sw.reverse ? -this.facing : this.facing) : 1,
				timer: distance / speed, // seconds - how long the travel lasts, so total distance ~= speed * timer
			};
		}
		return true;
	}

	/** Resolves which attack tier ("light"|"medium"|"heavy"|"special") was requested, plus the
	 * current movement context (grounded/airborne, held direction, facing), into one concrete
	 * full-move-list slot key - the single place input turns into "which of the 18 possible moves
	 * is this". Always falls back to a slot that legacy (non-moveset.json) characters actually
	 * have, so the original 12-character roster keeps its exact old behavior (one move per tier,
	 * direction-blind) while a character with a real moveset.json gets the full direction-aware set. */
	resolveAttackSlot(tier, input) {
		const dirHeld = input.up ? "up" : input.down ? "down" : (input.left || input.right) ? "side" : null;
		const towardFacing = (input.left && this.facing === -1) || (input.right && this.facing === 1);

		if (!this.grounded) {
			if (dirHeld === "down" && this.moveset.dair) return "dair";
			if (dirHeld === "up" && this.moveset.uair) return "uair";
			if (dirHeld === "side" && towardFacing && this.moveset.fair) return "fair";
			if (dirHeld === "side" && !towardFacing && this.moveset.bair) return "bair";
			if (this.moveset.nair) return "nair";
			return this.moveset.fair ? "fair" : this.moveset.uair ? "uair" : this.moveset.dair ? "dair" : "bair";
		}

		if (tier === "special") {
			if (dirHeld === "up" && this.moveset.specialU) return "specialU";
			if (dirHeld === "down" && this.moveset.specialD) return "specialD";
			if (dirHeld === "side" && this.moveset.specialS) return "specialS";
			return "specialN";
		}

		if (tier === "heavy") {
			if (dirHeld === "up" && this.moveset.usmash) return "usmash";
			if (dirHeld === "down" && this.moveset.dsmash) return "dsmash";
			if (this.moveset.fsmash) return "fsmash";
			return this.moveset.usmash ? "usmash" : "dsmash";
		}

		// light / medium tier - grounded normals, including a dash attack while actively moving
		// toward facing at real speed (covers both a deliberate run and simply walking into a swing).
		if (dirHeld === "side" && towardFacing && Math.abs(this.vx) > 10 && this.moveset.dashAttack) return "dashAttack";
		if (dirHeld === "up" && this.moveset.utilt) return "utilt";
		if (dirHeld === "down" && this.moveset.dtilt) return "dtilt";
		if (dirHeld === "side" && this.moveset.ftilt) return "ftilt";
		return "jab";
	}

	currentFrame() {
		if (!this.action) return null;
		return this.action.frames[this.frameIndex - 1];
	}

	get isAttacking() {
		return Boolean(this.actionToSlot[this.actionNum]);
	}

	get inHitstun() {
		return this.hitstunTimer > 0;
	}

	/** True while an attack's animation is finishing up and another attack can't yet start. */
	get inRecovery() {
		return this.isAttacking || this.attackRecoveryTimer > 0;
	}

	/** True while stunned by hitstun, block-stun, or a broken shield - no input is read in this state. */
	get isLocked() {
		return this.hitstunTimer > 0 || this.blockStunTimer > 0 || this.shieldBreakTimer > 0;
	}

	/** Apply an incoming hit: damage, knockback, hitstun, and the reaction animation. */
	takeHit({ damage = 8, fromX = this.x, kbBase = 320, kbGrowth = 7.5, angle = 40 } = {}) {
		this.percent += damage;

		const dir = this.x >= fromX ? 1 : -1;
		const kb = kbBase + this.percent * kbGrowth;
		const rad = (angle * Math.PI) / 180;

		this.vx = dir * kb * Math.cos(rad);
		this.vy = -kb * Math.sin(rad);
		this.grounded = false;
		this.isBlocking = false;
		this.activeSweep = null; // a hit interrupts a sweep in progress, same as it interrupts any other attack
		this.pendingProjectileSpawn = null;

		this.hitstunTimer = Math.min(MAX_HITSTUN, Math.max(MIN_HITSTUN, kb / 900));
		this.play(this.pose("hitStand"), true);
	}

	/** Absorb an incoming hit on shield: chip damage + shield drain + pushback, no knockback/hitstun animation. */
	blockHit({ damage = 8, fromX = this.x } = {}) {
		this.percent += damage * CHIP_DAMAGE_MULT;
		this.shieldHP = Math.max(0, this.shieldHP - damage * SHIELD_DAMAGE_MULT);

		const dir = this.x >= fromX ? 1 : -1;
		this.vx = dir * BLOCK_PUSHBACK;
		this.blockStunTimer = BLOCK_STUN;

		if (this.shieldHP <= 0) {
			this.isBlocking = false;
			this.shieldBreakTimer = SHIELD_BREAK_STUN;
			this.play(this.pose("crouch"), true); // dazed - held in the guard-broken crouch pose until it wears off
		}
	}

	/** Reset to spawn position with 0 percent - call after a stock is lost. */
	respawn() {
		this.x = this.spawnX;
		this.y = this.spawnY;
		this.vx = 0;
		this.vy = 0;
		this.percent = 0;
		this.hitstunTimer = 0;
		this.attackRecoveryTimer = 0;
		this.currentMove = null;
		this.activeSweep = null;
		this.pendingProjectileSpawn = null;
		this.grounded = true;
		this.groundedOn = "stage";
		this.currentPlatform = null;
		this.shieldHP = MAX_SHIELD;
		this.isBlocking = false;
		this.blockStunTimer = 0;
		this.shieldBreakTimer = 0;
		this.invulnTimer = RESPAWN_INVULN;
		this.play(this.pose("idle"), true);
	}

	update(dt, input = {}, platforms = []) {
		if (this.invulnTimer > 0) this.invulnTimer = Math.max(0, this.invulnTimer - dt);
		if (this.attackRecoveryTimer > 0) this.attackRecoveryTimer = Math.max(0, this.attackRecoveryTimer - dt);
		if (this.hitstunTimer > 0) this.hitstunTimer = Math.max(0, this.hitstunTimer - dt);
		if (this.blockStunTimer > 0) this.blockStunTimer = Math.max(0, this.blockStunTimer - dt);
		// Runs unconditionally (even mid-attack/hitstun/locked) so a turn started right before
		// something else interrupts it still finishes its visual cycle instead of freezing
		// mid-squash - see draw() for how this drives the flip.
		if (this.turnFlipTimer > 0) this.turnFlipTimer = Math.max(0, this.turnFlipTimer - dt);
		if (this.shieldBreakTimer > 0) {
			this.shieldBreakTimer = Math.max(0, this.shieldBreakTimer - dt);
			if (this.shieldBreakTimer === 0) this.shieldHP = SHIELD_BREAK_RECOVER_HP;
		}

		// Walked off the edge of the platform currently underfoot - start falling. The stage's own
		// ground layer has no such edges here (it's checked separately, further below), so this
		// branch only ever fires for groundedOn === "platform".
		if (this.grounded && this.groundedOn === "platform" && this.currentPlatform) {
			const p = this.currentPlatform;
			const edgeMargin = 10; // small horizontal buffer so leaving the platform isn't pixel-perfect
			if (this.x + edgeMargin < p.x1 || this.x - edgeMargin > p.x2) {
				this.grounded = false;
				this.groundedOn = null;
				this.currentPlatform = null;
			}
		}

		const locked = this.isLocked;

		// Requesting guard: held, not already mid-attack/stunned, and something left to block with.
		// No longer requires being grounded - blocking works in midair too (see the airborne branch
		// below), matching a normal fighting-game air guard.
		let wantsBlock = Boolean(input.block) && !locked && !this.isAttacking && this.shieldHP > 0;

		if (!wantsBlock) {
			this.shieldHP = Math.min(MAX_SHIELD, this.shieldHP + SHIELD_REGEN_PER_SEC * dt);
		}

		if (locked) {
			this.isBlocking = false;
		} else {
			// --- Face whichever opponent we're told about, like a real fighting game ---
			if (typeof input.opponentX === "number" && this.grounded && !this.isAttacking && !wantsBlock) {
				const desiredFacing = input.opponentX >= this.x ? 1 : -1;
				if (desiredFacing !== this.facing) {
					this.turnFlipFrom = this.facing; // draw() keeps mirroring on this until the flip's midpoint
					this.turnFlipTimer = TURN_FLIP_DURATION;
					this.facing = desiredFacing; // combat/AI logic (hitboxes, hurtboxes) flips instantly, as before
				}
			}

			// Which attack tier (if any) is being requested this frame? Checked in priority order so
			// pressing two buttons at once resolves to the stronger move. Also doubles as "some
			// attack button is held", which is all crouch/air attacks care about. The concrete full
			// move-list slot (jab/ftilt/.../specialD) this tier actually resolves to depends on
			// grounded state and held direction - see resolveAttackSlot().
			let requestedTier = null;
			if (!this.inRecovery) {
				for (const slot of MOVE_SLOTS) {
					if (input[slot]) {
						requestedTier = slot;
						break;
					}
				}
			}
			const anyAttackPressed = requestedTier !== null;

			if (this.grounded) {
				if (this.groundedOn === "platform" && wantsBlock && input.jump) {
					// Hold crouch/block + tap jump to drop through the platform underfoot (Smash-style)
					// - plain block with no jump now blocks normally instead (see the next branch),
					// and this is only reachable when groundedOn is "platform" in the first place, so
					// the stage's own ground layer is never droppable this way.
					this.isBlocking = false;
					this.vx = 0;
					this.grounded = false;
					this.groundedOn = null;
					this.currentPlatform = null;
					this.vy = Math.max(this.vy, 30); // gentle nudge downward; gravity takes it from here
					this.play(this.pose("jumpFall"));
				} else if (wantsBlock && anyAttackPressed && this.moveset.crouchAttack) {
					// Pressing an attack while guarding cancels the block for a low crouch attack.
					this.isBlocking = false;
					this.vx = 0;
					this.attack("crouchAttack");
				} else if (wantsBlock) {
					this.isBlocking = true;
					this.shieldHP = Math.max(0, this.shieldHP - SHIELD_DRAIN_PER_SEC * dt);
					this.vx = 0;
					this.play(this.pose("crouch"));
					if (this.shieldHP <= 0) {
						this.isBlocking = false;
						this.shieldBreakTimer = SHIELD_BREAK_STUN;
					}
				} else if (requestedTier) {
					// Grounded attacks plant your feet - no more sliding through a swing at walk speed
					// (a "sweep" type move below immediately overrides this with its own travel).
					this.isBlocking = false;
					this.vx = 0;
					this.attack(this.resolveAttackSlot(requestedTier, input));
				} else if (input.jump && !this.isAttacking) {
					this.isBlocking = false;
					this.vy = JUMP_VELOCITY;
					this.grounded = false;
				} else if ((input.left || input.right) && !this.isAttacking) {
					this.isBlocking = false;
					const moveDir = input.left ? -1 : 1;
					this.vx = moveDir * MOVE_SPEED;
					this.play(moveDir === this.facing ? this.pose("walkFwd") : this.pose("walkBack"));
				} else if (!this.isAttacking) {
					this.isBlocking = false;
					this.vx = 0;
					this.play(this.pose("idle"));
				}
			} else {
				if (wantsBlock) {
					this.isBlocking = true;
					this.shieldHP = Math.max(0, this.shieldHP - SHIELD_DRAIN_PER_SEC * dt);
					this.play(this.pose("guard"));
					if (this.shieldHP <= 0) {
						this.isBlocking = false;
						this.shieldBreakTimer = SHIELD_BREAK_STUN;
					}
					// Deliberately no air-control steering while actively guarding - gravity still
					// integrates normally below, so an air-blocking character keeps falling, just
					// without being able to steer left/right until they let go of block.
				} else {
					this.isBlocking = false;
					const hasAerial = this.moveset.nair || this.moveset.fair || this.moveset.bair || this.moveset.uair || this.moveset.dair;
					if (anyAttackPressed && !this.inRecovery && hasAerial) {
						this.attack(this.resolveAttackSlot(requestedTier, input));
					} else if (!this.isAttacking) {
						// Air control: steer left/right while airborne on a voluntary jump. Knockback
						// launches never reach here since those keep the character in the locked branch.
						if (input.left) {
							this.vx = Math.max(this.vx - AIR_ACCEL * dt, -AIR_MAX_SPEED);
						} else if (input.right) {
							this.vx = Math.min(this.vx + AIR_ACCEL * dt, AIR_MAX_SPEED);
						} else {
							const decay = AIR_DRAG * dt;
							if (Math.abs(this.vx) <= decay) this.vx = 0;
							else this.vx -= Math.sign(this.vx) * decay;
						}
						this.play(this.vy < 0 ? this.pose("jumpUp") : this.pose("jumpFall"));
					}
				}
			}
		}

		// --- Physics ---
		this.vy = Math.min(this.vy + GRAVITY * dt, TERMINAL_VELOCITY);

		// A "sweep" type move (see character-mapper.html) forcibly drives the character's own
		// velocity for the move's travel duration, overriding whatever normal walk/gravity physics
		// just computed above/below - this is what makes it "the character travels while the
		// hitbox rides along" rather than a stationary swing. Side sweeps dash along the ground at
		// a fixed velocity; up/down sweeps rise or drop at a fixed vertical speed (an up-sweep with
		// enough speed/distance can carry the attacker onto a platform a normal jump wouldn't
		// reach; a down-sweep can drop fast enough to read as a stomp/crash landing on an
		// opponent - see the "reachPlatform"/"crashDown" hints authored in the mapper). Cleared the
		// instant its timer runs out, handing control straight back to normal physics/animation.
		if (this.activeSweep) {
			const sw = this.activeSweep;
			if (sw.direction === "side") {
				this.vx = sw.dirSign * sw.speed;
				if (this.grounded) this.vy = 0; // planted side sweep - an airborne one keeps falling normally underneath the dash
			} else if (sw.direction === "up") {
				this.vy = -sw.speed;
				this.vx *= 0.4; // still mostly plants horizontally, doesn't fully lock it
				this.grounded = false;
			} else if (sw.direction === "down") {
				this.vy = sw.speed;
				this.vx *= 0.4;
				this.grounded = false;
			}
			sw.timer -= dt;
			if (sw.timer <= 0) this.activeSweep = null;
		}

		// A grounded slide from knockback/block-pushback decays over time instead of continuing
		// forever - normal walking/attacks always set vx explicitly every frame so this never
		// fights against voluntary movement, it only ever decays an unattended leftover velocity.
		if (this.grounded && locked && this.vx !== 0) {
			const decay = GROUND_KNOCKBACK_FRICTION * dt;
			if (Math.abs(this.vx) <= decay) this.vx = 0;
			else this.vx -= Math.sign(this.vx) * decay;
		}
		this.x += this.vx * dt;

		// Bounce off the left/right screen edges instead of flying off them - only going off the
		// top of the screen is an actual KO now (see combat.js's isOffStage). Only reflects an
		// outward-moving character (so gently walking up to the edge just stops you there, same
		// as before, rather than pinging you back at your walk speed); a character sent flying by
		// a hard hit at high percent naturally bounces further/harder since the incoming velocity
		// that gets reflected is already bigger at higher percent (existing knockback scaling),
		// with no extra logic needed here for that part.
		if (this.x < STAGE.left) {
			this.x = STAGE.left;
			if (this.vx < 0) this.vx = -this.vx * BOUNCE_RESTITUTION;
		} else if (this.x > STAGE.right) {
			this.x = STAGE.right;
			if (this.vx > 0) this.vx = -this.vx * BOUNCE_RESTITUTION;
		}

		// Holding crouch/block while falling auto-passes-through any platform you'd otherwise land
		// on (Smash-style) - doesn't apply to the stage's own ground layer, which is handled
		// separately below and stays solid no matter what.
		const fallThroughHeld = Boolean(input.block) && !this.grounded;

		const prevY = this.y;
		this.y += this.vy * dt;
		if (this.grounded && this.groundedOn === "platform" && this.currentPlatform) {
			// Continuously hold the character at the platform's surface while standing on it -
			// mirrors the stage-ground clamp just below. Without this, gravity keeps accumulating
			// every single frame regardless of grounded state, and nothing else re-clamps a
			// platform-standing character back down (the landing check right below only ever
			// fires on the transition frame, gated on `!this.grounded`) - so they'd slowly sink
			// through the platform, picking up fall speed, while `grounded` incorrectly stayed
			// true the whole time.
			this.y = this.currentPlatform.y;
			this.vy = 0;
		} else if (this.y >= 0) {
			this.y = 0;
			this.vy = 0;
			this.grounded = true;
			this.groundedOn = "stage";
			this.currentPlatform = null;
		} else if (!this.grounded && this.vy > 0 && !fallThroughHeld) {
			// One-way platform landing: only catches a character that's actively falling onto the
			// platform's top surface this frame (prevY was above it, this.y crossed at/below it) -
			// jumping up through a platform from underneath just passes through untouched, and so
			// does a deliberate drop-through (prevY starts exactly at p.y that frame, which fails
			// the "prevY < p.y" check below, so it can never immediately re-catch itself).
			for (const p of platforms) {
				const halfWidth = 10; // small horizontal margin so landing doesn't need pixel-perfect alignment
				if (this.x + halfWidth < p.x1 || this.x - halfWidth > p.x2) continue;
				if (prevY < p.y && this.y >= p.y) {
					this.y = p.y;
					this.vy = 0;
					this.grounded = true;
					this.groundedOn = "platform";
					this.currentPlatform = p;
					break;
				}
			}
		}

		// --- Animation advance ---
		let frame = this.currentFrame();
		if (frame) {
			this.frameTimer += dt;
			let dur = ticksToSeconds(frame.time);
			if (frame.time >= 0 && dur > 0) {
				while (this.frameTimer >= dur) {
					this.frameTimer -= dur;
					this.frameIndex += 1;
					if (this.frameIndex > this.action.frames.length) {
						if (this.actionNum === this.pose("crouch")) {
							// This animation is only a couple of short breathing-idle frames in the
							// source data - fine passing through, but held for a whole block it just
							// flickers. Settle into the last (most-crouched) frame and stay there.
							this.frameIndex = this.action.frames.length;
							this.frameTimer = 0;
							break;
						}
						this.frameIndex = this.action.loopstart || 1;
						if (this.isAttacking) {
							this.attackRecoveryTimer = ATTACK_RECOVERY;
							this.currentMove = null;
							this.activeSweep = null;
							this.play(this.grounded ? this.pose("idle") : this.pose("jumpFall"), true);
							break;
						}
						if (this.actionNum === this.pose("hitStand") && this.hitstunTimer === 0) {
							this.play(this.grounded ? this.pose("idle") : this.pose("jumpFall"), true);
							break;
						}
					}
					frame = this.currentFrame();
					dur = frame ? ticksToSeconds(frame.time) : 0;
					if (!frame || frame.time < 0) break;
				}
			}
		}
	}

	draw(ctx) {
		const frame = this.currentFrame();
		if (!frame) return;
		// Paper-Mario turn-flip: while turnFlipTimer is counting down, squashX sweeps a smooth
		// 1 -> 0 -> 1 width envelope (full width at the start and end, a zero-width sliver at the
		// midpoint) and visualFacing only swaps from the old to the new facing right at that
		// zero-width instant - so the sprite visibly shrinks, mirrors, then grows back, instead of
		// snapping to the mirrored art at full width. this.facing itself (what hit/hurtboxes use)
		// already flipped the instant the turn started; only the draw is delayed/animated.
		let squashX = 1;
		let visualFacing = this.facing;
		if (this.turnFlipTimer > 0) {
			const progress = 1 - this.turnFlipTimer / TURN_FLIP_DURATION; // 0 at start -> 1 at end
			squashX = Math.abs(Math.cos(progress * Math.PI));
			visualFacing = progress < 0.5 ? this.turnFlipFrom : this.facing;
		}
		const flip = visualFacing === -1;
		this.atlas.draw(ctx, frame.group, frame.image, this.x, this.y, flip, false, this.scale, squashX);
	}

	/** World-space hurtboxes (Clsn2) for the current frame - empty during respawn invulnerability. */
	hurtboxes() {
		if (this.invulnTimer > 0) return [];
		return this._boxesFor("clsn2");
	}

	/** World-space hitboxes (Clsn1) for the current frame - empty while in hitstun (no trading off broken frames). */
	hitboxes() {
		if (this.inHitstun) return [];
		return this._boxesFor("clsn1");
	}

	_boxesFor(key) {
		const frame = this.currentFrame();
		if (!frame) return [];
		const boxes = [];
		for (const b of frame[key]) {
			let [x1, y1, x2, y2] = b;
			if (this.facing === -1) [x1, x2] = [-x1, -x2];
			x1 *= this.scale; x2 *= this.scale; y1 *= this.scale; y2 *= this.scale;
			boxes.push([this.x + Math.min(x1, x2), this.y + y1, this.x + Math.max(x1, x2), this.y + y2]);
		}
		return boxes;
	}
}


// ===== ai.js =====
// ai.js
// A lightweight opponent brain for singleplayer. It doesn't see anything the
// human player couldn't see (positions, percents, whether someone's mid-
// attack) - it just reacts to that state on a timer, the way a person would,
// rather than doing full lookahead/search. Three difficulty presets tune how
// often it "thinks", how good its decisions are, and how much it whiffs.
//
// The controller produces the exact same input shape main.js's keyboard
// readers do ({ left, right, jump, light, medium, heavy, special, opponentX })
// so Character.update() can't tell the difference between a human and the AI.



const DIFFICULTY = {
	easy: {
		thinkInterval: 0.45, // seconds between decisions
		reactionDelay: 0.28, // seconds before it reacts to a state change (e.g. opponent attacking) - now actually used, see AIController._perceive()
		mistakeChance: 0.3, // chance per decision it does something suboptimal (wrong move / hesitates)
		aggression: 0.4, // how eagerly it closes distance / commits to attacks
		dodgeChance: 0.3, // chance it reacts at all when the opponent swings nearby
		blockChance: 0.5, // of those reactions, chance it blocks instead of jumping away
		punishChance: 0.35, // chance it capitalizes on a whiff it just watched end nearby
		moveWeights: { light: 0.5, medium: 0.25, heavy: 0.1, special: 0.05, crouch: 0.1 },
	},
	normal: {
		thinkInterval: 0.22,
		reactionDelay: 0.12,
		mistakeChance: 0.13,
		aggression: 0.6,
		dodgeChance: 0.55,
		blockChance: 0.78,
		punishChance: 0.65,
		moveWeights: { light: 0.32, medium: 0.26, heavy: 0.16, special: 0.16, crouch: 0.1 },
	},
	hard: {
		thinkInterval: 0.09,
		reactionDelay: 0.035,
		mistakeChance: 0.03,
		aggression: 0.85,
		dodgeChance: 0.85,
		blockChance: 0.94,
		punishChance: 0.9,
		moveWeights: { light: 0.22, medium: 0.24, heavy: 0.18, special: 0.26, crouch: 0.1 },
	},
};

const ATTACK_RANGE = 95; // px - roughly where these characters' normals reach
const EDGE_MARGIN = 70; // px of buffer the AI tries to keep from the blast-zone edges
const THREAT_RANGE = ATTACK_RANGE * 1.3; // px - close enough that an opponent's swing is a real threat worth reacting to
const OPP_MEMORY = 5; // how many of the opponent's recent moves it remembers, for simple pattern reads

function weightedPick(weights) {
	const total = Object.values(weights).reduce((a, b) => a + b, 0);
	let r = Math.random() * total;
	for (const [key, w] of Object.entries(weights)) {
		if ((r -= w) <= 0) return key;
	}
	return Object.keys(weights)[0];
}

class AIController {
	constructor(character, opponent, difficulty = "normal", platforms = []) {
		this.character = character;
		this.opponent = opponent;
		this.platforms = platforms; // this match's stage layout - lets the AI actually use platforms instead of ignoring them
		this.setDifficulty(difficulty);

		this.thinkTimer = 0;
		this.plan = { move: 0, jump: false, attack: null, block: false }; // slower, strategic layer - refreshed on the think timer
		this.wantsSummon = false;

		// --- Perception state (checked every frame, independent of the think timer above) ---
		// This is what lets the bot "see" the opponent's actual moves/inputs - not by cheating and
		// reading their keyboard, but the same way a human would: watching state changes (an attack
		// starting, an attack ending, which move it was) as they happen, then reacting after a
		// short human-like delay rather than instantly.
		this.wasOppAttacking = false;
		this.oppRecentMoves = []; // last few move-slot names the opponent has thrown, newest last
		this.reactionTimer = 0; // counts down to zero, then `pendingReaction` actually fires
		this.pendingReaction = null; // "defend" | "punish", queued but not yet resolved
		this.reaction = null; // the resolved, currently-active reflex input (overrides `plan` for a beat)
		this.reactionHoldTimer = 0; // how much longer the resolved reaction stays in control

		// --- Platform pacing: a cooldown so voluntary platform play reads as occasional, not a tic ---
		this.platformCooldown = 1 + Math.random() * 2;
	}

	setDifficulty(difficulty) {
		this.difficulty = difficulty;
		this.tuning = DIFFICULTY[difficulty] || DIFFICULTY.normal;
	}

	/** Call once per frame; returns an input object for Character.update(). */
	update(dt) {
		const self = this.character;
		const opp = this.opponent;

		if (this.platformCooldown > 0) this.platformCooldown -= dt;

		this._perceive(dt);

		this.thinkTimer -= dt;
		if (this.thinkTimer <= 0) {
			this.thinkTimer = this.tuning.thinkInterval * (0.8 + Math.random() * 0.4);
			this._decide();
		}

		// Emergency reactions are checked every frame, not just on the think
		// timer, so the bot doesn't step off the stage just because it hasn't
		// "thought" in a while - this is the one thing that overrides everything else.
		const recovering = self.x < STAGE.left + EDGE_MARGIN || self.x > STAGE.right - EDGE_MARGIN;

		const input = {
			left: false,
			right: false,
			jump: false,
			light: false,
			medium: false,
			heavy: false,
			special: false,
			block: false,
			summon: false,
			opponentX: opp.x,
		};

		if (recovering && self.grounded) {
			// Walk back toward center.
			if (self.x < STAGE.left + EDGE_MARGIN) input.right = true;
			else input.left = true;
		} else if (this.reaction) {
			// A resolved reflex (block/dodge/punish) briefly overrides the slower strategic plan -
			// same as how a real player's reflexes interrupt whatever they were doing a moment ago.
			const r = this.reaction;
			if (r.move < 0) input.left = true;
			else if (r.move > 0) input.right = true;
			if (r.jump) input.jump = true;
			if (r.attack) input[r.attack] = true;
			if (r.block) input.block = true;

			this.reactionHoldTimer -= dt;
			if (this.reactionHoldTimer <= 0) this.reaction = null;
		} else {
			if (this.plan.move < 0) input.left = true;
			else if (this.plan.move > 0) input.right = true;
			if (this.plan.jump) input.jump = true;
			if (this.plan.attack) input[this.plan.attack] = true;
			if (this.plan.block) input.block = true;
		}
		if (this.wantsSummon) input.summon = true;

		return input;
	}

	/**
	 * Runs every frame regardless of the think timer. Watches the opponent's actual animation
	 * state - is it attacking right now, did it just stop, which move was it - the same
	 * information visible on screen to a human opponent - and turns state *changes* into
	 * delayed reactions, rather than the bot instantly knowing and instantly responding.
	 */
	_perceive(dt) {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;
		const dist = Math.abs(opp.x - self.x);
		const oppSlot = opp.actionToSlot ? opp.actionToSlot[opp.actionNum] : null;

		if (opp.isAttacking && !this.wasOppAttacking) {
			// Rising edge: the opponent just committed to a move. Recognize what it actually is
			// (a heavy/special hits harder and should be respected more than a jab) and remember it,
			// so repeated use of the same move gets easier to read over time.
			if (oppSlot) {
				this.oppRecentMoves.push(oppSlot);
				if (this.oppRecentMoves.length > OPP_MEMORY) this.oppRecentMoves.shift();
			}
			if (dist < THREAT_RANGE && !this.pendingReaction) {
				const move = opp.currentMove;
				const isHeavy = move && (move.priority >= 2 || move.damage >= 13);
				// Bigger, higher-priority swings get noticed a bit faster and more reliably reacted
				// to - the same way a person reacts quicker/more surely to an obvious haymaker than
				// a flicked-out jab.
				const delay = t.reactionDelay * (isHeavy ? 0.6 : 1) * (0.75 + Math.random() * 0.5);
				this.pendingReaction = { kind: "defend", isHeavy };
				this.reactionTimer = delay;
			}
		} else if (!opp.isAttacking && this.wasOppAttacking) {
			// Falling edge: the opponent's swing just ended. If it whiffed close by and the bot
			// isn't already busy, that's a clean punish window - react to it quickly, since
			// noticing an attack has *already* ended is an easier read than predicting one mid-swing.
			if (dist < THREAT_RANGE && !self.isAttacking && !self.inRecovery && !this.pendingReaction && Math.random() < t.punishChance) {
				this.pendingReaction = { kind: "punish" };
				this.reactionTimer = t.reactionDelay * 0.6 * (0.75 + Math.random() * 0.5);
			}
		}
		this.wasOppAttacking = opp.isAttacking;

		if (this.pendingReaction) {
			this.reactionTimer -= dt;
			if (this.reactionTimer <= 0) {
				this._resolveReaction(this.pendingReaction, dist);
				this.pendingReaction = null;
			}
		}
	}

	/** Turns a queued reaction into an actual input plan, held for a short beat. */
	_resolveReaction(reaction, dist) {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;
		const towardOpponent = opp.x >= self.x ? 1 : -1;

		if (reaction.kind === "defend") {
			// A pattern that's been repeated is easier to read - if the opponent's last couple of
			// moves were the same slot, lean even harder toward blocking it instead of guessing.
			const recent = this.oppRecentMoves;
			const repeated = recent.length >= 2 && recent[recent.length - 1] === recent[recent.length - 2];
			const blockChance = Math.min(0.98, t.blockChance + (reaction.isHeavy ? 0.08 : 0) + (repeated ? 0.15 : 0));
			if (self.grounded && self.shieldHP > 15 && Math.random() < blockChance) {
				this.reaction = { move: 0, jump: false, attack: null, block: true };
				this.reactionHoldTimer = 0.35;
			} else {
				this.reaction = { move: -towardOpponent, jump: self.grounded, attack: null, block: false };
				this.reactionHoldTimer = 0.25;
			}
			return;
		}

		// Whiff punish: opponent's swing just ended and left them in recovery - step in and hit
		// back rather than let a clean opening go to waste. Prefer whatever move is currently
		// weighted heaviest at this difficulty so a punish actually hurts.
		if (dist > ATTACK_RANGE * 0.8) {
			this.reaction = { move: towardOpponent, jump: false, attack: null, block: false };
			this.reactionHoldTimer = 0.15;
		} else {
			const slot = weightedPick(t.moveWeights === undefined ? { medium: 1 } : t.moveWeights);
			this.reaction = { move: 0, jump: false, attack: slot === "crouch" ? "light" : slot, block: slot === "crouch" };
			this.reactionHoldTimer = 0.2;
		}
	}

	/**
	 * Slower strategic layer - runs on the think timer, not every frame. Where `_perceive()` is
	 * reflexes, this is planning: it looks at the match state (stocks/percent, who's ahead, is the
	 * opponent stranded off-stage) and biases the usual approach/attack/hold-ground decision
	 * accordingly, instead of always playing the exact same way regardless of the scoreline.
	 */
	_decide() {
		const self = this.character;
		const opp = this.opponent;
		const t = this.tuning;

		// Independent of everything else below: a small per-think-tick chance to call a summon.
		// Harmless to request one while it's still on cooldown - main.js just ignores it then.
		this.wantsSummon = Math.random() < 0.05;

		const dx = opp.x - self.x;
		const dist = Math.abs(dx);
		const towardOpponent = dx > 0 ? 1 : -1;

		// --- Strategy: read the scoreline and adjust risk-taking, same as a person would play
		// differently when comfortably ahead vs. down to their last stock. ---
		const stockDiff = self.stocks - opp.stocks;
		const percentDiff = self.percent - opp.percent; // positive = self is in more danger (higher %, easier to KO)
		let aggression = t.aggression;
		let mistakeChance = t.mistakeChance;
		if (stockDiff < 0 || percentDiff > 25) {
			// Behind on stocks, or sitting at a much higher percent than the opponent (one good hit
			// from losing a stock): play riskier, commit more, stop being so cautious about mistakes.
			aggression = Math.min(1, aggression + 0.2);
			mistakeChance = Math.max(0, mistakeChance - 0.08);
		} else if (stockDiff > 0 && percentDiff < -20) {
			// Comfortably ahead: no reason to dive in for risky trades, play a bit more patiently.
			aggression = Math.max(0.15, aggression - 0.15);
		}

		// Edge-guard read: opponent is airborne and out near a blast-zone edge, i.e. actually
		// recovering - worth closing toward that edge to threaten them on the way back in, rather
		// than only ever reacting once they're already safely back on stage.
		const oppRecovering = !opp.grounded && (opp.x < STAGE.left + EDGE_MARGIN * 1.5 || opp.x > STAGE.right - EDGE_MARGIN * 1.5);
		if (oppRecovering && self.grounded && Math.random() < aggression) {
			const edgeX = opp.x < 0 ? STAGE.left + EDGE_MARGIN : STAGE.right - EDGE_MARGIN;
			this.plan = { move: edgeX > self.x + 5 ? 1 : edgeX < self.x - 5 ? -1 : 0, jump: false, attack: null, block: false };
			return;
		}

		// Defensive reaction on the think tick too (in addition to the faster `_perceive()` path
		// above) so a bot that's mid-plan still reconsiders blocking on a normal decision beat.
		if (opp.isAttacking && dist < THREAT_RANGE && Math.random() < t.dodgeChance) {
			if (self.grounded && self.shieldHP > 15 && Math.random() < t.blockChance) {
				this.plan = { move: 0, jump: false, attack: null, block: true };
			} else {
				this.plan = { move: -towardOpponent, jump: self.grounded, attack: null, block: false };
			}
			return;
		}

		// Platform awareness: occasionally reposition onto or off of a platform instead of only
		// ever fighting at ground level, so floating platforms actually get used - gated behind a
		// cooldown (set below whenever it actually acts) so this reads as an occasional tactical
		// choice rather than something it tries to do every other decision tick.
		if (this.platforms.length && !opp.isAttacking && this.platformCooldown <= 0) {
			if (self.groundedOn === "platform") {
				// Hop back down instead of camping on the platform forever - the same drop-through
				// input a human uses (hold down/block + tap jump). More eager to drop when the
				// opponent isn't also up on a platform (i.e. there's actually somewhere worth
				// dropping down *to* to re-engage), less eager (but still sometimes) otherwise.
				const oppWorthChasing = opp.groundedOn !== "platform";
				const dropChance = oppWorthChasing ? 0.4 : 0.18;
				if (Math.random() < dropChance) {
					this.plan = { move: 0, jump: true, attack: null, block: true };
					this.platformCooldown = 2.5 + Math.random() * 2.5;
					return;
				}
			} else if (self.grounded && dist > ATTACK_RANGE && Math.random() < aggression * 0.32) {
				const target = this.platforms[Math.floor(Math.random() * this.platforms.length)];
				const targetX = (target.x1 + target.x2) / 2;
				if (Math.abs(self.x - targetX) < 260) {
					// Close enough that a jump could plausibly land on it - walk under it and jump.
					this.plan = { move: targetX > self.x + 5 ? 1 : targetX < self.x - 5 ? -1 : 0, jump: true, attack: null, block: false };
					this.platformCooldown = 2.5 + Math.random() * 2.5;
					return;
				}
			}
		}

		// Proactive guarding: even without reacting to a swing already in progress, sometimes
		// just hold block for a beat at close-to-mid range - reads as actually respecting the
		// neutral game instead of only ever blocking as a pure reaction to an active hitbox.
		if (dist <= ATTACK_RANGE * 1.4 && self.grounded && self.shieldHP > 25 && Math.random() < t.blockChance * 0.2) {
			this.plan = { move: 0, jump: false, attack: null, block: true };
			return;
		}

		// A mistake this tick: do something a bit off (stand still, or just approach
		// without attacking) so the bot isn't perfectly optimal.
		const mistake = Math.random() < mistakeChance;

		if (dist <= ATTACK_RANGE) {
			if (mistake) {
				// Whiff: back off slightly instead of attacking into a read.
				this.plan = { move: -towardOpponent * 0.5, jump: false, attack: null, block: false };
				return;
			}
			const slot = weightedPick(t.moveWeights);
			if (slot === "crouch") {
				// Crouch attacks are triggered by holding block + any attack button at once.
				this.plan = { move: 0, jump: false, attack: "light", block: true };
			} else {
				this.plan = { move: 0, jump: false, attack: slot, block: false };
			}
			return;
		}

		if (dist <= ATTACK_RANGE * 2.2) {
			// Mid-range: close in, with occasional aggression-scaled jump-ins (which will throw an
			// air attack automatically once airborne and back in range, no special-casing needed here).
			const jumpIn = self.grounded && Math.random() < aggression * 0.3;
			this.plan = { move: towardOpponent, jump: jumpIn, attack: null, block: false };
			return;
		}

		// Far away: approach, but a passive/low-aggression bot sometimes just holds ground.
		if (Math.random() < aggression || mistake === false) {
			this.plan = { move: towardOpponent, jump: false, attack: null, block: false };
		} else {
			this.plan = { move: 0, jump: false, attack: null, block: false };
		}
	}
}


// ===== summon.js =====
// summon.js
// A Smash-style "assist" pool shared by every character. Backed by real creature
// sprites/animations pulled out of the original screenpack's fightfx.sff (see
// sff_reader.py) - these turned out to be genuine multi-frame creatures sitting
// unused in the shared effects file, not wired to any character's moveset in the
// source data. This is a new trigger/cooldown system built on top of that real art.
//
// Behaves like a Smash assist trophy / Pokemon call: appears standing on the
// ground right in front of whoever summoned it, performs its attack in place,
// then leaves. It does not travel across the stage like a projectile.




const SUMMON_POOL = [
	{ name: "Wolf", mode: "melee", attackAction: 37112, damage: 12, kbBase: 380, kbGrowth: 7.5, angle: 35 },
	{ name: "Golem", mode: "melee", attackAction: 38118, damage: 16, kbBase: 450, kbGrowth: 9.0, angle: 45 },
	{ name: "Wraith", mode: "drop", attackAction: 37770, damage: 15, kbBase: 430, kbGrowth: 8.5, angle: 50 },
];

// Same scale the playable fighters draw at by default, so a summoned creature reads as
// character-sized rather than a shrunken effect sprite.
const SUMMON_SCALE = 2;

let sharedAtlas = null;
let sharedActions = null;
let loadPromise = null;

/** Load the shared summon-pool atlas/animations once; safe to call multiple times. */
function preloadSummonPool(def) {
	if (loadPromise) return loadPromise;
	loadPromise = (async () => {
		if (def.inline) {
			sharedAtlas = await Atlas.loadInline(def.inline.csv, def.inline.png);
			sharedActions = parseAir(def.inline.air);
		} else {
			const base = def.basePath;
			sharedAtlas = await Atlas.load(`${base}/sprite_atlas_summons.csv`, `${base}/sprite_atlas_summons.png`);
			const airText = await fetchTextOrThrow(`${base}/summons.air`);
			sharedActions = parseAir(airText);
		}
	})();
	return loadPromise;
}

const ENTER_DURATION = 0.25; // expanding in from nothing before it can hit anything
const EXIT_DURATION = 0.3; // collapsing back down to nothing after its attack finishes
const MAX_ATTACK_TIME = 2.5; // safety cap in case an animation's timing loops oddly
const DROP_START_Y = -700; // how high a "drop" summon starts, well above the visible stage
const DROP_GRAVITY = 2600; // px/s^2 - noticeably heavier fall than a character's jump, reads as a weighty object
const SQUASH_DURATION = 0.12; // seconds of impact squash on landing

class Summon {
	/**
	 * @param {object} def - one entry from SUMMON_POOL
	 * @param {number} x world x it appears/lands at
	 * @param {number} facing 1 or -1, which way it faces to attack
	 * @param {Character} target the character this summon can actually hit (never its own summoner)
	 */
	constructor(def, x, facing, target) {
		this.def = def;
		this.x = x;
		this.facing = facing;
		this.target = target;
		this.timer = 0;
		this.hitLanded = false;
		this.squashTimer = 0;

		if (def.mode === "drop") {
			this.y = DROP_START_Y;
			this.vy = 0;
			this.phase = "falling"; // falling -> attack -> exit -> gone
		} else {
			this.y = def.yOffset || 0;
			this.phase = "enter"; // enter -> attack -> exit -> gone
		}

		this.action = sharedActions[def.attackAction];
		this.frameIndex = 1;
		this.frameTimer = 0;
	}

	get isDone() {
		return this.phase === "gone";
	}

	get isAttacking() {
		return this.phase === "attack";
	}

	currentFrame() {
		return this.action ? this.action.frames[this.frameIndex - 1] : null;
	}

	hitboxes() {
		if (this.phase !== "attack" || this.hitLanded) return [];
		const frame = this.currentFrame();
		if (!frame) return [];
		return this._worldBoxes(frame.clsn1);
	}

	_worldBoxes(list) {
		const boxes = [];
		for (const b of list) {
			let [x1, y1, x2, y2] = b;
			if (this.facing === -1) [x1, x2] = [-x1, -x2];
			x1 *= SUMMON_SCALE; x2 *= SUMMON_SCALE; y1 *= SUMMON_SCALE; y2 *= SUMMON_SCALE;
			boxes.push([this.x + Math.min(x1, x2), this.y + y1, this.x + Math.max(x1, x2), this.y + y2]);
		}
		return boxes;
	}

	update(dt) {
		this.timer += dt;
		if (this.squashTimer > 0) this.squashTimer = Math.max(0, this.squashTimer - dt);

		if (this.phase === "falling") {
			this.vy += DROP_GRAVITY * dt;
			this.y += this.vy * dt;
			if (this.y >= 0) {
				this.y = 0;
				this.vy = 0;
				this.phase = "attack";
				this.timer = 0;
				this.squashTimer = SQUASH_DURATION; // impact thud on landing
			}
			return;
		}

		if (this.phase === "enter") {
			if (this.timer >= ENTER_DURATION) {
				this.phase = "attack";
				this.timer = 0;
			}
			return;
		}

		if (this.phase === "attack") {
			let frame = this.currentFrame();
			if (frame) {
				this.frameTimer += dt;
				let dur = frame.time / 60;
				while (frame && dur > 0 && this.frameTimer >= dur) {
					this.frameTimer -= dur;
					this.frameIndex += 1;
					if (this.frameIndex > this.action.frames.length) {
						this.phase = "exit";
						this.timer = 0;
						break;
					}
					frame = this.currentFrame();
					dur = frame ? frame.time / 60 : 0;
					if (!frame || frame.time < 0) break; // holds on its last frame - fine, exit will cut it off
				}
			}
			if (this.timer > MAX_ATTACK_TIME) {
				this.phase = "exit";
				this.timer = 0;
			}
			return;
		}

		if (this.phase === "exit") {
			// stays put on the ground and just fades - no flying off, it's leaving the way it arrived
			if (this.timer >= EXIT_DURATION) this.phase = "gone";
		}
	}

	draw(ctx) {
		const frame = this.currentFrame();
		if (!frame || !sharedAtlas) return;

		let scaleXMul = 1;
		let scaleYMul = 1;
		let alpha = 1;

		if (this.phase === "enter") {
			// Instead of just popping in, scale from nothing up to full size - reads like a quick
			// materialize rather than a jarring instant appearance. (Drop-mode summons skip this -
			// falling into frame is itself a clear, non-jarring entrance.)
			const t = Math.min(1, this.timer / ENTER_DURATION);
			scaleXMul = scaleYMul = t;
			alpha = t;
		} else if (this.phase === "exit") {
			const t = Math.min(1, this.timer / EXIT_DURATION);
			scaleXMul = scaleYMul = 1 - t;
			alpha = 1 - t;
		} else if (this.squashTimer > 0) {
			// Brief heavy-impact squash right on landing (drop-mode) - wide and short, then settles.
			const t = this.squashTimer / SQUASH_DURATION;
			scaleXMul = 1 + t * 0.35;
			scaleYMul = 1 - t * 0.3;
		}

		ctx.save();
		ctx.globalAlpha = alpha;
		ctx.translate(this.x, this.y);
		ctx.scale(Math.max(0.001, scaleXMul), Math.max(0.001, scaleYMul));
		sharedAtlas.draw(ctx, frame.group, frame.image, 0, 0, this.facing === -1, false, SUMMON_SCALE);
		ctx.restore();
	}
}

function randomSummonDef() {
	return SUMMON_POOL[Math.floor(Math.random() * SUMMON_POOL.length)];
}


// ===== projectile.js =====
// A traveling hitbox for "projectile" type moves (see character-mapper.html's per-move Type
// selector): the owning Character plays its throw animation once and stays planted (handled in
// Character.attack()/update() via pendingProjectileSpawn), while this object independently flies
// across the stage, drawn from its own dedicated sprite/animation-frame-sheet if the move was
// given one (every frame on the sheet sharing the same frameW x frameH cell), or a small drawn
// energy-bolt fallback when it wasn't - so a projectile move works with zero extra art too.
const PROJECTILE_SCALE = 2; // matches BASE_SCALE, so a projectile reads as roughly character-sized by default
function loadProjectileImage(dataUrl) {
	return new Promise((resolve) => {
		if (!dataUrl) { resolve(null); return; }
		const img = new Image();
		img.onload = () => resolve(img);
		img.onerror = () => resolve(null);
		img.src = dataUrl;
	});
}
// Cache decoded projectile images by data-URL identity so re-throwing the same move doesn't
// re-decode its sheet every single time - keyed on the string itself (data: URLs are immutable).
const _projectileImageCache = new Map();
function getProjectileImage(dataUrl) {
	if (!dataUrl) return null;
	if (_projectileImageCache.has(dataUrl)) return _projectileImageCache.get(dataUrl);
	const entry = { img: null };
	_projectileImageCache.set(dataUrl, entry);
	loadProjectileImage(dataUrl).then((img) => { entry.img = img; });
	return entry;
}

class Projectile {
	/**
	 * @param {object} move - the full move entry (damage/kbBase/kbGrowth/angle + .projectile{speed,offsetX,offsetY,life,image,frameW,frameH,frameCount,fps})
	 * @param {number} fromX/fromY - the owning character's position at the moment it was thrown
	 * @param {number} facing - the owning character's facing at that moment (travel direction)
	 * @param {Character} owner - never hits its own owner
	 */
	constructor(move, fromX, fromY, facing, owner) {
		const p = move.projectile || {};
		this.move = move;
		this.owner = owner;
		this.facing = facing;
		this.speed = Number(p.speed) || 340;
		this.life = Number(p.life) || 1.2;
		this.x = fromX + facing * (Number(p.offsetX) || 0);
		this.y = fromY + (Number(p.offsetY) || 0);
		this.frameW = Math.max(1, Number(p.frameW) || 32);
		this.frameH = Math.max(1, Number(p.frameH) || 32);
		this.frameCount = Math.max(1, Math.round(Number(p.frameCount)) || 1);
		this.fps = Math.max(1, Number(p.fps) || 12);
		this.imageEntry = p.image ? getProjectileImage(p.image) : null;
		this.animTime = 0;
		this.hitLanded = false;
		this.done = false;
	}

	update(dt) {
		this.x += this.facing * this.speed * dt;
		this.life -= dt;
		this.animTime += dt;
		if (this.life <= 0 || this.hitLanded || this.x < STAGE.left - 200 || this.x > STAGE.right + 200) {
			this.done = true;
		}
	}

	hitboxes() {
		if (this.hitLanded || this.done) return [];
		// Half-extents purely from the frame/fallback size at PROJECTILE_SCALE - simple and
		// predictable rather than trying to infer a tighter box from per-frame alpha.
		const hw = (this.imageEntry && this.imageEntry.img ? this.frameW : 16) * PROJECTILE_SCALE * 0.5;
		const hh = (this.imageEntry && this.imageEntry.img ? this.frameH : 16) * PROJECTILE_SCALE * 0.5;
		return [[this.x - hw, this.y - hh * 2, this.x + hw, this.y]];
	}

	draw(ctx) {
		const img = this.imageEntry && this.imageEntry.img;
		ctx.save();
		ctx.translate(this.x, this.y - (this.frameH * PROJECTILE_SCALE) / 2);
		if (img) {
			const frameIdx = Math.floor(this.animTime * this.fps) % this.frameCount;
			const cols = Math.max(1, Math.floor(img.naturalWidth / this.frameW));
			const sx = (frameIdx % cols) * this.frameW;
			const sy = Math.floor(frameIdx / cols) * this.frameH;
			const dw = this.frameW * PROJECTILE_SCALE;
			const dh = this.frameH * PROJECTILE_SCALE;
			if (this.facing === -1) ctx.scale(-1, 1);
			ctx.imageSmoothingEnabled = false;
			ctx.drawImage(img, sx, sy, this.frameW, this.frameH, -dw / 2, -dh / 2, dw, dh);
		} else {
			// No dedicated art uploaded - a small pulsing energy bolt so the move still reads clearly.
			const r = 10 + Math.sin(this.animTime * 30) * 2;
			const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
			grad.addColorStop(0, "#fff7d6");
			grad.addColorStop(0.5, "#ffcf5d");
			grad.addColorStop(1, "#ff8a1e00");
			ctx.fillStyle = grad;
			ctx.beginPath();
			ctx.arc(0, 0, r, 0, Math.PI * 2);
			ctx.fill();
		}
		ctx.restore();
	}
}


// ===== main.js =====
// main.js
// Two-character combat demo: percent-based knockback instead of a health
// bar, Smash-style blast-zone KOs, a moveset per character with contextual
// crouch/air attacks and a shield/block system, floating one-way platforms,
// and a singleplayer AI opponent with switchable difficulty. Runs fullscreen:
// the canvas always matches the current viewport size, so there's nothing to
// scroll and nothing gets clipped at any resolution.
//
// Flow: title (tap or any key) -> character select (a P1/P2 tab + AI/HUMAN
// toggle each, a swipeable/tappable portrait carousel for whichever tab is
// active, FIGHT to launch) -> match -> match-over banner -> Enter for instant
// rematch (same characters) or Escape to go back and pick again.
//
// Touch is only wired up on the title and select screens (tap to start, tap
// or swipe to browse/confirm characters) - the match itself stays keyboard-
// only by design; the default is AI vs AI, so a mobile visitor can just watch.









const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
// Sprites in these atlases are packed edge-to-edge with no padding between frames. The default
// bilinear smoothing would blend in a sliver of whatever's packed next to each sprite (visible as
// stray colored/white edges bleeding in above or beside a character) - keep it off, and pixel art
// scales cleanly at integer multiples anyway. Turned on temporarily just for the title background
// (see drawTitleScreen) since that's a single full-bleed piece of art, not a packed sprite sheet.
ctx.imageSmoothingEnabled = false;

const ROSTER = Object.keys(CHARACTER_NAMES); // preserves definition order from moves.js

// Character-select avatars: real photo/art portraits (pre-cropped to a uniform ~360x381 box -
// see process_avatars.py), used as the primary art on the select-screen cards instead of the old
// small MUGEN-extracted pixel icons below. These load fast (small flat PNGs, no atlas/CSV/AIR
// parsing) so they're normally already `.complete` well before the screen is ever shown.
const avatarImages = {};
for (const key of ROSTER) {
	const img = new Image();
	img.src = `assets/characters/${key}/avatar.png`;
	avatarImages[key] = img;
}

// Stage background art (see STAGES in combat.js) - loaded from the real assets/stages/{id}/bg.png
// path on disk (no embedded data: URI build anymore).
let currentStageId = null; // set by startMatch(); read by the match draw loop's background fill
const stageBgImages = {};
for (const stage of STAGES) {
	const img = new Image();
	img.src = `assets/stages/${stage.id}/bg.png`;
	stageBgImages[stage.id] = img;
}

// Optional per-stage foreground layer (see stage-mapper.html's foreground upload) - a `fg` key on
// a STAGES entry. Only stages that actually have one get an Image created; drawn between the
// background and the platforms in the match loop
// (see STAGE_FG_GROUND_FRAC below) so it never paints over the platforms/characters - platforms
// and everything gameplay-relevant always render on top of it, it's purely set-dressing behind them.
const stageFgImages = {};
for (const stage of STAGES) {
	if (!stage.fg) continue;
	const img = new Image();
	img.src = `assets/stages/${stage.id}/fg.png`;
	stageFgImages[stage.id] = img;
}

// Second, optional foreground layer (see stage-mapper.html's "front foreground" upload) - a
// `fgFront` key on a STAGES entry. Unlike `fg` above (deliberately kept behind platforms/
// characters), this one is drawn dead last in the match loop, in front of platforms AND both
// fighters - most stages won't set it, but it's there for foreground bars/mesh/pillars the action
// should appear to pass behind.
const stageFgFrontImages = {};
for (const stage of STAGES) {
	if (!stage.fgFront) continue;
	const img = new Image();
	img.src = `assets/stages/${stage.id}/fgFront.png`;
	stageFgFrontImages[stage.id] = img;
}

// Small face-icon previews (28x28, extracted from each character's original MUGEN .sff) - now
// only a last-resort fallback if a character's avatar image above fails to load for some reason.
const iconImages = {};
for (const key of ROSTER) {
	const img = new Image();
	img.src = `assets/characters/${key}/icon.png`;
	iconImages[key] = img;
}

// Full-body select-screen portraits: the character's own real idle sprite (action 0, frame 0),
// auto-scaled to a target height from its own atlas entry so every character's portrait reads as
// the same size on the card regardless of how big that character's source art actually is -
// sidesteps needing per-character SIZE_SCALE here (that constant is calibrated for in-match
// hurtbox parity, not portrait framing). Loaded progressively in the background; drawPortrait()
// below falls back to the small icon (and finally a placeholder) until a given character's atlas
// has actually finished loading.
const portraitAtlases = {}; // key -> { atlas, actions } once loaded
const portraitLoadPromises = {};
function ensurePortraitLoaded(key) {
	if (portraitLoadPromises[key]) return portraitLoadPromises[key];
	portraitLoadPromises[key] = (async () => {
		let atlas, actions;
		{
			const base = `assets/characters/${key}`;
			const [atlasResult, airText] = await Promise.all([
				Atlas.load(`${base}/sprite_atlas_${key}.csv`, `${base}/sprite_atlas_${key}.png`),
				fetch(`${base}/${key}.air`).then((r) => r.text()),
			]);
			atlas = atlasResult;
			actions = parseAir(airText);
		}
		portraitAtlases[key] = { atlas, actions };
	})().catch(() => {}); // a single character's art failing to load shouldn't break the whole screen
	return portraitLoadPromises[key];
}
// Kick off loading the entire roster's portraits as soon as the module runs - fire-and-forget,
// doesn't block the title/select screens from showing up immediately. On the standalone build
// (assets embedded as data: URIs already in memory) this is effectively instant; on the modular
// dev build it streams in over a few frames and the fallback icon covers the gap.
for (const key of ROSTER) ensurePortraitLoaded(key);

// Fixed scale unit for select-screen portraits, calibrated against the roster's tallest raw
// idle sprite (Etna, ~128px) against the new, tighter card size (180px tall) so she comfortably
// fills it without overflowing, then every other character is scaled from that same unit by
// their own real SIZE_SCALE - identical in spirit to how startMatch scales
// BASE_SCALE * SIZE_SCALE[name] for actual gameplay. This is deliberately NOT "fit every
// character's sprite to the same box height": that was an earlier bug (Neera has a real
// SIZE_SCALE of 0.59, i.e. she's *supposed* to render meaningfully smaller than the rest of the
// cast; auto-fitting her raw pixel height to match everyone else erased that correction).
const PORTRAIT_SCALE_UNIT = 1.2;

function drawPortrait(key, cx, topY, w, h, bottomY, scaleMul) {
	// Primary: the real avatar image, cover-fit to fill the whole card box (the caller already
	// clips to the card's rounded rect, so a cover-fit here never bleeds outside it).
	const avatar = avatarImages[key];
	if (avatar && avatar.complete && avatar.naturalWidth > 0) {
		const boxAspect = w / h;
		const imgAspect = avatar.naturalWidth / avatar.naturalHeight;
		let dw, dh;
		if (imgAspect > boxAspect) {
			dh = h;
			dw = h * imgAspect;
		} else {
			dw = w;
			dh = w / imgAspect;
		}
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(avatar, cx - dw / 2, topY + (h - dh) / 2, dw, dh);
		ctx.imageSmoothingEnabled = false;
		return;
	}
	// Fallback if the avatar failed to load for some reason: the character's own real idle sprite
	// from its match atlas, then (if even that hasn't loaded yet) the tiny pixel icon.
	const finalScale = scaleMul * (SIZE_SCALE[key] || 1);
	const loaded = portraitAtlases[key];
	if (loaded) {
		const frame = loaded.actions[0] && loaded.actions[0].frames[0];
		const spr = frame && loaded.atlas.get(frame.group, frame.image);
		if (frame && spr) {
			loaded.atlas.draw(ctx, frame.group, frame.image, cx, bottomY, false, false, finalScale);
			return;
		}
	}
	const icon = iconImages[key];
	if (icon && icon.complete && icon.naturalWidth > 0) {
		const iw = finalScale * 64 * 0.8;
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(icon, cx - iw / 2, bottomY - iw, iw, iw);
		ctx.imageSmoothingEnabled = false;
	}
}

// Real title/select-screen art extracted from the original screenpack's system.sff (see
// sff_reader.py) - decorative light streaks, select-screen panels, a cell background tile, and
// P1/P2 cursor sprites, packed into one sheet the same way character sprite atlases are. (The
// title *background* itself now comes from a separate hand-picked piece of art - see
// titleCustomImg just below - but the light-streak overlay and everything else here is unchanged.)
const systemImg = new Image();
systemImg.src = "assets/system/sprite_atlas_system.png";
const SYS = {
	titleStrip: { x: 964, y: 0, w: 57, h: 735 },
};
function drawSys(key, dx, dy, dw, dh, smooth) {
	if (!systemImg.complete || systemImg.naturalWidth === 0) return false;
	const s = SYS[key];
	ctx.imageSmoothingEnabled = Boolean(smooth);
	ctx.imageSmoothingQuality = "high";
	ctx.drawImage(systemImg, s.x, s.y, s.w, s.h, dx, dy, dw ?? s.w, dh ?? s.h);
	ctx.imageSmoothingEnabled = false;
	return true;
}

// Title screen background art - separate image/asset from the packed system atlas above, so
// swapping it never touches the (still-used) light-streak overlay next to it.
const titleCustomImg = new Image();
titleCustomImg.src = "assets/system/title_custom.png";
const TITLE_CUSTOM_SIZE = { w: 1000, h: 740 }; // the art's own real pixel dimensions

let showBoxes = false;

// --- Singleplayer state ---
// Defaults to AI vs AI so the game is immediately watchable/playable with zero setup; either
// slot can be handed to a human from the character select screen's P1/P2 toggles (or anytime
// in-match with the 1/2 keys, unchanged).
let p2IsAI = true;
let p1IsAI = true;
const difficultyOrder = ["easy", "normal", "hard"];
let difficultyIndex = 1; // "normal"

// --- Fixed 720p internal resolution, scaled to fill the real device screen ---
// Everything in this file draws against a constant 1280x720 canvas buffer - no more computing
// layout against whatever arbitrary size the device happens to report. The *display* size still
// fills the whole window on any device/aspect ratio: resizeCanvas() scales the canvas element via
// CSS (contain-fit, so the full 16:9 frame is always visible and never cropped or stretched) and
// centers it, letterboxing top/bottom or pillarboxing left/right as needed. Pointer/touch input
// coordinates need converting from real CSS pixels back into this fixed game space - see
// toGameCoords() below, used anywhere a click/tap position is read.
const GAME_W = 1280;
const GAME_H = 720;
canvas.width = GAME_W;
canvas.height = GAME_H;
ctx.imageSmoothingEnabled = false; // re-assert after the width/height writes above, which reset context state

function resizeCanvas() {
	const scale = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
	const cssW = Math.round(GAME_W * scale);
	const cssH = Math.round(GAME_H * scale);
	canvas.style.width = cssW + "px";
	canvas.style.height = cssH + "px";
	canvas.style.position = "fixed";
	canvas.style.left = Math.round((window.innerWidth - cssW) / 2) + "px";
	canvas.style.top = Math.round((window.innerHeight - cssH) / 2) + "px";
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);

/** Converts a pointer/mouse event's real screen position into fixed-game-space coordinates. */
function toGameCoords(e) {
	const rect = canvas.getBoundingClientRect();
	const scaleX = canvas.width / rect.width;
	const scaleY = canvas.height / rect.height;
	return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

// Keys that the browser would otherwise use to scroll the page (arrows,
// space, tab) are claimed for the game so they never touch the scrollbar -
// belt-and-braces alongside `overflow: hidden` on <body>.
const SCROLL_KEYS = new Set(["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "tab"]);

const keys = {};
let resetMatchFn = null; // wired up once a match starts
let backToSelectFn = null; // wired up once a match starts
let selectKeyHandlerFn = null; // wired up while the select screen is active

// One shared <audio> element for menu/stage music (select.mp3 during both select screens, a
// stage's own track once a match starts) - simpler than juggling multiple elements since only
// one music track is ever meant to be playing at a time. Browsers block audio autoplay before any
// user gesture, so the first playMusic() call may reject; that's expected and swallowed here -
// music starts as soon as the player's first key/tap fires, not before.
const musicEl = new Audio();
musicEl.volume = 0.55;
// Music tracks are real external files (sound/{id}.mp3, kept alongside this HTML - NOT embedded) -
// STAGES/select-screen code below refers to tracks by short id ("samus", "select", ...) and
// resolves through here rather than hardcoding a path either way.
function resolveMusicSrc(id) {
	return `sound/${id}.mp3`;
}
// Ids that have already failed to load this session (sound/ folder missing entirely, a specific
// track not copied over, blocked by the browser's local file:// security policy, etc.) - once an
// id lands here, playMusic() for it becomes a silent no-op instead of retrying and spamming
// errors. This only resets on a real page reload (a fresh check of whatever's on disk), which is
// the right granularity here: there's no live filesystem-watching to react to a file showing up
// mid-session anyway. Either way, a missing track never breaks the game - it just plays silently.
const musicFailedIds = new Set();
musicEl.addEventListener("error", () => {
	const failedId = musicEl.dataset.pendingId;
	if (failedId) musicFailedIds.add(failedId);
	musicEl.removeAttribute("data-src");
});
function playMusic(id, loop = true) {
	if (musicFailedIds.has(id)) return; // known missing/unloadable this session - stay silent
	const src = resolveMusicSrc(id);
	if (musicEl.dataset.src === src && !musicEl.paused) return;
	musicEl.dataset.src = src;
	musicEl.dataset.pendingId = id;
	musicEl.src = src;
	musicEl.loop = loop;
	musicEl.currentTime = 0;
	musicEl.play().catch(() => {}); // autoplay-policy rejection before a user gesture - fine, ignored
}
function stopMusic() {
	musicEl.pause();
	musicEl.removeAttribute("data-src");
}

window.addEventListener("keydown", (e) => {
	const k = e.key.toLowerCase();
	keys[k] = true;
	if (SCROLL_KEYS.has(k)) e.preventDefault();
	if (e.key === "Tab") showBoxes = !showBoxes;
	if (e.key === "1") p1IsAI = !p1IsAI;
	if (e.key === "2") p2IsAI = !p2IsAI;
	if (e.key === "[") difficultyIndex = Math.max(0, difficultyIndex - 1);
	if (e.key === "]") difficultyIndex = Math.min(difficultyOrder.length - 1, difficultyIndex + 1);
	if (e.key === "Enter" && resetMatchFn) resetMatchFn();
	if (e.key === "Escape" && backToSelectFn) backToSelectFn();
	if (!e.repeat && selectKeyHandlerFn) selectKeyHandlerFn(k);
});
window.addEventListener("keyup", (e) => {
	const k = e.key.toLowerCase();
	keys[k] = false;
	if (SCROLL_KEYS.has(k)) e.preventDefault();
});

function isPortrait() {

}
function drawPortraitWarning() {
	ctx.fillStyle = "#000000";

function roundRectPath(x, y, w, h, r) {
	ctx.beginPath();
	ctx.moveTo(x + r, y);
	ctx.arcTo(x + w, y, x + w, y + h, r);
	ctx.arcTo(x + w, y + h, x, y + h, r);
	ctx.arcTo(x, y + h, x, y, r);
	ctx.arcTo(x, y, x + w, y, r);
	ctx.closePath();
}

function drawBoxes(boxes, color) {
	ctx.fillStyle = color;

function drawShieldBar(x, y, width, character, alignRight) {
	const barX = alignRight ? x - width : x;

	ctx.fillStyle = character.shieldHP > 30 ? "#5dd0ff" : "#ff5d5d";

	ctx.fillRect(alignRight ? barX + width - fillW : barX, y, fillW, 6);
	if (character.shieldBreakTimer > 0) {
		ctx.fillStyle = "#ff5d5d";
		ctx.font = "11px 'All Around The World', monospace";
		ctx.textAlign = alignRight ? "right" : "left";
		ctx.fillText("GUARD BROKEN", alignRight ? barX + width : barX, y + 18);

}
