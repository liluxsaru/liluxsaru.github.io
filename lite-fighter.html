<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<title>K.O. Breaker</title>
	<style>
		/* Shared house font across all three tools (character-mapper.html, stage-mapper.html, this
		   file) - ships as a real file at assets/fonts/all-around-the-world.otf next to this HTML,
		   not embedded, so it's one shared copy instead of three inlined base64 copies. Every
		   font-family/ctx.font in this file falls back to monospace if it fails to load. */
		@font-face {
			font-family: "All Around The World";
			src: url("assets/fonts/all-around-the-world.otf") format("opentype");
			font-display: swap;
		}
		* {
			box-sizing: border-box;
		}
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #0b0c10;
			overflow: hidden;
			font-family: 'All Around The World', monospace;
		}
		canvas {
			display: block;
			image-rendering: pixelated;
			touch-action: none;
		}
		/* Real, playing <video> for GIF-authored stage backgrounds (see STAGES' bgExt comment - the
		   .gif ships as-is for the stage mapper/reference, but the actual in-game playback source is
		   a converted .mp4 sitting right next to it, same basename). It is NEVER shown via CSS/DOM
		   layering - the match draw loop instead ctx.drawImage()s this element straight into the
		   canvas every frame like any other background art (see stageBgImages/frame()'s bg block),
		   which reads whatever frame is currently playing. That keeps the canvas fully opaque
		   everywhere (no transparent hole for additive-blended hit-spark/explosion art - authored on
		   a black matte that relies on an opaque backdrop, see ImpactFX.draw()'s own comment - to
		   wrongly show through as solid black), and needs no getBoundingClientRect()/per-frame style
		   writes (a real perf cost) to keep a DOM overlay pixel-synced to the panning/zooming camera.
		   This replaces an earlier <img>-playing-a-GIF version of this same element: getting a
		   browser to keep actually decoding new frames for a GIF sitting in an <img> turned out to be
		   unreliable in practice across real browsers regardless of how it was sized/hidden (tiny+
		   near-zero-opacity froze it outright; a real size + opacity:0 still never animated in
		   testing) - drawImage() reading the current frame of a playing <video> is the standard,
		   well-supported way real games get animated/video content into a canvas, with none of that
		   GIF-in-img decode-throttling uncertainty. Still kept small and invisible (not because video
		   playback needs that the way GIF animation did - it doesn't - just no reason to show it). */
		#stageGifLayer {
			position: fixed;
			left: 0;
			top: 0;
			width: 320px;
			height: 155px;
			opacity: 0;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<canvas id="game"></canvas>
	<video id="stageGifLayer" muted loop playsinline preload="auto"></video>
	<script>
// [ASSETS baked-in blob removed - characters now load from assets/characters/<name>/ via fetch()]
</script>
	<script>

// ===== atlas.js =====
// atlas.js
// Loads a sprite_atlas_*.csv + matching .png into an indexed table of
// source-rect entries, keyed by [group][number]. JS port of lib/atlas.lua.
//
// CSV columns (header row present):
//   spr_x, spr_y, spr_width, spr_height, spr_off_x, spr_off_y, spr_group, spr_no

function trim(s) {
	return s.replace(/^\s+|\s+$/g, "");
}

class Atlas {
	constructor() {
		this.image = null;
		this.imgW = 0;
		this.imgH = 0;
		this.sprites = {}; // sprites[group][number] = { x, y, w, h, offX, offY }
		this.textureScale = 1; // set >1 when the PNG itself is stored smaller than the csv's coordinate units imply (see build script)
	}

	/** Load an atlas from a csv URL + png URL. */
	static async load(csvPath, pngPath, textureScale = 1) {
		// csv text and the atlas PNG are two independent fetches (nothing about parsing/using
		// either one depends on the other) - loading them in parallel instead of csv-then-image
		// roughly halves this call's own contribution to fight-start load time, since the PNG
		// (the actual sprite sheet image, typically the bigger of the two) no longer has to wait
		// for the small csv text fetch to fully finish first.
		const [csvText, image] = await Promise.all([fetch(csvPath).then((r) => r.text()), loadImage(pngPath)]);
		return Atlas._build(csvText, image, textureScale);
	}

	/** Load an atlas from already-in-memory csv text + a png src (URL or data: URI) - no fetch. Used for the standalone build where everything is embedded in the page. */
	static async loadInline(csvText, pngSrc, textureScale = 1) {
		const image = await loadImage(pngSrc);
		return Atlas._build(csvText, image, textureScale);
	}

	static _build(csvText, image, textureScale = 1) {
		const self = new Atlas();

		self.image = image;
		self.imgW = image.width;
		self.imgH = image.height;
		self.textureScale = textureScale;

		const lines = csvText.split(/\r?\n/);
		let first = true;
		for (const rawLine of lines) {
			const line = trim(rawLine);
			if (line === "") continue;
			if (first) {
				first = false; // header row
				continue;
			}
			const cols = line.split(",").map(trim);
			if (cols.length < 8) continue;
			const [x, y, w, h, offX, offY, group, no] = cols.map(Number);
			if ([x, y, w, h, group, no].some((n) => Number.isNaN(n))) continue;

			self.sprites[group] = self.sprites[group] || {};
			self.sprites[group][no] = { x, y, w, h, offX: offX || 0, offY: offY || 0 };
		}

		return self;
	}

	/** Fetch sprite entry for a given group/number, or undefined if not present. */
	get(group, number) {
		const g = this.sprites[group];
		return g ? g[number] : undefined;
	}

	/**
	 * Draw a single sprite so that its MUGEN offset point (offX, offY) lands
	 * exactly at world position (x, y) — matches love.graphics.draw's
	 * origin-offset semantics from the Love2D version.
	 * @param {number} scaleXMul - extra horizontal-only scale multiplier on top of `scale`,
	 *   applied after the flip sign. Defaults to 1 (no effect on any existing caller); used by
	 *   Character.draw()'s turn-flip squash to shrink/grow just the width for a Paper-Mario-style
	 *   flip without touching vertical scale or hitbox math (which never sees this).
	 */
	draw(ctx, group, number, x, y, flipH, flipV, scale = 1, scaleXMul = 1) {
		const spr = this.get(group, number);
		if (!spr) return false;

		// textureScale compensates for the PNG being stored smaller than its own coordinate units
		// imply (e.g. a 2x downscaled-and-dithered atlas) - inflate the draw scale to match, while
		// hitboxes elsewhere stay entirely keyed to the original .air units and never see this.
		const totalScale = scale * this.textureScale;
		const sx = (flipH ? -totalScale : totalScale) * scaleXMul;
		const sy = flipV ? -totalScale : totalScale;

		// Sprites are packed edge-to-edge (little/no gutter) in these atlases. At a non-integer
		// draw scale, floating-point rounding at the source rect's exact boundary can sample one
		// row/column into whatever sprite happens to be packed next to it - a classic canvas
		// texture-atlas bleeding bug, not anything actually present in the source PNG. Insetting
		// the sampled rect by half a pixel on every edge keeps sampling strictly inside this
		// sprite's own pixels regardless of scale.
		const inset = 0.5;
		const ix = Math.min(inset, spr.w / 4);
		const iy = Math.min(inset, spr.h / 4);

		ctx.save();
		ctx.translate(x, y);
		ctx.scale(sx, sy);
		ctx.drawImage(
			this.image,
			spr.x + ix,
			spr.y + iy,
			spr.w - ix * 2,
			spr.h - iy * 2,
			-spr.offX + ix,
			-spr.offY + iy,
			spr.w - ix * 2,
			spr.h - iy * 2
		);
		ctx.restore();
		return true;
	}
}

function loadImage(src) {
	return new Promise((resolve, reject) => {
		const img = new Image();
		img.onload = () => resolve(img);
		img.onerror = reject;
		img.src = src;
	});
}


// ===== sound.js =====
// sound.js
// Per-character sound engine, driven by a real MUGEN .snd extraction (see the mugen parser
// toolkit's sound_bank.json - every raw (group,sample) node, exposed with a `resolved` filename
// plus every real `variants` file under that key). A character's own .snd can genuinely reuse some
// (group,sample) keys (e.g. one group having several distinct real recordings all nominally
// "sample 0") -
// CharacterSoundBank.resolveFile() below tolerates that by falling back to (and rotating through)
// every real variant under a group when the exact sample requested by a move's `sounds` entry
// isn't its own dedicated key, so all 106 real recordings actually get used instead of only 38.
class CharacterSoundBank {
	constructor() {
		this.byKey = {}; // "group,sample" -> {variants:[filenames], resolved}
		this.byGroup = {}; // group -> [{sample, variants, resolved}, ...]
		this.basePath = "";
	}
	static async load(basePath) {
		const bank = new CharacterSoundBank();
		bank.basePath = basePath;
		try {
			const res = await fetch(`${basePath}/sound_bank.json`);
			if (res.ok) {
				const data = await res.json();
				for (const s of data.sounds || []) {
					bank.byKey[`${s.group},${s.sample}`] = s;
					(bank.byGroup[s.group] = bank.byGroup[s.group] || []).push(s);
				}
			}
		} catch (err) {
			/* no sound_bank.json for this character - playCharacterSound() below just no-ops */
		}
		return bank;
	}
	/** Resolves a [group, sample] ref (as authored in moveset.json's `sounds` fields) to a real
	 * "sounds/<file>.wav" URL, or null if this character has nothing under that group at all. */
	resolveUrl(ref) {
		if (!ref) return null;
		const [group, sample] = ref;
		const exact = this.byKey[`${group},${sample}`];
		const pool = exact ? exact.variants : (this.byGroup[group] || []).flatMap((g) => g.variants);
		if (!pool || !pool.length) return null;
		const file = pool[Math.floor(Math.random() * pool.length)];
		return `${this.basePath}/sounds/${file}`;
	}
}

// Small pool of reused <audio> elements instead of an unbounded `new Audio()` per call - cheap
// insurance against a fast flurry of hits (multi-hit moves, both fighters swinging at once)
// spawning dozens of concurrent decode/play requests.
const SFX_POOL_SIZE = 16;
const _sfxPool = [];
let sfxVolume = 0.85;
/** Plays a raw URL through the pool. `onEnded` (if given) fires exactly once, either when the
 * sound actually finishes or - if every pooled channel is busy and this call has to steal one
 * still mid-playback - immediately, right here, on the sound whose channel just got stolen (its
 * real "ended" event will never fire once .src is overwritten below). playCharacterSound() below
 * is the only caller and relies on that steal-case firing promptly, or a stolen sound's own
 * no-overlap tracking would stay marked "still playing" on its character forever. */
function playSfx(url, volume = sfxVolume, onEnded) {
	if (!url) return null;
	let el = _sfxPool.find((a) => a.paused || a.ended);
	if (!el) {
		if (_sfxPool.length < SFX_POOL_SIZE) {
			el = new Audio();
			_sfxPool.push(el);
		} else {
			el = _sfxPool[Math.floor(Math.random() * _sfxPool.length)]; // steal an in-use channel rather than drop the new sound
		}
	}
	if (el._sfxOnEnded) {
		const prev = el._sfxOnEnded;
		el._sfxOnEnded = null;
		prev();
	}
	el.src = url;
	el.volume = Math.max(0, Math.min(1, volume));
	el.currentTime = 0;
	el._sfxOnEnded = onEnded || null;
	el.onended = () => {
		el._sfxOnEnded = null;
		if (onEnded) onEnded();
	};
	el.play().catch(() => {}); // autoplay-policy rejection before a user gesture - harmless, ignored
	return el;
}
/** Plays one of `character`'s own sounds by MUGEN [group, sample] ref (see moveset.json's
 * `sounds` fields / `poseSounds`) - a no-op if this character has no sound bank or nothing under
 * that group, so a character shipped without a .snd extraction never throws.
 *
 * No overlapping/stacking: if this exact cue (the [group,sample] ref itself, not the resolved
 * file - a group with several random-variant samples still counts as "the same sound" for this)
 * is already playing on THIS character, the new request is dropped outright rather than
 * restarting it or layering a second copy on top. It has to finish (or lose its channel to the
 * pool being stolen, handled above) before it can play again. Tracked per-character (not
 * globally), so both fighters' identical sound banks never block each other. */
function playCharacterSound(character, ref, volume) {
	if (!character || !character.soundBank || !ref) return;
	const refKey = Array.isArray(ref) ? ref.join(",") : String(ref);
	if (!character._activeSfxRefs) character._activeSfxRefs = new Set();
	if (character._activeSfxRefs.has(refKey)) return;
	const url = character.soundBank.resolveUrl(ref);
	if (!url) return;
	character._activeSfxRefs.add(refKey);
	playSfx(url, volume, () => character._activeSfxRefs.delete(refKey));
}

// ----- Pixel-perfect fallback hitboxes (ENGINE_SCOPE Track A) -----
// Ported from character-mapper.html's getSpriteAlphaSpans() so the game and the mapper agree on
// the exact same coordinate space (draw-space x = localPx - offX, y = localPy - offY): a sprite's
// own decoded pixels are the single source of truth for any action whose frames have no authored
// Clsn1 data, computed at runtime rather than exported/baked into JSON so they can never drift
// from the art. Spans are cached per-atlas (not in one shared/global cache) since group/number
// keys are only unique within a single character's own atlas - two characters sharing a cache
// would silently read each other's sprites.
let _maskCanvas = null;
let _maskCtx = null;

function getSpriteAlphaSpans(atlasRef, group, number, alphaThreshold = 96) {
	// Raised from 24: at 24, faint anti-aliased edge pixels and glow/trail fringe around a
	// swinging limb or weapon counted as solid sprite, so a Track A fallback hitbox (used only
	// when an action has no authored Clsn1 - see the comment above this function) reached
	// noticeably further than the character actually looks like it's hitting. 96 requires
	// genuinely opaque pixels, tightening these fallback hitboxes down to the visually solid
	// part of the sprite - closer to how authored Clsn1 boxes are hand-tuned in the first place.
	const cache = atlasRef._alphaSpanCache || (atlasRef._alphaSpanCache = new Map());
	const cacheKey = `${group}:${number}`;
	if (cache.has(cacheKey)) return cache.get(cacheKey);

	const spr = atlasRef.get(group, number);
	if (!spr || spr.w <= 0 || spr.h <= 0) {
		cache.set(cacheKey, null);
		return null;
	}

	if (!_maskCanvas) {
		_maskCanvas = document.createElement("canvas");
		_maskCtx = _maskCanvas.getContext("2d", { willReadFrequently: true });
	}
	_maskCanvas.width = spr.w;
	_maskCanvas.height = spr.h;
	_maskCtx.clearRect(0, 0, spr.w, spr.h);
	_maskCtx.drawImage(atlasRef.image, spr.x, spr.y, spr.w, spr.h, 0, 0, spr.w, spr.h);

	let data;
	try {
		data = _maskCtx.getImageData(0, 0, spr.w, spr.h).data;
	} catch (err) {
		// Tainted canvas (e.g. a fetch build without proper CORS headers) - fail closed to "no
		// auto hitbox" rather than throwing and breaking the match.
		cache.set(cacheKey, null);
		return null;
	}

	const spans = [];
	for (let py = 0; py < spr.h; py++) {
		let x1 = -1, x2 = -1;
		const rowStart = py * spr.w * 4;
		for (let px = 0; px < spr.w; px++) {
			const alpha = data[rowStart + px * 4 + 3];
			if (alpha >= alphaThreshold) {
				if (x1 === -1) x1 = px;
				x2 = px;
			}
		}
		if (x1 !== -1) {
			spans.push({ y: py - spr.offY, x1: x1 - spr.offX, x2: x2 - spr.offX });
		}
	}
	const result = spans.length ? spans : null;
	cache.set(cacheKey, result);
	return result;
}

/** Precompute alpha spans for every Clsn1-less frame in a just-loaded character's action set, so
 * the (getImageData-based) computation never happens for the first time mid-swing - by the time
 * FIGHT starts every span this character could ever need is already cached. */
function warmAlphaSpanCache(atlas, actions) {
	const seen = new Set();
	for (const num of Object.keys(actions)) {
		for (const f of actions[num].frames) {
			const key = `${f.group}:${f.image}`;
			if (seen.has(key)) continue;
			seen.add(key);
			getSpriteAlphaSpans(atlas, f.group, f.image);
		}
	}
}


// ===== air_parser.js =====
// air_parser.js
// Parses MUGEN .air animation files into plain JS objects.
// This is a straight port of the Love2D project's lib/air_parser.lua —
// same file format, same output shape, just JS instead of Lua.
//
// Result shape:
// actions = {
//   [actionNumber]: {
//     loopstart: <frame index, 1-based>,
//     frames: [
//       {
//         group, image,        // sprite lookup key into the atlas
//         x, y,                 // draw offset
//         time,                 // duration in ticks (-1 = hold forever)
//         flipH, flipV,
//         clsn1: [[x1,y1,x2,y2], ...],  // attack (hit) boxes, active this frame
//         clsn2: [[x1,y1,x2,y2], ...],  // vulnerable (hurt) boxes, active this frame
//       },
//       ...
//     ]
//   }
// }

function trim(s) {
	return s.replace(/^\s+|\s+$/g, "");
}

// Parses a frame data line like: "0,0, 0,0, 7" or "3,1, 0,0, 4, H"
function parseFrameLine(line) {
	const semi = line.indexOf(";");
	if (semi !== -1) line = line.slice(0, semi);
	line = trim(line);
	if (line === "") return null;

	const parts = line.split(",").map(trim).filter((p) => p !== "");
	if (parts.length < 5) return null;

	const group = Number(parts[0]);
	const image = Number(parts[1]);
	const x = Number(parts[2]);
	const y = Number(parts[3]);
	const time = Number(parts[4]);
	if ([group, image, x, y, time].some((n) => Number.isNaN(n))) return null;

	let flipH = false;
	let flipV = false;
	if (parts[5]) {
		const f = parts[5].toUpperCase();
		if (f.includes("H")) flipH = true;
		if (f.includes("V")) flipV = true;
	}

	return { group, image, x, y, time, flipH, flipV, clsn1: [], clsn2: [] };
}

// Parses "Clsn1: 2" / "Clsn2Default: 1" style header lines.
function parseClsnHeader(line) {
	const m = line.match(/^\s*[Cc]lsn([12])(\w*)\s*:\s*(\d+)/);
	if (!m) return null;
	return { kind: "clsn" + m[1], isDefault: m[2].toLowerCase() === "default", count: Number(m[3]) };
}

// Parses "Clsn1[0] = -10, -42, 13, 1"
function parseClsnBox(line) {
	const m = line.match(/[Cc]lsn[12]\[(\d+)\]\s*=\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)/);
	if (!m) return null;
	return { idx: Number(m[1]), box: [Number(m[2]), Number(m[3]), Number(m[4]), Number(m[5])] };
}

/**
 * Parse the full contents of a .air file (already read into a string).
 * @param {string} text
 * @returns {object} actions table, as described above
 */
function parseAir(text) {
	const actions = {};
	let current = null;
	let currentNum = null;
	let currentFrames = null;
	let defaultClsn1 = [];
	let defaultClsn2 = [];
	let pendingClsn1 = null;
	let pendingClsn2 = null;
	let buildingTarget = null; // whichever table is currently receiving Clsn[n] = ... lines

	// Commits the block just finished (if any) into `actions`, once its full frame list is known -
	// deferred like this (rather than assigning into `actions` the instant "[Begin Action N]" is
	// seen) so the guard below can see the WHOLE new block before deciding whether it's allowed to
	// replace an earlier one. Some amateur/ported .air files
	// accidentally reuse an action number a second time for an unrelated one-off "invisible helper"
	// animation (a single group=-1/image=-1 frame, sometimes literally commented "Inviso_frame!" -
	// clearly meant for some other purpose, just mis-numbered by whoever authored it) - naively
	// letting last-definition-wins apply here would silently blank out a real, already-parsed
	// animation (e.g. this file's action 0 "Stand" - its real 20-frame breathing-idle loop gets
	// redefined twice more later in the file as that trivial blank stub, which without this guard
	// made the character completely invisible while standing still). A later redefinition only
	// replaces an existing non-blank entry if it ALSO has real (non-blank) content - otherwise the
	// earlier, real animation for that number is kept.
	function commitCurrent() {
		if (current === null) return;
		const existing = actions[currentNum];
		const isTrivialBlank = current.frames.length > 0 &&
			current.frames.every((f) => f.group === -1 || f.image === -1);
		const existingHasContent = existing && existing.frames.some((f) => f.group !== -1 && f.image !== -1);
		if (!(existingHasContent && isTrivialBlank)) {
			actions[currentNum] = current;
		}
	}

	const lines = text.split(/\r?\n/);

	for (const rawLine of lines) {
		const trimmed = trim(rawLine);
		if (trimmed.startsWith(";")) continue;

		const actionMatch = trimmed.match(/^\[\s*[Bb]egin\s+[Aa]ction\s+(-?\d+)\s*\]/);
		if (actionMatch) {
			commitCurrent();
			currentNum = Number(actionMatch[1]);
			current = { loopstart: 1, frames: [] };
			currentFrames = current.frames;
			defaultClsn1 = [];
			defaultClsn2 = [];
			pendingClsn1 = null;
			pendingClsn2 = null;
			buildingTarget = null;
			continue;
		}

		if (!current) continue;

		if (/^[Ll]oopstart/.test(trimmed)) {
			current.loopstart = currentFrames.length + 1;
			continue;
		}

		const header = parseClsnHeader(trimmed);
		if (header) {
			const fresh = header.count === 0 ? [] : [];
			if (header.isDefault) {
				if (header.kind === "clsn1") defaultClsn1 = fresh;
				else defaultClsn2 = fresh;
				buildingTarget = header.count > 0 ? fresh : null;
			} else {
				if (header.kind === "clsn1") pendingClsn1 = fresh;
				else pendingClsn2 = fresh;
				buildingTarget = header.count > 0 ? fresh : null;
			}
			continue;
		}

		const clsnBox = parseClsnBox(trimmed);
		if (clsnBox) {
			if (buildingTarget) buildingTarget[clsnBox.idx] = clsnBox.box;
			continue;
		}

		const frame = parseFrameLine(trimmed);
		if (frame) {
			frame.clsn1 = pendingClsn1 || defaultClsn1;
			frame.clsn2 = pendingClsn2 || defaultClsn2;
			currentFrames.push(frame);
		}
	}
	commitCurrent(); // the last block in the file never hit another "[Begin Action]" to trigger a commit

	return actions;
}

/** Convenience: fetch and parse a .air file from a URL. */
async function loadAir(path) {
	const res = await fetch(path);
	const text = await res.text();
	return parseAir(text);
}


// ===== moves.js =====
// moves.js
// Per-character move tables. Each entry maps a logical move slot (light,
// medium, heavy, special) to a MUGEN action number that already has real
// Clsn1 (hitbox) data in that character's .air file, plus Smash-style combat
// tuning for that specific move. Action numbers differ between characters
// (every MUGEN author numbers their own animations), so this indirection is
// what lets "press light attack" mean something sensible for both cast
// members instead of hard-coding one shared action id.
//
// Tuning fields:
//   action      - .air action number to play
//   damage      - percent added on hit
//   kbBase      - knockback speed (px/s) at 0% opponent damage
//   kbGrowth    - extra px/s of knockback per point of opponent percent
//   angle       - launch angle in degrees above horizontal
//   priority    - used to resolve "player pressed two attack buttons at once"
//                 and by the AI when picking a move (higher = commits harder)

// All characters removed from the roster - the game is being restarted with a blank character
// slate. The legacy 6-slot MOVESETS table below is buildSlotMoveset()'s fallback if a future
// character's moveset.json ever fails to fetch (see Character.load()); a real character normally
// ships its own full moveset.json (jab/ftilt/.../specialD) instead, which is what actually drives
// combat - this table is only ever a safety net.
const MOVESETS = {
	// No entries - add a new character's legacy 6-slot fallback here if it needs one (light/
	// medium/heavy/special/crouch/air, each { action, damage, kbBase, kbGrowth, angle, priority } -
	// see the field comments above this table). Real MUGEN-verified action numbers only, not
	// guessed from convention.
};

// Display names for the roster (used by the character-select screen). Add
// `<key>: "<Display Name>"` here for each new character (CHARACTER_NAMES' own keys are what
// ROSTER is built from below, and what Character.load() uses to find assets/characters/<key>/).
const CHARACTER_NAMES = {
	chibirobo: "Chibi-Robo",
	kirby: "Kirby",
	chuchu: "ChuChu Rocket",
};

// Source-franchise category per roster key (drawn as a readout badge on the highlighted
// character-select card, and cyclable via the category filter chip - see buildCategoryList() and
// drawSelectScreen()). Taken straight from each character's own source .zip name (e.g.
// "Nintendo_-_Kirby.zip" -> "Nintendo", "Sega_-_ChuChu_Rocket.zip" -> "Sega"). A roster key with
// no entry here just reads as "Other" everywhere a category is shown/filtered.
const CHARACTER_CATEGORY = {
	chibirobo: "Nintendo",
	kirby: "Nintendo",
	chuchu: "Sega",
};
function categoryOf(key) {
	return CHARACTER_CATEGORY[key] || "Other";
}
// "All" first, then every distinct category actually present in the roster, alphabetically -
// recomputed from CHARACTER_CATEGORY/ROSTER so a newly added character's category just shows up
// here automatically, no separate list to keep in sync by hand.
function buildCategoryList() {
	const set = new Set();
	for (const key of Object.keys(CHARACTER_NAMES)) set.add(categoryOf(key));
	return ["All", ...Array.from(set).sort()];
}

// ===== Character height clamp (per explicit design rule - see the same note in
// parse_cns.py/parse_states.py and character-mapper.html for wherever a new character's data gets
// authored) =====
// Every playable character renders close to the same, tall standing height - the band is
// deliberately narrow now:
//   CHARACTER_MIN_HEIGHT_PX (180) <= standing height <= CHARACTER_MAX_HEIGHT_PX (200)
// Nobody can ever end up shorter than 180 or taller than 200 world px (== screen px at the
// camera's default zoom=1); in practice that means most characters sit right at the 180 floor and
// only a character with genuinely tall native art renders noticeably taller, up near 200. This is
// enforced once, automatically, for every character - including any added later, with zero extra
// per-character setup required - by measureIdleSpriteHeight() +
// computeNaturalCharacterScale() below, both called from Character.load() right after that
// character's own atlas/actions/poseMap are ready. There is no per-character manual size table:
// the old SIZE_SCALE table this system originally replaced (and the wider 60-200 band a later,
// reverted pass tried) both existed at different points, but a normalized, mostly-uniform roster
// close to 200px turned out to be the actually-preferred look - this is that.
//
// The measurement: each character's own idle pose (poseMap.idle, see buildPoseMap() - action 0
// unless a moveset.json overrides it), frame 0, looked up in that character's own
// sprite_atlas_<name>.csv via its group/image, using spr_off_y as the raw "ground-to-head" standing
// height - it's each sprite's own vertical distance from its axis (feet) to the top of the art,
// independent of incidental padding in the raw pixel rect. This is native SPRITE-SHEET pixels, not
// world/screen px yet.
//
// NATURAL_HEIGHT_SCALE_UNIT converts that raw sprite-pixel measurement into a "natural" world-px
// height (naturalHeight = rawHeight * NATURAL_HEIGHT_SCALE_UNIT), which is THEN clamped into the
// [180, 200] band above - the actual draw scale used is whatever ratio makes that clamped height
// come out right (clampedHeight / rawHeight). Width scales identically for free: Atlas.draw()
// applies one uniform `scale` to both axes (see its own comment), so a taller/shorter clamp
// automatically produces a proportionally wider/narrower sprite too, no separate width math needed.
// Every FX/summon/projectile/hit-spark that already derives its own scale from `owner.scale` at
// spawn time inherits this same correction for free too (see PROJECTILE_SCALE's comment, Summon's
// constructor, and the ImpactFX call site) - nothing about them needs touching separately.
// 1.3 was tuned against the previous roster so a character with a tall raw idle measurement lands
// just under the 200 ceiling unclamped, while a character with more modest native art clamps UP to
// exactly 180 - one consistent, tall roster height, with room for a genuinely bigger character to
// still read as visibly bigger without ever breaking the 200 ceiling. Re-check this tuning once a
// new roster's own real idle measurements are known.
const CHARACTER_MIN_HEIGHT_PX = 180;
const CHARACTER_MAX_HEIGHT_PX = 200;
const NATURAL_HEIGHT_SCALE_UNIT = 1.3;
// Only used if a character's idle frame genuinely can't be measured (missing/malformed atlas
// data) - this raw value clamps straight to the CHARACTER_MIN_HEIGHT_PX floor (65 * 1.3 = 84.5,
// well under 180), so a character that fails to measure just renders at the same height as the
// rest of the roster instead of crashing or rendering at some wild, un-clamped size.
const DEFAULT_RAW_IDLE_HEIGHT = 65;

/** Raw native-sprite-pixel "ground-to-head" height of a character's own idle pose, straight off
 * its own atlas (spr_off_y of the idle action's first frame) - see the CHARACTER_MIN/MAX_HEIGHT_PX
 * comment block above for what this feeds into. Returns null if it genuinely can't be measured
 * (missing idle action, frame, or atlas entry) - computeNaturalCharacterScale() falls back to
 * DEFAULT_RAW_IDLE_HEIGHT in that case. */
function measureIdleSpriteHeight(atlas, actions, poseMap) {
	const idleAction = poseMap && poseMap.idle != null ? actions[poseMap.idle] : null;
	const frame = idleAction && idleAction.frames[0];
	const spr = frame && atlas.get(frame.group, frame.image);
	return spr && spr.offY > 0 ? spr.offY : null;
}

/** The actual draw scale for a character, given its raw idle sprite height - see the
 * CHARACTER_MIN/MAX_HEIGHT_PX comment block above for the full rule this implements. */
function computeNaturalCharacterScale(rawIdleHeightPx) {
	const raw = rawIdleHeightPx && rawIdleHeightPx > 0 ? rawIdleHeightPx : DEFAULT_RAW_IDLE_HEIGHT;
	const naturalHeight = raw * NATURAL_HEIGHT_SCALE_UNIT;
	const clampedHeight = Math.max(CHARACTER_MIN_HEIGHT_PX, Math.min(CHARACTER_MAX_HEIGHT_PX, naturalHeight));
	return clampedHeight / raw;
}

// Per-character multiplier on walk/dash ANIMATION playback speed only - never touches actual
// movement velocity, which stays the shared MOVE_SPEED/SPRINT_SPEED_MULT for every character.
// For a character whose own native .air walk/run cycle was authored at a slower relative tempo
// than this engine's fixed translation speed, the legs visibly can't keep up with how fast the
// character is actually sliding across the screen ("moonwalking") without this. Left empty
// (defaults to 1) for any character whose native timing already reads correctly.
const LOCOMOTION_ANIM_SPEED_MULT = {
	// No entries - add `<key>: <multiplier>` here if a new character's own native walk/run cycle
	// reads as too fast/slow for how quickly they actually slide across the screen at the shared
	// MOVE_SPEED (see the comment above).
};
const MOVE_SLOTS = ["special", "heavy", "medium", "light"];

// ===== Full move-list support (character-mapper.html moveset.json) =====
// character-mapper.html's slot editor (SLOT_DEFS there) authors a much richer per-character move
// list than the 18-year-old legacy 6-slot MOVESETS table above: separate jab/tilts/smashes/
// aerials/specials, each independently a melee hit, a projectile (own travel physics + optional
// dedicated sprite/frame-sheet), or a sweep (the character itself travels while the hitbox rides
// along - up/down/side dash attacks). A character gets this full list by shipping a
// `moveset.json` (that tool's "Export JSON" output) at assets/characters/<name>/moveset.json,
// fetched below in Character.load(); characters without one keep working exactly as before,
// synthesized from their MOVESETS entry via REVERSE_LEGACY_SLOT_MAP so both formats drive the
// exact same combat code from here on - nothing downstream needs to know which format a given
// character was authored in.
const FULL_ATTACK_SLOTS = [
	"jab", "ftilt", "utilt", "dtilt", "dashAttack", "crouchAttack",
	"fsmash", "usmash", "dsmash",
	"nair", "fair", "uair", "dair", "bair",
	"specialN", "specialS", "specialU", "specialD",
	"specialNAir", "specialSAir", "specialUAir", "specialDAir",
];
const REVERSE_LEGACY_SLOT_MAP = { light: "jab", medium: "ftilt", heavy: "fsmash", special: "specialN", crouch: "crouchAttack", air: "nair" };
// Pose slots (see UNIVERSAL_ACTIONS in character-mapper.html) map 1:1 onto this engine's own
// ACTION.* numbers for every built-in character by convention already - this table only matters
// for a character whose moveset.json overrides one of them with a different action number.
const POSE_SLOT_KEYS = ["idle", "crouch", "walkFwd", "walkBack", "jumpUp", "jumpFall", "guard", "hitStand", "taunt", "dizzy", "dash", "win", "lose"];

/** Builds the full slot-keyed attack moveset (jab/ftilt/.../specialD -> move data) a Character uses
 * for combat, from either a real moveset.json export (fullMoveset) or, when absent, synthesized
 * from the legacy MOVESETS table so old characters need no migration. */
function buildSlotMoveset(name, fullMoveset) {
	const out = {};
	if (fullMoveset) {
		for (const key of FULL_ATTACK_SLOTS) {
			const m = fullMoveset[key];
			if (m && !m.pose && typeof m.action === "number") out[key] = m;
		}
		return out;
	}
	const legacy = MOVESETS[name] || {};
	for (const [oldSlot, newSlot] of Object.entries(REVERSE_LEGACY_SLOT_MAP)) {
		if (legacy[oldSlot]) out[newSlot] = { ...legacy[oldSlot], type: "melee" };
	}
	return out;
}

/** Builds the pose-key -> action-number map a Character uses instead of hard-coded ACTION.*
 * constants, so a moveset.json can override e.g. which action number is this character's actual
 * walk-forward pose. Defaults to the existing ACTION.* constants (matches every built-in character). */
function buildPoseMap(actions, fullMoveset) {
	const map = {
		idle: ACTION.STAND, crouch: ACTION.CROUCH, walkFwd: ACTION.WALK_FWD, walkBack: ACTION.WALK_BACK,
		jumpUp: ACTION.JUMP_UP, jumpFall: ACTION.JUMP_FALL, guard: ACTION.GUARD_AIR, hitStand: ACTION.HIT_BACK,
			dizzy: ACTION.DIZZY,
	};
	if (fullMoveset) {
		for (const key of POSE_SLOT_KEYS) {
			const m = fullMoveset[key];
			if (m && m.pose && typeof m.action === "number" && actions[m.action]) map[key] = m.action;
		}
	}
	return map;
}


// ===== combat.js =====
// combat.js
// Small shared helpers for two-character combat: AABB overlap testing, stage boundaries, and
// this stage's set of floating-platform layouts.

/** True if two [x1,y1,x2,y2] boxes overlap. */
function boxesOverlap(a, b) {
	return a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
}

/** True if any box in listA overlaps any box in listB. */
function anyOverlap(listA, listB) {
	for (const a of listA) {
		for (const b of listB) {
			if (boxesOverlap(a, b)) return true;
		}
	}
	return false;
}

/** Box-vs-pixel-span overlap test (ENGINE_SCOPE Track A): true if any of a character's local
 * (unscaled, unflipped, anchor-relative) alpha spans - transformed into world space the same way
 * _boxesFor() transforms a real Clsn1 box (facing flip, then scale, then translate by x/y) - has
 * its row inside a box's y-range with an overlapping x-interval. One row check per span, so this
 * stays cheap even though it's testing a full silhouette instead of one rectangle. */
function spansOverlapBoxes(character, spans, boxes) {
	if (!boxes.length) return false;
	const flip = character.facing === -1;
	const scale = character.scale;
	for (const s of spans) {
		const wy = character.y + s.y * scale;
		let wx1 = s.x1 * scale;
		let wx2 = s.x2 * scale;
		if (flip) {
			const t = wx1;
			wx1 = -wx2;
			wx2 = -t;
		}
		wx1 += character.x;
		wx2 += character.x;
		// Trim the fallback (Track A) hitbox span inward on both ends before testing - this is
		// the ATTACK side only (defender's hurtboxes passed in are never touched), so it tightens
		// how close a swing actually needs to land without making the defender any harder to hit
		// with a real authored Clsn1 attack. Keeps at least a sliver of width so a very thin span
		// (a fingertip, a weapon tip) doesn't get trimmed down to nothing.
		if (wx2 - wx1 > HITBOX_REACH_TRIM * 2) {
			wx1 += HITBOX_REACH_TRIM;
			wx2 -= HITBOX_REACH_TRIM;
		}
		for (const b of boxes) {
			if (wy >= b[1] && wy <= b[3] && wx1 < b[2] && wx2 > b[0]) return true;
		}
	}
	return false;
}

// The left/right/bottom edges are no longer blast zones - character.js bounces a character back
// onto the screen off the left/right edges (see BOUNCE_RESTITUTION there), and the stage's own
// solid ground layer (y = 0) already makes the bottom edge physically unreachable in the first
// place. Only flying off the *top* of the screen is an actual KO now - see isOffStage() below.
const STAGE = {
	left: -540, // every stage is 1080 world units wide (±540) - see startMatch()'s STAGE.left/right assignment
	right: 540,
	blastAbove: -900,
	bgFloorFrac: null, // per-stage override for STAGE_BG_GROUND_FRAC below - see startMatch()'s assignment and frame()'s bg/fg/fgFront scale/position formulas
};

// Every standing jump reaches at most JUMP_VELOCITY^2 / (2 * GRAVITY) with this engine's current
// physics: 1240^2 / (2*1800) ≈ 427.1px on the way up (this was doubled again from an earlier -877
// jump velocity/~213.6px apex, see character.js's own JUMP_VELOCITY/FALL_GRAVITY_MULT comments -
// falling back down is now faster than the rise, not symmetric). This apex is the same regardless
// of what surface the jump started from (ground or a platform) - the physics only care about
// JUMP_VELOCITY/GRAVITY, not the character's current y - so it's also the max safe RISE between
// any two consecutive platform tiers, not just between the ground and the first one.
//
// Random platform layout for the "randomizePlatforms" stage entry (see STAGES) - called fresh
// from startMatch() every time a match (re)starts, so the layout lands somewhere new each play.
// Per explicit request, this builds a genuinely reachable CHAIN of height tiers rather than
// picking 3 fixed heights at random: tier 1 must be reachable from the ground in one jump, tier 2
// from tier 1, and so on, each rise kept comfortably under the ~427px apex above (see
// PLATFORM_MAX_RISE) so nobody ever has to pixel-perfect a jump to keep climbing. Tiers keep
// stacking upward until there's no longer safe room before STAGE.blastAbove (the KO zone) - so a
// stage with a taller blast zone naturally supports more/taller tiers, and this never places a
// platform the player could stand on only to immediately risk drifting into the kill zone above
// it. `count` platforms are then spread across however many tiers that produced: every tier gets
// at least one, and any platforms beyond the tier count double up as side-by-side platforms on the
// same (already-reachable) tier, rather than forcing exactly one platform per tier.
const PLATFORM_MAX_RISE = 380; // stays comfortably under the ~427px apex above, with margin for timing/horizontal drift on the way up
const PLATFORM_MIN_RISE = 150; // shortest hop between two tiers - keeps consecutive tiers from reading as basically the same height
const PLATFORM_BLAST_MARGIN = 150; // keep the highest tier at least this far below STAGE.blastAbove, so standing on the top platform never brushes the KO zone
const PLATFORM_WIDTH_MIN = 100; // narrowed from 140 when the default layout went from 4 to 6 platforms - each of 6 slots across the 1080-wide stage is only ~157px, so a too-wide platform would routinely spill well past its own slot into its neighbor's
const PLATFORM_WIDTH_MAX = 160; // narrowed from 220, same reasoning
function generateRandomPlatforms(count) {
	const margin = 70; // keep every platform fully clear of STAGE.left/right, not flush against the bounce boundary
	const usableLeft = STAGE.left + margin;
	const usableRight = STAGE.right - margin;

	// Build the reachable tier chain first - ground (y=0) is implied as the starting point but is
	// never itself a platform. Each rise is randomized between PLATFORM_MIN_RISE and whatever's
	// smaller of PLATFORM_MAX_RISE or the room actually left before the blast-margin ceiling, so
	// the climb always stays inside a single jump's reach AND never crosses into KO territory.
	const ceilingY = STAGE.blastAbove + PLATFORM_BLAST_MARGIN; // most negative (highest) a tier may go
	const tierYs = [];
	let y = 0;
	while (tierYs.length < count) {
		const maxRise = Math.min(PLATFORM_MAX_RISE, y - ceilingY);
		if (maxRise < PLATFORM_MIN_RISE) break; // out of safe vertical room - stop stacking tiers
		y -= PLATFORM_MIN_RISE + Math.random() * (maxRise - PLATFORM_MIN_RISE);
		tierYs.push(y);
	}
	if (!tierYs.length) tierYs.push(-PLATFORM_MIN_RISE); // pathologically short stage fallback - always at least one reachable tier

	// Spread `count` platforms across the tiers just built: one each first, then randomly hand out
	// whatever's left so a stage with room for e.g. 3 tiers but 6 platforms gets pairs/trios of
	// platforms side by side at some heights instead of only ever 3 platforms total.
	const perTier = tierYs.map(() => 1);
	let remaining = count - tierYs.length;
	while (remaining > 0) {
		perTier[Math.floor(Math.random() * perTier.length)]++;
		remaining--;
	}

	const platforms = [];
	tierYs.forEach((tierY, tierIndex) => {
		const n = perTier[tierIndex];
		const slotWidth = (usableRight - usableLeft) / n;
		for (let i = 0; i < n; i++) {
			const width = PLATFORM_WIDTH_MIN + Math.random() * (PLATFORM_WIDTH_MAX - PLATFORM_WIDTH_MIN);
			const slotLeft = usableLeft + i * slotWidth;
			const slotRight = slotLeft + slotWidth;
			// Clamp the random center so the platform's own width never spills past its slot's edges.
			const minCenter = Math.min(slotLeft + width / 2, slotRight - width / 2);
			const maxCenter = Math.max(slotLeft + width / 2, slotRight - width / 2);
			const center = minCenter + Math.random() * Math.max(0, maxCenter - minCenter);
			platforms.push({ x1: center - width / 2, x2: center + width / 2, y: tierY });
		}
	});
	return platforms;
}

// Real stage backgrounds. IMPORTANT CORRECTION from the first pass: these stages are NOT flat
// single-image backgrounds - like Halo, every one of them is a genuinely layered MUGEN stage
// (sky/wall/floor/building layers, dozens of entries per .def). The originally-supplied "atlas"
// export per stage had already (silently, incorrectly) collapsed each down to just one sprite,
// which is why the first version of these backgrounds looked incomplete/wrong. Fixed by writing
// a real (if scoped) SFF v1 reader + compositor (process_stage_bgs.py, not saved into the
// delivered project) that:
//   - walks each stage's raw .sff sprite table directly (bypassing the flawed pre-built atlas)
//   - composites every ACTIVE (non-commented-out) `type=normal` (static) [BG ...] layer from the
//     .def, in file order (back-to-front), honoring MASK transparency, trans=add blending, and
//     horizontal tile=1,x repeats
//   - deliberately SKIPS type=anim (crowds, cars, moths, etc. - would need per-frame .air lookups)
//     and type=parallax (extra scale math) entries - a real scope cut, not an oversight; this
//     still recovers the large structural layers (sky/floor/walls/buildings) that make up the
//     bulk of what a background actually looks like
//   - every stage is composited onto the SAME fixed 1600x720 working canvas with the stage's own
//     [StageInfo] zoffset (MUGEN's own "pixel row from the top where the floor sits") used to
//     place the floor at a fixed row 400 on that canvas - so every bg.png this produces shares
//     the exact same "floor is at y=400 of a 720-tall image" convention, which is what lets the
//     game (see the match draw loop) scale+position each one so its real floor lines up with
//     the actual gameplay ground line instead of just center-cropping and hoping - the earlier
//     version had no such alignment, which is why the floor used to land mid-screen instead of
//     near the bottom where these stages actually draw it.
// `platforms`: various heights, same one-way-platform physics as before
// (character.js) - the stage floor itself is the lowest "platform" now, so layouts only add
// genuinely elevated ones on top of it (0-6, matching stage-mapper.html's own MAX_PLATFORMS).
// `music`: a short track id (resolveMusicSrc()
// above), resolved to a real external sound/{id}.mp3 file next to this HTML - NOT embedded (the
// mp3s are 2-18MB apiece and inlining ~90MB of base64 audio into one file was the wrong
// tradeoff; images/atlases stay inlined as before since those are small). Missing/unloadable
// tracks fail silently, see playMusic().
// Down to a single authored stage per explicit request: the old rgqnzj0-ezgif MUGEN-derived
// background (and its bg.gif/bg.mp4 art) has been removed, and this is deliberately not left
// empty (an empty STAGES crashes drawStageSelectScreen(), which indexes STAGES[idx] directly) -
// instead the one entry below IS the "no background art, just the twinkle-star backdrop" default
// (`id: null` - see stageBgImages' own guard skipping null-id entries, and the match draw loop's
// `bgImg = currentStageId ? ... : null` check, which is what makes drawStars() the entire
// background whenever id is null). `platforms: []` here is just a placeholder for the stage
// select card's count text - the real layout is never read from this array. `randomizePlatforms:
// true` tells startMatch() to call generateRandomPlatforms() fresh every match instead (see both
// just below) so the 4 floating platforms land somewhere different each play. The floor itself
// (a solid, non-droppable 1080-wide ground bar) isn't stage data at all - it's drawn unconditionally
// by drawFloor() in the match draw loop whenever there's no background art, and it's physically
// non-droppable "for free": the engine's own invisible y=0 ground plane was already solid and
// un-droppable (see the "stage's own ground layer is never droppable" comment in character.js) -
// drawFloor() just finally gives that existing plane real pixels instead of leaving it invisible.
// Expected shape per entry (id/name/music/platforms, optionally worldLeft/worldRight/groundYFrac/fg/
// blastAboveY - see the stage mapper's own export, and its comment this array used to carry above
// this line): { id: "mystage", name: "My Stage", music: "mystage", platforms: [{ x1, x2, y }, ...] }
// `bgExt`: NOT part of the stage mapper's export (it has no concept of a shipped file extension -
// see its own "this stage's background is an animated GIF" comment, which only ever lands as a
// note, never a field). Added here on the engine side: an optional per-entry override for the
// bg image's file extension (defaults to "png"). Any entry with `bgExt: "gif"` loads
// assets/stages/{id}/bg.gif instead of bg.png (for the mapper/reference dimensions only - see
// stageBgImages' own comment) AND requires a converted assets/stages/{id}/bg.mp4 next to it (same
// basename) - THAT is the file actually played/drawn in-game, via stageGifLayer, a <video> element
// - drawImage() reading a playing <video>'s current frame turned out to be the only reliably
// cross-browser way to get this animating into the canvas; a plain <img> playing the .gif directly
// (an earlier version of this) never reliably kept decoding new frames in practice. See both
// stageGifLayer call sites (its load in startMatch(), its draw in the match draw loop's bg block).
const STAGES = [
	{
		id: null,
		name: "Starfield Arena",
		music: null,
		platforms: [], // display-only placeholder - see the STAGES comment above; generateRandomPlatforms() drives the real layout
		randomizePlatforms: true,
	},
];

// Fallback used whenever STAGES is empty (or a requested stageId isn't found) - a flat arena with
// no background art and no platforms, so the game stays playable with zero stages configured.
const DEFAULT_STAGE = { id: null, name: "Default Arena", music: null, platforms: [] };

function randomStage() {
	if (STAGES.length === 0) return DEFAULT_STAGE;
	return STAGES[Math.floor(Math.random() * STAGES.length)];
}

/** True only when a character has flown off the top of the screen - the only way to lose a stock now. */
function isOffStage(character) {
	return character.y < STAGE.blastAbove;
}

// ===== breakout.js =====
// A grid of destructible "breakout/pong" blocks that spans the FULL width of the current stage's
// play area and sits directly above the real stage art's own top edge - in the same black,
// starfield-filled space that "extends the camera vertically above the stage" (see drawStars()'s
// own comment on that rule) - as a SOLID barrier between normal jump height and the real top blast
// zone (STAGE.blastAbove). See the match draw loop (drawn right where the floating platforms are,
// so it layers above the background/foreground art exactly like they do, and inside the same
// camera ctx.scale(camZoom) transform, so it pans/zooms with everything else automatically) and
// checkBlockCollisions() in main.js. The wall is solid to EVERY character, always - a normal jump,
// a recovery move, anything - not just one currently in the fast/hitstun "pinball" state
// (isBouncing() in main.js); otherwise a character could simply climb/float past the grid's own
// height and reach the kill zone without ever actually going through a block, which would defeat
// the entire point of it being a barrier. Only whether a given hit actually BREAKS the block it
// hits is gated on isBreakingSpeed() - a fast-enough-and-still-hitstun character cracks it open (one hit
// each, no HP) on contact; anything slower just bounces off it intact, same as hitting a wall.

 * size itself) never changes, but the column COUNT is solved for that exact width, and the small
 * gap between columns is then back-solved so however many columns that takes tile the width with

 * block stack lifted just far enough that the column's lowest block still clears

 * platform always leaves real headroom under the wall above, never a block sitting right on top
 * of a player's head. The lift is computed once here (a fixed per-column offset baked into each
 * block, added on top of the normal row math in getBlockY()) against blockGridBottomY's value AT

 * stage whose background image hasn't finished loading yet (see blockGridBottomY's own comment);
 * for the current no-background default stage that value never changes again anyway. Omitting
 * `platforms` (or passing none) just skips this entirely - every column lift stays 0, identical to
 * the grid's previous unconditional-uniform-rows behavior. */
function buildBlockGrid(platforms) {

	// half of STAGE.right - STAGE.left, exposing a sliver of open background on each side, right at
	// the wall's own height, with no block there to cover it - the "small amount of empty space on
	// each side" a zoomed-out camera could reveal. Padding the grid out to at least that full
	// possible half-view on both sides guarantees the wall always reaches wherever the camera can
	// ever actually show, regardless of how much (or little) wider than the stage's own play width
	// that turns out to be. Characters themselves can never reach past STAGE.left/right anyway (see
	// the x-bounce clamp in Character.update()), so the extra columns this can add are purely
	// covering background, never new reachable collision surface.
	const halfViewAtMinZoom = GAME_W / 2 / CAMERA_ZOOM_MIN;
	const sideMargin = Math.max(0, halfViewAtMinZoom - (STAGE.right - STAGE.left) / 2);

	// the same lift, which is what keeps that column's own internal row spacing intact and just
	// shifts the whole stack higher, rather than carving individual holes out of the middle of it.
	const colLift = new Array(cols).fill(0);

		for (let col = 0; col < cols; col++) {

			const colX2 = colX1 + BLOCK_W;
			let lift = 0;
			for (const p of platforms) {
				if (colX2 <= p.x1 || colX1 >= p.x2) continue; // no x-overlap with this platform
				const clearY = p.y - BLOCK_PLATFORM_CLEARANCE; // world y the column's bottom edge must sit AT OR ABOVE (more negative)
				const neededLift = blockGridBottomY - clearY; // positive when the grid's natural (row 0) bottom currently sits too low relative to that line
				if (neededLift > lift) lift = neededLift;
			}
			colLift[col] = Math.max(0, lift);
		}
	}
	const grid = [];
	for (let row = 0; row < BLOCK_ROWS; row++) {
		for (let col = 0; col < cols; col++) {
			grid.push({
				x: gridLeft + col * (BLOCK_W + appliedGap),
				row,
				w: BLOCK_W,
				h: BLOCK_H,
				alive: true,
				respawnTimer: 0,
				colorIndex: (row + col) % BLOCK_PALETTE.length,
				platformLift: colLift[col],
			});
		}
	}
	return grid;
}

// ===== command_buffer.js =====
// command_buffer.js
// Lightweight motion-input recognizer for "combo" specials (see moveset.json's `commandMoves`)
// - watches a short rolling history of held-direction
// changes plus attack-button presses and matches simple quarter-circle motions, faithful to real
// MUGEN .cmd commands ("~D, DF, F, x+y" etc.) but remapped onto this engine's 4-tier
// light/medium/heavy/special buttons instead of MUGEN's 6-button x/y/z/a/b/c layout. Fed from the
// exact same {left,right,up,down,light,medium,heavy,special} shape Character.update() already
// reads every frame, so it works identically whether that input came from the keyboard or the new
// Xbox 360 gamepad support (see gamepad.js) - no separate code path per input device.
const COMMAND_BUFFER_WINDOW = 0.5; // seconds of history kept
const COMMAND_BUTTON_GRACE = 0.18; // seconds after the qualifying motion the trigger button still counts
class CommandBuffer {
	constructor() {
		this.history = []; // { t, dir } - one entry per direction *change*, not per held frame
		this.buttons = []; // { t, button } - one entry per attack-button rising edge
		this.lastDir = null;
		this.prevButtons = { light: false, medium: false, heavy: false, special: false };
	}

	/** Call once per frame with the current input state and the character's facing (so "forward"
	 * always means toward-facing regardless of which screen side this character is on). */
	update(t, input, facing) {
		const fwdHeld = facing === 1 ? input.right : input.left;
		const backHeld = facing === 1 ? input.left : input.right;
		let dir = null;
		if (input.down && fwdHeld) dir = "DF";
		else if (input.down && backHeld) dir = "DB";
		else if (input.down) dir = "D";
		else if (fwdHeld) dir = "F";
		else if (backHeld) dir = "B";

		if (dir && dir !== this.lastDir) {
			this.history.push({ t, dir });
			if (this.history.length > 12) this.history.shift();
		}
		this.lastDir = dir;

		for (const key of ["light", "medium", "heavy", "special"]) {
			const held = Boolean(input[key]);
			if (held && !this.prevButtons[key]) {
				this.buttons.push({ t, button: key });
				if (this.buttons.length > 6) this.buttons.shift();
			}
			this.prevButtons[key] = held;
		}

		const cutoff = t - COMMAND_BUFFER_WINDOW;
		while (this.history.length && this.history[0].t < cutoff) this.history.shift();
		while (this.buttons.length && this.buttons[0].t < cutoff) this.buttons.shift();
	}

	/** Returns the matched move's `key` (see moveset.json's commandMoves.moves[].key), or null.
	 * Only ever fires on the frame its trigger button was just pressed, so it can never retroactively
	 * steal a button press a normal attack already resolved a frame earlier. */
	match(defs, t) {
		if (!defs || !defs.length || !this.buttons.length) return null;
		const lastButton = this.buttons[this.buttons.length - 1];
		if (t - lastButton.t > COMMAND_BUTTON_GRACE) return null;
		for (const def of defs) {
			const spec = def.command;
			if (!spec || spec.button !== lastButton.button) continue;
			if (this._matchesMotion(spec.motion, lastButton.t)) return def.key;
		}
		return null;
	}

	_matchesMotion(motion, beforeT) {
		const seq = motion === "qcf" ? ["D", "DF", "F"] : motion === "qcb" ? ["D", "DB", "B"] : null;
		if (!seq) return false;
		let seqIdx = seq.length - 1;
		for (let i = this.history.length - 1; i >= 0 && seqIdx >= 0; i--) {
			if (this.history[i].t > beforeT) continue;
			if (this.history[i].dir === seq[seqIdx]) seqIdx--;
		}
		return seqIdx < 0;
	}
}
