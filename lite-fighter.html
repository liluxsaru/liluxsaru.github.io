// ===================== Title screen =====================

// ===================== Retro VHS look =====================
// A shared post-process pass (scanlines + film grain + vignette + slight warm tint) drawn on
// top of every screen so the whole game reads as one consistent retro presentation - dialed back
// from an earlier, heavier pass that read as noisy/messy, especially over UI text on the select
// screen. Scanlines can be turned off entirely per-call (see `scanlines` option) for screens that
// need to stay crisp and readable; everything else (grain/tint/vignette) stays uniformly light.

const grainTiles = (() => {
	const tiles = [];
	for (let t = 0; t < 4; t++) {
		const c = document.createElement("canvas");
		c.width = 96;
		c.height = 96;
		const gctx = c.getContext("2d");
		const img = gctx.createImageData(96, 96);
		for (let i = 0; i < img.data.length; i += 4) {
			const v = Math.random() * 255;
			img.data[i] = v;
			img.data[i + 1] = v;
			img.data[i + 2] = v;
			img.data[i + 3] = Math.random() * 16; // was 30 - noticeably grittier than intended
		}
		gctx.putImageData(img, 0, 0);
		tiles.push(c);
	}
	return tiles;
})();

function applyRetroFX(time, intensity = 1, { scanlines = true } = {}) {
	ctx.save();

	// Scanlines - thinner and more widely spaced than before, and fully skippable.
	if (scanlines) {
		ctx.globalAlpha = 0.07 * intensity;
		ctx.fillStyle = "#000000";
		for (let y = 0; y < canvas.height; y += 4) {
			ctx.fillRect(0, y, canvas.width, 1);
		}
	}

	// Film grain - flickers between a handful of precomputed noise tiles rather than
	// regenerating full-resolution random pixels every frame (expensive for little gain).
	ctx.globalAlpha = 0.28 * intensity;
	const tile = grainTiles[Math.floor(time / 50) % grainTiles.length];
	const pattern = ctx.createPattern(tile, "repeat");
	ctx.fillStyle = pattern;
	ctx.fillRect(0, 0, canvas.width, canvas.height);

	// Warm/green VHS tint
	ctx.globalAlpha = 0.04 * intensity;
	ctx.globalCompositeOperation = "multiply";
	ctx.fillStyle = "#bfe8c8";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	ctx.globalCompositeOperation = "source-over";

	// Vignette - softer and pushed further out than before so it frames the screen without
	// darkening the readable center.
	const grad = ctx.createRadialGradient(
		canvas.width / 2, canvas.height / 2, canvas.height * 0.45,
		canvas.width / 2, canvas.height / 2, canvas.height * 0.85
	);
	grad.addColorStop(0, "rgba(0,0,0,0)");
	grad.addColorStop(1, `rgba(0,0,0,${0.32 * intensity})`);
	ctx.globalAlpha = 1;
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, canvas.width, canvas.height);

	ctx.restore();
}

// ===================== Starfield =====================

let stars = [];
function ensureStars() {
	const target = Math.floor((canvas.width * canvas.height) / 9000);
	if (stars.length === target) return;
	stars = [];
	for (let i = 0; i < target; i++) {
		stars.push({
			x: Math.random(),
			y: Math.random(),
			size: 1 + Math.random() * 1.8,
			phase: Math.random() * Math.PI * 2,
			speed: 1.5 + Math.random() * 2.5,
		});
	}
}
function drawStars(time) {
	ensureStars();
	ctx.save();
	for (const s of stars) {
		const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(time / 500 * s.speed + s.phase));
		ctx.globalAlpha = twinkle;
		ctx.fillStyle = "#ffffff";
		const x = s.x * canvas.width;
		const y = s.y * canvas.height;
		const sz = s.size;
		ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
		if (twinkle > 0.85) {
			// occasional cross-shaped sparkle on the brightest twinkle frames
			ctx.fillRect(x - sz * 1.6, y - 0.5, sz * 3.2, 1);
			ctx.fillRect(x - 0.5, y - sz * 1.6, 1, sz * 3.2);
		}
	}
	ctx.restore();
}

const IS_TOUCH = "ontouchstart" in window || navigator.maxTouchPoints > 0;

function drawTitleCustom(dx, dy, dw, dh) {
	if (!titleCustomImg.complete || titleCustomImg.naturalWidth === 0) return false;
	ctx.imageSmoothingEnabled = false; // plain cover-fit, matches the "no upscaling experiment" look everywhere else
	ctx.drawImage(titleCustomImg, 0, 0, TITLE_CUSTOM_SIZE.w, TITLE_CUSTOM_SIZE.h, dx, dy, dw, dh);
	return true;
}

// Datamosh-style glitch: every GLITCH_PERIOD_MS the title art gets briefly torn into horizontal
// bands that jump sideways, plus a quick red/cyan color flash, then settles back to normal - a
// short, self-contained post-process pass over whatever's already been drawn to the canvas (no
// separate buffer needed since it's just re-blitting slices of the canvas onto itself). Runs on
// a plain time-based cycle so it repeats automatically for as long as the title screen is up.
const GLITCH_PERIOD_MS = 10000;
const GLITCH_DURATION_MS = 450;
function applyTitleDatamoshGlitch(t, dx, dy, dw, dh) {
	const cyclePos = t % GLITCH_PERIOD_MS;
	if (cyclePos >= GLITCH_DURATION_MS) return;
	// Ramps up then back down across the glitch window (0 -> 1 -> 0) instead of an abrupt on/off,
	// so it reads as a glitch "hit" rather than a hard flicker cut.
	const intensity = Math.sin((cyclePos / GLITCH_DURATION_MS) * Math.PI);

	const bandCount = 14;
	const bandH = Math.ceil(dh / bandCount);
	for (let i = 0; i < bandCount; i++) {
		if (Math.random() > 0.5) continue; // not every band tears on every frame
		const y = dy + i * bandH;
		const h = Math.min(bandH, dy + dh - y);
		if (h <= 0) continue;
		const maxShift = 44 * intensity;
		const shiftX = (Math.random() * 2 - 1) * maxShift;
		ctx.drawImage(canvas, dx, y, dw, h, dx + shiftX, y, dw, h);
	}

	// Quick chromatic-aberration-style color flash on top of the torn bands.
	ctx.save();
	ctx.globalAlpha = 0.16 * intensity;
	ctx.globalCompositeOperation = "lighter";
	ctx.fillStyle = "#ff2050";
	ctx.fillRect(dx - 5 * intensity, dy, dw, dh);
	ctx.fillStyle = "#20d0ff";
	ctx.fillRect(dx + 5 * intensity, dy, dw, dh);
	ctx.restore();
}

function drawTitleScreen(t) {
	ctx.fillStyle = "#000000";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	drawStars(t);

	// Stretched to exactly fill the canvas - no cropping, no letterbox bars, at the cost of a
	// mild (non-uniform) stretch since the source art's own aspect ratio isn't 16:9. Previously
	// this was cover-fit + cropped, which was cutting off meaningful parts of the art at the top
	// and bottom on a 1280x720 canvas.
	const dw = canvas.width;
	const dh = canvas.height;
	const dx = 0;
	const dy = 0;
	const ok = drawTitleCustom(dx, dy, dw, dh);

	if (ok) {
		// Decorative scrolling light streaks along both edges - unchanged from before.
		const avgScale = (dw / TITLE_CUSTOM_SIZE.w + dh / TITLE_CUSTOM_SIZE.h) / 2;
		const stripW = SYS.titleStrip.w * avgScale;
		const stripH = SYS.titleStrip.h * avgScale;
		const scroll = (t / 12) % stripH;
		ctx.save();
		ctx.globalAlpha = 0.55;
		ctx.globalCompositeOperation = "lighter";
		for (const sx of [dx + dw * 0.03, dx + dw * 0.97 - stripW]) {
			for (let y = dy - stripH + scroll; y < dy + dh; y += stripH) {
				drawSys("titleStrip", sx, y, stripW, stripH);
			}
		}
		ctx.restore();

		// Periodic datamosh glitch over the art+streaks, then it settles back to normal on its own.
		applyTitleDatamoshGlitch(t, dx, dy, dw, dh);
	} else {
		// Art not loaded yet - simple placeholder so the screen isn't blank.
		ctx.textAlign = "center";
		ctx.fillStyle = "#ffffff";
		ctx.font = "bold 32px 'All Around The World', monospace";
		ctx.fillText("LITE FIGHTER", canvas.width / 2, canvas.height / 2);
	}

	ctx.fillStyle = "rgba(0,0,0,0.55)";
	ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
	ctx.textAlign = "center";
	ctx.font = "bold 18px 'All Around The World', monospace";
	ctx.fillStyle = Math.sin(t / 300) > 0 ? "#ffffff" : "#888888";
	ctx.fillText(IS_TOUCH ? "TAP TO START" : "PRESS ANY KEY TO START", canvas.width / 2, canvas.height - 24);

	applyRetroFX(t, 0.85, { scanlines: false });
}

function runTitleScreen(onDone) {
	let done = false;
	function start() {
		if (done) return;
		done = true;
		window.removeEventListener("keydown", start);
		canvas.removeEventListener("pointerdown", start);
		onDone();
	}
	window.addEventListener("keydown", start);
	canvas.addEventListener("pointerdown", start);
	function loop(t) {
		if (done) return;
		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(loop);
			return;
		}
		drawTitleScreen(t);
		requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
}

// ===================== Character select =====================
// select = { p1: rosterIndex, p2: rosterIndex, active: "p1" | "p2" }. Whichever slot is
// "active" is the one the big carousel currently shows/edits - keyboard (A/D for P1,
// arrow keys for P2) and pointer input (tapping a tab, or swiping/tapping the carousel while
// that tab is active) both just drive select.p1/select.p2/select.active directly, so there's
// a single source of truth regardless of input method. No ready/confirm gating anymore: AI vs
// AI is a fully valid, always-startable default, so FIGHT is available immediately.

// Hit-test rects for the current frame's layout, refreshed every draw call and read back by the
// pointer handlers in runSelectScreen() - simplest way to keep hit-testing in sync with a layout
// that reflows per screen size without duplicating the layout math in two places.
let selectHitRects = {};

function drawPlayerTab(x, y, w, h, label, isAI, charName, color, isActive, s) {
	roundRectPath(x, y, w, h, 8 * s);
	ctx.fillStyle = isActive ? "#242838" : "#171a24";
	ctx.fill();
	ctx.strokeStyle = isActive ? color : "#33384a";
	ctx.lineWidth = isActive ? 2 : 1;
	ctx.stroke();

	ctx.textAlign = "left";
	ctx.fillStyle = color;
	ctx.font = `bold ${Math.max(10, 13 * s)}px 'All Around The World', monospace`;
	ctx.fillText(label, x + 14 * s, y + 21 * s);
	ctx.fillStyle = "#ffffff";
	ctx.font = `${Math.max(9, 12 * s)}px 'All Around The World', monospace`;
	ctx.fillText(charName, x + 14 * s, y + h - 13 * s);

	const chipW = Math.max(50, 68 * s), chipH = Math.max(22, 24 * s);
	const chipX = x + w - chipW - 10 * s, chipY = y + h / 2 - chipH / 2;
	roundRectPath(chipX, chipY, chipW, chipH, chipH / 2);
	ctx.fillStyle = isAI ? "#33384a" : color;
	ctx.fill();
	ctx.fillStyle = isAI ? "#bbbbbb" : "#0b0c10";
	ctx.font = `bold ${Math.max(9, 11 * s)}px 'All Around The World', monospace`;
	ctx.textAlign = "center";
	ctx.fillText(isAI ? "AI" : "HUMAN", chipX + chipW / 2, chipY + chipH / 2 + 4 * s);
	ctx.textAlign = "left";

	return { tab: { x, y, w, h }, chip: { x: chipX, y: chipY, w: chipW, h: chipH } };
}

function drawPortraitCard(cx, topY, w, h, key, color, alpha, highlighted, portraitScaleMul, s) {
	ctx.save();
	ctx.globalAlpha = alpha;
	roundRectPath(cx - w / 2, topY, w, h, 10 * s);
	ctx.fillStyle = "#14151c";
	ctx.fill();
	if (highlighted) {
		ctx.shadowColor = color;
		ctx.shadowBlur = 16;
	}
	ctx.strokeStyle = highlighted ? color : "#33384a";
	ctx.lineWidth = highlighted ? 3 : 1;
	roundRectPath(cx - w / 2, topY, w, h, 10 * s);
	ctx.stroke();
	ctx.shadowBlur = 0;
	// Clip to the card so a tall character (see PORTRAIT_SCALE_UNIT notes) never draws outside
	// its own rounded rect into a neighboring card or the tabs above.
	roundRectPath(cx - w / 2, topY, w, h, 10 * s);
	ctx.clip();
	drawPortrait(key, cx, topY, w, h, topY + h - 8 * s, portraitScaleMul);
	ctx.restore();

	if (highlighted) {
		ctx.textAlign = "center";
		ctx.fillStyle = "#ffffff";
		ctx.font = `bold ${Math.max(11, 16 * s)}px 'All Around The World', monospace`;
		ctx.fillText(CHARACTER_NAMES[key], cx, topY + h + 22 * s);
	}
}

// Baseline "designed at" viewport - the whole screen scales down uniformly from this by however
// much smaller the real canvas is, so every element (fonts, cards, gaps, buttons) shrinks
// together and stays non-overlapping instead of any one piece independently overflowing.
const SELECT_BASELINE_W = 760;
const SELECT_BASELINE_H = 600;

function drawSelectScreen(select) {
	const time = performance.now();
	// Single continuous scale factor instead of one hard breakpoint - fits any aspect ratio
	// (including short mobile-landscape viewports) instead of just "wide desktop" vs "narrow
	// phone". Floor of 0.62 keeps tap targets usable even on very small/cramped screens.
	const s = Math.max(0.62, Math.min(1, canvas.width / SELECT_BASELINE_W, canvas.height / SELECT_BASELINE_H));
	const compact = s < 0.8; // swap to shorter copy at small sizes rather than shrinking text past readable
	const rects = {};

	ctx.fillStyle = "#0b0c10";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	drawStars(time);

	let y = 14 * s;
	const titleSize = Math.max(15, 26 * s);
	ctx.textAlign = "center";
	ctx.fillStyle = "#ffffff";
	ctx.font = `bold ${titleSize}px 'All Around The World', monospace`;
	ctx.fillText("CHARACTER SELECT", canvas.width / 2, y + titleSize);
	y += titleSize + 8 * s;

	const subSize = Math.max(8, 11 * s);
	ctx.font = `${subSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#00ff00";
	ctx.fillText(
		compact
			? (IS_TOUCH ? "Tap a tab, swipe to browse, tap FIGHT" : "A/D or \u2190/\u2192 browse \u2022 ENTER to fight")
			: IS_TOUCH
			? "Tap a tab to choose who's playing \u2022 swipe or tap the arrows to browse \u2022 tap FIGHT to begin"
			: "A/D or \u2190/\u2192 to browse \u2022 tap a tab, or press 1/2, to toggle AI/HUMAN \u2022 ENTER to fight",
		canvas.width / 2,
		y + subSize
	);
	y += subSize + 12 * s;

	// --- P1 / P2 tabs ---
	const tabH = Math.max(38, 46 * s);
	const tabGap = 12 * s;
	const tabW = Math.min(320 * s, (canvas.width - 40 - tabGap) / 2);
	const tabY = y;
	const tabsStartX = (canvas.width - (tabW * 2 + tabGap)) / 2;
	const p1TabHit = drawPlayerTab(tabsStartX, tabY, tabW, tabH, "PLAYER 1", p1IsAI, CHARACTER_NAMES[ROSTER[select.p1]], "#5dd0ff", select.active === "p1", s);
	const p2TabHit = drawPlayerTab(tabsStartX + tabW + tabGap, tabY, tabW, tabH, "PLAYER 2", p2IsAI, CHARACTER_NAMES[ROSTER[select.p2]], "#ff9d5d", select.active === "p2", s);
	rects.p1Tab = p1TabHit.tab;
	rects.p1Chip = p1TabHit.chip;
	rects.p2Tab = p2TabHit.tab;
	rects.p2Chip = p2TabHit.chip;
	y = tabY + tabH + 20 * s;

	// --- Carousel for whichever slot is active ---
	const activeColor = select.active === "p1" ? "#5dd0ff" : "#ff9d5d";
	const activeIdx = select[select.active];
	// Sized much bigger than the old 150x180 - there was a large unused vertical gap between the
	// carousel and the difficulty chip/FIGHT button at every screen size (FIGHT is bottom-anchored
	// to the real canvas height, so that gap just sat empty). Roughly 2x on both axes; checked the
	// side-card + chevron-arrow horizontal spread still leaves a healthy margin on both edges, and
	// the difficulty chip still lands well above the FIGHT button with room to spare.
	const cardW = 300 * s;
	const cardH = 360 * s;
	const sideScale = 0.62;
	const gap = 24 * s;
	const carouselCenterY = y;
	const cx = canvas.width / 2;
	const portraitScaleMul = PORTRAIT_SCALE_UNIT * s;

	const prevIdx = (activeIdx - 1 + ROSTER.length) % ROSTER.length;
	const nextIdx = (activeIdx + 1) % ROSTER.length;
	const sideW = cardW * sideScale, sideH = cardH * sideScale;
	const sideTopY = carouselCenterY + (cardH - sideH) / 2;
	const prevCx = cx - cardW / 2 - gap - sideW / 2;
	const nextCx = cx + cardW / 2 + gap + sideW / 2;

	drawPortraitCard(prevCx, sideTopY, sideW, sideH, ROSTER[prevIdx], "#555566", 0.5, false, portraitScaleMul * sideScale, s);
	drawPortraitCard(nextCx, sideTopY, sideW, sideH, ROSTER[nextIdx], "#555566", 0.5, false, portraitScaleMul * sideScale, s);
	drawPortraitCard(cx, carouselCenterY, cardW, cardH, ROSTER[activeIdx], activeColor, 1, true, portraitScaleMul, s);

	rects.prevCard = { x: prevCx - sideW / 2, y: sideTopY, w: sideW, h: sideH };
	rects.nextCard = { x: nextCx - sideW / 2, y: sideTopY, w: sideW, h: sideH };
	rects.carouselZone = { x: cx - cardW / 2 - gap - sideW, y: carouselCenterY, w: (cardW / 2 + gap + sideW) * 2, h: cardH };

	// Chevron arrows, drawn just outside the side cards - also tappable/clickable.
	const arrowY = carouselCenterY + cardH / 2;
	const arrowSize = Math.max(18, 30 * s);
	ctx.textAlign = "center";
	ctx.font = `bold ${arrowSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#5dd0ff88";
	const leftArrowX = prevCx - sideW / 2 - Math.max(16, 26 * s);
	const rightArrowX = nextCx + sideW / 2 + Math.max(16, 26 * s);
	ctx.fillText("\u25C0", leftArrowX, arrowY + arrowSize / 3);
	ctx.fillText("\u25B6", rightArrowX, arrowY + arrowSize / 3);
	rects.leftArrow = { x: leftArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };
	rects.rightArrow = { x: rightArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };

	// The highlighted card's name label is drawn below the card itself (see drawPortraitCard,
	// at cardBottom + 22*s, using this same font size) - budget for its own height here too
	// before placing the difficulty chip, otherwise the chip and the name text sit at the exact
	// same y and overlap.
	const nameLabelFont = Math.max(11, 16 * s);
	y = carouselCenterY + cardH + 22 * s + nameLabelFont + 14 * s;

	// --- Difficulty chip (affects both AI slots) ---
	const diffLabel = `DIFFICULTY: ${difficultyOrder[difficultyIndex].toUpperCase()}`;
	const diffFont = Math.max(9, 12 * s);
	ctx.font = `bold ${diffFont}px 'All Around The World', monospace`;
	const diffW = ctx.measureText(diffLabel).width + 26 * s;
	const diffH = Math.max(20, 26 * s);
	const diffX = cx - diffW / 2;
	const diffY = y;
	roundRectPath(diffX, diffY, diffW, diffH, diffH / 2);
	ctx.fillStyle = "#1a1d28";
	ctx.fill();
	ctx.strokeStyle = "#444a5e";
	ctx.lineWidth = 1;
	ctx.stroke();
	ctx.fillStyle = "#ffd75d";
	ctx.textAlign = "center";
	ctx.fillText(diffLabel, cx, diffY + diffH / 2 + 4 * s);
	rects.diffChip = { x: diffX, y: diffY, w: diffW, h: diffH };

	// --- FIGHT button - bottom-anchored to the real canvas height (not the scaled baseline), so
	// it always sits a comfortable fixed distance from the true bottom edge regardless of how
	// much empty space is left below the (scaled) content above. ---
	const fightW = Math.max(150, 240 * s);
	const fightH = Math.max(40, 52 * s);
	const fightY = canvas.height - fightH - Math.max(16, 26 * s);
	const fightX = cx - fightW / 2;
	const pulse = 0.5 + 0.5 * Math.sin(time / 260);
	ctx.save();
	roundRectPath(fightX, fightY, fightW, fightH, fightH / 2);
	ctx.fillStyle = "#2f9fd8";
	ctx.fill();
	ctx.shadowColor = "#5dd0ff";
	ctx.shadowBlur = 10 + pulse * 10;
	ctx.strokeStyle = "#5dd0ff";
	ctx.lineWidth = 2;
	roundRectPath(fightX, fightY, fightW, fightH, fightH / 2);
	ctx.stroke();
	ctx.restore();
	ctx.fillStyle = "#0b0c10";
	ctx.font = `bold ${Math.max(14, 20 * s)}px 'All Around The World', monospace`;
	ctx.textAlign = "center";
	ctx.fillText("FIGHT", cx, fightY + fightH / 2 + 7 * s);
	rects.fightButton = { x: fightX, y: fightY, w: fightW, h: fightH };

	if (!compact) {
		ctx.font = `${Math.max(9, 11 * s)}px 'All Around The World', monospace`;
		ctx.fillStyle = "#666666";
		ctx.fillText(IS_TOUCH ? "or tap here" : "or press ENTER", cx, fightY - 8 * s);
	}

	selectHitRects = rects;
	applyRetroFX(time, 0.7, { scanlines: false });
}

function pointInRect(px, py, r) {
	return r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function runSelectScreen(onReady) {
	for (const k of Object.keys(keys)) keys[k] = false;
	const select = { p1: 0, p2: Math.min(1, ROSTER.length - 1), active: "p1" };
	let started = false;

	function cycle(slot, dir) {
		select[slot] = (select[slot] + dir + ROSTER.length) % ROSTER.length;
		select.active = slot;
	}
	function startFight() {
		if (started) return;
		started = true;
		selectKeyHandlerFn = null;
		canvas.removeEventListener("pointerdown", onPointerDown);
		canvas.removeEventListener("pointerup", onPointerUp);
		onReady(ROSTER[select.p1], ROSTER[select.p2]);
	}

	selectKeyHandlerFn = (k) => {
		if (started) return;
		if (k === "a") cycle("p1", -1);
		else if (k === "d") cycle("p1", 1);
		else if (k === "arrowleft") cycle("p2", -1);
		else if (k === "arrowright") cycle("p2", 1);
		else if (k === "enter" || k === " ") startFight();
		// "1"/"2" already toggle p1IsAI/p2IsAI globally (see the module-level keydown handler) -
		// reused as-is here rather than duplicated, so it behaves identically in and out of a match.
	};

	// Pointer input (mouse click and touch tap/swipe both go through Pointer Events) - added/
	// removed locally to this screen, same pattern runTitleScreen uses for its own listener.
	let dragStart = null;
	function onPointerDown(e) {
		const p = toGameCoords(e);
		dragStart = { x: p.x, y: p.y, t: performance.now() };
	}
	function onPointerUp(e) {
		if (started || !dragStart) return;
		const p = toGameCoords(e);
		const dx = p.x - dragStart.x;
		const dy = p.y - dragStart.y;
		dragStart = null;

		const SWIPE_DIST = 40;
		if (Math.abs(dx) > SWIPE_DIST && Math.abs(dx) > Math.abs(dy) * 1.5) {
			cycle(select.active, dx < 0 ? 1 : -1);
			return;
		}

		const px = p.x, py = p.y;
		const r = selectHitRects;
		if (pointInRect(px, py, r.p1Chip)) p1IsAI = !p1IsAI;
		else if (pointInRect(px, py, r.p2Chip)) p2IsAI = !p2IsAI;
		else if (pointInRect(px, py, r.p1Tab)) select.active = "p1";
		else if (pointInRect(px, py, r.p2Tab)) select.active = "p2";
		else if (pointInRect(px, py, r.leftArrow) || pointInRect(px, py, r.prevCard)) cycle(select.active, -1);
		else if (pointInRect(px, py, r.rightArrow) || pointInRect(px, py, r.nextCard)) cycle(select.active, 1);
		else if (pointInRect(px, py, r.diffChip)) difficultyIndex = (difficultyIndex + 1) % difficultyOrder.length;
		else if (pointInRect(px, py, r.fightButton)) startFight();
	}
	canvas.addEventListener("pointerdown", onPointerDown);
	canvas.addEventListener("pointerup", onPointerUp);

	function loop() {
		if (started) return;
		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(loop);
			return;
		}
		drawSelectScreen(select);
		requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
}

// ===================== Stage select =====================
let stageSelectHitRects = {};

function drawStageSelectScreen(idx) {
	const time = performance.now();
	const s = Math.max(0.62, Math.min(1, canvas.width / SELECT_BASELINE_W, canvas.height / SELECT_BASELINE_H));
	const compact = s < 0.8;
	const rects = {};

	ctx.fillStyle = "#0b0c10";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	drawStars(time);

	let y = 14 * s;
	const titleSize = Math.max(15, 26 * s);
	ctx.textAlign = "center";
	ctx.fillStyle = "#ffffff";
	ctx.font = `bold ${titleSize}px 'All Around The World', monospace`;
	ctx.fillText("STAGE SELECT", canvas.width / 2, y + titleSize);
	y += titleSize + 8 * s;

	const subSize = Math.max(8, 11 * s);
	ctx.font = `${subSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#00ff00";
	ctx.fillText(
		compact
			? (IS_TOUCH ? "Tap a stage, or RANDOM, tap FIGHT" : "A/D or \u2190/\u2192 browse \u2022 ENTER to fight")
			: IS_TOUCH
			? "Swipe or tap the arrows to browse \u2022 tap RANDOM to pick for you \u2022 tap FIGHT to begin"
			: "A/D or \u2190/\u2192 to browse \u2022 R for random \u2022 ENTER to fight \u2022 ESC to go back",
		canvas.width / 2,
		y + subSize
	);
	y += subSize + 16 * s;

	const cardW = Math.min(560 * s, canvas.width - 80 * s);
	const cardH = cardW * (9 / 16);
	const cx = canvas.width / 2;
	const cardTopY = y;

	roundRectPath(cx - cardW / 2, cardTopY, cardW, cardH, 10 * s);
	ctx.save();
	ctx.clip();
	const bg = stageBgImages[STAGES[idx].id];
	if (bg && bg.complete && bg.naturalWidth > 0) {
		const boxAspect = cardW / cardH;
		const imgAspect = bg.naturalWidth / bg.naturalHeight;
		let dw, dh;
		if (imgAspect > boxAspect) {
			dh = cardH;
			dw = cardH * imgAspect;
		} else {
			dw = cardW;
			dh = cardW / imgAspect;
		}
		ctx.drawImage(bg, cx - dw / 2, cardTopY + cardH / 2 - dh / 2, dw, dh);
	} else {
		ctx.fillStyle = "#1a1d28";
		ctx.fillRect(cx - cardW / 2, cardTopY, cardW, cardH);
	}
	ctx.restore();
	ctx.strokeStyle = "#5dd0ff";
	ctx.lineWidth = 2;
	roundRectPath(cx - cardW / 2, cardTopY, cardW, cardH, 10 * s);
	ctx.stroke();
	rects.card = { x: cx - cardW / 2, y: cardTopY, w: cardW, h: cardH };

	// Chevron arrows either side of the preview card.
	const arrowSize = Math.max(18, 30 * s);
	ctx.textAlign = "center";
	ctx.font = `bold ${arrowSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#5dd0ff88";
	const leftArrowX = cx - cardW / 2 - Math.max(20, 34 * s);
	const rightArrowX = cx + cardW / 2 + Math.max(20, 34 * s);
	const arrowY = cardTopY + cardH / 2;
	ctx.fillText("\u25C0", leftArrowX, arrowY + arrowSize / 3);
	ctx.fillText("\u25B6", rightArrowX, arrowY + arrowSize / 3);
	rects.leftArrow = { x: leftArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };
	rects.rightArrow = { x: rightArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };

	y = cardTopY + cardH + 14 * s;
	const nameSize = Math.max(14, 22 * s);
	ctx.font = `bold ${nameSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#ffffff";
	ctx.fillText(STAGES[idx].name.toUpperCase(), cx, y + nameSize);
	y += nameSize + 6 * s;
	const countSize = Math.max(9, 11 * s);
	ctx.font = `${countSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#8fa0b8";
	ctx.fillText(`${idx + 1} / ${STAGES.length}    \u2022    ${STAGES[idx].platforms.length} platform${STAGES[idx].platforms.length === 1 ? "" : "s"}`, cx, y + countSize);
	y += countSize + 18 * s;

	// RANDOM chip
	const randLabel = "RANDOM";
	const randFont = Math.max(9, 12 * s);
	ctx.font = `bold ${randFont}px 'All Around The World', monospace`;
	const randW = ctx.measureText(randLabel).width + 26 * s;
	const randH = Math.max(20, 26 * s);
	const randX = cx - randW / 2;
	const randY = y;
	roundRectPath(randX, randY, randW, randH, randH / 2);
	ctx.fillStyle = "#1a1d28";
	ctx.fill();
	ctx.strokeStyle = "#444a5e";
	ctx.lineWidth = 1;
	ctx.stroke();
	ctx.fillStyle = "#ffd75d";
	ctx.fillText(randLabel, cx, randY + randH / 2 + 4 * s);
	rects.randomChip = { x: randX, y: randY, w: randW, h: randH };

	// FIGHT button - same bottom-anchored placement as the character select screen.
	const fightW = Math.max(150, 240 * s);
	const fightH = Math.max(40, 52 * s);
	const fightY = canvas.height - fightH - Math.max(16, 26 * s);
	const fightX = cx - fightW / 2;
	const pulse = 0.5 + 0.5 * Math.sin(time / 260);
	ctx.save();
	roundRectPath(fightX, fightY, fightW, fightH, fightH / 2);
	ctx.fillStyle = "#2f9fd8";
	ctx.fill();
	ctx.shadowColor = "#5dd0ff";
	ctx.shadowBlur = 10 + pulse * 10;
	ctx.strokeStyle = "#5dd0ff";
	ctx.lineWidth = 2;
	roundRectPath(fightX, fightY, fightW, fightH, fightH / 2);
	ctx.stroke();
	ctx.restore();
	ctx.fillStyle = "#0b0c10";
	ctx.font = `bold ${Math.max(14, 20 * s)}px 'All Around The World', monospace`;
	ctx.fillText("FIGHT", cx, fightY + fightH / 2 + 7 * s);
	rects.fightButton = { x: fightX, y: fightY, w: fightW, h: fightH };

	// BACK, small and top-left, doesn't need to fight for attention the way FIGHT does.
	const backSize = Math.max(9, 12 * s);
	ctx.font = `${backSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#8fa0b8";
	ctx.textAlign = "left";
	ctx.fillText(IS_TOUCH ? "\u2039 tap here to go back" : "\u2039 ESC to go back", 14 * s, 20 * s);
	rects.backButton = { x: 0, y: 0, w: 140 * s, h: 34 * s };

	stageSelectHitRects = rects;
	applyRetroFX(time, 0.7, { scanlines: false });
}

// Goes to the stage select screen if there's anything to pick from; otherwise (STAGES is empty)
// skips straight to the fight on the default fallback arena - a browse screen with zero stages in
// it has nothing useful to show.
function goToStageSelect(p1Name, p2Name) {
	if (STAGES.length === 0) {
		startMatch(p1Name, p2Name, null);
		return;
	}
	runStageSelectScreen(p1Name, p2Name, startMatch);
}

function runStageSelectScreen(p1Name, p2Name, onReady) {
	let idx = Math.floor(Math.random() * STAGES.length);
	let started = false;

	function cycle(dir) {
		idx = (idx + dir + STAGES.length) % STAGES.length;
	}
	function confirm() {
		if (started) return;
		started = true;
		selectKeyHandlerFn = null;
		canvas.removeEventListener("pointerdown", onPointerDown);
		canvas.removeEventListener("pointerup", onPointerUp);
		onReady(p1Name, p2Name, STAGES[idx].id);
	}

	selectKeyHandlerFn = (k) => {
		if (started) return;
		if (k === "a" || k === "arrowleft") cycle(-1);
		else if (k === "d" || k === "arrowright") cycle(1);
		else if (k === "r") idx = Math.floor(Math.random() * STAGES.length);
		else if (k === "enter" || k === " ") confirm();
		else if (k === "escape") {
			started = true;
			selectKeyHandlerFn = null;
			canvas.removeEventListener("pointerdown", onPointerDown);
			canvas.removeEventListener("pointerup", onPointerUp);
			runSelectScreen(goToStageSelect);
		}
	};

	let dragStart = null;
	function onPointerDown(e) {
		const p = toGameCoords(e);
		dragStart = { x: p.x, y: p.y, t: performance.now() };
	}
	function onPointerUp(e) {
		if (started || !dragStart) return;
		const p = toGameCoords(e);
		const dx = p.x - dragStart.x;
		const dy = p.y - dragStart.y;
		dragStart = null;

		const SWIPE_DIST = 40;
		if (Math.abs(dx) > SWIPE_DIST && Math.abs(dx) > Math.abs(dy) * 1.5) {
			cycle(dx < 0 ? 1 : -1);
			return;
		}

		const px = p.x, py = p.y;
		const r = stageSelectHitRects;
		if (pointInRect(px, py, r.leftArrow)) cycle(-1);
		else if (pointInRect(px, py, r.rightArrow)) cycle(1);
		else if (pointInRect(px, py, r.randomChip)) idx = Math.floor(Math.random() * STAGES.length);
		else if (pointInRect(px, py, r.fightButton)) confirm();
		else if (pointInRect(px, py, r.backButton)) {
			started = true;
			selectKeyHandlerFn = null;
			canvas.removeEventListener("pointerdown", onPointerDown);
			canvas.removeEventListener("pointerup", onPointerUp);
			runSelectScreen(goToStageSelect);
		}
	}
	canvas.addEventListener("pointerdown", onPointerDown);
	canvas.addEventListener("pointerup", onPointerUp);

	function loop() {
		if (started) return;
		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(loop);
			return;
		}
		drawStageSelectScreen(idx);
		requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
}

// ===================== Match =====================

// Sleek sci-fi pixel-art platform: dark metal body, a glowing top edge (color cycles per
// platform for a little visual variety), tech brackets at both ends, and a few rivets along the
// underside - all plain fillRect calls (cheap, no image assets, stays crisp at any scale).
const PLATFORM_ACCENTS = ["#5dd0ff", "#ff9d5d", "#8fe86f", "#c58fff"];
// Very subtle wind-sway: a slow, tiny vertical bob applied only at draw time (never written back
// to p.x1/x2/y, which stay the fixed stage data used for real collision) - so platforms visually
// read as "floating" instead of dead-static, without ever actually moving where a character can
// stand. Each platform gets its own phase (derived from its own x-position, deterministic and
// stable across frames rather than random per call) so a multi-platform stage doesn't bob in
// perfect unison, which reads as fake; amplitude is small enough it never looks like jitter.
const PLATFORM_SWAY_PX = 1.4;
const PLATFORM_SWAY_PERIOD_MS = 3200;
function drawPlatform(ctx, p, accent, now) {
	const phase = ((p.x1 + p.x2) / 2) * 0.017; // deterministic per-platform offset, not random
	const swayY = now != null ? Math.sin(now / PLATFORM_SWAY_PERIOD_MS + phase) * PLATFORM_SWAY_PX : 0;
	const x = p.x1, w = p.x2 - p.x1, yTop = p.y + swayY;
	const bodyH = 10;
	const capW = Math.min(14, w / 5);

	ctx.fillStyle = "rgba(0,0,0,0.28)";
	ctx.fillRect(x + 3, yTop + bodyH, w - 6, 3);

	ctx.fillStyle = "#262a38";
	ctx.fillRect(x, yTop, w, bodyH);
	ctx.fillStyle = "#1b1e28";
	ctx.fillRect(x, yTop + bodyH - 3, w, 3);

	ctx.fillStyle = accent;
	ctx.fillRect(x, yTop, w, 2);
	ctx.fillStyle = "#ffffff55";
	ctx.fillRect(x, yTop, w, 1);

	ctx.fillStyle = "#3a3f52";
	ctx.fillRect(x, yTop, capW, bodyH);
	ctx.fillRect(x + w - capW, yTop, capW, bodyH);
	ctx.fillStyle = accent;
	ctx.globalAlpha = 0.8;
	ctx.fillRect(x + 3, yTop + 2, 3, bodyH - 4);
	ctx.fillRect(x + w - capW + 3, yTop + 2, 3, bodyH - 4);
	ctx.globalAlpha = 1;

	ctx.fillStyle = "#12141c";
	for (let nx = x + capW + 10; nx < x + w - capW - 6; nx += 22) {
		ctx.fillRect(nx, yTop + bodyH - 5, 6, 2);
	}
}

/** Wraps the real match-start sequence so a failed asset fetch/parse (a missing or malformed
 * character/stage/summon file - by far the most common cause, since none of Character.load()'s
 * or preloadSummonPool()'s asset loading is fault-tolerant) can never again silently strand the
 * player on a black screen after pressing Enter/Fight with zero feedback. Any throw or rejection
 * from startMatchInner is caught here, logged in full to the console, and shown as an on-screen
 * error so it's immediately obvious something failed (and what) instead of looking like input
 * just stopped working. */
async function startMatch(p1Name, p2Name, stageId) {
	try {
		await startMatchInner(p1Name, p2Name, stageId);
	} catch (err) {
		console.error("[litefighter] Failed to start the match - most likely a character/stage/summon asset (a .air, .csv, .png, or moveset.json under assets/) is missing, unreachable, or malformed:", err);
		showMatchLoadError(p1Name, p2Name, err);
	}
}

/** Simple canvas-drawn error screen so a failed match start is visible and recoverable instead of
 * an indefinite black/frozen screen - press any key or tap to return to character select. */
function showMatchLoadError(p1Name, p2Name, err) {
	const message = (err && (err.message || String(err))) || "Unknown error";
	function draw() {
		ctx.fillStyle = "#1a0e0e";
		ctx.fillRect(0, 0, canvas.width, canvas.height);
		ctx.textAlign = "center";
		ctx.fillStyle = "#ff8080";
		ctx.font = "28px 'All Around The World', monospace";
		ctx.fillText("Couldn't start the fight", canvas.width / 2, canvas.height / 2 - 60);
		ctx.fillStyle = "#ddd";
		ctx.font = "16px 'All Around The World', monospace";
		ctx.fillText(`(${p1Name} vs ${p2Name})`, canvas.width / 2, canvas.height / 2 - 20);
		ctx.fillStyle = "#ffb347";
		ctx.font = "14px 'All Around The World', monospace";
		const msg = message.length > 110 ? message.slice(0, 110) + "..." : message;
		ctx.fillText(msg, canvas.width / 2, canvas.height / 2 + 20);
		ctx.fillStyle = "#888";
		ctx.font = "14px 'All Around The World', monospace";
		ctx.fillText("Check that this character/stage's files exist under assets/ - see console for full details.", canvas.width / 2, canvas.height / 2 + 50);
		ctx.fillText("Press any key or tap to go back", canvas.width / 2, canvas.height / 2 + 80);
		ctx.textAlign = "left";
	}
	draw();
	function back() {
		window.removeEventListener("keydown", onKey);
		canvas.removeEventListener("pointerdown", onPointer);
		runSelectScreen(goToStageSelect);
	}
	function onKey() { back(); }
	function onPointer() { back(); }
	window.addEventListener("keydown", onKey);
	canvas.addEventListener("pointerdown", onPointer);
}

async function startMatchInner(p1Name, p2Name, stageId) {
	for (const k of Object.keys(keys)) keys[k] = false;
	const stage = (stageId != null && STAGES.find((st) => st.id === stageId)) || randomStage();
	currentStageId = stage.id;
	if (stage.music) playMusic(stage.music);
	// Per-stage bounce-boundary calibration from the stage mapper (worldLeft/worldRight on a
	// STAGES entry) - STAGE is a single shared object that every physics/AI/camera call already
	// reads fresh each time rather than caching, so mutating it here before the match loop starts
	// propagates everywhere correctly. Stages that haven't been recalibrated just keep ±450.
	STAGE.left = stage.worldLeft ?? -450;
	STAGE.right = stage.worldRight ?? 450;
	const p1Label = CHARACTER_NAMES[p1Name].toUpperCase();
	const p2Label = CHARACTER_NAMES[p2Name].toUpperCase();

	const BASE_SCALE = 2;
	// All character/summon art loads from the real assets/ folder on disk (no embedded/inline
	// build option anymore - see the ASSETS-removal note near the top of this file).
	const p1Def = { x: -150, y: 0, scale: BASE_SCALE * (SIZE_SCALE[p1Name] || 1), facing: 1 };
	const p2Def = { x: 150, y: 0, scale: BASE_SCALE * (SIZE_SCALE[p2Name] || 1), facing: -1 };
	const p1 = await Character.load(p1Name, { ...p1Def, basePath: `assets/characters/${p1Name}` });
	const p2 = await Character.load(p2Name, { ...p2Def, basePath: `assets/characters/${p2Name}` });
	await preloadSummonPool({ basePath: "assets/summons" });

	const stageLayout = { platforms: stage.platforms }; // this match's platform arrangement (0-4 platforms, from the chosen stage)

	const p1AI = new AIController(p1, p2, difficultyOrder[difficultyIndex], stageLayout.platforms);
	const p2AI = new AIController(p2, p1, difficultyOrder[difficultyIndex], stageLayout.platforms);

	const SUMMON_COOLDOWN = 12; // seconds
	let p1SummonCooldown = 0;
	let p2SummonCooldown = 0;
	let p1SummonPrev = false; // previous frame's requested state, for rising-edge detection
	let p2SummonPrev = false;
	const activeSummons = [];
	const activeProjectiles = []; // "projectile" type moves - see Projectile class above

	/** Turns a just-armed pendingProjectileSpawn (set by Character.attack()) into a real traveling
	 * Projectile and clears the flag - called once per character per frame from the match loop
	 * below, mirroring how summons are spawned from trySummon() rather than from inside Character
	 * itself (keeps Character.js free of any match-loop-scoped state). */
	function spawnPendingProjectile(character) {
		const spawn = character.pendingProjectileSpawn;
		if (!spawn) return;
		character.pendingProjectileSpawn = null;
		activeProjectiles.push(new Projectile(spawn.move, spawn.fromX, spawn.fromY, spawn.facing, character));
	}

	function trySummon(cooldownRemaining, requesting, wasPressed, summoner, target, spawnFacing) {
		const rising = requesting && !wasPressed;
		if (rising && cooldownRemaining <= 0) {
			const def = randomSummonDef();
			const nearX = def.mode === "drop" ? target.x : summoner.x + spawnFacing * 100;
			const spawnX = Math.max(STAGE.left + 40, Math.min(STAGE.right - 40, nearX));
			const facing = def.mode === "drop" ? (target.x >= summoner.x ? 1 : -1) : spawnFacing;
			activeSummons.push(new Summon(def, spawnX, facing, target));
			return SUMMON_COOLDOWN;
		}
		return cooldownRemaining;
	}

	let last = performance.now();
	let matchOver = false;
	let winnerLabel = null;
	let active = true; // set false when leaving this match (Escape) so its rAF loop actually stops
	let camX = 0; // smoothed camera-follow offset in world units - see the "camera" block in frame() below
	let camZoom = 1; // smoothed zoom level - see the same block

	function resetMatch() {
		p1.stocks = 3;
		p1.respawn();
		p2.stocks = 3;
		p2.respawn();
		matchOver = false;
		winnerLabel = null;
		activeSummons.length = 0;
		activeProjectiles.length = 0;
		p1SummonCooldown = 0;
		p2SummonCooldown = 0;
	}
	resetMatchFn = resetMatch;
	backToSelectFn = () => {
		active = false;
		resetMatchFn = null;
		backToSelectFn = null;
		playMusic("select");
		runSelectScreen(goToStageSelect);
	};

	// Both attackers' hitbox/hurtbox overlap is checked against the *same* pre-hit snapshot of
	// both characters, then applied afterward - so if both swings land in the same frame it's a
	// genuine trade (both get hit) instead of whoever is resolved first always winning.
	function computeHit(attacker, defender) {
		if (!attacker.isAttacking || attacker.hitLanded || attacker.inHitstun) return null;
		const frame = attacker.currentFrame();
		if (!frame) return null;
		if (frame.clsn1 && frame.clsn1.length > 0) {
			if (anyOverlap(attacker.hitboxes(), defender.hurtboxes())) return attacker.currentMove || {};
			return null;
		}
		// Track A: this action's frames have no authored Clsn1 - fall back to the sprite's own
		// pixel silhouette instead of "no hitbox at all".
		const spans = getSpriteAlphaSpans(attacker.atlas, frame.group, frame.image);
		if (spans && spansOverlapBoxes(attacker, spans, defender.hurtboxes())) {
			return attacker.currentMove || {};
		}
		return null;
	}
	function applyHit(attacker, defender, move) {
		attacker.hitLanded = true;
		const hitInfo = { damage: move.damage ?? 8, fromX: attacker.x, kbBase: move.kbBase, kbGrowth: move.kbGrowth, angle: move.angle };
		if (defender.isBlocking) defender.blockHit(hitInfo);
		else defender.takeHit(hitInfo);
	}

	// Simple pushbox: keeps the two characters from fully overlapping while walking around each
	// other. Never active during an attack or hitstun so it can't rob a real hit of its range.
	const PUSH_MIN_DIST = 68;
	function separate(a, b) {
		if (a.isAttacking || b.isAttacking || a.inHitstun || b.inHitstun) return;
		const dx = b.x - a.x;
		const dist = Math.abs(dx);
		if (dist > 0 && dist < PUSH_MIN_DIST) {
			const push = (PUSH_MIN_DIST - dist) / 2;
			const dir = dx >= 0 ? 1 : -1;
			a.x -= push * dir;
			b.x += push * dir;
		}
	}

	function checkKO(character, name, opponentName) {
		if (isOffStage(character)) {
			character.stocks = Math.max(0, character.stocks - 1);
			character.respawn();
			if (character.stocks === 0 && !matchOver) {
				matchOver = true;
				winnerLabel = opponentName;
			}
		}
	}

	function frame(now) {
		if (!active) return;
		const dt = Math.min((now - last) / 1000, 1 / 30);
		last = now;

		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(frame);
			return;
		}

		if (!matchOver) {
			// Keep both AI brains on whatever difficulty is currently selected.
			const difficulty = difficultyOrder[difficultyIndex];
			if (p1AI.difficulty !== difficulty) p1AI.setDifficulty(difficulty);
			if (p2AI.difficulty !== difficulty) p2AI.setDifficulty(difficulty);

			const p1Move = p1IsAI ? p1AI.update(dt) : p1Input(p2.x);
			const p2Move = p2IsAI ? p2AI.update(dt) : p2Input(p1.x);

			p1.update(dt, p1Move, stageLayout.platforms);
			p2.update(dt, p2Move, stageLayout.platforms);
			spawnPendingProjectile(p1);
			spawnPendingProjectile(p2);

			if (p1SummonCooldown > 0) p1SummonCooldown = Math.max(0, p1SummonCooldown - dt);
			if (p2SummonCooldown > 0) p2SummonCooldown = Math.max(0, p2SummonCooldown - dt);
			p1SummonCooldown = trySummon(p1SummonCooldown, p1Move.summon, p1SummonPrev, p1, p2, p1.facing);
			p2SummonCooldown = trySummon(p2SummonCooldown, p2Move.summon, p2SummonPrev, p2, p1, p2.facing);
			p1SummonPrev = Boolean(p1Move.summon);
			p2SummonPrev = Boolean(p2Move.summon);

			for (const s of activeSummons) {
				s.update(dt);
				if (s.isAttacking && !s.hitLanded && anyOverlap(s.hitboxes(), s.target.hurtboxes())) {
					s.hitLanded = true;
					const def = s.def;
					const hitInfo = { damage: def.damage, fromX: s.x, kbBase: def.kbBase, kbGrowth: def.kbGrowth, angle: def.angle };
					if (s.target.isBlocking) s.target.blockHit(hitInfo);
					else s.target.takeHit(hitInfo);
				}
			}
			for (let i = activeSummons.length - 1; i >= 0; i--) {
				if (activeSummons[i].isDone) activeSummons.splice(i, 1);
			}

			for (const proj of activeProjectiles) {
				proj.update(dt);
				const target = proj.owner === p1 ? p2 : p1;
				if (!proj.hitLanded && anyOverlap(proj.hitboxes(), target.hurtboxes())) {
					proj.hitLanded = true;
					const move = proj.move;
					const hitInfo = { damage: move.damage ?? 8, fromX: proj.x, kbBase: move.kbBase, kbGrowth: move.kbGrowth, angle: move.angle };
					if (target.isBlocking) target.blockHit(hitInfo);
					else target.takeHit(hitInfo);
				}
			}
			for (let i = activeProjectiles.length - 1; i >= 0; i--) {
				if (activeProjectiles[i].done) activeProjectiles.splice(i, 1);
			}

			separate(p1, p2);

			const p1HitMove = computeHit(p1, p2);
			const p2HitMove = computeHit(p2, p1);
			if (p1HitMove) applyHit(p1, p2, p1HitMove);
			if (p2HitMove) applyHit(p2, p1, p2HitMove);

			checkKO(p1, p1Label, p2Label);
			checkKO(p2, p2Label, p1Label);
		}

		// --- draw --- (recomputed every frame so a live window resize is handled for free)
		// Camera follows the midpoint between both characters (panning, smoothed, clamped to the
		// stage's own fixed edges - on this fixed 1280-wide canvas the 900-wide stage already
		// fits without panning, so maxCamX is normally 0 and this stays dead center; kept for
		// robustness if either number ever changes) and zooms out the farther apart the two
		// players are, so a full-stage-width spread stays framed instead of the characters
		// shrinking toward the screen edges.
		const dist = Math.abs(p1.x - p2.x);
		const ZOOM_MIN = 0.45; // at/beyond a full stage-width spread (lower floor than before so a
		// tall/wide calibrated boundary box can still fit on-screen without ever clipping the floor)
		const ZOOM_MAX = 1; // at/under a close-range distance
		const ZOOM_NEAR_DIST = 260;
		const ZOOM_FAR_DIST = STAGE.right - STAGE.left;
		const zoomT = Math.max(0, Math.min(1, (dist - ZOOM_NEAR_DIST) / (ZOOM_FAR_DIST - ZOOM_NEAR_DIST)));
		let targetZoom = ZOOM_MAX - zoomT * (ZOOM_MAX - ZOOM_MIN);

		// Vertical play area this camera frames, calibrated in the stage mapper's "Stage Boundaries"
		// tool and exported as topBoundaryYFrac/bottomBoundaryYFrac (both fractions of the mapper's
		// own fixed 1280x720 canvas, anchored to ITS fixed default ground row at 0.7*720 - see
		// stagemapper.html's worldToScreenY/DEFAULT_GROUND_Y - which is why the conversion below
		// subtracts the same fixed 0.7, not this stage's own groundYFrac calibration). Stages that
		// predate this feature fall back to the mapper's own defaults (0.05/0.95). worldBottom is
		// ALWAYS pinned to the bottom of the canvas below (see originScreenY) - only the top of this
		// range can ever clip off-screen, exactly matching the stage/character mapper's test preview.
		const worldTop = ((stage.topBoundaryYFrac ?? 0.05) - 0.7) * canvas.height;
		const worldBottom = ((stage.bottomBoundaryYFrac ?? 0.95) - 0.7) * canvas.height;
		const vertFitZoom = canvas.height / Math.max(1, worldBottom - worldTop);
		targetZoom = Math.max(0.2, Math.min(targetZoom, vertFitZoom, ZOOM_MAX));
		camZoom += (targetZoom - camZoom) * Math.min(1, 4 * dt);

		const halfView = canvas.width / 2 / camZoom; // in world units - widens as the camera zooms out
		const maxCamX = Math.max(0, STAGE.right - halfView);
		const targetCamX = Math.max(-maxCamX, Math.min(maxCamX, (p1.x + p2.x) / 2));
		camX += (targetCamX - camX) * Math.min(1, 6 * dt);
		const screenCenterX = canvas.width / 2 - camX * camZoom; // world x=0 renders here
		// Bottom of the calibrated vertical play area pinned to the bottom of the canvas (world
		// y=worldBottom -> screen y=canvas.height) at every zoom level, so the floor never scrolls
		// off-screen - only the top can, when the play area doesn't fit. This is the screen-space
		// origin (world y=0) the camera transform below translates to.
		const originScreenY = canvas.height - worldBottom * camZoom;
		// groundYFrac is a SEPARATE, purely-visual calibration (see the stage mapper's "drag the
		// ground line" control) for which pixel row of the background art itself is the floor - it
		// only feeds the art scale/position formulas below (artGroundY), never the camera origin
		// above, and does NOT touch physics (character.js's grounded/y>=0 check is in world
		// coordinates and never looks at this). Stages that haven't been recalibrated just keep the
		// original fixed 0.7.
		const artGroundY = canvas.height * (stage.groundYFrac ?? 0.7);

		ctx.clearRect(0, 0, canvas.width, canvas.height);
		ctx.fillStyle = "#1e212e"; // fallback fill while the image loads, or if it's missing
		ctx.fillRect(0, 0, canvas.width, canvas.height);

		ctx.save();
		ctx.translate(screenCenterX, originScreenY); // world space -> screen space
		ctx.scale(camZoom, camZoom);

		// Stage background: drawn INSIDE the same camera transform as the platforms/characters
		// (below), so it zooms and pans together with everything else instead of sitting frozen in
		// screen space while the world "moves" independently around it - that mismatch is what used
		// to make the platforms look like they were sliding in and out on their own as the camera
		// zoomed. The world's own bounce bounds (STAGE.left/right, combat.js) are still NOT tied to
		// the image's displayed size - they stay the fixed ±450 world units the physics/platform
		// layouts were already tuned against, which happens to line up with the full 1280px canvas
		// width at the camera's default zoom/pan, i.e. the edges of the (cover-fit) image are where
		// a character bounces off, in the common case of camera zoom=1/pan=0.
		//
		// STAGE_BG_GROUND_FRAC: every stage bg.png was composited onto the same fixed 1600x720
		// canvas with the real floor placed at row 400 (see STAGES' comment above / the
		// compositor script) - so 400/720 is the floor's position as a fraction of image height
		// for every one of these images, not just one. Scaling/positioning against that fraction
		// (instead of naive center-crop) is what makes the art's own floor land on world y=0, which
		// this transform already maps to `groundY` on screen - so the floor stays visually pinned to
		// the same screen row regardless of zoom, exactly like it did before.
		//
		// Sizing the image against canvas.width / ZOOM_MIN (the widest the view will ever get, i.e.
		// the most-zoomed-out camera state) rather than the raw canvas.width is what keeps it
		// covering the screen edge-to-edge with no gaps at every zoom level, not just zoom=1 - a
		// plain canvas.width would leave black bars at the sides once the camera actually zooms out.
		const STAGE_BG_GROUND_FRAC = 400 / 720;
		const bgCoverWidth = canvas.width / ZOOM_MIN;
		const bgImg = currentStageId ? stageBgImages[currentStageId] : null;
		if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
			const scaleForGround = artGroundY / (STAGE_BG_GROUND_FRAC * bgImg.naturalHeight);
			const scaleForWidth = bgCoverWidth / bgImg.naturalWidth;
			const scale = Math.max(scaleForGround, scaleForWidth);
			const dw = bgImg.naturalWidth * scale;
			const dh = bgImg.naturalHeight * scale;
			const drawX = -dw / 2; // centered on world x=0
			const drawY = -STAGE_BG_GROUND_FRAC * dh; // pins the art's real floor row to world y=0 (=groundY on screen)
			ctx.drawImage(bgImg, drawX, drawY, dw, dh);
		}

		// Optional foreground layer (set dressing only - pillars/plants/etc.) - drawn right after the
		// background and BEFORE the platforms/characters below, so it can never obscure actual
		// gameplay, using the same scale/position formula (and the same world transform) so it stays
		// aligned with the background and zooms/pans right along with it too.
		const fgImg = currentStageId ? stageFgImages[currentStageId] : null;
		if (fgImg && fgImg.complete && fgImg.naturalWidth > 0) {
			const scaleForGround = artGroundY / (STAGE_BG_GROUND_FRAC * fgImg.naturalHeight);
			const scaleForWidth = bgCoverWidth / fgImg.naturalWidth;
			const scale = Math.max(scaleForGround, scaleForWidth);
			const dw = fgImg.naturalWidth * scale;
			const dh = fgImg.naturalHeight * scale;
			const drawX = -dw / 2;
			const drawY = -STAGE_BG_GROUND_FRAC * dh;
			ctx.drawImage(fgImg, drawX, drawY, dw, dh);
		}

		// No separate flat ground-line bar anymore - the stage background's own floor (aligned to
		// this same `groundY` above) is the floor now; drawing a generic gray bar on top of it
		// just clashed with the real art.

		// Floating platforms, drawn after the background/foreground and before the characters -
		// platforms render over everything behind them (background, optional foreground layer) and
		// anyone standing on one draws in front of it in turn. Platforms themselves never move
		// (their x1/x2/y are fixed stage data - only the very subtle wind-sway drawn below shifts,
		// and that's a draw-time-only offset that never touches the real platform coordinates used
		// for collision, so it can't cause the "platform drifts/jitters" class of bug).
		stageLayout.platforms.forEach((p, i) => drawPlatform(ctx, p, PLATFORM_ACCENTS[i % PLATFORM_ACCENTS.length], now));

		p1.draw(ctx);
		p2.draw(ctx);
		for (const s of activeSummons) s.draw(ctx);
		for (const proj of activeProjectiles) proj.draw(ctx);
		if (showBoxes) {
			drawBoxes(p1.hurtboxes(), "#3399ff");
			drawBoxes(p1.hitboxes(), "#ff3333");
			drawBoxes(p2.hurtboxes(), "#3399ff");
			drawBoxes(p2.hitboxes(), "#ff3333");
			for (const proj of activeProjectiles) drawBoxes(proj.hitboxes(), "#ffcf5d");
		}

		// Front foreground layer (see stage-mapper.html's "front foreground" upload) - a SECOND,
		// optional layer drawn dead last, on top of platforms and both fighters (unlike the classic
		// `fg` layer above, which is deliberately kept behind gameplay). Most stages won't set this;
		// it exists for foreground bars/mesh/pillars the action should visually pass behind.
		const fgFrontImg = currentStageId ? stageFgFrontImages[currentStageId] : null;
		if (fgFrontImg && fgFrontImg.complete && fgFrontImg.naturalWidth > 0) {
			const scaleForGround = artGroundY / (STAGE_BG_GROUND_FRAC * fgFrontImg.naturalHeight);
			const scaleForWidth = bgCoverWidth / fgFrontImg.naturalWidth;
			const scale = Math.max(scaleForGround, scaleForWidth);
			const dw = fgFrontImg.naturalWidth * scale;
			const dh = fgFrontImg.naturalHeight * scale;
			const drawX = -dw / 2;
			const drawY = -STAGE_BG_GROUND_FRAC * dh;
			ctx.drawImage(fgFrontImg, drawX, drawY, dw, dh);
		}

		ctx.restore();

		drawHud(p1, p2, p1Label, p2Label, p1SummonCooldown, p2SummonCooldown);
		if (matchOver) drawWinnerBanner(winnerLabel);
		applyRetroFX(now, 0.6);

		requestAnimationFrame(frame);
	}

	requestAnimationFrame(frame);
}

runTitleScreen(() => {
	playMusic("select");
	runSelectScreen(goToStageSelect);
});

</script>
</body>
</html>
