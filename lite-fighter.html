// errors. This only resets on a real page reload (a fresh check of whatever's on disk), which is
// the right granularity here: there's no live filesystem-watching to react to a file showing up
// mid-session anyway. Either way, a missing track never breaks the game - it just plays silently.
const musicFailedIds = new Set();
musicEl.addEventListener("error", () => {
	const failedId = musicEl.dataset.pendingId;
	if (failedId) musicFailedIds.add(failedId);
	musicEl.removeAttribute("data-src");
});
function playMusic(id, loop = true) {
	if (musicFailedIds.has(id)) return; // known missing/unloadable this session - stay silent
	const src = resolveMusicSrc(id);
	if (musicEl.dataset.src === src && !musicEl.paused) return;
	musicEl.dataset.src = src;
	musicEl.dataset.pendingId = id;
	musicEl.src = src;
	musicEl.loop = loop;
	musicEl.currentTime = 0;
	musicEl.play().catch(() => {}); // autoplay-policy rejection before a user gesture - fine, ignored
}
function stopMusic() {
	musicEl.pause();
	musicEl.removeAttribute("data-src");
}

window.addEventListener("keydown", (e) => {
	const k = e.key.toLowerCase();
	keys[k] = true;
	if (SCROLL_KEYS.has(k)) e.preventDefault();
	if (e.key === "Tab") showBoxes = !showBoxes;
	if (e.key === "1") p1IsAI = !p1IsAI;
	if (e.key === "2") p2IsAI = !p2IsAI;
	if (e.key === "[") difficultyIndex = Math.max(0, difficultyIndex - 1);
	if (e.key === "]") difficultyIndex = Math.min(difficultyOrder.length - 1, difficultyIndex + 1);
	if (e.key === "-" || e.key === "_") roundsCount = Math.max(ROUNDS_MIN, roundsCount - 1);
	if (e.key === "=" || e.key === "+") roundsCount = Math.min(ROUNDS_MAX, roundsCount + 1);
	if (e.key === "Enter" && resetMatchFn) resetMatchFn();
	if (e.key === "Escape" && !e.repeat && pauseToggleFn) pauseToggleFn();
	if (k === "p" && !e.repeat && pauseToggleFn) pauseToggleFn();
	if (!e.repeat && isPausedFn && isPausedFn()) {
		// Only meaningful while actually paused - Character.update() never runs during pause (see
		// frame()'s own `!paused` gate), so repurposing these two keys here never touches a real
		// per-character keybinding, P1's own "Q" (guard) and "F" (light) included.
		if (k === "q" && backToSelectFn) backToSelectFn();
		if (k === "f") toggleFullscreen();
	}
	if (!e.repeat && selectKeyHandlerFn) selectKeyHandlerFn(k);
});
window.addEventListener("keyup", (e) => {
	const k = e.key.toLowerCase();
	keys[k] = false;
	if (SCROLL_KEYS.has(k)) e.preventDefault();
});

// P1 (left hand): A/D move, W jump, S = crouch (down), Q = guard, F/G/H/R = light/medium/heavy/
// special, T = summon, Y = taunt. Guard is its own dedicated key, separate from crouch, matching
// the gamepad's dedicated RT guard button below - holding S alone just crouches (lets a
// crouchAttack through, no shield/flicker involved), holding Q is a real guard (shield drain +
// flicker, no attacking through it), and S+W (crouch + jump) drops through a platform. Keyboard
// still has no separate "held up direction" independent of the jump key, so
// tilts/smashes/aerial-direction/specialU/specialD and the motion-input Hyper combos stay
// gamepad-only (see readGamepadInput() below) - full directional coverage of every
// FULL_ATTACK_SLOTS move is what the Xbox 360 support is for.
function p1Input(opponentX) {
	return {
		left: keys["a"],
		right: keys["d"],
		jump: keys["w"],
		down: keys["s"],
		block: keys["q"],
		light: keys["f"],
		medium: keys["g"],
		heavy: keys["h"],
		special: keys["r"],
		summon: keys["t"],
		taunt: keys["y"],
		opponentX,
	};
}
// P2 (right hand, when human): arrows move, Up jump, Down = crouch, / = guard, J/K/L/; =
// light/medium/heavy/special, O = summon, I = taunt. Same crouch/guard split as P1 above, just
// with Down doing crouch duty instead of S and / as the dedicated guard key.
function p2Input(opponentX) {
	return {
		left: keys["arrowleft"],
		right: keys["arrowright"],
		jump: keys["arrowup"],
		down: keys["arrowdown"],
		block: keys["/"],
		light: keys["j"],
		medium: keys["k"],
		heavy: keys["l"],
		special: keys[";"],
		summon: keys["o"],
		taunt: keys["i"],
		opponentX,
	};
}

// ===== gamepad.js =====
// gamepad.js
// Xbox 360 (and any standard-mapping-compatible) controller support, Smash-style: the four face
// buttons ARE the four attack tiers (matching this engine's own light/medium/heavy/special design
// 1:1, no C-stick/flick-detection needed), RT is a dedicated guard button (own action entirely -
// see Character.update()'s wantsGuard/wantsCrouch split, guard is the only thing that flickers),
// and - critically - the left stick/d-pad reports a real held UP/DOWN direction independent of
// both the jump and guard buttons, which is what actually unlocks every slot in
// FULL_ATTACK_SLOTS (utilt/dtilt/usmash/dsmash/uair/dair/specialU/specialD) plus the motion-input
// Hyper combos (see CommandBuffer) AND lets down alone crouch (crouch-attacks) or down+jump drop
// through a platform - none of that full directional coverage is reachable from this game's
// keyboard scheme, where "up" is just the jump key.
//
// Standard Gamepad API button/axis indices (what every Xbox 360 / XInput pad reports in every
// evergreen browser via the "standard" mapping):
//   buttons: 0=A 1=B 2=X 3=Y 4=LB 5=RB 6=LT 7=RT 8=Back/View 9=Start/Menu 10=LS click 11=RS click
//            12=dpad-up 13=dpad-down 14=dpad-left 15=dpad-right
//   axes: 0=left stick X (-1..1) 1=left stick Y (-1..1, negative = up)
const GAMEPAD_DEADZONE = 0.35;
function padPressed(pad, i) {
	const b = pad.buttons[i];
	return Boolean(b && (b.pressed || b.value > 0.5));
}
/** Player index (0 or 1) -> the Gamepad object currently at that slot, or null if none connected.
 * Deliberately NOT cached across frames - navigator.getGamepads() entries can go stale/disconnect
 * without a matching event on some browsers, so this stays a fresh read every call. */
function connectedPad(playerIndex) {
	const pads = navigator.getGamepads ? navigator.getGamepads() : [];
	const pad = pads[playerIndex];
	return pad && pad.connected ? pad : null;
}
function readGamepadInput(pad, opponentX) {
	const axisX = pad.axes[0] || 0;
	const axisY = pad.axes[1] || 0;
	return {
		left: axisX < -GAMEPAD_DEADZONE || padPressed(pad, 14),
		right: axisX > GAMEPAD_DEADZONE || padPressed(pad, 15),
		up: axisY < -GAMEPAD_DEADZONE || padPressed(pad, 12),
		down: axisY > GAMEPAD_DEADZONE || padPressed(pad, 13),
		jump: padPressed(pad, 4),   // LB - keeps all 4 face buttons free for the attack tiers below
		light: padPressed(pad, 0),   // A
		medium: padPressed(pad, 2),  // X
		heavy: padPressed(pad, 3),   // Y
		special: padPressed(pad, 1), // B
		block: padPressed(pad, 7),  // RT - guard, its own dedicated button (see wantsGuard above)
		summon: padPressed(pad, 5),  // RB
		taunt: padPressed(pad, 8), // Back - Start (9) is reserved for Pause, handled separately in frame()'s Start rising-edge check, not fed through Character.update()'s input shape
		opponentX,
	};
}
/** Gamepad input when connected for this player slot, otherwise the existing keyboard reader -
 * both produce the exact same shape, so Character.update()/AIController never need to know which
 * device is actually driving a given player. */
function getP1Input(opponentX) {
	const pad = connectedPad(0);
	return pad ? readGamepadInput(pad, opponentX) : p1Input(opponentX);
}
function getP2Input(opponentX) {
	const pad = connectedPad(1);
	return pad ? readGamepadInput(pad, opponentX) : p2Input(opponentX);
}

function isPortrait() {
	return window.innerHeight > window.innerWidth;
}
function drawPortraitWarning() {
	ctx.fillStyle = "#000000";
	ctx.fillRect(0, 0, GAME_W, GAME_H);
	ctx.textAlign = "center";
	ctx.fillStyle = "#ffffff";
	ctx.font = "bold 20px 'All Around The World', monospace";
	ctx.fillText("Please rotate your device", GAME_W / 2, GAME_H / 2 - 14);
	ctx.font = "14px 'All Around The World', monospace";
	ctx.fillStyle = "#ffb238";
	ctx.fillText("This game needs a landscape or square screen", GAME_W / 2, GAME_H / 2 + 14);
}

function roundRectPath(x, y, w, h, r) {
	ctx.beginPath();
	ctx.moveTo(x + r, y);
	ctx.arcTo(x + w, y, x + w, y + h, r);
	ctx.arcTo(x + w, y + h, x, y + h, r);
	ctx.arcTo(x, y + h, x, y, r);
	ctx.arcTo(x, y, x + w, y, r);
	ctx.closePath();
}

/** Draws a rounded, glossy "bubbly toy button/panel": a vertical gradient fill (lighter near the
 * top, darker below - the classic glossy-plastic bevel a Hasbro toy or a Kirby-style rounded UI
 * button reads as) plus a soft white highlight sliver hugging the top edge, and an optional bright
 * outline. This is the one shared look behind every HUD panel/pill/badge in this pass - call it
 * instead of a flat fillRect+roundRectPath wherever a piece of UI wants that "juicy" rounded-plastic
 * treatment rather than a flat retro-terminal fill. `x,y,w,h,r` are the rounded-rect's own bounds;
 * `baseColor`/`highColor` are the gradient's dark/light stops (both required); `borderColor` is
 * optional (pass null/undefined to skip the stroke entirely). */
function drawGlossyPanel(x, y, w, h, r, baseColor, highColor, borderColor, borderWidth = 2) {
	const grad = ctx.createLinearGradient(x, y, x, y + h);
	grad.addColorStop(0, highColor);
	grad.addColorStop(0.5, baseColor);
	grad.addColorStop(1, baseColor);
	roundRectPath(x, y, w, h, r);
	ctx.fillStyle = grad;
	ctx.fill();
	ctx.save();
	roundRectPath(x, y, w, h, r);
	ctx.clip();
	ctx.fillStyle = "rgba(255,255,255,0.24)";
	roundRectPath(x + w * 0.08, y + h * 0.1, w * 0.84, Math.max(1, h * 0.3), Math.max(1, r * 0.6));
	ctx.fill();
	ctx.restore();
	if (borderColor) {
		ctx.strokeStyle = borderColor;
		ctx.lineWidth = borderWidth;
		roundRectPath(x, y, w, h, r);
		ctx.stroke();
	}
}

/** Turns a "#rrggbb" hex color into an "rgba(...)" string at a given alpha - used throughout
 * drawGlassBlock() below, since a translucent glass look is built almost entirely out of the same
 * base palette color at different opacities rather than distinct highlight/shadow shades. */
function hexToRgba(hex, alpha) {
	const n = parseInt(hex.slice(1), 16);
	return `rgba(${(n >> 16) & 0xff}, ${(n >> 8) & 0xff}, ${n & 0xff}, ${alpha})`;
}

/** Breakout block, styled to match this game's space/EVA aesthetic rather than a bubbly toy
 * button: a translucent glass/acrylic panel (mostly see-through, tinted by the block's own accent
 * color, darkening toward a near-black glass base at the bottom) plus a crisp double-line edge (a
 * saturated accent-color line just inside a thinner white one, like light catching the panel's own
 * cut edge) instead of a flat colored border. Same gentle per-block idle bob as before (purely
 * cosmetic - draw-time only, never touches the real x/y checkBlockCollisions() collides against)
 * so the grid never looks dead/static even before anything's actually been broken. */
function drawGlassBlock(ctx, block, now) {
	const bob = Math.sin(now / 900 + block.x * 0.01) * 2;
	const y = getBlockY(block) + bob;
	const color = BLOCK_PALETTE[block.colorIndex];
	const x = block.x, w = block.w, h = block.h;
	const r = Math.min(w, h) * 0.22; // less rounded than the old bubbly look - reads more like a cut glass/acrylic panel than a candy button

	ctx.save();
	roundRectPath(x, y, w, h, r);
	ctx.clip();

	// Glass body: mostly transparent, brightest (still tinted by the block's own color, not a flat
	// white) near the top, deepening down into a near-black glass base - reads as a lit, glowing
	// panel rather than solid opaque plastic.
	const bodyGrad = ctx.createLinearGradient(x, y, x, y + h);
	bodyGrad.addColorStop(0, hexToRgba(color, 0.55));
	bodyGrad.addColorStop(0.55, hexToRgba(color, 0.25));
	bodyGrad.addColorStop(1, "rgba(4,6,13,0.55)");
	ctx.fillStyle = bodyGrad;
	ctx.fillRect(x, y, w, h);

	ctx.restore(); // undo clip

	// Crisp cut-glass edge: a saturated accent-color line just inside a thinner, dimmer white one.
	ctx.strokeStyle = hexToRgba(color, 0.9);
	ctx.lineWidth = 2;
	roundRectPath(x + 1, y + 1, w - 2, h - 2, r);
	ctx.stroke();
	ctx.strokeStyle = "rgba(220,240,255,0.45)";
	ctx.lineWidth = 1;
	roundRectPath(x + 0.5, y + 0.5, w - 1, h - 1, r);
	ctx.stroke();
}

/** A broken block's empty socket: a faint cool-toned outline (matching the glass panels' own
 * space/EVA palette instead of a flat white) plus a small radial "fuse" arc ticking down
 * BLOCK_REGEN_SECONDS in that block's own accent color, so a player can actually read a gap about
 * to refill instead of a block just popping back with zero warning. */
function drawBlockSocket(ctx, block) {
	const y = getBlockY(block);
	const r = Math.min(block.w, block.h) * 0.22;
	ctx.save();
	ctx.globalAlpha = 0.2;
	ctx.strokeStyle = "#8fb4d9";
	ctx.lineWidth = 2;
	roundRectPath(block.x, y, block.w, block.h, r);
	ctx.stroke();
	ctx.globalAlpha = 0.75;
	const t = 1 - block.respawnTimer / BLOCK_REGEN_SECONDS;
	ctx.strokeStyle = BLOCK_PALETTE[block.colorIndex];
	ctx.lineWidth = 3;
	ctx.beginPath();
	ctx.arc(block.x + block.w / 2, y + block.h / 2, Math.min(block.w, block.h) * 0.22, -Math.PI / 2, -Math.PI / 2 + t * Math.PI * 2);
	ctx.stroke();
	ctx.restore();
}

/** Draws the whole breakout grid - a live block gets the full glassy treatment, a broken one gets
 * just its faint regen-timer socket. Called from the match draw loop right alongside the floating
 * platforms, in the same camera-transformed world space, so it pans/zooms/layers with the stage
 * exactly like they do (see the "above the stage image" comment at that call site). */
function drawBlockGrid(ctx, grid, now, camX, camZoom) {
	// View-frustum cull: buildBlockGrid() now pads the grid out to cover the camera's own furthest
	// possible zoom-out (see its own comment), which roughly doubled the live block count so the
	// wall would reach those wider edges - but most of the match is spent at a much closer zoom
	// where only the middle stage-width columns are ever actually visible. Without this cull, every
	// one of those extra off-screen blocks still paid the full glass-panel draw cost (gradient +
	// clip + double stroke) every single frame regardless of whether the camera could see them,
	// which is what turned into the sudden lag/stutter after that change - skipping anything
	// entirely outside the current view brings normal-zoom frames back to drawing only the blocks
	// actually on screen, same as before, while the wider coverage is still there the moment the
	// camera actually zooms out far enough to need it.
	const halfView = GAME_W / 2 / camZoom;
	const viewLeft = camX - halfView;
	const viewRight = camX + halfView;
	for (const block of grid) {
		if (block.x + block.w < viewLeft || block.x > viewRight) continue;
		if (block.alive) drawGlassBlock(ctx, block, now);
		else drawBlockSocket(ctx, block);
	}
}

/** A small diagonal two-tone hazard-stripe accent tucked into a panel's corner - the one direct
 * "EVA terminal" quote in this UI pass (NERV's own monitor chrome leans hard on amber caution-
 * stripe framing around otherwise clean panels). Purely decorative, clipped to the panel's own
 * rounded rect so it never spills past the edge regardless of panel size. `corner` is "tl"/"tr". */
function drawHazardCorner(x, y, w, h, r, color, corner) {
	ctx.save();
	roundRectPath(x, y, w, h, r);
	ctx.clip();
	ctx.globalAlpha = 0.5;
	ctx.fillStyle = color;
	const size = Math.min(w, h) * 0.9;
	ctx.save();
	ctx.translate(corner === "tr" ? x + w : x, y);
	ctx.rotate(Math.PI / 4);
	ctx.fillRect(corner === "tr" ? -size : 0, -size / 2, size, size / 4);
	ctx.restore();
	ctx.globalAlpha = 1;
	ctx.restore();
}

function drawBoxes(boxes, color) {
	ctx.fillStyle = color;
	ctx.globalAlpha = 0.5;
	for (const [x1, y1, x2, y2] of boxes) ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
	ctx.globalAlpha = 1;
}

// --- HUD colors: a warm, dark "EVA terminal" panel backing (amber-on-dark cockpit-readout vibe)
// with bubbly, glossy Kirby/Hasbro-toy accent colors per player - the shared look behind every
// piece of in-match HUD (see drawGlossyPanel/drawHazardCorner above). ---
const HUD_PANEL_BASE = "#241a10";
const HUD_PANEL_HIGH = "#4a3420";
const HUD_PANEL_BORDER = "#ffb238";

const STOCK_PILL_W = 17, STOCK_PILL_H = 23, STOCK_PILL_GAP = 5; // fixed px at s=1 - every pill this
// exact same size regardless of stock count (per spec) - no shrink-to-fit, unlike a normal bar.
// Bumped up from 13x18 alongside the wider HUD panel (see drawHud's panelW) so pills read clearly
// at a glance instead of looking lost in the extra space.

/** One row of uniform "Mega Man health-cell"-style pills, one per remaining stock. Draws left-to-
 * right normally, or mirrored right-to-left for the P2 panel (alignRight). */
function drawStockPills(x, y, count, color, darkColor, alignRight, s) {
	const w = STOCK_PILL_W * s, h = STOCK_PILL_H * s, gap = STOCK_PILL_GAP * s;
	for (let i = 0; i < count; i++) {
		const px = alignRight ? x - w - i * (w + gap) : x + i * (w + gap);
		drawGlossyPanel(px, y, w, h, 3.5 * s, darkColor, color, "#14151c", Math.max(1, 1.5 * s));
	}
}

// Fixed two-row readout block reserved under the name for temporary status effects (taunt gamble
// today; a future Limit Break gauge, Materia proc, or any other buff/debuff readout later) - see
// getBuffReadouts() below. Reserving the space for both rows unconditionally (rather than
// collapsing when only one/zero buffs are active) keeps the pills row and summon badge locked to
// a fixed Y regardless of which buffs happen to be live, so the panel never visibly resizes/jumps
// mid-match.
const BUFF_ROW_H = 11; // px at s=1, vertical gap between the two buff-text rows
const BUFF_ROW_TOP_Y = 30; // px at s=1, first row's baseline offset from panelY

// Collects every temporary status readout a character should show in its HUD panel, top row
// first. IMPORTANT: taunt's atk/def buff is always pushed on LAST so it consistently renders in
// the BOTTOM row - any future buff type (Limit Break ready, an active Materia effect, etc.) should
// be unshifted/pushed BEFORE this taunt entry so it claims the top row instead. Only the first two
// entries are ever drawn (see drawPlayerHudPanel) since the panel only reserves two rows.
function getBuffReadouts(character) {
	const readouts = [];
	// Future buff types get added here, above the taunt entry, e.g.:
	//   if (character.limitBreakReady) readouts.push({ label: "LIMIT BREAK!", color: "#ffe45d" });
	//   if (character.materiaBuff) readouts.push({ label: character.materiaBuff.label, color: "#7dffb0" });
	if (character.buffType && character.buffTimer > 0) {
		const buffColor = character.buffType === "atk" ? "#ff5d5d" : "#5dc8ff";
		readouts.push({
			label: `${character.buffType === "atk" ? "ATK+" : "DEF+"} ${Math.ceil(character.buffTimer)}s`,
			color: buffColor,
		});
	}
	return readouts;
}

/** The full per-player HUD readout, stacked inside one contained glossy terminal panel so nothing
 * can ever overlap the gameplay below it or the other player's panel: name, then a reserved
 * two-row buff/status readout block (see getBuffReadouts - taunt's buff always occupies the
 * bottom of those two rows), then the stock-pill row, then - only for a character that actually
 * has one (see Character.summonDef) - a summon-cooldown badge. Top-to-bottom order matches the
 * spec: name / buff rows / pill stock bar / summon countdown. */
function drawPlayerHudPanel(panelX, panelY, w, h, label, isAI, character, summonCooldown, color, darkColor, alignRight, s) {
	drawGlossyPanel(panelX, panelY, w, h, 10 * s, HUD_PANEL_BASE, HUD_PANEL_HIGH, HUD_PANEL_BORDER, Math.max(1.5, 2 * s));

	// Everything below is centered on the panel's own horizontal midpoint - same for both the P1
	// (left) and P2 (right) panel, rather than hugging whichever outer edge alignRight pointed at.
	const centerX = panelX + w / 2;

	ctx.textAlign = "center";
	ctx.font = `bold ${Math.max(12, 16 * s)}px 'All Around The World', monospace`;
	ctx.fillStyle = color;
	ctx.fillText(`${label}${isAI ? " \u00b7 AI" : ""}`, centerX, panelY + 20 * s);

	// Buff/status readout rows - up to two, stacked, right under the name (see getBuffReadouts's
	// own doc comment for why taunt's buff is guaranteed to land in the bottom slot). Widened panel
	// (see drawHud's panelW) gives these plenty of horizontal room for a longer future label like
	// "LIMIT BREAK!" without crowding the name above or the pills below.
	const buffReadouts = getBuffReadouts(character);
	if (buffReadouts.length) {
		ctx.font = `bold ${Math.max(9, 10 * s)}px 'All Around The World', monospace`;
		for (let i = 0; i < Math.min(2, buffReadouts.length); i++) {
			ctx.fillStyle = buffReadouts[i].color;
			ctx.fillText(buffReadouts[i].label, centerX, panelY + (BUFF_ROW_TOP_Y + i * BUFF_ROW_H) * s);
		}
	}

	// Stock pills, centered as a single group under the name and the reserved buff-row block (no
	// more shield/guard sliver bar between them - removed entirely per request).
	const pillsY = panelY + 50 * s;
	const pillsW = character.stocks > 0 ? character.stocks * STOCK_PILL_W * s + Math.max(0, character.stocks - 1) * STOCK_PILL_GAP * s : 0;
	drawStockPills(centerX - pillsW / 2, pillsY, character.stocks, color, darkColor, false, s);

	// Summon cooldown badge - only for a character with a real summon move (Character.summonDef,
	// no more generic shared pool - see its own comment elsewhere). Anchored to the panel's bottom
	// edge with enough clearance below the pills row (see panelH's own sizing in drawHud) that the
	// two can never overlap regardless of stock count.
	if (character.summonDef) {
		const ready = summonCooldown <= 0;
		const badgeW = Math.max(70, 84 * s), badgeH = Math.max(16, 18 * s);
		const badgeX = centerX - badgeW / 2;
		const badgeY = panelY + h - badgeH - 8 * s;
		drawGlossyPanel(badgeX, badgeY, badgeW, badgeH, badgeH / 2, ready ? "#8a6a12" : "#2a2d3a", ready ? "#ffd75d" : "#3a3f52", ready ? "#ffe27a" : "#565b6e", Math.max(1, 1.5 * s));
		ctx.font = `bold ${Math.max(8, 10 * s)}px 'All Around The World', monospace`;
		ctx.fillStyle = ready ? "#2b1f0a" : "#9aa0b8";
		ctx.fillText(ready ? "SUMMON READY" : `SUMMON ${Math.ceil(summonCooldown)}s`, centerX, badgeY + badgeH / 2 + 4 * s);
	}
	ctx.textAlign = "left";
}

// HUD panel size scales down a little on narrow windows so nothing runs off the edge or overlaps
// itself at small resolutions. No more bottom-of-screen control-hint text (moved to the pause
// overlay only, opened on demand, instead of permanently overlaying the match) and no more a raw
// "37%" text readout (see Character._drawDamagePopups() instead - damage now shows as a floating
// number above whoever got hit, not a corner counter).
function drawHud(p1, p2, p1Label, p2Label, p1SummonCooldown, p2SummonCooldown) {
	const narrow = GAME_W < 700;
	const s = narrow ? 0.82 : 1;
	const margin = 12 * s;
	// Widened again (226 -> 280) for bigger stock pills (see STOCK_PILL_W/H) plus a two-row buff
	// readout (see getBuffReadouts/BUFF_ROW_*) with comfortable horizontal room for a longer future
	// label like "LIMIT BREAK!" without crowding the panel's edges or shrinking below readable size.
	const panelW = Math.max(190, 280 * s);
	// Tall enough that name (ends ~26*s) -> reserved buff rows (30*s/41*s) -> pills (start 50*s, end
	// ~73*s at the bigger 23*s-tall pills) -> summon badge (anchored to the bottom, own height
	// ~18*s + 8*s bottom margin) never collide - see drawPlayerHudPanel's own spacing comments.
	// 112*s leaves a clean few pixels of breathing room between the pills row and the badge even at
	// the smallest stock-pill layout.
	const panelH = Math.max(96, 112 * s);
	const panelY = 10 * s;

	drawPlayerHudPanel(margin, panelY, panelW, panelH, p1Label, p1IsAI, p1, p1SummonCooldown, "#5dd0ff", "#1c5570", false, s);
	drawPlayerHudPanel(GAME_W - margin - panelW, panelY, panelW, panelH, p2Label, p2IsAI, p2, p2SummonCooldown, "#ff9d5d", "#8a4a22", true, s);
}

function drawWinnerBanner(winnerLabel, fadeProgress = 1) {
	ctx.save();
	ctx.globalAlpha = fadeProgress;
	ctx.fillStyle = "rgba(0,0,0,0.5)";
	ctx.fillRect(0, 0, GAME_W, GAME_H);
	ctx.textAlign = "center";
	ctx.fillStyle = "#ffffff";
	ctx.font = "bold 42px 'All Around The World', monospace";
	ctx.fillText(`${winnerLabel} WINS`, GAME_W / 2, GAME_H / 2 - 10);
	ctx.font = "16px 'All Around The World', monospace";
	ctx.fillStyle = "#ffb238";
	ctx.fillText("ENTER: rematch      ESC: character select", GAME_W / 2, GAME_H / 2 + 26);
	ctx.restore();
}

// ===================== Pause menu / movelist =====================
// Xbox 360 face-button glyphs matching readGamepadInput()'s own light/medium/heavy/special mapping
// (A/X/Y/B) - see the gamepad.js comment block above for the full button-index table.
const BUTTON_GLYPH = { light: "A", medium: "X", heavy: "Y", special: "B" };
// CommandBuffer's two recognized motions (see CommandBuffer.match() / moveset.json's commandMoves) -
// qcf/qcb are always relative to the character's own facing, same as a real fighting game's
// "quarter-circle forward/back" notation, so this arrow sequence reads correctly for either player.
const MOTION_GLYPH = { qcf: "↓↘→", qcb: "↓↙←" }; // qcf: down,down-fwd,fwd | qcb: down,down-back,back

// Static control hint per FULL_ATTACK_SLOTS key, describing exactly how Character.resolveAttackSlot()
// turns a held direction + attack tier into that slot - this resolution logic is shared by every
// character (it's engine-level, not per-character data), so the hint text itself never changes;
// only *which* of these rows actually show up is per-character, driven by buildMovelist() below
// only including slots the given character's moveset.json actually defines.
const SLOT_CONTROL_HINTS = {
	jab: "A",
	ftilt: "A + →",
	utilt: "A + ↑",
	dtilt: "A + ↓",
	dashAttack: "Dash →, then A",
	crouchAttack: "Hold Block + A",
	fsmash: "Y",
	usmash: "Y + ↑",
	dsmash: "Y + ↓",
	nair: "A/X/Y/B (in air)",
	fair: "A/X/Y/B + → (in air)",
	bair: "A/X/Y/B + ← (in air)",
	uair: "A/X/Y/B + ↑ (in air)",
	dair: "A/X/Y/B + ↓ (in air)",
	specialN: "B",
	specialS: "B + →",
	specialU: "B + ↑",
	specialD: "B + ↓",
	specialNAir: "B (in air)",
	specialSAir: "B + → (in air)",
	specialUAir: "B + ↑ (in air)",
	specialDAir: "B + ↓ (in air)",
};

// Generic Smash-style fallback name per slot, used only when a move has no explicit "label" of its
// own in moveset.json (most of the basic 18-slot moveset - jab/tilts/smashes/aerials - describes
// itself via attackType instead; specials/hypers usually do carry a real custom label). Same table
// for every character, so this "populates" generically too.
const SLOT_DISPLAY_NAMES = {
	jab: "Jab", ftilt: "Forward Tilt", utilt: "Up Tilt", dtilt: "Down Tilt",
	dashAttack: "Dash Attack", crouchAttack: "Crouch Attack",
	fsmash: "Forward Smash", usmash: "Up Smash", dsmash: "Down Smash",
	nair: "Neutral Air", fair: "Forward Air", bair: "Back Air", uair: "Up Air", dair: "Down Air",
	specialN: "Neutral Special", specialS: "Side Special", specialU: "Up Special", specialD: "Down Special",
	specialNAir: "Neutral Special (Air)", specialSAir: "Side Special (Air)", specialUAir: "Up Special (Air)", specialDAir: "Down Special (Air)",
};

/** Builds this character's movelist for the pause overlay, purely from what it actually has: every
 * FULL_ATTACK_SLOTS entry present in character.moveset (real melee/projectile/sweep moves - pose
 * slots like idle/crouch are never in this table, see buildSlotMoveset()) plus every motion-input
 * combo in character.commandMoveDefs (moveset.json's optional commandMoves.moves[]). A character
 * with a smaller moveset.json (or none at all - the legacy roster) just gets a shorter list; nothing
 * here is tied to any one character, so this "populates" correctly for any character's moveset.json. */
function buildMovelist(character) {
	const entries = [];
	for (const slot of FULL_ATTACK_SLOTS) {
		const move = character.moveset[slot];
		if (!move) continue;
		entries.push({ label: move.label || SLOT_DISPLAY_NAMES[slot] || slot, control: SLOT_CONTROL_HINTS[slot] || "?" });
	}
	for (const cm of character.commandMoveDefs) {
		if (!cm || !cm.command) continue;
		const motion = MOTION_GLYPH[cm.command.motion] || cm.command.motion || "";
		const button = BUTTON_GLYPH[cm.command.button] || cm.command.button || "";
		entries.push({ label: cm.label || cm.key, control: `${motion} + ${button}` });
	}
	return entries;
}

function drawPauseOverlay(p1, p2, p1Label, p2Label) {
	ctx.save();
	ctx.fillStyle = "rgba(0,0,0,0.84)";
	ctx.fillRect(0, 0, GAME_W, GAME_H);

	ctx.textAlign = "center";
	ctx.fillStyle = "#ffffff";
	ctx.font = "bold 26px 'All Around The World', monospace";
	ctx.fillText("PAUSED", GAME_W / 2, 40);
	ctx.font = "12px 'All Around The World', monospace";
	ctx.fillStyle = "#ffb238";
	ctx.fillText("MOVE LIST - Xbox 360 controls", GAME_W / 2, 60);

	const colWidth = GAME_W / 2 - 50;
	const startY = 92;
	const lineH = 15;
	const maxY = GAME_H - 90; // leaves room for the utility-controls footer below

	function drawColumn(x, label, color, character) {
		ctx.textAlign = "left";
		ctx.font = "bold 15px 'All Around The World', monospace";
		ctx.fillStyle = color;
		ctx.fillText(label, x, startY);
		const moves = buildMovelist(character);
		ctx.font = "11px 'All Around The World', monospace";
		let y = startY + 22;
		for (const m of moves) {
			if (y > maxY) break; // safety clip - not expected to trigger with the current movesets
			ctx.textAlign = "left";
			ctx.fillStyle = "#ffffff";
			ctx.fillText(m.label, x, y);
			ctx.textAlign = "right";
			ctx.fillStyle = "#ffd75d";
			ctx.fillText(m.control, x + colWidth, y);
			y += lineH;
		}
		if (!moves.length) {
			ctx.textAlign = "left";
			ctx.fillStyle = "#888888";
			ctx.fillText("(no moveset.json - legacy single-move-per-tier character)", x, y);
		}
	}

	drawColumn(30, `${p1Label} (P1)`, "#5dd0ff", p1);
	drawColumn(GAME_W / 2 + 20, `${p2Label} (P2)`, "#ff9d5d", p2);

	ctx.textAlign = "center";
	ctx.font = "12px 'All Around The World', monospace";
	ctx.fillStyle = "#ffb238";
	ctx.fillText("Move: Left Stick/D-Pad    Jump: LB    Guard: RT    Down: Crouch    Summon: RB    Taunt: Back", GAME_W / 2, GAME_H - 74);
	ctx.fillText("Keyboard - P1: A/D/W/S/Q/F/G/H/R/T/Y (Q=guard)     P2: Arrows + Slash(guard)/J/K/L/;/O/I", GAME_W / 2, GAME_H - 58);

	// --- Resume / Fullscreen / Quit - mouse click, touch tap, and the gamepad/keyboard equivalent
	// noted in each button's own sub-label all do the same thing, so every input method this game
	// supports has a way to reach all three from here, not just whichever one opened the pause
	// overlay in the first place. ---
	const rects = {};
	const btnW = 220, btnH = 40, btnGap = 24;
	const btnY = GAME_H - btnH - 10;
	const btnStartX = (GAME_W - (btnW * 3 + btnGap * 2)) / 2;

	function drawPauseButton(x, label, sub, accent) {
		drawGlossyPanel(x, btnY, btnW, btnH, 8, "#1c1f2b", accent, "#565b6e", 1.5);
		ctx.textAlign = "center";
		ctx.font = "bold 13px 'All Around The World', monospace";
		ctx.fillStyle = "#ffffff";
		ctx.fillText(label, x + btnW / 2, btnY + 17);
		ctx.font = "9px 'All Around The World', monospace";
		ctx.fillStyle = "#c9cddb";
		ctx.fillText(sub, x + btnW / 2, btnY + 30);
		return { x, y: btnY, w: btnW, h: btnH };
	}

	rects.resumeButton = drawPauseButton(btnStartX, "RESUME", IS_TOUCH ? "tap here \u2022 Start/P/Esc" : "Start / P / Esc", "#3a3f52");
	rects.fullscreenButton = drawPauseButton(
		btnStartX + btnW + btnGap,
		isFullscreenActive() ? "EXIT FULLSCREEN" : "FULLSCREEN",
		IS_TOUCH ? "tap here \u2022 Y button" : "Y button / F",
		"#3a3f52"
	);
	rects.quitButton = drawPauseButton(btnStartX + (btnW + btnGap) * 2, "QUIT TO MENU", IS_TOUCH ? "tap here \u2022 B button" : "B button / Q", "#5a2a2a");

	pauseHitRects = rects;

	ctx.restore();
}

// ===================== Title screen =====================

// ===================== Retro VHS look =====================
// A shared post-process pass (scanlines + film grain + vignette + slight warm tint) drawn on
// top of every screen so the whole game reads as one consistent retro presentation - dialed back
// from an earlier, heavier pass that read as noisy/messy, especially over UI text on the select
// screen. Scanlines can be turned off entirely per-call (see `scanlines` option) for screens that
// need to stay crisp and readable; everything else (grain/tint/vignette) stays uniformly light.

const grainTiles = (() => {
	const tiles = [];
	for (let t = 0; t < 4; t++) {
		const c = document.createElement("canvas");
		c.width = 96;
		c.height = 96;
		const gctx = c.getContext("2d");
		const img = gctx.createImageData(96, 96);
		for (let i = 0; i < img.data.length; i += 4) {
			const v = Math.random() * 255;
			img.data[i] = v;
			img.data[i + 1] = v;
			img.data[i + 2] = v;
			img.data[i + 3] = Math.random() * 16; // was 30 - noticeably grittier than intended
		}
		gctx.putImageData(img, 0, 0);
		tiles.push(c);
	}
	return tiles;
})();

// ===== Twinkling top-edge stars =====
// A decorative screen-space overlay drawn AFTER the camera-transformed world (see the match draw
// loop's call site, right after ctx.restore()) so it never pans/zooms with the stage - a scattering
// of small twinkling stars hugging the very top edge of the frame, matching this game's space/
// EVA-toned aesthetic (see the breakout block palette's own comment) rather than the "comic page
// burning" flame look this replaced. TOP edge only, by design - same as before; the bottom/left/
// right edges stay clean. Every star's position/twinkle phase is derived directly from `now` and
// its own fixed per-star seed (the same technique the platform sway and block idle-bob elsewhere
// in this file already use) rather than a separately-ticked dt-integrated simulation, so this needs
// no per-frame update() call of its own - just draw, every frame, from whatever `now` currently is.
const TOP_STAR_COUNT = 60;
const topStarSeeds = (() => {
	const seeds = [];
	for (let i = 0; i < TOP_STAR_COUNT; i++) {
		seeds.push({
			xFrac: Math.random(),
			yBand: Math.random() * 56, // how far down from the true top edge this star sits
			size: 1 + Math.random() * 2.2,
			twinkleDuration: 900 + Math.random() * 2200, // ms per full brighten-dim cycle, staggered by `phase` below
			phase: Math.random() * 100000,
			sparkle: Math.random() < 0.16, // a handful get a bigger four-point cross-flare instead of a plain dot
		});
	}
	return seeds;
})();

/** Draws the whole top-edge twinkling-star field - see the section comment above for the overall
 * approach. Additive ("lighter") blending so overlapping stars brighten toward white where they
 * happen to sit close together, same as ImpactFX's own sparks elsewhere in this file, and no
 * ctx.shadowBlur anywhere (real canvas cost for very little extra glow over what a small radial
 * gradient already gives for free). */
function drawBurningBorder(ctx, now) {
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	for (const s of topStarSeeds) {
		const cycle = ((now + s.phase) % s.twinkleDuration) / s.twinkleDuration; // 0..1, loops forever
		// Never fully off - a real star still glimmers at its dimmest, just doesn't vanish and pop
		// back like a hard on/off blink would.
		const twinkle = 0.25 + 0.75 * Math.abs(Math.sin(cycle * Math.PI));
		const x = s.xFrac * GAME_W;
		const y = s.yBand;
		const size = s.size * (0.7 + twinkle * 0.5);
		ctx.globalAlpha = twinkle;
		ctx.fillStyle = "#eaf3ff";
		if (s.sparkle) {
			ctx.strokeStyle = "#eaf3ff";
			ctx.lineWidth = Math.max(0.6, size * 0.35);
			ctx.beginPath();
			ctx.moveTo(x - size * 2.6, y);
			ctx.lineTo(x + size * 2.6, y);
			ctx.moveTo(x, y - size * 2.6);
			ctx.lineTo(x, y + size * 2.6);
			ctx.stroke();
		}
		ctx.beginPath();
		ctx.arc(x, y, size, 0, Math.PI * 2);
		ctx.fill();
	}
	ctx.globalAlpha = 1;
	ctx.restore();
}

function applyRetroFX(time, intensity = 1, { scanlines = true } = {}) {
	ctx.save();

	// Scanlines - thinner and more widely spaced than before, and fully skippable.
	if (scanlines) {
		ctx.globalAlpha = 0.07 * intensity;
		ctx.fillStyle = "#000000";
		for (let y = 0; y < GAME_H; y += 4) {
			ctx.fillRect(0, y, GAME_W, 1);
		}
	}

	// Film grain - flickers between a handful of precomputed noise tiles rather than
	// regenerating full-resolution random pixels every frame (expensive for little gain).
	ctx.globalAlpha = 0.28 * intensity;
	const tile = grainTiles[Math.floor(time / 50) % grainTiles.length];
	const pattern = ctx.createPattern(tile, "repeat");
	ctx.fillStyle = pattern;
	ctx.fillRect(0, 0, GAME_W, GAME_H);

	// Warm/green VHS tint
	ctx.globalAlpha = 0.04 * intensity;
	ctx.globalCompositeOperation = "multiply";
	ctx.fillStyle = "#bfe8c8";
	ctx.fillRect(0, 0, GAME_W, GAME_H);
	ctx.globalCompositeOperation = "source-over";

	// Vignette - softer and pushed further out than before so it frames the screen without
	// darkening the readable center.
	const grad = ctx.createRadialGradient(
		GAME_W / 2, GAME_H / 2, GAME_H * 0.45,
		GAME_W / 2, GAME_H / 2, GAME_H * 0.85
	);
	grad.addColorStop(0, "rgba(0,0,0,0)");
	grad.addColorStop(1, `rgba(0,0,0,${0.32 * intensity})`);
	ctx.globalAlpha = 1;
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, GAME_W, GAME_H);

	ctx.restore();
}

// ===================== Starfield =====================

let stars = [];
function ensureStars() {
	const target = Math.floor((GAME_W * GAME_H) / 9000);
	if (stars.length === target) return;
	stars = [];
	for (let i = 0; i < target; i++) {
		stars.push({
			x: Math.random(),
			y: Math.random(),
			size: 1 + Math.random() * 1.8,
			phase: Math.random() * Math.PI * 2,
			speed: 1.5 + Math.random() * 2.5,
		});
	}
}
function drawStars(time) {
	ensureStars();
	ctx.save();
	for (const s of stars) {
		const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(time / 500 * s.speed + s.phase));
		ctx.globalAlpha = twinkle;
		ctx.fillStyle = "#ffffff";
		const x = s.x * GAME_W;
		const y = s.y * GAME_H;
		const sz = s.size;
		ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
		if (twinkle > 0.85) {
			// occasional cross-shaped sparkle on the brightest twinkle frames
			ctx.fillRect(x - sz * 1.6, y - 0.5, sz * 3.2, 1);
			ctx.fillRect(x - 0.5, y - sz * 1.6, 1, sz * 3.2);
		}
	}
	ctx.restore();
}

const IS_TOUCH = "ontouchstart" in window || navigator.maxTouchPoints > 0;
// Forgiveness margin added around every UI button's hit rect (see pointInRect()) - buttons used to
// require a literally pixel-perfect tap/click inside their exact drawn bounds, which read as
// "unresponsive" for anything landing even a few px outside the visible glyph/label, especially on
// a phone touchscreen where a fingertip is much less precise than a mouse cursor. Expressed in
// fixed 1280x720 GAME_W/GAME_H logical space (same space toGameCoords() converts every pointer
// event into), so this stays the same effective on-screen forgiveness regardless of real device
// resolution/DPR/window size - it doesn't need separate handling per display.
const HIT_PAD = IS_TOUCH ? 18 : 10;

function drawTitleCustom(dx, dy, dw, dh) {
	if (!titleCustomImg.complete || titleCustomImg.naturalWidth === 0) return false;
	ctx.imageSmoothingEnabled = false; // plain cover-fit, matches the "no upscaling experiment" look everywhere else
	ctx.drawImage(titleCustomImg, 0, 0, TITLE_CUSTOM_SIZE.w, TITLE_CUSTOM_SIZE.h, dx, dy, dw, dh);
	return true;
}

// Datamosh-style glitch: every GLITCH_PERIOD_MS the title art gets briefly torn into horizontal
// bands that jump sideways, plus a quick red/cyan color flash, then settles back to normal - a
// short, self-contained post-process pass over whatever's already been drawn to the canvas (no
// separate buffer needed since it's just re-blitting slices of the canvas onto itself). Runs on
// a plain time-based cycle so it repeats automatically for as long as the title screen is up.
const GLITCH_PERIOD_MS = 10000;
const GLITCH_DURATION_MS = 450;
function applyTitleDatamoshGlitch(t, dx, dy, dw, dh) {
	const cyclePos = t % GLITCH_PERIOD_MS;
	if (cyclePos >= GLITCH_DURATION_MS) return;
	// Ramps up then back down across the glitch window (0 -> 1 -> 0) instead of an abrupt on/off,
	// so it reads as a glitch "hit" rather than a hard flicker cut.
	const intensity = Math.sin((cyclePos / GLITCH_DURATION_MS) * Math.PI);

	const bandCount = 14;
	const bandH = Math.ceil(dh / bandCount);
	for (let i = 0; i < bandCount; i++) {
		if (Math.random() > 0.5) continue; // not every band tears on every frame
		const y = dy + i * bandH;
		const h = Math.min(bandH, dy + dh - y);
		if (h <= 0) continue;
		const maxShift = 44 * intensity;
		const shiftX = (Math.random() * 2 - 1) * maxShift;
		ctx.drawImage(canvas, dx, y, dw, h, dx + shiftX, y, dw, h);
	}

	// Quick chromatic-aberration-style color flash on top of the torn bands.
	ctx.save();
	ctx.globalAlpha = 0.16 * intensity;
	ctx.globalCompositeOperation = "lighter";
	ctx.fillStyle = "#ff2050";
	ctx.fillRect(dx - 5 * intensity, dy, dw, dh);
	ctx.fillStyle = "#20d0ff";
	ctx.fillRect(dx + 5 * intensity, dy, dw, dh);
	ctx.restore();
}

function drawTitleScreen(t) {
	ctx.fillStyle = "#000000";
	ctx.fillRect(0, 0, GAME_W, GAME_H);
	drawStars(t);

	// Stretched to exactly fill the canvas - no cropping, no letterbox bars, at the cost of a
	// mild (non-uniform) stretch since the source art's own aspect ratio isn't 16:9. Previously
	// this was cover-fit + cropped, which was cutting off meaningful parts of the art at the top
	// and bottom on a 1280x720 canvas.
	const dw = GAME_W;
	const dh = GAME_H;
	const dx = 0;
	const dy = 0;
	const ok = drawTitleCustom(dx, dy, dw, dh);

	if (ok) {
		// Decorative scrolling light streaks along both edges - unchanged from before.
		const avgScale = (dw / TITLE_CUSTOM_SIZE.w + dh / TITLE_CUSTOM_SIZE.h) / 2;
		const stripW = SYS.titleStrip.w * avgScale;
		const stripH = SYS.titleStrip.h * avgScale;
		const scroll = (t / 12) % stripH;
		ctx.save();
		ctx.globalAlpha = 0.55;
		ctx.globalCompositeOperation = "lighter";
		for (const sx of [dx + dw * 0.03, dx + dw * 0.97 - stripW]) {
			for (let y = dy - stripH + scroll; y < dy + dh; y += stripH) {
				drawSys("titleStrip", sx, y, stripW, stripH);
			}
		}
		ctx.restore();

		// Periodic datamosh glitch over the art+streaks, then it settles back to normal on its own.
		applyTitleDatamoshGlitch(t, dx, dy, dw, dh);
	} else {
		// Art not loaded yet - simple placeholder so the screen isn't blank.
		ctx.textAlign = "center";
		ctx.fillStyle = "#ffffff";
		ctx.font = "bold 32px 'All Around The World', monospace";
		ctx.fillText("K.O. BREAKER", GAME_W / 2, GAME_H / 2);
	}

	ctx.fillStyle = "rgba(0,0,0,0.55)";
	ctx.fillRect(0, GAME_H - 60, GAME_W, 60);
	ctx.textAlign = "center";
	ctx.font = "bold 18px 'All Around The World', monospace";
	ctx.fillStyle = Math.sin(t / 300) > 0 ? "#ffffff" : "#888888";
	ctx.fillText(IS_TOUCH ? "TAP TO START" : "PRESS ANY KEY TO START", GAME_W / 2, GAME_H - 24);

	applyRetroFX(t, 0.85, { scanlines: false });
}

function runTitleScreen(onDone) {
	let done = false;
	function start() {
		if (done) return;
		done = true;
		window.removeEventListener("keydown", start);
		canvas.removeEventListener("pointerdown", start);
		onDone();
	}
	window.addEventListener("keydown", start);
	canvas.addEventListener("pointerdown", start);
	function loop(t) {
		if (done) return;
		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(loop);
			return;
		}
		drawTitleScreen(t);
		requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
}

// ===================== Character select =====================
// select = { p1: rosterIndex, p2: rosterIndex, active: "p1" | "p2" }. Whichever slot is
// "active" is the one the big carousel currently shows/edits - keyboard (A/D for P1,
// arrow keys for P2) and pointer input (tapping a tab, or swiping/tapping the carousel while
// that tab is active) both just drive select.p1/select.p2/select.active directly, so there's
// a single source of truth regardless of input method. No ready/confirm gating anymore: AI vs
// AI is a fully valid, always-startable default, so FIGHT is available immediately.

// Hit-test rects for the current frame's layout, refreshed every draw call and read back by the
// pointer handlers in runSelectScreen() - simplest way to keep hit-testing in sync with a layout
// that reflows per screen size without duplicating the layout math in two places.
let selectHitRects = {};

function drawPlayerTab(x, y, w, h, label, isAI, charName, color, isActive, s) {
	if (isActive) {
		drawGlossyPanel(x, y, w, h, 8 * s, "#1b2030", "#333c58", color, 2 * s);
	} else {
		roundRectPath(x, y, w, h, 8 * s);
		ctx.fillStyle = "#171a24";
		ctx.fill();
		ctx.strokeStyle = "#33384a";
		ctx.lineWidth = 1;
		ctx.stroke();
	}

	ctx.textAlign = "left";
	ctx.fillStyle = color;
	ctx.font = `bold ${Math.max(10, 13 * s)}px 'All Around The World', monospace`;
	ctx.fillText(label, x + 14 * s, y + 21 * s);
	ctx.fillStyle = "#ffffff";
	ctx.font = `${Math.max(9, 12 * s)}px 'All Around The World', monospace`;
	ctx.fillText(charName, x + 14 * s, y + h - 13 * s);

	const chipW = Math.max(50, 68 * s), chipH = Math.max(22, 24 * s);
	const chipX = x + w - chipW - 10 * s, chipY = y + h / 2 - chipH / 2;
	if (isAI) {
		drawGlossyPanel(chipX, chipY, chipW, chipH, chipH / 2, "#2a2d3a", "#464c66", "#565b6e", Math.max(1, 1.5 * s));
		ctx.fillStyle = "#cfd3e6";
	} else {
		drawGlossyPanel(chipX, chipY, chipW, chipH, chipH / 2, color, "#ffffff", "#14151c", Math.max(1, 1.5 * s));
		ctx.fillStyle = "#0b0c10";
	}
	ctx.font = `bold ${Math.max(9, 11 * s)}px 'All Around The World', monospace`;
	ctx.textAlign = "center";
	ctx.fillText(isAI ? "AI" : "HUMAN", chipX + chipW / 2, chipY + chipH / 2 + 4 * s);
	ctx.textAlign = "left";

	return { tab: { x, y, w, h }, chip: { x: chipX, y: chipY, w: chipW, h: chipH } };
}

function drawPortraitCard(cx, topY, w, h, key, color, alpha, highlighted, portraitScaleMul, s) {
	ctx.save();
	ctx.globalAlpha = alpha;
	roundRectPath(cx - w / 2, topY, w, h, 10 * s);
	ctx.fillStyle = "#14151c";
	ctx.fill();
	if (highlighted) {
		ctx.shadowColor = color;
		ctx.shadowBlur = 16;
	}
	ctx.strokeStyle = highlighted ? color : "#33384a";
	ctx.lineWidth = highlighted ? 3 : 1;
	roundRectPath(cx - w / 2, topY, w, h, 10 * s);
	ctx.stroke();
	ctx.shadowBlur = 0;
	// Clip to the card so a tall character (see PORTRAIT_SCALE_UNIT notes) never draws outside
	// its own rounded rect into a neighboring card or the tabs above.
	roundRectPath(cx - w / 2, topY, w, h, 10 * s);
	ctx.clip();
	drawPortrait(key, cx, topY, w, h, topY + h - 8 * s, portraitScaleMul);
	ctx.restore();

	if (highlighted) {
		ctx.textAlign = "center";
		ctx.fillStyle = "#ffffff";
		ctx.font = `bold ${Math.max(11, 16 * s)}px 'All Around The World', monospace`;
		ctx.fillText(CHARACTER_NAMES[key], cx, topY + h + 22 * s);

		// Category readout - small pill tucked inside the card's own top-left corner. Only ever
		// drawn for the highlighted (center) card, and stays fully inside that card's own
		// rounded-rect bounds (never over the name label below, which lives below topY+h, or the
		// prev/next side cards, which sit outside this card's x-range entirely).
		const badgeLabel = categoryOf(key).toUpperCase();
		const badgeFont = Math.max(8, 10 * s);
		ctx.font = `bold ${badgeFont}px 'All Around The World', monospace`;
		const badgePadX = 8 * s;
		const badgeW = ctx.measureText(badgeLabel).width + badgePadX * 2;
		const badgeH = Math.max(15, 18 * s);
		const badgeX = cx - w / 2 + 8 * s;
		const badgeY = topY + 8 * s;
		roundRectPath(badgeX, badgeY, badgeW, badgeH, badgeH / 2);
		ctx.fillStyle = "#0b0c10cc";
		ctx.fill();
		ctx.strokeStyle = color;
		ctx.lineWidth = 1.5;
		ctx.stroke();
		ctx.fillStyle = color;
		ctx.textAlign = "center";
		ctx.fillText(badgeLabel, badgeX + badgeW / 2, badgeY + badgeH / 2 + badgeFont / 3);
	}
}

// Baseline "designed at" viewport - the whole screen scales down uniformly from this by however
// much smaller the real canvas is, so every element (fonts, cards, gaps, buttons) shrinks
// together and stays non-overlapping instead of any one piece independently overflowing.
const SELECT_BASELINE_W = 760;
const SELECT_BASELINE_H = 600;

function drawSelectScreen(select) {
	const time = performance.now();
	// Single continuous scale factor instead of one hard breakpoint - fits any aspect ratio
	// (including short mobile-landscape viewports) instead of just "wide desktop" vs "narrow
	// phone". Floor of 0.62 keeps tap targets usable even on very small/cramped screens.
	const s = Math.max(0.62, Math.min(1, GAME_W / SELECT_BASELINE_W, GAME_H / SELECT_BASELINE_H));
	const compact = s < 0.8; // swap to shorter copy at small sizes rather than shrinking text past readable
	const rects = {};

	ctx.fillStyle = "#0b0c10";
	ctx.fillRect(0, 0, GAME_W, GAME_H);
	drawStars(time);

	let y = 14 * s;
	const titleSize = Math.max(15, 26 * s);
	ctx.textAlign = "center";
	ctx.fillStyle = "#ffffff";
	ctx.font = `bold ${titleSize}px 'All Around The World', monospace`;
	ctx.fillText("CHARACTER SELECT", GAME_W / 2, y + titleSize);
	y += titleSize + 8 * s;

	const subSize = Math.max(8, 11 * s);
	ctx.font = `${subSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#ffb238";
	ctx.fillText(
		compact
			? (IS_TOUCH ? "Tap a tab, swipe to browse, tap FIGHT" : "A/D or \u2190/\u2192 browse \u2022 ENTER to fight")
			: IS_TOUCH
			? "Tap a tab to choose who's playing \u2022 swipe or tap the arrows to browse \u2022 tap RANDOM or FIGHT"
			: "A/D or \u2190/\u2192 to browse \u2022 tap a tab, or press 1/2, to toggle AI/HUMAN \u2022 R for random \u2022 ENTER to fight",
		GAME_W / 2,
		y + subSize
	);
	y += subSize + 12 * s;

	// --- P1 / P2 tabs ---
	const tabH = Math.max(38, 46 * s);
	const tabGap = 12 * s;
	const tabW = Math.min(320 * s, (GAME_W - 40 - tabGap) / 2);
	const tabY = y;
	const tabsStartX = (GAME_W - (tabW * 2 + tabGap)) / 2;
	const p1TabHit = drawPlayerTab(tabsStartX, tabY, tabW, tabH, "PLAYER 1", p1IsAI, CHARACTER_NAMES[ROSTER[select.p1]], "#5dd0ff", select.active === "p1", s);
	const p2TabHit = drawPlayerTab(tabsStartX + tabW + tabGap, tabY, tabW, tabH, "PLAYER 2", p2IsAI, CHARACTER_NAMES[ROSTER[select.p2]], "#ff9d5d", select.active === "p2", s);
	rects.p1Tab = p1TabHit.tab;
	rects.p1Chip = p1TabHit.chip;
	rects.p2Tab = p2TabHit.tab;
	rects.p2Chip = p2TabHit.chip;
	y = tabY + tabH + 20 * s;

	// --- Carousel for whichever slot is active ---
	const activeColor = select.active === "p1" ? "#5dd0ff" : "#ff9d5d";
	const activeIdx = select[select.active];
	// Sized much bigger than the old 150x180 - there was a large unused vertical gap between the
	// carousel and the difficulty chip/FIGHT button at every screen size (FIGHT is bottom-anchored
	// to the real canvas height, so that gap just sat empty). Roughly 2x on both axes; checked the
	// side-card + chevron-arrow horizontal spread still leaves a healthy margin on both edges, and
	// the difficulty chip still lands well above the FIGHT button with room to spare.
	// Matches the fixed 360x384 avatar portrait size 1:1 (see character-mapper.html's AVATAR_W/
	// AVATAR_H) - the shipped avatar.png cover-fits this box exactly, no runtime crop surprises.
	const cardW = 360 * s;
	const cardH = 384 * s;
	const sideScale = 0.62;
	const gap = 24 * s;
	const carouselCenterY = y;
	const cx = GAME_W / 2;
	const portraitScaleMul = PORTRAIT_SCALE_UNIT * s;

	const prevIdx = (activeIdx - 1 + ROSTER.length) % ROSTER.length;
	const nextIdx = (activeIdx + 1) % ROSTER.length;
	const sideW = cardW * sideScale, sideH = cardH * sideScale;
	const sideTopY = carouselCenterY + (cardH - sideH) / 2;
	const prevCx = cx - cardW / 2 - gap - sideW / 2;
	const nextCx = cx + cardW / 2 + gap + sideW / 2;

	drawPortraitCard(prevCx, sideTopY, sideW, sideH, ROSTER[prevIdx], "#555566", 0.5, false, portraitScaleMul * sideScale, s);
	drawPortraitCard(nextCx, sideTopY, sideW, sideH, ROSTER[nextIdx], "#555566", 0.5, false, portraitScaleMul * sideScale, s);
	drawPortraitCard(cx, carouselCenterY, cardW, cardH, ROSTER[activeIdx], activeColor, 1, true, portraitScaleMul, s);

	rects.prevCard = { x: prevCx - sideW / 2, y: sideTopY, w: sideW, h: sideH };
	rects.nextCard = { x: nextCx - sideW / 2, y: sideTopY, w: sideW, h: sideH };
	rects.carouselZone = { x: cx - cardW / 2 - gap - sideW, y: carouselCenterY, w: (cardW / 2 + gap + sideW) * 2, h: cardH };

	// Chevron arrows, drawn just outside the side cards - also tappable/clickable.
	const arrowY = carouselCenterY + cardH / 2;
	const arrowSize = Math.max(18, 30 * s);
	ctx.textAlign = "center";
	ctx.font = `bold ${arrowSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#5dd0ff88";
	const leftArrowX = prevCx - sideW / 2 - Math.max(16, 26 * s);
	const rightArrowX = nextCx + sideW / 2 + Math.max(16, 26 * s);
	ctx.fillText("\u25C0", leftArrowX, arrowY + arrowSize / 3);
	ctx.fillText("\u25B6", rightArrowX, arrowY + arrowSize / 3);
	rects.leftArrow = { x: leftArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };
	rects.rightArrow = { x: rightArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };

	// The highlighted card's name label is drawn below the card itself (see drawPortraitCard,
	// at cardBottom + 22*s, using this same font size) - budget for its own height here too
	// before placing the difficulty chip, otherwise the chip and the name text sit at the exact
	// same y and overlap.
	const nameLabelFont = Math.max(11, 16 * s);
	y = carouselCenterY + cardH + 22 * s + nameLabelFont + 14 * s;

	// --- Difficulty chip (affects both AI slots) ---
	const diffLabel = `DIFFICULTY: ${difficultyOrder[difficultyIndex].toUpperCase()}`;
	const diffFont = Math.max(9, 12 * s);
	ctx.font = `bold ${diffFont}px 'All Around The World', monospace`;
	const diffW = ctx.measureText(diffLabel).width + 26 * s;
	const diffH = Math.max(20, 26 * s);
	const diffX = cx - diffW / 2;
	const diffY = y;
	drawGlossyPanel(diffX, diffY, diffW, diffH, diffH / 2, "#1a1d28", "#363c52", "#565b6e", Math.max(1, 1.5 * s));
	ctx.fillStyle = "#ffd75d";
	ctx.textAlign = "center";
	ctx.fillText(diffLabel, cx, diffY + diffH / 2 + 4 * s);
	rects.diffChip = { x: diffX, y: diffY, w: diffW, h: diffH };

	// --- RANDOM chip - randomizes whichever player's tab is currently active (select.active),
	// same "only the active slot" scope the arrows/side-cards above already have, rather than
	// re-rolling both players at once (which the AI/HUMAN chips and browse arrows don't do either). ---
	const randY = diffY + diffH + Math.max(8, 12 * s);
	const randLabel = "RANDOM";
	const randFont = Math.max(9, 12 * s);
	ctx.font = `bold ${randFont}px 'All Around The World', monospace`;
	const randW = ctx.measureText(randLabel).width + 26 * s;
	const randH = Math.max(20, 26 * s);
	const randX = cx - randW / 2;
	drawGlossyPanel(randX, randY, randW, randH, randH / 2, "#1a1d28", "#363c52", "#565b6e", Math.max(1, 1.5 * s));
	ctx.fillStyle = "#ffd75d";
	ctx.textAlign = "center";
	ctx.fillText(randLabel, cx, randY + randH / 2 + 4 * s);
	rects.randomChip = { x: randX, y: randY, w: randW, h: randH };

	// --- Rounds chip (how many stocks/lives each fighter starts with, i.e. "best of N" length -
	// each stock lost plays a real ROUND->FIGHT intro again, see RoundFightKO) - a stepper with
	// its own tappable -/+ zones flanking the number, rather than a single cycling chip like
	// difficulty above, since 1-10 is too wide a range to want to click-cycle through one at a
	// time past the value you actually meant to land on. ---
	const roundsY = randY + randH + Math.max(8, 12 * s);
	const roundsLabel = `ROUNDS: ${roundsCount}`;
	const roundsFont = Math.max(9, 12 * s);
	ctx.font = `bold ${roundsFont}px 'All Around The World', monospace`;
	const roundsNumW = ctx.measureText(roundsLabel).width + 26 * s;
	const roundsH = Math.max(20, 26 * s);
	const stepBtnW = roundsH; // square -/+ buttons, same height as the chip
	const roundsTotalW = roundsNumW + (stepBtnW + Math.max(4, 6 * s)) * 2;
	const roundsX = cx - roundsTotalW / 2;
	const minusX = roundsX;
	const numChipX = minusX + stepBtnW + Math.max(4, 6 * s);
	const plusX = numChipX + roundsNumW + Math.max(4, 6 * s);

	const minusDisabled = roundsCount <= ROUNDS_MIN;
	const plusDisabled = roundsCount >= ROUNDS_MAX;
	drawGlossyPanel(minusX, roundsY, stepBtnW, roundsH, roundsH / 2, minusDisabled ? "#15161d" : "#1a1d28", minusDisabled ? "#22242e" : "#363c52", "#565b6e", Math.max(1, 1.5 * s));
	drawGlossyPanel(numChipX, roundsY, roundsNumW, roundsH, roundsH / 2, "#1a1d28", "#363c52", "#565b6e", Math.max(1, 1.5 * s));
	drawGlossyPanel(plusX, roundsY, stepBtnW, roundsH, roundsH / 2, plusDisabled ? "#15161d" : "#1a1d28", plusDisabled ? "#22242e" : "#363c52", "#565b6e", Math.max(1, 1.5 * s));
	ctx.fillStyle = minusDisabled ? "#4a4d5a" : "#ffd75d";
	ctx.fillText("\u2212", minusX + stepBtnW / 2, roundsY + roundsH / 2 + 4 * s);
	ctx.fillStyle = "#ffd75d";
	ctx.fillText(roundsLabel, numChipX + roundsNumW / 2, roundsY + roundsH / 2 + 4 * s);
	ctx.fillStyle = plusDisabled ? "#4a4d5a" : "#ffd75d";
	ctx.fillText("+", plusX + stepBtnW / 2, roundsY + roundsH / 2 + 4 * s);
	rects.roundsMinus = { x: minusX, y: roundsY, w: stepBtnW, h: roundsH };
	rects.roundsPlus = { x: plusX, y: roundsY, w: stepBtnW, h: roundsH };
	y = roundsY + roundsH;

	// --- FIGHT button - bottom-anchored to the real canvas height (not the scaled baseline), so
	// it always sits a comfortable fixed distance from the true bottom edge regardless of how
	// much empty space is left below the (scaled) content above. ---
	const fightW = Math.max(150, 240 * s);
	const fightH = Math.max(40, 52 * s);
	const fightY = GAME_H - fightH - Math.max(16, 26 * s);
	const fightX = cx - fightW / 2;
	const pulse = 0.5 + 0.5 * Math.sin(time / 260);
	ctx.save();
	ctx.shadowColor = "#5dd0ff";
	ctx.shadowBlur = 10 + pulse * 10;
	drawGlossyPanel(fightX, fightY, fightW, fightH, fightH / 2, "#1f7fb8", "#7fe0ff", "#5dd0ff", 2);
	ctx.restore();
	ctx.fillStyle = "#06222e";
	ctx.font = `bold ${Math.max(14, 20 * s)}px 'All Around The World', monospace`;
	ctx.textAlign = "center";
	ctx.fillText("FIGHT", cx, fightY + fightH / 2 + 7 * s);
	rects.fightButton = { x: fightX, y: fightY, w: fightW, h: fightH };

	if (!compact) {
		// Anchored to content flow (right below the rounds chip) rather than a fixed offset
		// above the FIGHT button - a fixed offset is what let this text sit on top of the
		// rounds stepper once that row pushed the layout taller. Only actually drawn if there's
		// real clearance before the button; on a cramped layout the button's own label already
		// says what to do, so the hint just quietly drops rather than crowding/overlapping it.
		const hintFont = Math.max(9, 11 * s);
		const hintY = y + hintFont + 10 * s;
		if (hintY < fightY - 10 * s) {
			ctx.font = `${hintFont}px 'All Around The World', monospace`;
			ctx.fillStyle = "#666666";
			ctx.fillText(IS_TOUCH ? "or tap here" : "or press ENTER", cx, hintY);
		}
	}

	// Category filter chip - top-LEFT corner, mirroring the fullscreen toggle's fixed top-right
	// placement below. Lives in its own empty corner (title/subtitle are center-aligned and never
	// reach this far out, see the "CHARACTER SELECT" fillText above) so it can never overlap any
	// other control, and its own fixed height means it never pushes the tabs/carousel/FIGHT flow
	// below it around either - purely an overlay in unused screen space, same pattern the
	// fullscreen button already uses. Tapping/clicking it cycles buildCategoryList(); label always
	// reflects the current filter ("ALL" when unfiltered).
	const catList = buildCategoryList();
	const filterLabel = selectFilterCategory.toUpperCase();
	const filterFont = Math.max(9, 12 * s);
	ctx.font = `bold ${filterFont}px 'All Around The World', monospace`;
	const filterPadX = 12 * s;
	const filterW = Math.max(90 * s, ctx.measureText(filterLabel).width + filterPadX * 2 + 18 * s);
	const filterH = Math.max(28, 34 * s);
	const filterX = 10, filterY = 10;
	drawGlossyPanel(filterX, filterY, filterW, filterH, filterH / 2, "#1a1d28", "#363c52", "#ffd75d", Math.max(1, 1.5 * s));
	ctx.fillStyle = "#ffd75d";
	ctx.textAlign = "left";
	ctx.fillText(filterLabel, filterX + filterPadX, filterY + filterH / 2 + filterFont / 3);
	// Small cycle-arrow glyph on the right edge of the chip, so it visually reads as a
	// cycle/filter control rather than a plain static label.
	ctx.textAlign = "right";
	ctx.fillText("\u21BB", filterX + filterW - filterPadX * 0.6, filterY + filterH / 2 + filterFont / 3);
	ctx.textAlign = "center";
	if (catList.length > 1) {
		const catSubFont = Math.max(7, 8.5 * s);
		ctx.font = `${catSubFont}px 'All Around The World', monospace`;
		ctx.fillStyle = "#888888";
		ctx.textAlign = "left";
		ctx.fillText("CATEGORY", filterX, filterY + filterH + catSubFont + 3 * s);
	}
	rects.filterChip = { x: filterX, y: filterY, w: filterW, h: filterH };

	// Fullscreen toggle - top-right corner, a fixed small size regardless of the `s` scale factor
	// so it stays a comfortable, consistent tap target even on a cramped layout. Drawn last so it
	// sits on top of everything else on the screen.
	const fsSize = 52, fsPad = 10;
	const fsX = GAME_W - fsSize - fsPad, fsY = fsPad;
	drawGlossyPanel(fsX, fsY, fsSize, fsSize, 12, "#1c1f2b", "#3a3f52", "#565b6e", 2);
	drawFullscreenGlyph(fsX, fsY, fsSize);
	rects.fullscreenButton = { x: fsX, y: fsY, w: fsSize, h: fsSize };
	selectHitRects = rects;

	applyRetroFX(time, 0.7, { scanlines: false });
}

function pointInRect(px, py, r, pad = HIT_PAD) {
	// `pad` grows the effective hit area on all four sides without touching the rect's own
	// drawn x/y/w/h (still used for visuals) - see HIT_PAD's own comment for why. Passing 0
	// explicitly still works for the rare case a caller genuinely wants exact bounds.
	return Boolean(r) && px >= r.x - pad && px <= r.x + r.w + pad && py >= r.y - pad && py <= r.y + r.h + pad;
}

function runSelectScreen(onReady) {
	for (const k of Object.keys(keys)) keys[k] = false;
	const select = { p1: 0, p2: Math.min(1, ROSTER.length - 1), active: "p1" };
	let started = false;

	// Indices into ROSTER that match the current selectFilterCategory ("All" -> every index).
	// Falls back to the full roster if a filter would otherwise leave nothing to pick from (can't
	// actually happen with buildCategoryList() since every category it lists is guaranteed to have
	// at least one member, but kept as a defensive floor so filtering can never soft-lock select).
	function filteredRosterIndices() {
		if (selectFilterCategory === "All") return ROSTER.map((_, i) => i);
		const idxs = [];
		for (let i = 0; i < ROSTER.length; i++) if (categoryOf(ROSTER[i]) === selectFilterCategory) idxs.push(i);
		return idxs.length ? idxs : ROSTER.map((_, i) => i);
	}

	function cycle(slot, dir) {
		const pool = filteredRosterIndices();
		const curPos = pool.indexOf(select[slot]);
		const fromPos = curPos === -1 ? 0 : curPos;
		const nextPos = (fromPos + dir + pool.length) % pool.length;
		select[slot] = pool[nextPos];
		select.active = slot;
	}

	// Snaps a slot's current character onto the filtered pool if the just-changed filter no
	// longer includes it (leaves it alone otherwise) - keeps the on-screen carousel and the
	// prev/next side-cards always showing filter-consistent choices right after cycling the chip.
	function reconcileFilter() {
		const pool = filteredRosterIndices();
		for (const slot of ["p1", "p2"]) {
			if (!pool.includes(select[slot])) select[slot] = pool[0];
		}
	}
	function cycleFilter() {
		const catList = buildCategoryList();
		const curPos = catList.indexOf(selectFilterCategory);
		selectFilterCategory = catList[(curPos + 1 + catList.length) % catList.length];
		reconcileFilter();
	}
	function startFight() {
		if (started) return;
		started = true;
		selectKeyHandlerFn = null;
		canvas.removeEventListener("pointerdown", onPointerDown);
		canvas.removeEventListener("pointerup", onPointerUp);
		onReady(ROSTER[select.p1], ROSTER[select.p2]);
	}

	function randomizeActive() {
		const pool = filteredRosterIndices();
		select[select.active] = pool[Math.floor(Math.random() * pool.length)];
	}

	selectKeyHandlerFn = (k) => {
		if (started) return;
		if (k === "a") cycle("p1", -1);
		else if (k === "d") cycle("p1", 1);
		else if (k === "arrowleft") cycle("p2", -1);
		else if (k === "arrowright") cycle("p2", 1);
		else if (k === "r") randomizeActive();
		else if (k === "f") cycleFilter();
		else if (k === "enter" || k === " ") startFight();
		// "1"/"2" already toggle p1IsAI/p2IsAI globally (see the module-level keydown handler) -
		// reused as-is here rather than duplicated, so it behaves identically in and out of a match.
	};

	// Pointer input (mouse click and touch tap/swipe both go through Pointer Events) - added/
	// removed locally to this screen, same pattern runTitleScreen uses for its own listener.
	let dragStart = null;
	function onPointerDown(e) {
		const p = toGameCoords(e);
		dragStart = { x: p.x, y: p.y, t: performance.now() };
	}
	function onPointerUp(e) {
		if (started || !dragStart) return;
		const p = toGameCoords(e);
		const dx = p.x - dragStart.x;
		const dy = p.y - dragStart.y;
		dragStart = null;

		const SWIPE_DIST = 40;
		if (Math.abs(dx) > SWIPE_DIST && Math.abs(dx) > Math.abs(dy) * 1.5) {
			cycle(select.active, dx < 0 ? 1 : -1);
			return;
		}

		const px = p.x, py = p.y;
		const r = selectHitRects;
		if (pointInRect(px, py, r.p1Chip)) p1IsAI = !p1IsAI;
		else if (pointInRect(px, py, r.p2Chip)) p2IsAI = !p2IsAI;
		else if (pointInRect(px, py, r.p1Tab)) select.active = "p1";
		else if (pointInRect(px, py, r.p2Tab)) select.active = "p2";
		else if (pointInRect(px, py, r.leftArrow) || pointInRect(px, py, r.prevCard)) cycle(select.active, -1);
		else if (pointInRect(px, py, r.rightArrow) || pointInRect(px, py, r.nextCard)) cycle(select.active, 1);
		else if (pointInRect(px, py, r.diffChip)) difficultyIndex = (difficultyIndex + 1) % difficultyOrder.length;
		else if (pointInRect(px, py, r.randomChip)) randomizeActive();
		else if (pointInRect(px, py, r.roundsMinus)) roundsCount = Math.max(ROUNDS_MIN, roundsCount - 1);
		else if (pointInRect(px, py, r.roundsPlus)) roundsCount = Math.min(ROUNDS_MAX, roundsCount + 1);
		else if (pointInRect(px, py, r.fightButton)) startFight();
		else if (pointInRect(px, py, r.filterChip)) cycleFilter();
		else if (pointInRect(px, py, r.fullscreenButton)) toggleFullscreen();
	}
	canvas.addEventListener("pointerdown", onPointerDown);
	canvas.addEventListener("pointerup", onPointerUp);

	function loop() {
		if (started) return;
		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(loop);
			return;
		}
		drawSelectScreen(select);
		requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
}

// ===================== Stage select =====================
let stageSelectHitRects = {};

function drawStageSelectScreen(idx) {
	const time = performance.now();
	const s = Math.max(0.62, Math.min(1, GAME_W / SELECT_BASELINE_W, GAME_H / SELECT_BASELINE_H));
	const compact = s < 0.8;
	const rects = {};

	ctx.fillStyle = "#0b0c10";
	ctx.fillRect(0, 0, GAME_W, GAME_H);
	drawStars(time);

	let y = 14 * s;
	const titleSize = Math.max(15, 26 * s);
	ctx.textAlign = "center";
	ctx.fillStyle = "#ffffff";
	ctx.font = `bold ${titleSize}px 'All Around The World', monospace`;
	ctx.fillText("STAGE SELECT", GAME_W / 2, y + titleSize);
	y += titleSize + 8 * s;

	const subSize = Math.max(8, 11 * s);
	ctx.font = `${subSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#ffb238";
	ctx.fillText(
		compact
			? (IS_TOUCH ? "Tap a stage, or RANDOM, tap FIGHT" : "A/D or \u2190/\u2192 browse \u2022 ENTER to fight")
			: IS_TOUCH
			? "Swipe or tap the arrows to browse \u2022 tap RANDOM to pick for you \u2022 tap FIGHT to begin"
			: "A/D or \u2190/\u2192 to browse \u2022 R for random \u2022 ENTER to fight \u2022 ESC to go back",
		GAME_W / 2,
		y + subSize
	);
	y += subSize + 16 * s;

	const cardW = Math.min(560 * s, GAME_W - 80 * s);
	const cardH = cardW * (9 / 16);
	const cx = GAME_W / 2;
	const cardTopY = y;

	roundRectPath(cx - cardW / 2, cardTopY, cardW, cardH, 10 * s);
	ctx.save();
	ctx.clip();
	const bg = stageBgImages[STAGES[idx].id];
	if (bg && bg.complete && bg.naturalWidth > 0) {
		const boxAspect = cardW / cardH;
		const imgAspect = bg.naturalWidth / bg.naturalHeight;
		let dw, dh;
		if (imgAspect > boxAspect) {
			dh = cardH;
			dw = cardH * imgAspect;
		} else {
			dw = cardW;
			dh = cardW / imgAspect;
		}
		ctx.drawImage(bg, cx - dw / 2, cardTopY + cardH / 2 - dh / 2, dw, dh);
	} else {
		ctx.fillStyle = "#1a1d28";
		ctx.fillRect(cx - cardW / 2, cardTopY, cardW, cardH);
	}
	ctx.restore();
	ctx.strokeStyle = "#5dd0ff";
	ctx.lineWidth = 2;
	roundRectPath(cx - cardW / 2, cardTopY, cardW, cardH, 10 * s);
	ctx.stroke();
	rects.card = { x: cx - cardW / 2, y: cardTopY, w: cardW, h: cardH };

	// Chevron arrows either side of the preview card.
	const arrowSize = Math.max(18, 30 * s);
	ctx.textAlign = "center";
	ctx.font = `bold ${arrowSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#5dd0ff88";
	const leftArrowX = cx - cardW / 2 - Math.max(20, 34 * s);
	const rightArrowX = cx + cardW / 2 + Math.max(20, 34 * s);
	const arrowY = cardTopY + cardH / 2;
	ctx.fillText("\u25C0", leftArrowX, arrowY + arrowSize / 3);
	ctx.fillText("\u25B6", rightArrowX, arrowY + arrowSize / 3);
	rects.leftArrow = { x: leftArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };
	rects.rightArrow = { x: rightArrowX - arrowSize, y: arrowY - arrowSize, w: arrowSize * 2, h: arrowSize * 2 };

	y = cardTopY + cardH + 14 * s;
	const nameSize = Math.max(14, 22 * s);
	ctx.font = `bold ${nameSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#ffffff";
	ctx.fillText(STAGES[idx].name.toUpperCase(), cx, y + nameSize);
	y += nameSize + 6 * s;
	const countSize = Math.max(9, 11 * s);
	ctx.font = `${countSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#8fa0b8";
	const platformCountLabel = STAGES[idx].randomizePlatforms
		? "6 random platforms"
		: `${STAGES[idx].platforms.length} platform${STAGES[idx].platforms.length === 1 ? "" : "s"}`;
	ctx.fillText(`${idx + 1} / ${STAGES.length}    \u2022    ${platformCountLabel}`, cx, y + countSize);
	y += countSize + 18 * s;

	// RANDOM chip
	const randLabel = "RANDOM";
	const randFont = Math.max(9, 12 * s);
	ctx.font = `bold ${randFont}px 'All Around The World', monospace`;
	const randW = ctx.measureText(randLabel).width + 26 * s;
	const randH = Math.max(20, 26 * s);
	const randX = cx - randW / 2;
	const randY = y;
	roundRectPath(randX, randY, randW, randH, randH / 2);
	ctx.fillStyle = "#1a1d28";
	ctx.fill();
	ctx.strokeStyle = "#444a5e";
	ctx.lineWidth = 1;
	ctx.stroke();
	ctx.fillStyle = "#ffd75d";
	ctx.fillText(randLabel, cx, randY + randH / 2 + 4 * s);
	rects.randomChip = { x: randX, y: randY, w: randW, h: randH };

	// FIGHT button - same bottom-anchored placement as the character select screen.
	const fightW = Math.max(150, 240 * s);
	const fightH = Math.max(40, 52 * s);
	const fightY = GAME_H - fightH - Math.max(16, 26 * s);
	const fightX = cx - fightW / 2;
	const pulse = 0.5 + 0.5 * Math.sin(time / 260);
	ctx.save();
	ctx.shadowColor = "#5dd0ff";
	ctx.shadowBlur = 10 + pulse * 10;
	drawGlossyPanel(fightX, fightY, fightW, fightH, fightH / 2, "#1f7fb8", "#7fe0ff", "#5dd0ff", 2);
	ctx.restore();
	ctx.fillStyle = "#06222e";
	ctx.font = `bold ${Math.max(14, 20 * s)}px 'All Around The World', monospace`;
	ctx.fillText("FIGHT", cx, fightY + fightH / 2 + 7 * s);
	rects.fightButton = { x: fightX, y: fightY, w: fightW, h: fightH };

	// BACK, small and top-left, doesn't need to fight for attention the way FIGHT does.
	const backSize = Math.max(9, 12 * s);
	ctx.font = `${backSize}px 'All Around The World', monospace`;
	ctx.fillStyle = "#8fa0b8";
	ctx.textAlign = "left";
	ctx.fillText(IS_TOUCH ? "\u2039 tap here to go back" : "\u2039 ESC to go back", 14 * s, 20 * s);
	rects.backButton = { x: 0, y: 0, w: 140 * s, h: 34 * s };

	stageSelectHitRects = rects;
	applyRetroFX(time, 0.7, { scanlines: false });
}

// Goes to the stage select screen if there's anything to pick from; otherwise (STAGES is empty)
// skips straight to the fight on the default fallback arena - a browse screen with zero stages in
// it has nothing useful to show.
function goToStageSelect(p1Name, p2Name) {
	if (STAGES.length === 0) {
		safeStartMatch(p1Name, p2Name, null);
		return;
	}
	runStageSelectScreen(p1Name, p2Name, safeStartMatch);
}

/** Thin wrapper around startMatch() that turns a load failure into something the player can
 * actually see and recover from, instead of the silent freeze a rejected promise here used to
 * cause. Nothing downstream of the stage-select/character-select screens ever awaited or
 * .catch()'d startMatch()'s own promise - it was called as fire-and-forget - so any rejection
 * anywhere in that whole async load chain (a missing/renamed asset file, a dropped request, a
 * transient server hiccup) became an unhandled promise rejection: the screen's own click/key
 * handlers had already been torn down on the assumption the match was about to start, nothing
 * else was listening for the failure, and the player was just left on a dead screen with no
 * indication anything had gone wrong. This logs the real error (check the browser console) and
 * bounces back to character select so the game is at least usable again instead of stuck. */
function safeStartMatch(p1Name, p2Name, stageId) {
	startMatch(p1Name, p2Name, stageId).catch((err) => {
		console.error("Failed to start match:", err);
		alert("Couldn't load the fight (see browser console for details). Returning to character select.");
		runSelectScreen(goToStageSelect);
	});
}

function runStageSelectScreen(p1Name, p2Name, onReady) {
	let idx = Math.floor(Math.random() * STAGES.length);
	let started = false;

	function cycle(dir) {
		idx = (idx + dir + STAGES.length) % STAGES.length;
	}
	function confirm() {
		if (started) return;
		started = true;
		selectKeyHandlerFn = null;
		canvas.removeEventListener("pointerdown", onPointerDown);
		canvas.removeEventListener("pointerup", onPointerUp);
		onReady(p1Name, p2Name, STAGES[idx].id);
	}

	selectKeyHandlerFn = (k) => {
		if (started) return;
		if (k === "a" || k === "arrowleft") cycle(-1);
		else if (k === "d" || k === "arrowright") cycle(1);
		else if (k === "r") idx = Math.floor(Math.random() * STAGES.length);
		else if (k === "enter" || k === " ") confirm();
		else if (k === "escape") {
			started = true;
			selectKeyHandlerFn = null;
			canvas.removeEventListener("pointerdown", onPointerDown);
			canvas.removeEventListener("pointerup", onPointerUp);
			runSelectScreen(goToStageSelect);
		}
	};

	let dragStart = null;
	function onPointerDown(e) {
		const p = toGameCoords(e);
		dragStart = { x: p.x, y: p.y, t: performance.now() };
	}
	function onPointerUp(e) {
		if (started || !dragStart) return;
		const p = toGameCoords(e);
		const dx = p.x - dragStart.x;
		const dy = p.y - dragStart.y;
		dragStart = null;

		const SWIPE_DIST = 40;
		if (Math.abs(dx) > SWIPE_DIST && Math.abs(dx) > Math.abs(dy) * 1.5) {
			cycle(dx < 0 ? 1 : -1);
			return;
		}

		const px = p.x, py = p.y;
		const r = stageSelectHitRects;
		if (pointInRect(px, py, r.leftArrow)) cycle(-1);
		else if (pointInRect(px, py, r.rightArrow)) cycle(1);
		else if (pointInRect(px, py, r.randomChip)) idx = Math.floor(Math.random() * STAGES.length);
		else if (pointInRect(px, py, r.fightButton)) confirm();
		else if (pointInRect(px, py, r.backButton)) {
			started = true;
			selectKeyHandlerFn = null;
			canvas.removeEventListener("pointerdown", onPointerDown);
			canvas.removeEventListener("pointerup", onPointerUp);
			runSelectScreen(goToStageSelect);
		}
	}
	canvas.addEventListener("pointerdown", onPointerDown);
	canvas.addEventListener("pointerup", onPointerUp);

	function loop() {
		if (started) return;
		if (isPortrait()) {
			drawPortraitWarning();
			requestAnimationFrame(loop);
			return;
		}
		drawStageSelectScreen(idx);
		requestAnimationFrame(loop);
	}
	requestAnimationFrame(loop);
}

/** Draws a stage layer (bg/fg/fgFront) at its game-accurate rect (drawX/drawY/dw/dh, in the local,
 * already-camera-transformed space these calls run in - see the ctx.translate/scale right before
 * this block in frame()), then - if that rect's bottom edge doesn't reach all the way down to
 * `bottomY` (the canvas's true bottom edge, mapped into this same local space) - stretches a thin
 * sliver of the image's own bottom rows down to close the gap.
 *
 * Every pre-composited stage bg.png is authored with plenty of image below its own floor row (see
 * STAGE_BG_GROUND_FRAC's comment), so this is a no-op for those. A hand-picked/uploaded photo,
 * though, essentially never has that same margin - a real photograph's "floor" is usually close to
 * the bottom of the frame already - so without this, the same scale/position formula that correctly
 * pins the floor to world y=0 can leave the image's bottom edge short of the canvas's true bottom,
 * exposing bare canvas (the starfield/deep-space fallback) beneath the character's feet. That fallback
 * is meant to only ever be seen ABOVE the stage (the reveal effect when a player needs headroom) -
 * never below or beside it - so any such gap gets closed here instead. */
function drawStageLayerCovered(ctx, img, drawX, drawY, dw, dh, bottomY) {
	ctx.drawImage(img, drawX, drawY, dw, dh);
	const imgBottom = drawY + dh;
	if (imgBottom < bottomY) {
		const sliverSrcH = Math.max(1, img.naturalHeight * 0.015); // thin strip of the source image's own bottom rows
		const sliverSrcY = img.naturalHeight - sliverSrcH;
		const sliverDstH = bottomY - imgBottom + 2; // +2 avoids a hairline seam from sub-pixel rounding
		ctx.drawImage(img, 0, sliverSrcY, img.naturalWidth, sliverSrcH, drawX, imgBottom - 1, dw, sliverDstH);
	}
}

/** Draws a 1px-on-screen white rounded outline around a stage image's exact rendered rect (world
 * space, same coords the image itself was just drawImage()'d at) - the "comic panel" effect: the
 * stage reads as a floating panel with a visible border, rather than an edgeless backdrop. `zoom`
 * is the camera's current scale (ctx is already ctx.scale()'d by it when this is called) - dividing
 * both the line width and corner radius by it keeps the outline a constant, crisp 1 SCREEN pixel
 * and a constant on-screen corner radius at any zoom level, instead of getting thicker/thinner or
 * more/less rounded as the camera zooms. */
function strokeComicPanelOutline(ctx, x, y, w, h, zoom) {
	const lineW = 1 / zoom;
	const radius = 12 / zoom;
	ctx.save();
	ctx.strokeStyle = "#ffffff";
	ctx.lineWidth = lineW;
	// Reuses the file's own existing roundRectPath(x,y,w,h,r) helper (drawPortraitWarning() above
	// already relies on it, operating on the same module-level `ctx`) - it calls ctx.beginPath()
	// itself, so this only needs to stroke what it builds.
	roundRectPath(x + lineW / 2, y + lineW / 2, w - lineW, h - lineW, radius);
	ctx.stroke();
	ctx.restore();
}

// ===================== Match =====================

// Sleek sci-fi pixel-art platform: dark metal body, a glowing top edge (color cycles per
// platform for a little visual variety), tech brackets at both ends, and a few rivets along the
// underside - all plain fillRect calls (cheap, no image assets, stays crisp at any scale).
const PLATFORM_ACCENTS = ["#5dd0ff", "#ff9d5d", "#8fe86f", "#c58fff"];
// Very subtle wind-sway: a slow, tiny vertical bob applied only at draw time (never written back
// to p.x1/x2/y, which stay the fixed stage data used for real collision) - so platforms visually
// read as "floating" instead of dead-static, without ever actually moving where a character can
// stand. Each platform gets its own phase (derived from its own x-position, deterministic and
// stable across frames rather than random per call) so a multi-platform stage doesn't bob in
